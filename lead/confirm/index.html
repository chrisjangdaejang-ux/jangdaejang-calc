<!DOCTYPE html>
<html lang="ko">
<head>

<title>상담 신청 확인</title>
<!-- 분양 상담 연결 — 광고주 이의 뒤 손님에게 보내는 확인 링크(#t=토큰, 로그인 없음 · 토큰은 주소의 # 뒤에만 있어 서버 기록·통계로 가지 않음) -->
<script>window.JDJ_CONFIG = { tool:'lead_confirm', GA4_ID:'G-V2VR9VL7EM', CLARITY_ID:'' };</script>
<script src="../../assets/track.js?v=3"></script>
<script src="../../assets/agents.js"></script>
<script src="../../assets/config.js?v=17"></script>
<script src="../../assets/auth.js?v=11"></script>
<script src="../../assets/leads-core.js?v=1"></script>
<script src="../../assets/leads.js?v=1"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/aplus.css?v=50">
<style>
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 40px}
h1{font-size:clamp(24px,6vw,30px);margin:4px 0 6px;letter-spacing:-.6px;word-break:keep-all}
.lead{margin:0 0 14px;font-size:15.5px;color:var(--sub2);line-height:1.6;word-break:keep-all}
.pvbar{background:#111827;color:#fff;font-size:12.5px;text-align:center;padding:5px 8px}.pvbar a{color:#FCD34D}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border-radius:14px;border:1px solid #1D4ED8;background:#1D4ED8;color:#fff;font:inherit;font-size:16px;font-weight:800;cursor:pointer;margin-top:10px;text-decoration:none}
.btn.s{background:#fff;color:#111827;border-color:#D1D5DB}.btn[disabled]{opacity:.6;cursor:not-allowed}
.soonbox{max-width:560px;margin:60px auto;text-align:center;line-height:1.7;color:var(--sub)}
.msg{font-size:14px;margin:8px 0 0;color:#B42318}.msg.ok{color:#0E7A4F}
.q{border:1px solid var(--line);border-radius:20px;padding:22px 18px;background:#fff;text-align:center}
.q h1{font-size:clamp(22px,5.6vw,28px)}
.q .site{display:inline-block;font-size:13px;font-weight:800;color:#1D4ED8;background:#EAF1FF;border-radius:999px;padding:3px 10px;margin-bottom:8px}
</style>
<script src="../../assets/back.js?v=8" defer></script>
</head>
<body>
<header class="top">
  <a class="brand" href="../../" aria-label="집예보 홈"><svg class="bi" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#4338CA"/><path d="M29 47 V78 H71 V47 Z" fill="#FFFFFF"/><path d="M20 51 L50 26 L80 51" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="50" cy="59" r="6" fill="#4338CA"/><path d="M46.5 62 L44 74 H56 L53.5 62 Z" fill="#4338CA"/><circle cx="76" cy="24" r="5" fill="#5EEAD4"/></svg><span data-site-name>집예보</span></a>
  <div class="badge plain">상담 신청 확인</div>
</header>
<div id="pv"></div>
<main class="wrap">
  <div class="soonbox" id="soon"><h1>링크를 확인해 주세요</h1><p>알림톡·문자로 받은 링크를 그대로 눌러 주세요. 문제가 있으면 홈의 카카오톡 상담으로 알려 주세요.</p></div>
  <div id="page" hidden>
    <div class="q" id="q">
      <span class="site" id="site"></span>
      <h1 id="title">상담을 신청하셨나요?</h1>
      <p class="lead" id="sub">이 현장 담당자가 연락이 닿지 않는다고 알려 왔어요. 신청하신 게 맞으면 [네]를 눌러 주세요. 담당자가 다시 연락드려요.</p>
      <button type="button" class="btn" data-ans="yes">네, 연락 받을게요</button>
      <button type="button" class="btn s" data-ans="no">아니요</button>
      <p class="msg" id="msg" role="status"></p>
      <p class="lead" style="font-size:13px;margin-top:12px">[아니요]를 누르면 이 신청은 없던 것으로 하고 연락처를 지워 달라고 광고주에게 알려요.</p>
    </div>
  </div>
</main>
<footer class="foot">★ <span data-site-name>집예보</span> · <a href="../../">홈</a> · <a href="../../privacy/#lead">개인정보처리방침</a></footer>
<script>
(function () {
  'use strict';
  var L = window.JDJ_LEADS, $ = function (id) { return document.getElementById(id); };
  var t = (location.hash.match(/[#&]t=([0-9a-f]{64})/) || [])[1] || '', demo = !!(L && L.demo());
  var on = !!(L && (t || demo)); $('soon').hidden = on; $('page').hidden = !on; if (!on) return;
  if (demo && !t) $('pv').innerHTML = '<div class="pvbar">미리 보기 · 예시 현장이에요 · 아무것도 보내지 않아요 · <a href="?preview=off">끄기</a></div>';
  var call = function (b) {
    if (demo && !t) return Promise.resolve(b.peek ? { site: '예시 마곡 리버뷰(가상 현장)' } : { res: b.ans === 'yes' ? 'valid' : 'refund' });
    var api = (window.JDJ_AGENTS && JDJ_AGENTS.api) || '';
    return fetch(api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action: 'leadConfirm', t: t }, b)) })
      .then(function (r) { return r.json(); }).then(function (j) { if (!j || !j.ok) throw new Error((j && j.err) || '잠시 뒤 다시 해 주세요.'); return j; });
  };
  call({ peek: true }).then(function (j) { $('site').textContent = j.site; $('title').textContent = j.site + ' 현장에 상담을 신청하셨나요?'; })
    .catch(function (e) { $('title').textContent = '이미 답하셨거나 기간이 지났어요'; $('sub').textContent = e.message; Array.prototype.forEach.call(document.querySelectorAll('[data-ans]'), function (b) { b.hidden = true; }); });
  $('q').onclick = function (e) {
    var b = e.target.closest('[data-ans]'); if (!b) return;
    Array.prototype.forEach.call(document.querySelectorAll('[data-ans]'), function (x) { x.disabled = true; });
    var yes = b.getAttribute('data-ans') === 'yes';
    call({ ans: yes ? 'yes' : 'no' }).then(function () {
      $('title').textContent = yes ? '고마워요. 담당자가 다시 연락드려요' : '알려 주셔서 고마워요';
      $('sub').textContent = yes ? '연락은 오전 8시~오후 9시에만 와요. 더는 연락받고 싶지 않으면 내 상담 신청에서 동의를 거둘 수 있어요.' : '이 신청은 없던 것으로 했어요. 광고주에게 연락처를 지워 달라고 알렸어요.';
      Array.prototype.forEach.call(document.querySelectorAll('[data-ans]'), function (x) { x.hidden = true; });
    }).catch(function (er) { $('msg').textContent = er.message; Array.prototype.forEach.call(document.querySelectorAll('[data-ans]'), function (x) { x.disabled = false; }); });
  };
})();
</script>
</body>
</html>
