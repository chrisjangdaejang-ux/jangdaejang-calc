<style>
.wrap{max-width:960px;margin:0 auto;padding:22px 18px 60px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.hzbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px}
.hzbar b{font-size:14px;margin-right:4px}
.hzbar .hzv{font-size:15px;font-weight:900;color:var(--cream);background:var(--olive);border-radius:999px;padding:4px 14px;margin-left:auto}
.hzbar input[type=range]{width:100%;accent-color:var(--olive);margin:8px 0 0;height:28px}
.hzticks{width:calc(100% - 16px);margin:0 8px;position:relative;height:16px;font-size:11.5px;color:var(--muted)}
.hzticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.hzticks span:last-child{transform:translateX(-100%)}
.hzticks span:first-child{transform:none}
.hzrec{width:100%;font-size:12.5px;font-weight:700;color:var(--olive);margin-top:6px;line-height:1.5}
.hznote{width:100%;font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.btn{display:inline-block;background:var(--ink);color:var(--cream);text-decoration:none;font-weight:700;font-size:14px;padding:10px 15px;border-radius:7px;border:0;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--red);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.gold{background:var(--gold);color:var(--ink)}
/* settings */
.settings{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px;display:none}
.settings.open{display:block}
.settings h3{margin:0 0 12px;font-size:15px;font-weight:900}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:var(--muted)}
.field input,.field select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;font:inherit;font-size:15px;font-weight:700;background:#fff;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--line);background:#fff;padding:6px 10px;border-radius:999px;font:inherit;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.chip.on{background:var(--olive);border-color:var(--olive);color:var(--cream)}
.chip.reg{position:relative}
.chip.reg:after{content:"규제";font-size:9px;margin-left:4px;color:var(--gold)}
.chip.on.reg:after{color:var(--gold2)}
.nrank{display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;border-radius:50%;background:var(--olive);color:var(--cream);font-weight:900;font-size:13px}
table.near tr.agtr td{border-top:0;padding-top:0;padding-bottom:12px}
table.near tr.agtr .agt{margin-top:0}
table.near tr.agtr:has(.agt:empty){display:none}
.smallbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.smallbtns button{font:inherit;font-size:14px;font-weight:900;background:#fff;color:var(--olive);border:2px solid var(--olive);border-radius:8px;padding:8px 14px;cursor:pointer}
.smallbtns button:hover{background:var(--olive);color:var(--cream)}
.smallbtns button#sggNone{border-color:var(--red);color:var(--red)}
.smallbtns button#sggNone:hover{background:var(--red);color:#fff}
/* report */
.page{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px}
.cover{background:var(--olive);color:var(--cream);padding:30px 28px;position:relative;overflow:hidden}
.cover:after{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;border:34px solid rgba(217,184,90,.13)}
.cover .tag{display:inline-block;background:var(--ink);color:var(--gold2);font-size:11px;font-weight:700;letter-spacing:.14em;padding:4px 9px;border-radius:2px}
.cover h1{font-size:clamp(26px,5vw,38px);font-weight:900;letter-spacing:-.04em;line-height:1.2;margin:12px 0 6px}
.cover h1 em{font-style:normal;color:var(--gold2)}
.cover .meta{font-size:13px;color:#D9D3BC}
.cover .conds{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.cover .conds span{background:rgba(255,255,255,.08);border:1px solid rgba(217,184,90,.35);padding:4px 9px;border-radius:4px;font-size:12px}
.sec{padding:24px 26px;border-top:1px solid var(--line)}
.sec h2{font-size:18px;font-weight:900;margin:0 0 4px;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.sec h2 .no{background:var(--gold);color:var(--ink);font-size:12px;padding:2px 8px;border-radius:3px}
.sec .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:640px){.stats{grid-template-columns:1fr 1fr}}
.stat{background:var(--cream2);border-radius:8px;padding:14px}
.stat .k{font-size:12px;color:var(--muted);font-weight:700}
.stat .v{font-size:21px;font-weight:900;letter-spacing:-.03em;margin-top:2px}
.stat .d{font-size:11px;color:var(--muted)}
.stat.key{background:var(--olive);color:var(--cream)}
.stat.key .k,.stat.key .d{color:var(--gold2)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:8px 6px;border-bottom:2px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.num{text-align:right}
tr.total td{border-top:2px solid var(--ink);border-bottom:0;font-weight:900;font-size:15px}
tr.hl td{background:rgba(184,148,42,.12);font-weight:700}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:700px){.twocol{grid-template-columns:1fr}}
.note{font-size:12px;color:var(--muted);margin:10px 0 0}
.warn{background:rgba(162,59,42,.07);border-left:4px solid var(--red);padding:10px 12px;border-radius:0 6px 6px 0;font-size:13px;margin-top:12px}
.ok{background:rgba(78,107,46,.08);border-left:4px solid var(--green);padding:10px 12px;border-radius:0 6px 6px 0;font-size:13px;margin-top:12px}
/* cards */
.cards{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.cards>.card{min-width:0;overflow-wrap:anywhere;word-break:keep-all}
.card{border:1px solid var(--line);border-radius:10px;padding:16px 18px;background:var(--card);break-inside:avoid;page-break-inside:avoid}
.card .head{display:flex;align-items:flex-start;gap:12px}
.rank{flex:none;width:34px;height:34px;border-radius:50%;background:var(--olive);color:var(--gold2);font-weight:900;display:flex;align-items:center;justify-content:center;font-size:15px}
.card.best .rank{background:var(--gold);color:var(--ink)}
.card .name{font-size:17px;font-weight:900;letter-spacing:-.02em;line-height:1.3}
.card .loc{font-size:12px;color:var(--muted)}
.card .price{margin-left:auto;text-align:right;flex:none}
.card .price b{display:block;font-size:19px;font-weight:900;letter-spacing:-.03em}
.card .price small{font-size:11px;color:var(--muted)}
.card .row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 10px}
@media(max-width:600px){.card .row{grid-template-columns:1fr 1fr}}
.mini{background:#fff;border:1px solid var(--line);border-radius:6px;padding:7px 9px}
.mini .k{font-size:11px;color:var(--muted);font-weight:700}
.mini .v{font-size:14px;font-weight:900}
.reasons{margin:0;padding-left:0;list-style:none;display:grid;gap:4px}
.reasons li{font-size:13px;padding-left:18px;position:relative}
.reasons li:before{content:"✓";position:absolute;left:0;color:var(--green);font-weight:900}
.reasons li.c:before{content:"!";color:var(--red)}
.reasons li.r:before{content:"◆";color:var(--gold);font-size:10px;top:3px}
.reasons li.f:before{content:"★";color:var(--gold)}
.fvbox{border:1.5px solid var(--gold);background:rgba(184,148,42,.08);border-radius:10px;padding:12px 14px;margin:0 0 14px;font-size:13.5px;line-height:1.6}
.widen{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;background:#fff;border:1.5px dashed var(--gold);border-radius:10px;padding:12px 14px;margin:12px 0;font-size:14px}
.widen button{background:var(--olive);color:#F5EFDC;border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:900;cursor:pointer}
.fvhow{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:13.5px;line-height:1.65}
.fvhow summary{cursor:pointer;font-weight:900;color:var(--olive)}
.fvhow summary span{font-weight:500;color:var(--muted);font-size:12.5px}
.fvhow ol{margin:10px 0 6px;padding-left:20px;display:grid;gap:5px}
.fvhow p{margin:6px 0 0}
.imp{margin:10px 0 4px}.imp .ib{display:grid;grid-template-columns:130px 1fr 44px;gap:8px;align-items:center;font-size:12.5px;margin:4px 0}
.imp .ib i{height:8px;background:var(--gold);border-radius:4px;display:block}.imp .ib em{font-style:normal;color:var(--muted);text-align:right}
.fvhow .src{font-size:12px;color:var(--muted)}
.fvper{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.fvper span{background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 9px;text-align:center;line-height:1.3}
.fvper small{display:block;color:var(--muted);font-size:11px}.fvper b{color:var(--olive);font-size:15px}
.fvbox b.big{font-size:17px;color:var(--olive)}
.bar{height:6px;background:var(--cream2);border-radius:3px;overflow:hidden;margin-top:4px;width:120px}
.bar i{display:block;height:100%;background:var(--gold)}
.spark{display:block;margin-top:2px}
.region{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;break-inside:avoid;page-break-inside:avoid}
.region h4{margin:0 0 6px;font-size:15px;font-weight:900}
.region h4 small{font-weight:500;color:var(--muted);font-size:12px;margin-left:6px}
.region ul{margin:0;padding-left:18px;font-size:13px}
.region li{margin-bottom:2px}
.check{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.check li{padding:10px 12px 10px 38px;background:var(--card);border:1px solid var(--line);border-radius:8px;font-size:13px;position:relative}
.check li:before{content:"☐";position:absolute;left:12px;top:8px;font-size:18px;color:var(--olive)}
.check b{font-weight:900}
.src{font-size:11px;color:var(--muted)}
.src a{color:var(--muted)}
.cta{background:var(--gold);padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.cta p{margin:0;font-weight:900;font-size:17px}
.cta p small{display:block;font-weight:500;font-size:13px;color:#3d3416}
.loading{padding:60px 20px;text-align:center;color:var(--muted)}
.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.wm{position:fixed;right:14px;bottom:14px;background:var(--ink);color:var(--gold2);font-size:11px;font-weight:700;padding:5px 9px;border-radius:4px;letter-spacing:.08em;opacity:.85}
@media print{
  body{background:#fff}
  .noprint,.toolbar,.settings,.wm{display:none!important}
  .wrap{max-width:none;padding:0}
  .page{border:0;border-radius:0;margin:0}
  .sec{padding:16px 6px}
  .pb{page-break-before:always;break-before:page}
  .cover{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .stat,.stat.key,.card,.rank,.foot,.cta,.sec h2 .no,tr.hl td,.bar i{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  a{color:inherit;text-decoration:none}
  @page{size:A4;margin:12mm}
}
/* 제휴 공인중개사 */
.agt{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.agt:empty{display:none}
.agt-l{font-size:12px;font-weight:700;color:var(--olive)}
.agt-l em,.agsec h3 em,.agm .tag{font-style:normal;font-size:10px;font-weight:700;border:1px solid var(--gold);color:var(--gold);padding:1px 5px;border-radius:3px;margin-left:5px;vertical-align:1px}
.agbtn{font:inherit;font-size:13px;font-weight:700;background:#fff;border:1.5px solid var(--olive);color:var(--olive);padding:5px 11px;border-radius:999px;cursor:pointer}
.agbtn:hover{background:var(--olive);color:var(--cream)}
.agsec{margin-top:22px;border-top:1px dashed var(--line);padding-top:16px}
.agsec:empty{display:none}
.agsec h3{font-size:15px;font-weight:900;margin:0 0 4px}
.agrow h4{font-size:13px;margin:12px 0 6px;color:var(--muted)}
.aglist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.agc{border:1px solid var(--line);border-radius:9px;padding:11px 12px;background:#fff;display:flex;flex-direction:column;gap:4px}
.agc b{font-size:15px}
.agc small{color:var(--muted);font-size:12px}
.agc .hl{font-size:11px;font-weight:700;color:var(--green)}
.agc p{margin:0;font-size:12.5px;color:var(--ink)}
.agc .agbtn{align-self:flex-start;margin-top:4px}
.agjoin{font-size:12px;color:var(--muted);margin-top:10px}
.agjoin a{color:var(--olive);font-weight:700}
.agm-bg{position:fixed;inset:0;background:rgba(35,36,26,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.agm-bg.open{display:flex}
.agm{background:var(--card);border-radius:12px;max-width:420px;width:100%;padding:20px 20px 16px;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.agm h3{margin:0 0 2px;font-size:19px;font-weight:900}
.agm dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;margin:12px 0}
.agm dt{color:var(--muted);font-weight:700}
.agm dd{margin:0}
.agm .acts{display:flex;gap:8px;margin-top:12px}
.agm .acts .btn{flex:1;text-align:center}
.rvs{font-size:12px;font-weight:800;color:#B07A00;margin-left:6px}.rvs small{color:var(--muted);font-weight:600}
.rvgood{font-size:10.5px;font-weight:800;color:#fff;background:var(--olive);border-radius:4px;padding:1px 5px;margin-left:5px}
.rvlist{max-height:230px;overflow:auto;border-top:1px solid var(--line);margin-top:10px;padding-top:8px}

.rvbox .stars button{font-size:26px;border:0;background:none;cursor:pointer;color:#D8CFB5;padding:0 2px}.rvbox .stars button.on{color:#C9A227}
.rvbox .tags label{display:inline-block;font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;margin:3px 4px 0 0;cursor:pointer}
.rvbox .tags input{display:none}.rvbox .tags label:has(input:checked){background:var(--olive);color:var(--cream);border-color:var(--olive)}
.rvbox textarea{width:100%;box-sizing:border-box;margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:13.5px;min-height:60px}
.agm .x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted)}
.agm .disc{font-size:11.5px;color:var(--muted);margin-top:12px;line-height:1.5}
.agt{border-top:1px dashed var(--line);padding-top:10px}
.agchip{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:13px;font-weight:700;background:#fff;border:1.5px solid var(--olive);color:var(--olive);padding:6px 12px;border-radius:999px;cursor:pointer}
.agchip:hover{background:var(--olive);color:var(--cream)}
.agchip .b{font-size:10.5px;background:var(--green);color:#fff;padding:1px 6px;border-radius:999px}

.agwant{font-size:14px;color:var(--ink);font-weight:700}

.cmpbtn-add{font:inherit;font-size:13px;font-weight:900;background:#fff;color:var(--olive);border:1.5px solid var(--olive);border-radius:999px;padding:5px 12px;cursor:pointer;margin-top:8px}
.cmpbtn-add.on{background:var(--olive);color:var(--cream)}
#cmpBar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--cream);border:2px solid var(--gold);border-radius:999px;padding:8px 8px 8px 18px;display:none;align-items:center;gap:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:14px;font-weight:700;white-space:nowrap}

.cpick{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:6px}

function noteKey(code){
  if (NOTES.notes[code]) return code;
  const s = (typeof IX!=='undefined' && IX && IX.sgg) ? IX.sgg[code] : null;
  return (s && NOTES.byName && NOTES.byName[s.sido+'|'+s.name]) || code;

/* 규제지역 (2026.7.1 기준): 서울 전역 + 경기 15곳 */
const REG_GG = ['41290','41210','41135','41131','41133','41117','41111','41115','41173','41465','41430','41450','41597','41463','41310'];
const isReg = c => c.startsWith('11') || REG_GG.includes(c);

function pickCandidates(units, maxBy, ctxBy, dsrBy){
  const sggPpy = {}; for(const c of S.sggs){ const s=IX.sgg[c]; sggPpy[c] = s ? lastNZ(s.s) : 0; }
  const out=[];
  for(const u of units){
    const [code, dong, apt, band, area, n, series, cnt] = u;
    if(!S.sggs.has(code)) continue;
    if(S.areas.size && !S.areas.has(band)) continue;
    const ppy = lastNZ(series); if(!ppy) continue;
    if(recentCnt(cnt) < 1) continue;
    const g = groupOf(code), c = ctxBy[g], M = maxBy[g]; if(!M) continue;
    const P = r100(ppy*area/PY);
    const large = area>85;
    const nd = need(P,c,dsrBy[g],large);
    if (nd.need > S.cash) continue;
    const fit = P / M;
    if (fit < 0.55) continue;
    const ch = change6(series);
    const sp = sggPpy[code];
    const rel = sp ? (sp-ppy)/sp : 0;           // +면 지역 평균보다 저렴
    const sBudget = Math.max(0, 1 - Math.abs(0.93 - fit)*2.2);
    const sLiq = Math.min(1, Math.log(n)/Math.log(160));
    // 완만한 상승(0~6%)이 가장 좋고, 급등(8%↑)은 추격 위험으로 감점, 하락은 중립 이하
    let sMom = 0.5;
    if (ch!==null){
      if (ch < 0) sMom = Math.max(0.2, 0.55 + ch*2);
      else if (ch <= 0.06) sMom = 0.7 + ch*5;
      else sMom = Math.max(0.2, 1 - (ch-0.06)*5);
    }
    const sVal = Math.max(0, Math.min(1, 0.5 + rel));
    const sNote = noteOf(code) ? 1 : 0.4;
    const fx = u[9] || null, fvS = (fx && fx.fv!=null) ? fx.fv/100 : null;
    // 미래가치 점수(백테스트 검증)가 있으면 그게 중심, 없으면 기존 기준
    const score = fvS!==null ? 0.42*fvS + 0.25*sBudget + 0.20*sLiq + 0.13*sNote
                             : 0.28*sBudget + 0.30*sLiq + 0.16*sMom + 0.14*sVal + 0.12*sNote;
    out.push({code,dong,apt,band,area,n,series,P,g,c,nd,fit,ch,rel,score,large,fx,jb:u[8],mon:monthly(nd.loan.L,c.rate,c.term)});
  }
  out.sort((a,b)=>b.score-a.score);
  const picked=[], perSgg={}, seenApt=new Set();
  for(const x of out){
    const key=x.code+'|'+x.apt; if(seenApt.has(key)) continue;
    if((perSgg[x.code]||0) >= 3) continue;
    picked.push(x); seenApt.add(key); perSgg[x.code]=(perSgg[x.code]||0)+1;
    if(picked.length>=10) break;
  }
  return {picked, total: out.length};
}
function nearMisses(units, ctxBy, dsrBy){
  const out=[]; const seen=new Set();
  for(const u of units){
    const [code, dong, apt, band, area, n, series, cnt] = u;
    if(!S.sggs.has(code)) continue;
    if(S.areas.size && !S.areas.has(band)) continue;
    const ppy=lastNZ(series); if(!ppy || recentCnt(cnt)<1 || n<20) continue;
    const g=groupOf(code), P=r100(ppy*area/PY), nd=need(P,ctxBy[g],dsrBy[g],area>85);
    if (nd.need<=S.cash) continue;
    out.push({code,dong,apt,band,P,nd});
  }
  out.sort((a,b)=>a.nd.need-b.nd.need);
  const res=[]; for(const x of out){ const k=x.code+x.apt; if(seen.has(k)) continue; seen.add(k); res.push(x); if(res.length>=10) break; }
  return res;
}
function futureReasons(x){
  const f=x.fx, r=[]; if(!f) return r;
  const pct=v=>Math.round(Math.abs(v)*100);

    const sidoNm = (IX.sgg[x.code]||{}).sido || '';
    r.push(['f', f.gs!=null
      ? `미래가치 ${f.fv}점 — ${sidoNm} 전체 단지 중 상위 ${Math.max(1,100-f.fv)}%` + (f.fvg!=null?`, ${sggName(x.code)} 안에서는 상위 ${Math.max(1,100-f.fvg)}%`:'') + ' (과거 데이터로 검증한 점수)'
      : `미래가치 ${f.fv}점 — ${sggName(x.code)} 단지 중 상위 ${Math.max(1,100-f.fv)}% (과거 데이터로 검증한 점수)`]);
  }
  /* 선택한 보유 기간 기준 '왜 이 점수인지': 그 기간 모델에서 점수를 가장 많이 올린·내린 항목 */
  if (f.why){ const mix=hzMix(HZ), h=String(mix.slice().sort((a,b)=>b[1]-a[1])[0][0]), w=f.why[h]||f.why['2'], m=MOD(+h)||MODEL;
    if (w&&w.length){ const lb=k=>((m&&m.label&&m.label[k])||(MODEL&&MODEL.label&&MODEL.label[k])||k);
      const U=a=>[...new Set(a)], up=U(w.filter(t=>t.endsWith('+')).map(t=>lb(t.slice(0,-1)))), dn=U(w.filter(t=>t.endsWith('-')).map(t=>lb(t.slice(0,-1)))).filter(x=>!up.includes(x));

  }

    <div class="stats">

/* ---------- 추천 단지 지도 (Leaflet + OpenStreetMap, 키 없음) ---------- */
const XY_CACHE = {}; let MAP = null, PINS = [];
function goCard(i, id){ const c=$(id||('pk'+i)); if(!c) return; markPin(i); c.scrollIntoView({behavior:'smooth',block:'start'}); c.classList.add('flash'); setTimeout(()=>c.classList.remove('flash'),1600); }
function markPin(i){ PINS.forEach((m,j)=>{ const e=m.getElement&&m.getElement(); if(e) e.classList.toggle('on', j===i); m.setZIndexOffset(j===i?2000:(PINS.length-j)*10); });
  document.querySelectorAll('.rkrow').forEach(r=>r.classList.toggle('on', +r.dataset.i===i)); }
async function loadXY(id){ if(XY_CACHE[id]!==undefined) return XY_CACHE[id];
  try{ const r=await fetch(DATA+id+'_xy.json',{cache:'no-cache'}); XY_CACHE[id] = r.ok ? ((await r.json()).xy||{}) : {}; }catch(e){ XY_CACHE[id]={}; } return XY_CACHE[id]; }
let LF_P = null;
function loadLeaflet(){ if(window.L) return Promise.resolve(); if(LF_P) return LF_P;
  LF_P = new Promise((ok,no)=>{ const base='/jangdaejang-calc/assets/leaflet/';
    if(!document.querySelector('link[data-lf]')){ const l=document.createElement('link'); l.rel='stylesheet'; l.href=base+'leaflet.css'; l.dataset.lf='1'; document.head.appendChild(l); }
    const s=document.createElement('script'); s.src=base+'leaflet.js'; s.onload=()=>ok(); s.onerror=()=>{ LF_P=null; no(new Error('leaflet')); }; document.head.appendChild(s); });
  return LF_P; }
/* 핀이 겹치면 순위가 낮은 쪽을 숫자만 있는 작은 핀으로 (확대하면 다시 펼쳐짐) */
function declutter(){ if(!MAP) return; const placed=[];
  PINS.forEach(m=>{ const e=m.getElement&&m.getElement(); if(!e||!m.getLatLng) return;
    const pt=MAP.latLngToContainerPoint(m.getLatLng()), w=74, h=34, r={l:pt.x-w/2,r:pt.x+w/2,t:pt.y-h-6,b:pt.y};
    const hit=placed.some(q=>r.l<q.r&&r.r>q.l&&r.t<q.b&&r.b>q.t);
    e.classList.toggle('mcmp', hit); if(!hit) placed.push(r); }); }
async function drawMap(picked){
  const box=$('rkMap'); if(!box) return;
  if (MAP){ MAP.remove(); MAP=null; } PINS=[];
  const xy = await loadXY(S.sido.id);
  const pts = picked.map((x,i)=>({x,i,p:xy[`${x.code}|${x.dong}|${x.jb}`]})).filter(o=>o.p);
  if (!pts.length || $('rkMap')!==box) return;          /* 좌표 없는 단지는 목록에만 */
  await loadLeaflet(); if (!box.isConnected) return;
  box.hidden = false;
  MAP = L.map(box, {scrollWheelZoom:false, zoomControl:true, attributionControl:true, tap:false});
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> 기여자'}).addTo(MAP);
  MAP.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');
  const ringOf = x => (x.fx && x.fx.fv!=null) ? x.fx.fv : Math.round(x.score*100);
  for (const {x,i,p} of pts){
    const ic = L.divIcon({className:'mpinw', iconSize:null, html:`<button type="button" class="mpin ${i===0?'r1':''}" aria-label="추천 ${i+1}위 ${esc(x.apt)}, 점수 ${ringOf(x)}점 — 단지 카드로 이동"><span class="mf">${i+1}위 · ${ringOf(x)}</span><span class="mm">${i+1}</span></button>`});
    const m = L.marker([p[1],p[0]], {icon:ic, keyboard:false, title:x.apt, zIndexOffset:(picked.length-i)*10}).addTo(MAP);
    m.on('click', ()=>{ goCard(i); JDJ.track('report_map_pin',{rank:i+1}); });
    PINS[i] = m;
  }
  PINS = PINS.map(m=>m||{getElement:()=>null,setZIndexOffset:()=>{}});
  const b = L.latLngBounds(pts.map(o=>[o.p[1],o.p[0]]));
  MAP.on('zoomend', declutter);
  if (pts.length===1) MAP.setView(b.getCenter(), 15); else MAP.fitBounds(b, {padding:[46,46], maxZoom:16});
  declutter();
  if (pts.length < picked.length) box.insertAdjacentHTML('beforeend', `<div class="rkmapmiss">위치 정보가 없는 ${picked.length-pts.length}곳은 아래 목록에만 있어요</div>`);
}

    const msg=box.querySelector('#rvMsg'); if(!S){ msg.textContent='별점을 골라 주세요.'; return; }
    const tags=[...box.querySelectorAll('.tags input:checked')].map(x=>x.value), text=box.querySelector('textarea').value;
    let vid=''; try{ vid=localStorage.getItem('jdj_vid')||''; }catch(e){}
    window.JDJ_AGENTS.post({action:'review', a:id, vid, s:S, tags, text}).then(()=>{
      const o=rvTickets(); if(o[id]) o[id].done=1; rvSave(o); JDJ.track('agent_review',{agent:id, s:S});
      box.innerHTML='<b>감사합니다!</b> 리뷰가 등록됐어요. 다른 분들이 좋은 공인중개사를 고르는 데 큰 도움이 돼요.'; setTimeout(close, 2500);
    }).catch(e=>{ msg.textContent=e.message; });
  };
}
/* 리포트를 다시 열었을 때: 문의 후 12시간 지난 중개사 리뷰 요청(나중에 → 3일 뒤 다시, 한 번에 하나) */
setTimeout(()=>{ const o=rvTickets(), now=Date.now();
  const id=Object.keys(o).find(k=>!o[k].done && now-o[k].at>12*3600e3 && now-o[k].at<60*86400e3 && (!o[k].snooze || now-o[k].snooze>3*86400e3));
  if(id && window.JDJ_AGENTS && window.JDJ_AGENTS.ready) rvForm(id, o[id].name); }, 4000);
document.addEventListener('click', e=>{
  const b = e.target.closest('.agbtn'); if (!b) return;
  openAgent(b.dataset.a, b.dataset.g, b.dataset.k);
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ const bg=$('agm'); if(bg) bg.classList.remove('open'); } });

/* ---------- 시작 ---------- */
(async function(){
  try{
    IX = await loadIndex();
    S.sido = IX.sido.find(s=>s.name===Q.get('sd')) || defaultSido();
    S.sggs = (Q.get('g') && IX.sgg[Q.get('g')] && IX.sgg[Q.get('g')].sido===S.sido.name) ? new Set([Q.get('g')]) : new Set(defaultSggs(S.sido));
    cmpLoad(); buildSettings(); wireSettings();
    { const r=$('hzr'); if(r){ r.oninput=()=>{ rangeP(r); const v=$('hzv'); if(v) v.textContent=hzLbl(+r.value); }; r.onchange=()=>{ setHz(+r.value); JDJ.track('hz',{hz:r.value}); }; } } hzUi();
    $('cmpBtn').onclick=()=>{ MODE==='cmp' ? goRec() : goCompare(); JDJ.track('cmp_toggle',{mode:MODE}); };
    setModeUi();
    $('backBtn').href = '../' + (location.search||'');
    $('shareBtn').onclick = async ()=>{ const b=$('shareBtn'), url=location.href;
      try{ if (navigator.share) { await navigator.share({title:document.title, url}); if(window.jdjStat) jdjStat('report_share',{method:'share'}); return; } await navigator.clipboard.writeText(url); b.textContent='주소 복사됨'; if(window.jdjStat) jdjStat('report_share',{method:'copy'}); }
      catch(e){ if(e && e.name==='AbortError') return; b.textContent='복사 안 됨'; }
      setTimeout(()=>{ b.textContent='공유'; }, 2000); };
    await render();
    JDJ.track('report_view');
  }catch(e){
    $('report').innerHTML = `<div class="empty">실거래 데이터를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</div>`;
    console.error(e);
  }
})();
</script>
