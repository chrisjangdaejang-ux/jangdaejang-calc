<script>
const $ = id => document.getElementById(id);
const DATA = '/jangdaejang-timing/data/';
const FORM = 'https://docs.google.com/forms/d/e/1FAIpQLScCG7wzIlY3FE6EHU5QWo92uW5NQe7aiP-GJ9jvh41Rx2E8Zw/viewform';
const NOTES = (window.JDJ_REGION_NOTES||{notes:{},sources:[],asOf:''});
/* 행정구역 개편으로 코드가 바뀐 곳(예: 전남광주통합특별시 12xxx)은 '시도|시군구 이름'으로 기존 메모를 찾는다 */
function noteKey(code){
  if (NOTES.notes[code]) return code;
  const s = (typeof IX!=='undefined' && IX && IX.sgg) ? IX.sgg[code] : null;
  return (s && NOTES.byName && NOTES.byName[s.sido+'|'+s.name]) || code;
}
function noteOf(code){ return NOTES.notes[noteKey(code)]; }

/* 규제지역 (2026.7.1 기준): 서울 전역 + 경기 15곳 */
const REG_GG = ['41290','41210','41135','41131','41133','41117','41111','41115','41173','41465','41430','41450','41597','41463','41310'];
const isReg = c => c.startsWith('11') || REG_GG.includes(c);
const isCap = c => c.startsWith('11') || c.startsWith('41') || c.startsWith('28');
const LTV = { reg:{none:.40,first:.70,one:.40,multi:0}, capfree:{none:.70,first:.70,one:.70,multi:0}, local:{none:.70,first:.80,one:.70,multi:.60} };
const TYPE_RATIO = {var:1, mix:.8, cyc:.4};
const TYPE_NAME = {var:'변동형', mix:'혼합형', cyc:'주기형'};
const OWN_NAME = {none:'무주택', first:'생애최초', one:'1주택(처분조건)', multi:'다주택'};
const GROUP_NAME = {reg:'규제지역', capfree:'비규제 수도권', local:'지방 비규제'};
const BANDS = ['40㎡ 이하','49㎡대','59㎡대','74㎡대','84㎡대','99㎡대','114㎡대','135㎡대','150㎡ 이상'];
const PY = 3.3058;

const num = s => { const v=parseFloat(String(s).replace(/[^0-9.]/g,'')); return isNaN(v)?0:v; };
function fmt(man){ man=Math.round(man); if(man<=0) return '0원'; const e=Math.floor(man/10000), r=man%10000; return !e ? r.toLocaleString()+'만' : e+'억'+(r?' '+r.toLocaleString()+'만':''); }
function fmtS(man){ if(man>=10000) return (Math.round(man/1000)/10).toString().replace(/\.0$/,'')+'억'; return Math.round(man).toLocaleString()+'만'; }
function r100(m){ return Math.round(m/100)*100; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- 상태 ---------- */

  etc: num(Q.get('e')||1000), region: Q.get('r')||'seoul',
  sido: null, sggs: new Set(), areas: new Set(['59㎡대','74㎡대','84㎡대'])
};
let IX=null; const SIDO_CACHE={};

/* ---------- 계산 엔진 (계산기와 동일 기준) ---------- */
function groupOf(code){ return isReg(code) ? 'reg' : (isCap(code) ? 'capfree' : 'local'); }
function ctxFor(g){
  const capital = g!=='local', regulated = g==='reg';
  const stressBase = capital ? 3.0 : 0.75;
  const maxTerm = capital ? 30 : 40;
  return { g, capital, regulated, ltv: LTV[g][S.own], stressBase, stress: Math.round(stressBase*TYPE_RATIO[S.rtype]*100)/100,
           income:S.income, cash:S.cash, debt:S.debt, rate:S.rate, term:Math.min(S.term,maxTerm) };
}
function capByPrice(P,c){ if(!c.capital && !c.regulated) return Infinity; if(P<=150000) return 60000; if(P<=250000) return 40000; return 20000; }
function dsrMax(c, stress, rate, term){
  const room=c.income*0.40-c.debt; if(room<=0) return 0;
  const i=((rate??c.rate)+(stress??c.stress))/1200, n=(term??c.term)*12;
  return room/12*(i===0?n:(1-Math.pow(1+i,-n))/i);
}
function monthly(L,rate,term){ const i=rate/1200,n=term*12; if(L<=0) return 0; return i===0?L/n:L*i/(1-Math.pow(1+i,-n)); }
function costDetail(P,c,large){
  let rate, heavy=false;
  if (S.own==='multi'){ rate = c.regulated ? 12 : 8; heavy=true; }
  else if (P<=60000) rate=1; else if (P<=90000) rate=Math.round(((P/10000)*2/3-3)*100)/100; else rate=3;
  const acq=P*rate/100, edu=heavy?P*0.4/100:acq*0.1;
  let farm=0; if(large) farm = heavy ? P*(rate===12?1.0:0.6)/100 : P*0.2/100;
  let relief=0; if(S.own==='first' && P<=120000) relief=Math.min(acq,200);
  let br,cap=Infinity; if(P<5000){br=.6;cap=25;} else if(P<20000){br=.5;cap=80;} else if(P<90000) br=.4; else if(P<120000) br=.5; else if(P<150000) br=.6; else br=.7;
  const broker=Math.min(P*br/100,cap)*1.1;
  return {rate, acq, edu, farm, relief, br, broker, heavy, total: acq-relief+edu+farm+broker};
}
function loanAt(P,c,dsr){
  const a=P*c.ltv, b=capByPrice(P,c), d=dsr, L=Math.max(0,Math.min(a,b,d));
  let by='LTV'; if(L===b && b<a && b<=d) by='CAP'; if(L===d && d<a && d<b) by='DSR'; if(c.ltv===0) by='BAN';
  return {L,a,b,d,by};
}
function need(P,c,dsr,large){ const l=loanAt(P,c,dsr); const cd=costDetail(P,c,large); return {loan:l, cost:cd, need: P - l.L + cd.total + S.etc}; }
function maxPrice(c,dsr){
  let best=0;
  for(let P=1000;P<=800000;P+=100){ if(need(P,c,dsr,false).need <= c.cash) best=P; }
  return best;
}
const BY_TXT = {LTV:'LTV(집값 대비 비율)', CAP:'가격구간별 대출 한도', DSR:'소득(DSR 40%)', BAN:'주택구입 주담대 불가'};

/* ---------- 데이터 ---------- */
async function loadIndex(){ const r=await fetch(DATA+'index.json',{cache:'no-cache'}); if(!r.ok) throw new Error('index'); return r.json(); }
async function loadSido(id){ if(SIDO_CACHE[id]) return SIDO_CACHE[id]; const r=await fetch(DATA+id+'.json',{cache:'no-cache'}); if(!r.ok) throw new Error(id); const j=await r.json(); SIDO_CACHE[id]=j.units; return j.units; }
function sggName(code){ const s=IX.sgg[code]; return s ? s.name : code; }
function sidoOfCode(code){ const s=IX.sgg[code]; return s ? s.sido : ''; }
function lastNZ(arr){ for(let i=arr.length-1;i>=Math.max(0,arr.length-3);i--) if(arr[i]>0) return arr[i]; return 0; }
function recentCnt(cnt){ let s=0; for(const ch of cnt.slice(-3)) s+=ch.charCodeAt(0)-48; return s; }
function change6(arr){ const n=arr.length, a=arr[n-1]||arr[n-2], b=arr[n-7]||arr[n-8]; return (a>0&&b>0) ? (a-b)/b : null; }

/* ---------- 설정 UI ---------- */
function defaultSido(){
  const find = short => IX.sido.find(s=>s.short===short);
  if (S.region==='seoul') return find('서울');
  if (S.region==='ggreg' || S.region==='capfree') return find('경기');
  return find('부산') || IX.sido[0];
}
function sggsOfSido(sido){ return Object.entries(IX.sgg).filter(([k,v])=>v.sido===sido.name).map(([k])=>k).sort((a,b)=>sggName(a).localeCompare(sggName(b),'ko')); }
function defaultSggs(sido){
  const all = sggsOfSido(sido);
  if (S.region==='ggreg') return all.filter(isReg);
  if (S.region==='capfree') return all.filter(c=>!isReg(c));
  return all;
}

let rt=null; function rerender(){ clearTimeout(rt); rt=setTimeout(render,250); }
function wireSettings(){
  ['s_name','s_income','s_cash','s_debt','s_rate','s_etc'].forEach(id=>$(id).addEventListener('input',e=>{
    if(['s_income','s_cash','s_debt','s_etc'].includes(id)){ const raw=e.target.value.replace(/[^0-9]/g,''); e.target.value = raw?parseInt(raw,10).toLocaleString():''; }

  }));
  ['s_own','s_rtype','s_term'].forEach(id=>$(id).addEventListener('change',()=>{ readSettings(); rerender(); }));
  $('s_sido').addEventListener('change', async e=>{
    S.sido = IX.sido.find(s=>s.id===e.target.value); S.sggs = new Set(sggsOfSido(S.sido)); renderSggChips(); render();
  });
  $('s_sgg').addEventListener('click',e=>{ const b=e.target.closest('.chip'); if(!b) return; const v=b.dataset.v; S.sggs.has(v)?S.sggs.delete(v):S.sggs.add(v); b.classList.toggle('on'); rerender(); });
  $('s_area').addEventListener('click',e=>{ const b=e.target.closest('.chip'); if(!b) return; const v=b.dataset.v; S.areas.has(v)?S.areas.delete(v):S.areas.add(v); b.classList.toggle('on'); rerender(); });
  $('sggAll').onclick=()=>{ S.sggs=new Set(sggsOfSido(S.sido)); renderSggChips(); rerender(); };
  $('sggNone').onclick=()=>{ S.sggs=new Set(); renderSggChips(); rerender(); };
  $('sggReg').onclick=()=>{ S.sggs=new Set(sggsOfSido(S.sido).filter(isReg)); renderSggChips(); rerender(); };
  $('sggFree').onclick=()=>{ S.sggs=new Set(sggsOfSido(S.sido).filter(c=>!isReg(c))); renderSggChips(); rerender(); };
  $('editBtn').onclick=()=>{ $('settings').classList.toggle('open'); };
  $('printBtn').onclick=()=>{ JDJ.track('report_print'); window.print(); };

/* ---------- 추천 ---------- */
function pickCandidates(units, maxBy, ctxBy, dsrBy){
  const sggPpy = {}; for(const c of S.sggs){ const s=IX.sgg[c]; sggPpy[c] = s ? lastNZ(s.s) : 0; }
  const out=[];
  for(const u of units){
    const [code, dong, apt, band, area, n, series, cnt] = u;
    if(!S.sggs.has(code)) continue;
    if(S.areas.size && !S.areas.has(band)) continue;
    const ppy = lastNZ(series); if(!ppy) continue;
    if(recentCnt(cnt) < 1) continue;
    const g = groupOf(code), c = ctxBy[g], M = maxBy[g]; if(!M) continue;
    const P = r100(ppy*area/PY);
    const large = area>85;
    const nd = need(P,c,dsrBy[g],large);
    if (nd.need > S.cash) continue;
    const fit = P / M;
    if (fit < 0.55) continue;
    const ch = change6(series);
    const sp = sggPpy[code];
    const rel = sp ? (sp-ppy)/sp : 0;           // +면 지역 평균보다 저렴
    const sBudget = Math.max(0, 1 - Math.abs(0.93 - fit)*2.2);
    const sLiq = Math.min(1, Math.log(n)/Math.log(160));
    // 완만한 상승(0~6%)이 가장 좋고, 급등(8%↑)은 추격 위험으로 감점, 하락은 중립 이하
    let sMom = 0.5;
    if (ch!==null){
      if (ch < 0) sMom = Math.max(0.2, 0.55 + ch*2);
      else if (ch <= 0.06) sMom = 0.7 + ch*5;
      else sMom = Math.max(0.2, 1 - (ch-0.06)*5);
    }
    const sVal = Math.max(0, Math.min(1, 0.5 + rel));
    const sNote = noteOf(code) ? 1 : 0.4;
    const score = 0.28*sBudget + 0.30*sLiq + 0.16*sMom + 0.14*sVal + 0.12*sNote;
    out.push({code,dong,apt,band,area,n,series,P,g,c,nd,fit,ch,rel,score,large,mon:monthly(nd.loan.L,c.rate,c.term)});
  }
  out.sort((a,b)=>b.score-a.score);
  const picked=[], perSgg={}, seenApt=new Set();
  for(const x of out){
    const key=x.code+'|'+x.apt; if(seenApt.has(key)) continue;
    if((perSgg[x.code]||0) >= 3) continue;
    picked.push(x); seenApt.add(key); perSgg[x.code]=(perSgg[x.code]||0)+1;
    if(picked.length>=10) break;
  }
  return {picked, total: out.length};
}
function nearMisses(units, ctxBy, dsrBy){
  const out=[]; const seen=new Set();
  for(const u of units){
    const [code, dong, apt, band, area, n, series, cnt] = u;
    if(!S.sggs.has(code)) continue;
    if(S.areas.size && !S.areas.has(band)) continue;
    const ppy=lastNZ(series); if(!ppy || recentCnt(cnt)<1 || n<20) continue;
    const g=groupOf(code), P=r100(ppy*area/PY), nd=need(P,ctxBy[g],dsrBy[g],area>85);
    if (nd.need<=S.cash) continue;
    out.push({code,dong,apt,band,P,nd});
  }
  out.sort((a,b)=>a.nd.need-b.nd.need);
  const res=[]; for(const x of out){ const k=x.code+x.apt; if(seen.has(k)) continue; seen.add(k); res.push(x); if(res.length>=5) break; }
  return res;
}
function reasons(x){
  const r=[];
  const gap = S.cash - x.nd.need;
  r.push(['', `예산 적합: 매수 가능액의 ${Math.round(x.fit*100)}% 수준 · 모든 비용을 내고도 현금 ${fmt(gap)} 남음`]);
  if (x.n>=60) r.push(['', `거래 활발: 최근 1년 실거래 ${x.n}건 — 팔 때도 수요가 꾸준한 단지`]);
  else if (x.n>=24) r.push(['', `거래 꾸준: 최근 1년 실거래 ${x.n}건`]);
  else r.push(['c', `거래량 적음: 최근 1년 ${x.n}건 — 시세 확인과 매도 기간에 여유를 두세요`]);
  if (x.ch!==null){
    const p=(x.ch*100).toFixed(1);
    if (x.ch>=0.08) r.push(['c', `최근 6개월 평당가 +${p}% — 상승 속도가 빨라 추격 매수 주의`]);
    else if (x.ch>=0) r.push(['', `최근 6개월 평당가 +${p}% — 완만한 상승 흐름`]);
    else r.push(['', `최근 6개월 평당가 ${p}% — 조정 구간, 가격 협상 여지`]);
  }
  if (Math.abs(x.rel)>=0.05){
    r.push(['', x.rel>0 ? `${sggName(x.code)} 평균 평당가보다 ${Math.round(x.rel*100)}% 낮음 — 지역 내 가격 부담이 적은 편` : `${sggName(x.code)} 평균 평당가보다 ${Math.round(-x.rel*100)}% 높음 — 지역 내 선호 단지`]);
  }
  if (x.c.capital && x.P>140000 && x.P<=150000) r.push(['c', '15억 바로 아래 — 15억을 넘으면 대출 한도가 6억 → 4억으로 줄어듭니다']);
  if (x.nd.loan.by==='DSR') r.push(['c', '소득(DSR)이 대출 한도를 결정 — 금리 유형에 따라 한도가 달라집니다']);
  const note = noteOf(x.code);
  if (note && note.t && note.t[0]) r.push(['r', note.t[0]]);
  return r;
}
function spark(series){
  const v = series.map((y,i)=>[i,y]).filter(p=>p[1]>0); if(v.length<2) return '';
  const xs=v.map(p=>p[0]), ys=v.map(p=>p[1]); const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  const W=120,H=28, sx=x=> (x1===x0?0:(x-x0)/(x1-x0)*W), sy=y=> H-2-(y1===y0?H/2:(y-y0)/(y1-y0)*(H-4));
  const d=v.map((p,i)=>(i?'L':'M')+sx(p[0]).toFixed(1)+' '+sy(p[1]).toFixed(1)).join(' ');
  const up = ys[ys.length-1]>=ys[0];
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${d}" fill="none" stroke="${up?'#4E6B2E':'#A23B2A'}" stroke-width="2"/></svg>`;
}

/* ---------- 렌더 ---------- */
async function render(){
  const units = await loadSido(S.sido.id);
  const groups = [...new Set([...S.sggs].map(groupOf))];
  const ctxBy={}, dsrBy={}, maxBy={};
  for (const g of ['reg','capfree','local']){ const c=ctxFor(g); ctxBy[g]=c; dsrBy[g]=dsrMax(c); maxBy[g]=maxPrice(c,dsrBy[g]); }
  const main = groups.length ? groups.sort((a,b)=>[...S.sggs].filter(c=>groupOf(c)===b).length-[...S.sggs].filter(c=>groupOf(c)===a).length)[0] : 'reg';
  const c=ctxBy[main], dsr=dsrBy[main], M=maxBy[main], ld=loanAt(M,c,dsr), cd=costDetail(M,c,false);
  const mon = monthly(ld.L,c.rate,c.term);
  const {picked,total} = pickCandidates(units, maxBy, ctxBy, dsrBy);

  const selNames = [...S.sggs].map(sggName);
  const selTxt = selNames.length===0 ? '선택 없음' : (selNames.length===sggsOfSido(S.sido).length ? S.sido.name+' 전체' : selNames.slice(0,6).join('·')+(selNames.length>6?` 외 ${selNames.length-6}곳`:''));

  let h = `<div class="page">
  <div class="cover">
    <span class="tag">PREMIUM INSIGHT · 맞춤 매수 리포트</span>
    <h1>${who} <em>내 집 마련</em><br>맞춤 매수 리포트</h1>
    <div class="meta">작성일 ${ymd} · 실거래 데이터 ${dataTo}까지 반영 · 2026년 11월 대출 규제 기준</div>
    <div class="conds">
      <span>연소득 ${fmt(S.income)}</span><span>보유 현금 ${fmt(S.cash)}</span><span>${OWN_NAME[S.own]}</span>
      <span>${TYPE_NAME[S.rtype]} ${S.rate}% · ${c.term}년</span><span>희망 지역: ${esc(selTxt)}</span><span>평형: ${S.areas.size?[...S.areas].join(', '):'전체'}</span>
    </div>
  </div>`;

  /* 1. 요약 */
  h += `<div class="sec">
    <h2><span class="no">01</span> 한눈에 보는 매수 여력</h2>
    <p class="sub">${GROUP_NAME[main]} 기준입니다. 취득세·중개보수와 기타 비용 ${fmt(S.etc)}까지 모두 뺀 금액입니다.</p>
    <div class="stats">
      <div class="stat key"><div class="k">최대 매수 가능액</div><div class="v">${M?fmtS(M):'-'}</div><div class="d">${GROUP_NAME[main]}</div></div>
      <div class="stat"><div class="k">대출 가능액</div><div class="v">${fmtS(ld.L)}</div><div class="d">${BY_TXT[ld.by]}이 한도 결정</div></div>
      <div class="stat"><div class="k">월 상환액</div><div class="v">${Math.round(mon).toLocaleString()}만</div><div class="d">월소득의 ${S.income?Math.round(mon/(S.income/12)*100):0}%</div></div>
      <div class="stat"><div class="k">추천 후보</div><div class="v">${picked.length}곳</div><div class="d">조건 충족 ${total}개 평형 중</div></div>
    </div>`;
  if (groups.length>1){
    h += `<table style="margin-top:14px"><thead><tr><th>지역 구분</th><th class="num">최대 매수 가능액</th><th class="num">대출 가능액</th></tr></thead><tbody>`+

  }

let AG = {};
function shuffle(arr){ return arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]); }
function agCard(a, g, rk){
  const hl = rk===0 ? '추천 단지 매물 보유' : (rk===1 ? '추천 단지 같은 동 사무소' : (rk===2 ? '이 지역 사무소' : ''));
  return `<div class="agc"><b>${esc(a.n)}</b><small>${esc(a.ogn)} ${esc(a.dong)} · 대표 ${esc(a.ceo)}</small>
    ${hl?`<span class="hl">${hl}</span>`:''}${a.intro?`<p>${esc(a.intro)}</p>`:''}
    <button class="agbtn" data-a="${a.id}" data-g="${g}" data-k="">정보 보기 · 연락하기</button></div>`;
}
async function fillAgents(picked){
  const A = window.JDJ_AGENTS;
  const box = $('agentSec');
  if (!A || !A.ready || !picked.length) return;
  /* 공인중개사 모집 배너 — 항상 크게 */
  if (box) box.innerHTML = `<div class="agcta noprint"><div><b>공인중개사님, <em>이 단지들 옆에</em> 사무소를 노출하세요</b>
    <span>고객이 살 수 있는 단지가 추천될 때 그 단지 카드에 바로 연결됩니다 · 시범 기간 무료 · 사무소 구 + 원하는 구 2곳</span></div>
    <a href="../../agent/" target="_blank" rel="noopener" data-track="agent_join_click">제휴 신청하기 →</a></div>`;
  const res = await A.list();
  const list = (res && res.agents) || [];
  AG = {}; list.forEach(a=>AG[a.id]=a);
  const chip = (a, g, k, r) => {
    const badge = r===0 ? '매물 보유' : (r===1 ? '같은 동' : '');
    return `<button class="agchip agbtn" data-a="${a.id}" data-g="${g}" data-k="${esc(k)}">${badge?`<span class="b">${badge}</span>`:''}${esc(a.n)}<span class="tel">${esc(a.ph)}</span></button>`;
  };
  /* 추천 단지 1~10위 카드마다 [공인중개사 연결하기] 버튼 → 누르면 그 구를 선택한 제휴 중개사 전부 펼침.
     순서는 매물 보유 > 같은 동 > 같은 구 사무소 > 추가 지역, 같은 순위는 매번 무작위. 노출 기록은 펼쳤을 때 */
  document.querySelectorAll('.agt').forEach(el=>{
    const k = el.dataset.k, g = el.dataset.g, dong = k.split('|')[1];
    const cand = list.filter(a=>a.r.includes(g));
    if (!cand.length){
      el.innerHTML = `<span class="agwant noprint">이 단지 지역 제휴 중개사 모집 중 · <a href="../../agent/" target="_blank" rel="noopener" data-track="agent_join_click">공인중개사 제휴 신청</a></span>`;
      return;
    }
    const rank = a => a.dj.includes(k) ? 0 : (a.og===g && a.dong===dong ? 1 : (a.og===g ? 2 : 3));
    const all = shuffle(cand).sort((x,y)=>rank(x)-rank(y));
    const own = all.filter(a=>rank(a)===0).length;
    el.innerHTML = `<button class="agopen noprint">공인중개사 연결하기 · ${all.length}곳${own?` <span class="b">매물 보유 ${own}곳</span>`:''} <i>▾</i></button>
      <div class="aglist2" hidden><span class="agt-l">이 단지 문의 가능한 제휴 중개사<em>제휴·광고</em></span>${all.map(a=>chip(a,g,k,rank(a))).join('')}</div>`;
    A.log('rec', all.map(a=>a.id).sort().join(','), g, k);   // 카드에 추천 표시(펼치기 전)
    const btn = el.querySelector('.agopen'), box = el.querySelector('.aglist2');
    let logged = false;
    btn.onclick = ()=>{
      const show = box.hidden; box.hidden = !show;
      btn.querySelector('i').textContent = show ? '▴' : '▾';
      if (show && !logged){ logged = true; all.forEach(a=>A.log('imp', a.id, g, k)); JDJ.track('agent_open', {sgg:g, n:all.length, own}); }
    };
  });
}
function openAgent(id, g, k){
  const a = AG[id]; if (!a) return;
  const A = window.JDJ_AGENTS;
  A.log('view', id, g, k); JDJ.track('agent_view', {agent:id, sgg:g});
  const tel = String(a.ph||'').replace(/[^\d]/g,'');
  const kk = /^https:\/\//.test(a.kk||'') ? a.kk : '';
  let bg = $('agm');
  if (!bg){ bg = document.createElement('div'); bg.id='agm'; bg.className='agm-bg'; document.body.appendChild(bg);
    bg.addEventListener('click', e=>{ if(e.target===bg || e.target.classList.contains('x')) bg.classList.remove('open'); }); }
  bg.innerHTML = `<div class="agm" role="dialog" aria-modal="true"><button class="x" aria-label="닫기">×</button>
    <span class="tag">제휴·광고</span>
    <h3>${esc(a.n)}</h3>
    <dl><dt>대표</dt><dd>${esc(a.ceo)} 공인중개사</dd><dt>소재지</dt><dd>${esc(a.ogn)} ${esc(a.dong)}</dd>
      <dt>등록번호</dt><dd>${esc(a.reg)}</dd><dt>전화</dt><dd>${esc(a.ph)}</dd>
      ${a.dj.length?`<dt>매물 단지</dt><dd>${a.dj.filter(x=>x.startsWith(g+'|')).map(x=>esc(x.split('|')[2])).join(', ')||'-'}</dd>`:''}</dl>
    ${a.intro?`<p style="margin:0;font-size:14px">${esc(a.intro)}</p>`:''}
    <div class="acts">${tel?`<a class="btn primary" href="tel:${tel}" data-act="call">전화하기</a>`:''}${kk?`<a class="btn gold" href="${esc(kk)}" target="_blank" rel="noopener" data-act="kakao">카카오톡 문의</a>`:''}</div>
    <p class="disc">이 중개사무소는 장대장 리포트 제휴(광고) 사무소입니다. 장대장은 중개 행위에 관여하지 않으며, 매물 정보와 거래 조건은 해당 중개사무소에 직접 확인하세요.</p></div>`;
  bg.querySelectorAll('[data-act]').forEach(el=>el.addEventListener('click', ()=>{
    const t = el.dataset.act; A.log(t, id, g, k); A.flush(); JDJ.track('agent_'+t, {agent:id, sgg:g});
  }));
  bg.classList.add('open');
}
document.addEventListener('click', e=>{
  const b = e.target.closest('.agbtn'); if (!b) return;
  openAgent(b.dataset.a, b.dataset.g, b.dataset.k);
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ const bg=$('agm'); if(bg) bg.classList.remove('open'); } });

(async function(){
  try{
    IX = await loadIndex();
    S.sido = defaultSido();
    S.sggs = new Set(defaultSggs(S.sido));
    buildSettings(); wireSettings();
    $('backBtn').href = '../' + (location.search||'');
    await render();
    JDJ.track('report_view');
  }catch(e){
    $('report').innerHTML = `<div class="empty">실거래 데이터를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</div>`;
    console.error(e);
  }
})();
</script>
