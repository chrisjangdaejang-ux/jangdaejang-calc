<style>
:root{
  --cream:#F5EFDC; --cream2:#EDE4C9; --olive:#3B3F22; --olive2:#545A30;
  --gold:#B8942A; --gold2:#D9B85A; --ink:#23241A; --muted:#6B6A58;
  --red:#A23B2A; --green:#4E6B2E; --card:#FFFBF0; --line:#DCCFA8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.top{background:var(--olive);color:#F5EFDC;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:900;letter-spacing:-.02em;font-size:17px;white-space:nowrap}
.brand span{color:var(--gold2)}
.badge{border:1px solid var(--gold2);color:var(--gold2);font-size:11px;font-weight:700;letter-spacing:.12em;padding:4px 9px;border-radius:3px;white-space:nowrap}
@media(max-width:420px){.top{padding:12px 14px}.brand{font-size:15px}.badge{font-size:10px;padding:3px 7px;letter-spacing:.06em}}
.wrap{max-width:960px;margin:0 auto;padding:22px 18px 60px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.btn{display:inline-block;background:var(--ink);color:var(--cream);text-decoration:none;font-weight:700;font-size:14px;padding:10px 15px;border-radius:7px;border:0;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--red);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.gold{background:var(--gold);color:var(--ink)}
/* settings */
.settings{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px;display:none}
.settings.open{display:block}
.settings h3{margin:0 0 12px;font-size:15px;font-weight:900}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:var(--muted)}
.field input,.field select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;font:inherit;font-size:15px;font-weight:700;background:#fff;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--line);background:#fff;padding:6px 10px;border-radius:999px;font:inherit;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.chip.on{background:var(--olive);border-color:var(--olive);color:var(--cream)}
.chip.reg{position:relative}
.chip.reg:after{content:"규제";font-size:9px;margin-left:4px;color:var(--gold)}
.chip.on.reg:after{color:var(--gold2)}
.nrank{display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;border-radius:50%;background:var(--olive);color:var(--cream);font-weight:900;font-size:13px}
table.near tr.agtr td{border-top:0;padding-top:0;padding-bottom:12px}
table.near tr.agtr .agt{margin-top:0}
table.near tr.agtr:has(.agt:empty){display:none}
.smallbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.smallbtns button{font:inherit;font-size:14px;font-weight:900;background:#fff;color:var(--olive);border:2px solid var(--olive);border-radius:8px;padding:8px 14px;cursor:pointer}
.smallbtns button:hover{background:var(--olive);color:var(--cream)}
.smallbtns button#sggNone{border-color:var(--red);color:var(--red)}
.smallbtns button#sggNone:hover{background:var(--red);color:#fff}
/* report */
.page{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px}
.cover{background:var(--olive);color:var(--cream);padding:30px 28px;position:relative;overflow:hidden}
.cover:after{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;border:34px solid rgba(217,184,90,.13)}
.cover .tag{display:inline-block;background:var(--ink);color:var(--gold2);font-size:11px;font-weight:700;letter-spacing:.14em;padding:4px 9px;border-radius:2px}
.cover h1{font-size:clamp(26px,5vw,38px);font-weight:900;letter-spacing:-.04em;line-height:1.2;margin:12px 0 6px}
.cover h1 em{font-style:normal;color:var(--gold2)}
.cover .meta{font-size:13px;color:#D9D3BC}
.cover .conds{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.cover .conds span{background:rgba(255,255,255,.08);border:1px solid rgba(217,184,90,.35);padding:4px 9px;border-radius:4px;font-size:12px}
.sec{padding:24px 26px;border-top:1px solid var(--line)}
.sec h2{font-size:18px;font-weight:900;margin:0 0 4px;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.sec h2 .no{background:var(--gold);color:var(--ink);font-size:12px;padding:2px 8px;border-radius:3px}
.sec .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:640px){.stats{grid-template-columns:1fr 1fr}}
.stat{background:var(--cream2);border-radius:8px;padding:14px}
.stat .k{font-size:12px;color:var(--muted);font-weight:700}
.stat .v{font-size:21px;font-weight:900;letter-spacing:-.03em;margin-top:2px}
.stat .d{font-size:11px;color:var(--muted)}
.stat.key{background:var(--olive);color:var(--cream)}
.stat.key .k,.stat.key .d{color:var(--gold2)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:8px 6px;border-bottom:2px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.num{text-align:right}
tr.total td{border-top:2px solid var(--ink);border-bottom:0;font-weight:900;font-size:15px}
tr.hl td{background:rgba(184,148,42,.12);font-weight:700}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:700px){.twocol{grid-template-columns:1fr}}
.note{font-size:12px;color:var(--muted);margin:10px 0 0}
.warn{background:rgba(162,59,42,.07);border-left:4px solid var(--red);padding:10px 12px;border-radius:0 6px 6px 0;font-size:13px;margin-top:12px}
.ok{background:rgba(78,107,46,.08);border-left:4px solid var(--green);padding:10px 12px;border-radius:0 6px 6px 0;font-size:13px;margin-top:12px}
/* cards */
.cards{display:grid;gap:12px}
.card{border:1px solid var(--line);border-radius:10px;padding:16px 18px;background:var(--card);break-inside:avoid;page-break-inside:avoid}
.card .head{display:flex;align-items:flex-start;gap:12px}
.rank{flex:none;width:34px;height:34px;border-radius:50%;background:var(--olive);color:var(--gold2);font-weight:900;display:flex;align-items:center;justify-content:center;font-size:15px}
.card.best .rank{background:var(--gold);color:var(--ink)}
.card .name{font-size:17px;font-weight:900;letter-spacing:-.02em;line-height:1.3}
.card .loc{font-size:12px;color:var(--muted)}
.card .price{margin-left:auto;text-align:right;flex:none}
.card .price b{display:block;font-size:19px;font-weight:900;letter-spacing:-.03em}
.card .price small{font-size:11px;color:var(--muted)}
.card .row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 10px}
@media(max-width:600px){.card .row{grid-template-columns:1fr 1fr}}
.mini{background:#fff;border:1px solid var(--line);border-radius:6px;padding:7px 9px}
.mini .k{font-size:11px;color:var(--muted);font-weight:700}
.mini .v{font-size:14px;font-weight:900}
.reasons{margin:0;padding-left:0;list-style:none;display:grid;gap:4px}
.reasons li{font-size:13px;padding-left:18px;position:relative}
.reasons li:before{content:"✓";position:absolute;left:0;color:var(--green);font-weight:900}
.reasons li.c:before{content:"!";color:var(--red)}
.reasons li.r:before{content:"◆";color:var(--gold);font-size:10px;top:3px}
.reasons li.f:before{content:"★";color:var(--gold)}
.fvbox{border:1.5px solid var(--gold);background:rgba(184,148,42,.08);border-radius:10px;padding:12px 14px;margin:0 0 14px;font-size:13.5px;line-height:1.6}
.widen{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;background:#fff;border:1.5px dashed var(--gold);border-radius:10px;padding:12px 14px;margin:12px 0;font-size:14px}
.widen button{background:var(--olive);color:#F5EFDC;border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:900;cursor:pointer}
.fvhow{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:13.5px;line-height:1.65}
.fvhow summary{cursor:pointer;font-weight:900;color:var(--olive)}
.fvhow summary span{font-weight:500;color:var(--muted);font-size:12.5px}
.fvhow ol{margin:10px 0 6px;padding-left:20px;display:grid;gap:5px}
.fvhow p{margin:6px 0 0}
.imp{margin:10px 0 4px}.imp .ib{display:grid;grid-template-columns:130px 1fr 44px;gap:8px;align-items:center;font-size:12.5px;margin:4px 0}
.imp .ib i{height:8px;background:var(--gold);border-radius:4px;display:block}.imp .ib em{font-style:normal;color:var(--muted);text-align:right}
.fvhow .src{font-size:12px;color:var(--muted)}
.fvper{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.fvper span{background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 9px;text-align:center;line-height:1.3}
.fvper small{display:block;color:var(--muted);font-size:11px}.fvper b{color:var(--olive);font-size:15px}
.fvbox b.big{font-size:17px;color:var(--olive)}
.bar{height:6px;background:var(--cream2);border-radius:3px;overflow:hidden;margin-top:4px;width:120px}
.bar i{display:block;height:100%;background:var(--gold)}
.spark{display:block;margin-top:2px}
.region{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;break-inside:avoid;page-break-inside:avoid}
.region h4{margin:0 0 6px;font-size:15px;font-weight:900}
.region h4 small{font-weight:500;color:var(--muted);font-size:12px;margin-left:6px}
.region ul{margin:0;padding-left:18px;font-size:13px}
.region li{margin-bottom:2px}
.check{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.check li{padding:10px 12px 10px 38px;background:var(--card);border:1px solid var(--line);border-radius:8px;font-size:13px;position:relative}
.check li:before{content:"☐";position:absolute;left:12px;top:8px;font-size:18px;color:var(--olive)}
.check b{font-weight:900}
.src{font-size:11px;color:var(--muted)}
.src a{color:var(--muted)}
.cta{background:var(--gold);padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.cta p{margin:0;font-weight:900;font-size:17px}
.cta p small{display:block;font-weight:500;font-size:13px;color:#3d3416}
.foot{background:var(--gold);color:var(--ink);text-align:center;font-weight:900;padding:12px;font-size:13px}
.loading{padding:60px 20px;text-align:center;color:var(--muted)}
.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.wm{position:fixed;right:14px;bottom:14px;background:var(--ink);color:var(--gold2);font-size:11px;font-weight:700;padding:5px 9px;border-radius:4px;letter-spacing:.08em;opacity:.85}
@media print{
  body{background:#fff}
  .noprint,.toolbar,.settings,.wm{display:none!important}
  .wrap{max-width:none;padding:0}
  .page{border:0;border-radius:0;margin:0}
  .sec{padding:16px 6px}
  .pb{page-break-before:always;break-before:page}
  .cover{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .stat,.stat.key,.card,.rank,.foot,.cta,.sec h2 .no,tr.hl td,.bar i{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  a{color:inherit;text-decoration:none}
  @page{size:A4;margin:12mm}
}
/* 제휴 공인중개사 */
.agt{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.agt:empty{display:none}
.agt-l{font-size:12px;font-weight:700;color:var(--olive)}
.agt-l em,.agsec h3 em,.agm .tag{font-style:normal;font-size:10px;font-weight:700;border:1px solid var(--gold);color:var(--gold);padding:1px 5px;border-radius:3px;margin-left:5px;vertical-align:1px}
.agbtn{font:inherit;font-size:13px;font-weight:700;background:#fff;border:1.5px solid var(--olive);color:var(--olive);padding:5px 11px;border-radius:999px;cursor:pointer}
.agbtn:hover{background:var(--olive);color:var(--cream)}
.agsec{margin-top:22px;border-top:1px dashed var(--line);padding-top:16px}
.agsec:empty{display:none}
.agsec h3{font-size:15px;font-weight:900;margin:0 0 4px}
.agrow h4{font-size:13px;margin:12px 0 6px;color:var(--muted)}
.aglist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.agc{border:1px solid var(--line);border-radius:9px;padding:11px 12px;background:#fff;display:flex;flex-direction:column;gap:4px}
.agc b{font-size:15px}
.agc small{color:var(--muted);font-size:12px}
.agc .hl{font-size:11px;font-weight:700;color:var(--green)}
.agc p{margin:0;font-size:12.5px;color:var(--ink)}
.agc .agbtn{align-self:flex-start;margin-top:4px}
.agjoin{font-size:12px;color:var(--muted);margin-top:10px}
.agjoin a{color:var(--olive);font-weight:700}
.agm-bg{position:fixed;inset:0;background:rgba(35,36,26,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.agm-bg.open{display:flex}
.agm{background:var(--card);border-radius:12px;max-width:420px;width:100%;padding:20px 20px 16px;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.agm h3{margin:0 0 2px;font-size:19px;font-weight:900}
.agm dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;margin:12px 0}
.agm dt{color:var(--muted);font-weight:700}
.agm dd{margin:0}
.agm .acts{display:flex;gap:8px;margin-top:12px}
.agm .acts .btn{flex:1;text-align:center}
.agm .x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted)}
.agm .disc{font-size:11.5px;color:var(--muted);margin-top:12px;line-height:1.5}
.agt{border-top:1px dashed var(--line);padding-top:10px}
.agchip{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:13px;font-weight:700;background:#fff;border:1.5px solid var(--olive);color:var(--olive);padding:6px 12px;border-radius:999px;cursor:pointer}
.agchip:hover{background:var(--olive);color:var(--cream)}
.agchip .b{font-size:10.5px;background:var(--green);color:#fff;padding:1px 6px;border-radius:999px}
.agchip .tel{font-weight:500;font-size:12px;opacity:.8}
.agopen{font:inherit;font-size:15px;font-weight:900;background:var(--olive);color:var(--cream);border:2px solid var(--gold);padding:9px 18px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.agopen:hover{background:var(--ink)}
.agopen .b{font-size:11px;background:var(--green);color:#fff;padding:2px 7px;border-radius:999px}
.agopen i{font-style:normal;color:var(--gold2)}
.aglist2{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.aglist2[hidden]{display:none}
.agwant{font-size:14px;color:var(--ink);font-weight:700}
.agwant a{color:var(--red);font-weight:900;text-decoration:underline}
.agcta{margin-top:20px;background:var(--olive);color:var(--cream);border-radius:12px;padding:18px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between;border:2px solid var(--gold)}
.agcta b{font-size:19px;font-weight:900;letter-spacing:-.03em;display:block}
.agcta b em{font-style:normal;color:var(--gold2)}
.agcta span{font-size:13.5px;color:#DDD7BF}
.agcta a{background:var(--gold);color:var(--ink);font-weight:900;font-size:16px;padding:12px 20px;border-radius:9px;text-decoration:none;white-space:nowrap}
/* ---------- 단지 비교 ---------- */
.cmpbtn-add{font:inherit;font-size:13px;font-weight:900;background:#fff;color:var(--olive);border:1.5px solid var(--olive);border-radius:999px;padding:5px 12px;cursor:pointer;margin-top:8px}
.cmpbtn-add.on{background:var(--olive);color:var(--cream)}
#cmpBar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--cream);border:2px solid var(--gold);border-radius:999px;padding:8px 8px 8px 18px;display:none;align-items:center;gap:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:14px;font-weight:700;white-space:nowrap}
#cmpBar.show{display:flex}
#cmpBar button{font:inherit;font-weight:900;background:var(--gold);color:var(--ink);border:0;border-radius:999px;padding:8px 16px;cursor:pointer}
.cpick{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:6px}
.cpick .srow{display:grid;grid-template-columns:150px 150px 1fr;gap:8px}
@media(max-width:640px){.cpick .srow{grid-template-columns:1fr 1fr}.cpick .srow input{grid-column:1/-1}}
.cpick select,.cpick input{width:100%;padding:10px;border:1px solid var(--line);border-radius:7px;font:inherit;font-size:15px;font-weight:700;background:#fff;color:var(--ink)}
.cres{margin-top:8px;max-height:340px;overflow:auto}
.cres .it{padding:10px 4px;border-bottom:1px dashed var(--line)}
.cres .it b{font-size:15px}
.cres .it small{color:var(--muted);margin-left:6px}
.cres .bands{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.cres .bands button{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--olive);background:#fff;color:var(--olive);border-radius:999px;padding:5px 11px;cursor:pointer}
.cres .bands button:hover,.cres .bands button.on{background:var(--olive);color:var(--cream)}
.cres .none{color:var(--muted);font-size:13px;padding:8px 2px}
.cchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.cchips span{background:var(--olive);color:var(--cream);border-radius:999px;padding:6px 8px 6px 14px;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.cchips span button{background:transparent;border:0;color:var(--gold2);font-size:17px;line-height:1;cursor:pointer;padding:0 4px}
.ctbl{overflow-x:auto;margin-top:6px}
.ctbl table{min-width:560px;table-layout:fixed}
.ctbl th:first-child,.ctbl td:first-child{width:118px;color:var(--muted);font-weight:700;font-size:13px;vertical-align:top}
.ctbl thead th{background:var(--olive);color:var(--cream);font-size:15px;vertical-align:top}
.ctbl thead th small{display:block;color:var(--gold2);font-weight:500;font-size:12px;margin-top:2px}
.ctbl td{vertical-align:top;font-size:14px}
.ctbl td small{display:block;color:var(--muted);font-size:12px;line-height:1.4;margin-top:2px}

<script>
const $ = id => document.getElementById(id);
const DATA = '/jangdaejang-timing/data/';
const FORM = 'https://docs.google.com/forms/d/e/1FAIpQLScCG7wzIlY3FE6EHU5QWo92uW5NQe7aiP-GJ9jvh41Rx2E8Zw/viewform';
const NOTES = (window.JDJ_REGION_NOTES||{notes:{},sources:[],asOf:''});
/* 행정구역 개편으로 코드가 바뀐 곳(예: 전남광주통합특별시 12xxx)은 '시도|시군구 이름'으로 기존 메모를 찾는다 */
function noteKey(code){
  if (NOTES.notes[code]) return code;
  const s = (typeof IX!=='undefined' && IX && IX.sgg) ? IX.sgg[code] : null;
  return (s && NOTES.byName && NOTES.byName[s.sido+'|'+s.name]) || code;
}
function noteOf(code){ return NOTES.notes[noteKey(code)]; }

/* 규제지역 (2026.7.1 기준): 서울 전역 + 경기 15곳 */
const REG_GG = ['41290','41210','41135','41131','41133','41117','41111','41115','41173','41465','41430','41450','41597','41463','41310'];
const isReg = c => c.startsWith('11') || REG_GG.includes(c);
const isCap = c => c.startsWith('11') || c.startsWith('41') || c.startsWith('28');
const LTV = { reg:{none:.40,first:.70,one:.40,multi:0}, capfree:{none:.70,first:.70,one:.70,multi:0}, local:{none:.70,first:.80,one:.70,multi:.60} };
const TYPE_RATIO = {var:1, mix:.8, cyc:.4};
const TYPE_NAME = {var:'변동형', mix:'혼합형', cyc:'주기형'};
const OWN_NAME = {none:'무주택', first:'생애최초', one:'1주택(처분조건)', multi:'다주택'};
const GROUP_NAME = {reg:'규제지역', capfree:'비규제 수도권', local:'지방 비규제'};
const BANDS = ['40㎡ 이하','49㎡대','59㎡대','74㎡대','84㎡대','99㎡대','114㎡대','135㎡대','150㎡ 이상'];
const PY = 3.3058;

const num = s => { const v=parseFloat(String(s).replace(/[^0-9.]/g,'')); return isNaN(v)?0:v; };
function fmt(man){ man=Math.round(man); if(man<=0) return '0원'; const e=Math.floor(man/10000), r=man%10000; return !e ? r.toLocaleString()+'만' : e+'억'+(r?' '+r.toLocaleString()+'만':''); }
function fmtS(man){ if(man>=10000) return (Math.round(man/1000)/10).toString().replace(/\.0$/,'')+'억'; return Math.round(man).toLocaleString()+'만'; }
function r100(m){ return Math.round(m/100)*100; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- 상태 ---------- */
const Q = new URLSearchParams(location.search);
const S = {
  name: Q.get('n')||'',
  income: num(Q.get('i')||7000), cash: num(Q.get('c')||40000), debt: num(Q.get('d')||0),
  own: Q.get('o')||'none', rtype: Q.get('t')||'cyc', rate: num(Q.get('rt')||4.0), term: parseInt(Q.get('tm')||30,10),
  etc: num(Q.get('e')||1000), region: Q.get('r')||'seoul',
  sido: null, sggs: new Set(), areas: new Set(['59㎡대','74㎡대','84㎡대'])
};
let IX=null; const SIDO_CACHE={};

/* ---------- 계산 엔진 (계산기와 동일 기준) ---------- */
function groupOf(code){ return isReg(code) ? 'reg' : (isCap(code) ? 'capfree' : 'local'); }
function ctxFor(g){
  const capital = g!=='local', regulated = g==='reg';
  const stressBase = capital ? 3.0 : 0.75;
  const maxTerm = capital ? 30 : 40;
  return { g, capital, regulated, ltv: LTV[g][S.own], stressBase, stress: Math.round(stressBase*TYPE_RATIO[S.rtype]*100)/100,
           income:S.income, cash:S.cash, debt:S.debt, rate:S.rate, term:Math.min(S.term,maxTerm) };
}
function capByPrice(P,c){ if(!c.capital && !c.regulated) return Infinity; if(P<=150000) return 60000; if(P<=250000) return 40000; return 20000; }
function dsrMax(c, stress, rate, term){
  const room=c.income*0.40-c.debt; if(room<=0) return 0;
  const i=((rate??c.rate)+(stress??c.stress))/1200, n=(term??c.term)*12;
  return room/12*(i===0?n:(1-Math.pow(1+i,-n))/i);
}
function monthly(L,rate,term){ const i=rate/1200,n=term*12; if(L<=0) return 0; return i===0?L/n:L*i/(1-Math.pow(1+i,-n)); }
function costDetail(P,c,large){
  let rate, heavy=false;
  if (S.own==='multi'){ rate = c.regulated ? 12 : 8; heavy=true; }
  else if (P<=60000) rate=1; else if (P<=90000) rate=Math.round(((P/10000)*2/3-3)*100)/100; else rate=3;
  const acq=P*rate/100, edu=heavy?P*0.4/100:acq*0.1;
  let farm=0; if(large) farm = heavy ? P*(rate===12?1.0:0.6)/100 : P*0.2/100;
  let relief=0; if(S.own==='first' && P<=120000) relief=Math.min(acq,200);
  let br,cap=Infinity; if(P<5000){br=.6;cap=25;} else if(P<20000){br=.5;cap=80;} else if(P<90000) br=.4; else if(P<120000) br=.5; else if(P<150000) br=.6; else br=.7;
  const broker=Math.min(P*br/100,cap)*1.1;
  return {rate, acq, edu, farm, relief, br, broker, heavy, total: acq-relief+edu+farm+broker};
}
function loanAt(P,c,dsr){
  const a=P*c.ltv, b=capByPrice(P,c), d=dsr, L=Math.max(0,Math.min(a,b,d));
  let by='LTV'; if(L===b && b<a && b<=d) by='CAP'; if(L===d && d<a && d<b) by='DSR'; if(c.ltv===0) by='BAN';
  return {L,a,b,d,by};
}
function need(P,c,dsr,large){ const l=loanAt(P,c,dsr); const cd=costDetail(P,c,large); return {loan:l, cost:cd, need: P - l.L + cd.total + S.etc}; }
function maxPrice(c,dsr){
  let best=0;
  for(let P=1000;P<=800000;P+=100){ if(need(P,c,dsr,false).need <= c.cash) best=P; }
  return best;
}
const BY_TXT = {LTV:'LTV(집값 대비 비율)', CAP:'가격구간별 대출 한도', DSR:'소득(DSR 40%)', BAN:'주택구입 주담대 불가'};

/* ---------- 데이터 ---------- */
let MODEL=null, RAIL=null;
const RUSED=()=>!!(MODEL&&MODEL.region&&MODEL.region.used);
async function loadIndex(){ try{ const m=await fetch(DATA+'model.json',{cache:'no-cache'}); MODEL=m.ok?await m.json():null; }catch(e){} try{ const q=await fetch(DATA+'rail.json',{cache:'no-cache'}); RAIL=q.ok?await q.json():null; }catch(e){} const r=await fetch(DATA+'index.json',{cache:'no-cache'}); if(!r.ok) throw new Error('index'); return r.json(); }
async function loadSido(id){ if(SIDO_CACHE[id]) return SIDO_CACHE[id]; const r=await fetch(DATA+id+'.json',{cache:'no-cache'}); if(!r.ok) throw new Error(id); const j=await r.json(); SIDO_CACHE[id]=j.units; return j.units; }
function sggName(code){ const s=IX.sgg[code]; return s ? s.name : code; }
function sidoOfCode(code){ const s=IX.sgg[code]; return s ? s.sido : ''; }
function lastNZ(arr){ for(let i=arr.length-1;i>=Math.max(0,arr.length-3);i--) if(arr[i]>0) return arr[i]; return 0; }
function recentCnt(cnt){ let s=0; for(const ch of cnt.slice(-3)) s+=ch.charCodeAt(0)-48; return s; }
function change6(arr){ const n=arr.length, a=arr[n-1]||arr[n-2], b=arr[n-7]||arr[n-8]; return (a>0&&b>0) ? (a-b)/b : null; }

/* ---------- 설정 UI ---------- */
function defaultSido(){
  const find = short => IX.sido.find(s=>s.short===short);
  if (S.region==='seoul') return find('서울');
  if (S.region==='ggreg' || S.region==='capfree') return find('경기');
  return find('부산') || IX.sido[0];
}
function sggsOfSido(sido){ return Object.entries(IX.sgg).filter(([k,v])=>v.sido===sido.name).map(([k])=>k).sort((a,b)=>sggName(a).localeCompare(sggName(b),'ko')); }
function defaultSggs(sido){
  const all = sggsOfSido(sido);
  if (S.region==='ggreg') return all.filter(isReg);
  if (S.region==='capfree') return all.filter(c=>!isReg(c));
  return all;
}
function buildSettings(){
  $('s_name').value=S.name; $('s_income').value=S.income.toLocaleString(); $('s_cash').value=S.cash.toLocaleString(); $('s_debt').value=S.debt.toLocaleString();
  $('s_own').value=S.own; $('s_rtype').value=S.rtype; $('s_rate').value=S.rate; $('s_term').value=String(S.term); $('s_etc').value=S.etc.toLocaleString();
  $('s_sido').innerHTML = IX.sido.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
  $('s_sido').value = S.sido.id;
  renderSggChips();
  $('s_area').innerHTML = BANDS.map(b=>`<button class="chip ${S.areas.has(b)?'on':''}" data-v="${b}">${b}</button>`).join('');
}
function renderSggChips(){
  const list = sggsOfSido(S.sido);
  $('s_sgg').innerHTML = list.map(c=>`<button class="chip ${isReg(c)?'reg':''} ${S.sggs.has(c)?'on':''}" data-v="${c}">${esc(sggName(c))}</button>`).join('');
}
function readSettings(){
  S.name=$('s_name').value.trim(); S.income=num($('s_income').value); S.cash=num($('s_cash').value); S.debt=num($('s_debt').value);
  S.own=$('s_own').value; S.rtype=$('s_rtype').value; S.rate=num($('s_rate').value)||4; S.term=parseInt($('s_term').value,10); S.etc=num($('s_etc').value);
}
let rt=null; function rerender(){ clearTimeout(rt); rt=setTimeout(render,250); }
function wireSettings(){
  ['s_name','s_income','s_cash','s_debt','s_rate','s_etc'].forEach(id=>$(id).addEventListener('input',e=>{
    if(['s_income','s_cash','s_debt','s_etc'].includes(id)){ const raw=e.target.value.replace(/[^0-9]/g,''); e.target.value = raw?parseInt(raw,10).toLocaleString():''; }
    readSettings(); rerender();
  }));
  ['s_own','s_rtype','s_term'].forEach(id=>$(id).addEventListener('change',()=>{ readSettings(); rerender(); }));
  $('s_sido').addEventListener('change', async e=>{
    S.sido = IX.sido.find(s=>s.id===e.target.value); S.sggs = new Set(sggsOfSido(S.sido)); renderSggChips(); render();
  });
  $('s_sgg').addEventListener('click',e=>{ const b=e.target.closest('.chip'); if(!b) return; const v=b.dataset.v; S.sggs.has(v)?S.sggs.delete(v):S.sggs.add(v); b.classList.toggle('on'); rerender(); });
  $('s_area').addEventListener('click',e=>{ const b=e.target.closest('.chip'); if(!b) return; const v=b.dataset.v; S.areas.has(v)?S.areas.delete(v):S.areas.add(v); b.classList.toggle('on'); rerender(); });
  $('sggAll').onclick=()=>{ S.sggs=new Set(sggsOfSido(S.sido)); renderSggChips(); rerender(); };
  $('sggNone').onclick=()=>{ S.sggs=new Set(); renderSggChips(); rerender(); };
  $('sggReg').onclick=()=>{ S.sggs=new Set(sggsOfSido(S.sido).filter(isReg)); renderSggChips(); rerender(); };
  $('sggFree').onclick=()=>{ S.sggs=new Set(sggsOfSido(S.sido).filter(c=>!isReg(c))); renderSggChips(); rerender(); };
  $('editBtn').onclick=()=>{ $('settings').classList.toggle('open'); };
  $('printBtn').onclick=()=>{ JDJ.track('report_print'); window.print(); };
}

/* ---------- 추천 ---------- */
function pickCandidates(units, maxBy, ctxBy, dsrBy){
  const sggPpy = {}; for(const c of S.sggs){ const s=IX.sgg[c]; sggPpy[c] = s ? lastNZ(s.s) : 0; }
  const out=[];
  for(const u of units){
    const [code, dong, apt, band, area, n, series, cnt] = u;
    if(!S.sggs.has(code)) continue;
    if(S.areas.size && !S.areas.has(band)) continue;
    const ppy = lastNZ(series); if(!ppy) continue;
    if(recentCnt(cnt) < 1) continue;
    const g = groupOf(code), c = ctxBy[g], M = maxBy[g]; if(!M) continue;
    const P = r100(ppy*area/PY);
    const large = area>85;
    const nd = need(P,c,dsrBy[g],large);
    if (nd.need > S.cash) continue;
    const fit = P / M;
    if (fit < 0.55) continue;
    const ch = change6(series);
    const sp = sggPpy[code];
    const rel = sp ? (sp-ppy)/sp : 0;           // +면 지역 평균보다 저렴
    const sBudget = Math.max(0, 1 - Math.abs(0.93 - fit)*2.2);
    const sLiq = Math.min(1, Math.log(n)/Math.log(160));
    // 완만한 상승(0~6%)이 가장 좋고, 급등(8%↑)은 추격 위험으로 감점, 하락은 중립 이하
    let sMom = 0.5;
    if (ch!==null){
      if (ch < 0) sMom = Math.max(0.2, 0.55 + ch*2);
      else if (ch <= 0.06) sMom = 0.7 + ch*5;
      else sMom = Math.max(0.2, 1 - (ch-0.06)*5);
    }
    const sVal = Math.max(0, Math.min(1, 0.5 + rel));
    const sNote = noteOf(code) ? 1 : 0.4;
    const fx = u[9] || null, fvS = (fx && fx.fv!=null) ? fx.fv/100 : null;
    // 미래가치 점수(백테스트 검증)가 있으면 그게 중심, 없으면 기존 기준
    const score = fvS!==null ? 0.42*fvS + 0.25*sBudget + 0.20*sLiq + 0.13*sNote
                             : 0.28*sBudget + 0.30*sLiq + 0.16*sMom + 0.14*sVal + 0.12*sNote;
    out.push({code,dong,apt,band,area,n,series,P,g,c,nd,fit,ch,rel,score,large,fx,mon:monthly(nd.loan.L,c.rate,c.term)});
  }
  out.sort((a,b)=>b.score-a.score);
  const picked=[], perSgg={}, seenApt=new Set();
  for(const x of out){
    const key=x.code+'|'+x.apt; if(seenApt.has(key)) continue;
    if((perSgg[x.code]||0) >= 3) continue;
    picked.push(x); seenApt.add(key); perSgg[x.code]=(perSgg[x.code]||0)+1;
    if(picked.length>=10) break;
  }
  return {picked, total: out.length};
}
function nearMisses(units, ctxBy, dsrBy){
  const out=[]; const seen=new Set();
  for(const u of units){
    const [code, dong, apt, band, area, n, series, cnt] = u;
    if(!S.sggs.has(code)) continue;
    if(S.areas.size && !S.areas.has(band)) continue;
    const ppy=lastNZ(series); if(!ppy || recentCnt(cnt)<1 || n<20) continue;
    const g=groupOf(code), P=r100(ppy*area/PY), nd=need(P,ctxBy[g],dsrBy[g],area>85);
    if (nd.need<=S.cash) continue;
    out.push({code,dong,apt,band,P,nd});
  }
  out.sort((a,b)=>a.nd.need-b.nd.need);
  const res=[]; for(const x of out){ const k=x.code+x.apt; if(seen.has(k)) continue; seen.add(k); res.push(x); if(res.length>=10) break; }
  return res;
}
function futureReasons(x){
  const f=x.fx, r=[]; if(!f) return r;
  const pct=v=>Math.round(Math.abs(v)*100);
  if (f.fv!=null){
    const sidoNm = (IX.sgg[x.code]||{}).sido || '';
    r.push(['f', f.gs!=null
      ? `미래가치 ${f.fv}점 — ${sidoNm} 전체 단지 중 상위 ${Math.max(1,100-f.fv)}%` + (f.fvg!=null?`, ${sggName(x.code)} 안에서는 상위 ${Math.max(1,100-f.fvg)}%`:'') + ' (과거 데이터로 검증한 점수)'
      : `미래가치 ${f.fv}점 — ${sggName(x.code)} 단지 중 상위 ${Math.max(1,100-f.fv)}% (과거 데이터로 검증한 점수)`]);
  }

        <li><b>거래량</b> — 최근 2년 실거래 건수. 거래가 많아야 시세가 믿을 만하고, 팔 때도 수월합니다.</li>
      </ol>
      ${MODEL&&MODEL.importance ? `<div class="imp"><b>과거 데이터로 확인한 지표별 영향도</b>${Object.entries(MODEL.importance).sort((a,b)=>b[1]-a[1]).filter(([k,v])=>v>=1).map(([k,v])=>`<div class="ib"><span>${esc((MODEL.label||{})[k]||k)}</span><i style="width:${Math.min(100,v*2)}%"></i><em>${v}%</em></div>`).join('')}</div>` : ''}
      <p>지표마다 얼마나 비중을 둘지는 사람이 정하지 않았습니다. <b>2년 전 시점의 자료만으로 점수를 매겼을 때 실제로 더 오른 단지를 가장 잘 맞힌 비중</b>을 데이터로 찾아 적용했습니다. 여기에 예산 적합도, 공공기관 개발 발표를 더해 최종 순위를 정합니다.</p>
      <p class="src">자료: 국토교통부 아파트 매매·전월세 실거래가(2017년~), 공동주택관리정보시스템(K-apt) 단지 정보, 자동 갱신</p>
    </details>`;
    h += `<div class="cards">` + picked.map((x,i)=>{
      const rs = reasons(x);
      return `<div class="card ${i<3?'best':''}">
        <div class="head">
          <div class="rank">${i+1}</div>
          <div><div class="name">${esc(x.apt)}</div><div class="loc">${esc(sidoOfCode(x.code))} ${esc(sggName(x.code))} ${esc(x.dong)} · ${x.band} (전용 ${x.area}㎡)${isReg(x.code)?' · 규제지역':''}</div></div>
          <div class="price"><b>${fmtS(x.P)}</b><small>추정 시세</small>${spark(x.series)}</div>
        </div>
        <div class="row">
          <div class="mini"><div class="k">대출</div><div class="v">${fmtS(x.nd.loan.L)}</div></div>
          <div class="mini"><div class="k">필요 현금</div><div class="v">${fmtS(x.nd.need)}</div></div>
          <div class="mini"><div class="k">월 상환</div><div class="v">${Math.round(x.mon).toLocaleString()}만</div></div>
          <div class="mini"><div class="k">추천 점수</div><div class="v">${Math.round(x.score*100)}</div><div class="bar"><i style="width:${Math.round(x.score*100)}%"></i></div></div>
        </div>
        <ul class="reasons">${rs.map(r=>`<li class="${r[0]}">${esc(r[1])}</li>`).join('')}</ul>
        ${(()=>{ const k=cmpKey({sd:S.sido.id,code:x.code,dong:x.dong,apt:x.apt,band:x.band}); return `<button type="button" class="cmpbtn-add noprint ${cmpHas(k)?'on':''}" data-cp="${esc(k)}">${cmpHas(k)?'✓ 비교함에 담김':'＋ 비교에 담기'}</button>`; })()}
        <div class="agt" data-g="${x.code}" data-k="${esc(x.code+'|'+x.dong+'|'+x.apt)}"></div>
      </div>`;
    }).join('') + `</div>` +
    ((picked.length<10 && S.sggs.size < sggsOfSido(S.sido).length) ? `<div class="widen"><span>선택한 지역에서 예산에 맞는 단지는 <b>${picked.length}곳</b>입니다. 범위를 넓히면 더 많은 후보를 볼 수 있어요.</span><button type="button" id="widenBtn">${esc(S.sido.name)} 전체로 넓히기</button></div>` : '') + `
    <p class="note">추정 시세는 같은 단지·같은 평형대의 최근 3개월 실거래 중앙값(전용면적 기준 환산)이며 호가와 다를 수 있습니다. 층·향·동에 따라 실제 가격은 달라집니다. 역까지 거리와 학교 배정은 지도에서 꼭 확인하세요.</p>`;
    h += `<div id="agentSec" class="agsec"></div>`;
  }
  h += `</div>`;

  /* 5. 지역 포인트 */
  const codes = [...new Set((picked.length ? picked : near).map(x=>x.code))];
  const withNotes = codes.filter(c=>noteOf(c));
  const noteKeys = withNotes.map(noteKey);
  h += `<div class="sec">
    <h2><span class="no">05</span> 추천 지역 교통·개발 포인트</h2>
    <p class="sub">${NOTES.asOf} 기준 공공기관 발표 내용이며, 괄호 안이 발표 기관입니다. 개통·준공 일정은 바뀔 수 있습니다.</p>`;
  if (withNotes.length){
    h += withNotes.map(code=>{
      const n=noteOf(code), s=IX.sgg[code], ch=s?change6(s.s):null;
      return `<div class="region"><h4>${esc(sggName(code))}<small>${isReg(code)?'규제지역 · 토지거래허가구역':'비규제지역'}${ch!==null?` · 지역 평당가 6개월 ${(ch*100>=0?'+':'')+(ch*100).toFixed(1)}%`:''}</small></h4>
        <ul>${(n.t||[]).map(t=>`<li><b>교통</b> ${esc(t)}</li>`).join('')}${(n.d||[]).map(t=>`<li><b>개발</b> ${esc(t)}</li>`).join('')}</ul></div>`;
    }).join('');
  } else {
    h += `<div class="empty">추천 지역의 교통·개발 포인트는 상담에서 자세히 안내해 드립니다.</div>`;
  }
  h += `</div>`;

  /* 6. 체크리스트 */
  const anyReg = picked.some(x=>isReg(x.code)) || main==='reg';
  h += `<div class="sec pb">
    <h2><span class="no">06</span> 매수 전 체크리스트</h2>
    <p class="sub">계약 전에 순서대로 확인하세요.</p>
    <ul class="check">
      <li><b>은행 사전 상담</b> — 이 리포트의 대출 가능액은 추정치입니다. 감정가·신용·소득 인정 방식에 따라 달라지므로 2곳 이상 은행에서 한도와 금리를 확인하세요.</li>
      ${anyReg?`<li><b>토지거래허가</b> — 서울 전역과 경기 규제지역은 토지거래허가구역입니다. 실거주 목적으로 관할 지자체 허가를 받은 뒤 계약해야 하므로 허가 기간을 일정에 넣어 두세요.</li>
      <li><b>전입 의무</b> — 규제지역 주담대는 6개월 안에 전입해야 합니다. 세입자가 있는 집은 대출 실행이 어렵습니다.</li>`:''}
      ${S.own==='one'?`<li><b>기존 주택 처분 기한</b> — 처분조건부 대출은 정해진 기한 안에 기존 주택을 팔아야 합니다. 기한을 넘기면 대출 회수와 세금 추징이 생길 수 있습니다.</li>`:''}
      <li><b>등기부등본·건축물대장</b> — 근저당·가압류·위반건축물 여부를 계약 전에 확인하세요.</li>
      ${(main!=='local' || picked.some(x=>isCap(x.code)))?`<li><b>15억 경계</b> — 수도권·규제지역은 15억 초과 시 대출 한도가 4억, 25억 초과 시 2억으로 줄어듭니다.</li>`:''}
      ${main==='local'?`<li><b>지방 스트레스 금리</b> — 지방 주담대의 완화된 스트레스 금리는 2026년 12월 31일까지입니다. 내년에 대출을 실행한다면 한도를 다시 확인하세요.</li>`:''}
      <li><b>취득세 신고</b> — 잔금일로부터 60일 이내 신고·납부합니다.</li>
      <li><b>현장 확인</b> — 역까지 걷는 시간, 학교 배정, 일조·소음은 지도와 현장에서 직접 확인하세요.</li>
    </ul>
  </div>`;

  /* 7. 출처 — 추천 지역과 관련된 공공기관 자료만 */
  const usedSrc = NOTES.sources.filter(s=>(s[3]||[]).some(c=>noteKeys.includes(c)));
  h += `<div class="sec">
    <h2><span class="no">07</span> 데이터 출처와 유의사항</h2>
    <p class="src">실거래가: 국토교통부 아파트 매매 실거래가(공공데이터포털), 해제·직거래 제외, ${dataTo}까지 집계. 대출 규제: 2026년 11월 기준 LTV·DSR·스트레스 금리·가격구간별 한도.${usedSrc.length?' 추천 지역 교통·개발 정보(공공기관 원문):':''}</p>
    ${usedSrc.length?`<ul class="src" style="padding-left:16px;margin:6px 0 10px">${usedSrc.map(s=>`<li>${esc(s[0])} — ${esc(s[1])} <a href="${s[2]}" target="_blank" rel="noopener">링크</a></li>`).join('')}</ul>`:''}
    <p class="src">이 리포트는 공개 데이터로 만든 참고 자료이며 특정 단지의 매수를 권유하는 것이 아닙니다. 실제 대출 한도와 세금은 금융기관·세무 전문가에게 확인하세요.</p>
  </div>`;

  /* CTA */
  const q=new URLSearchParams({usp:'pp_url'});
  q.set('entry.146176170', fmt(S.income)+'원'); q.set('entry.1872979900', fmt(S.cash)+'원');
  q.set('entry.397234060', selTxt); q.set('entry.1054811896', OWN_NAME[S.own]);
  q.set('entry.658364183', `[맞춤 리포트] 최대 ${fmt(M)}원 · 추천 1순위 ${picked[0]?picked[0].apt:'-'} | ${JDJ.label()}`);
  h += `<div class="cta noprint"><p>이 리포트를 바탕으로 1:1 전략을 받아보세요<small>1차 진단은 무료 · 심층 컨설팅은 유료로 별도 안내 · 리포트 내용이 신청서에 자동 입력됩니다</small></p>
    <a class="btn primary" data-track="report_consult" href="${FORM}?${q.toString().replace(/\+/g,'%20')}" target="_blank" rel="noopener">상담 신청</a></div>
  </div>`;

  $('report').innerHTML = h;
  document.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>{ const [sd,code,dong,apt,band]=b.dataset.cp.split('~'); if(!cmpToggle({sd,code,dong,apt,band})) return; const on=cmpHas(b.dataset.cp); b.classList.toggle('on',on); b.textContent=on?'✓ 비교함에 담김':'＋ 비교에 담기'; });
  const wb=document.getElementById('widenBtn'); if(wb) wb.onclick=()=>{ S.sggs=new Set(sggsOfSido(S.sido)); renderSggChips(); render(); JDJ.track('report_widen',{region:S.sido.short}); };
  fillAgents(picked.length ? picked : near).catch(e=>console.warn('agents',e));
  JDJ.track('report_render', {region:S.sido.short, sgg_count:S.sggs.size, max_band:JDJ.band(M), picks:picked.length});
}

/* ---------- 제휴 공인중개사 ---------- */
let AG = {};
function shuffle(arr){ return arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]); }
function agCard(a, g, rk){
  const hl = rk===0 ? '추천 단지 매물 보유' : (rk===1 ? '추천 단지 같은 동 사무소' : (rk===2 ? '이 지역 사무소' : ''));
  return `<div class="agc"><b>${esc(a.n)}</b><small>${esc(a.ogn)} ${esc(a.dong)} · 대표 ${esc(a.ceo)}</small>
    ${hl?`<span class="hl">${hl}</span>`:''}${a.intro?`<p>${esc(a.intro)}</p>`:''}
    <button class="agbtn" data-a="${a.id}" data-g="${g}" data-k="">정보 보기 · 연락하기</button></div>`;
}
async function fillAgents(picked){
  const A = window.JDJ_AGENTS;
  const box = $('agentSec');
  if (!A || !A.ready || !picked.length) return;
  /* 공인중개사 모집 배너 — 항상 크게 */
  if (box) box.innerHTML = `<div class="agcta noprint"><div><b>공인중개사님, <em>이 단지들 옆에</em> 사무소를 노출하세요</b>
    <span>고객이 추천받거나 비교하는 단지 카드에 바로 연결됩니다 · 시범 기간 무료 · 사무소 구 + 원하는 구 2곳</span></div>
    <a href="../../agent/" target="_blank" rel="noopener" data-track="agent_join_click">제휴 신청하기 →</a></div>`;
  const res = await A.list();
  const list = (res && res.agents) || [];
  AG = {}; list.forEach(a=>AG[a.id]=a);
  const chip = (a, g, k, r) => {
    const badge = r===0 ? '매물 보유' : (r===1 ? '같은 동' : '');
    return `<button class="agchip agbtn" data-a="${a.id}" data-g="${g}" data-k="${esc(k)}">${badge?`<span class="b">${badge}</span>`:''}${esc(a.n)}<span class="tel">${esc(a.ph)}</span></button>`;
  };
  /* 추천 단지 1~10위 카드마다 [공인중개사 연결하기] 버튼 → 누르면 그 구를 선택한 제휴 중개사 전부 펼침.
     순서는 매물 보유 > 같은 동 > 같은 구 사무소 > 추가 지역, 같은 순위는 매번 무작위. 노출 기록은 펼쳤을 때 */
  document.querySelectorAll('.agt').forEach(el=>{
    const k = el.dataset.k, g = el.dataset.g, dong = k.split('|')[1];
    const cand = list.filter(a=>a.r.includes(g));
    if (!cand.length){
      /* 제휴 중개사가 없는 구: 고객은 장대장 상담으로 연결, 중개사에겐 작은 모집 안내 */
      const apt = k.split('|')[2];
      const q = new URLSearchParams({usp:'pp_url'});
      q.set('entry.397234060', sggName(g)+' '+dong); q.set('entry.658364183', `[단지 문의] ${apt} (${sggName(g)} ${dong}) | ${JDJ.label()}`);
      el.innerHTML = `<a class="agopen noprint" href="${FORM}?${q.toString().replace(/\+/g,'%20')}" target="_blank" rel="noopener" data-track="danji_consult" style="text-decoration:none">이 단지 상담 받기 <i>→</i></a>
        <span class="agwant noprint" style="margin-left:10px;font-size:12.5px;font-weight:500;color:var(--muted)">공인중개사이신가요? <a href="../../agent/" target="_blank" rel="noopener" data-track="agent_join_click">이 지역 제휴 신청</a></span>`;
      return;
    }
    const rank = a => a.dj.includes(k) ? 0 : (a.og===g && a.dong===dong ? 1 : (a.og===g ? 2 : 3));
    const all = shuffle(cand).sort((x,y)=>rank(x)-rank(y));
    const own = all.filter(a=>rank(a)===0).length;
    el.innerHTML = `<button class="agopen noprint">공인중개사 연결하기 · ${all.length}곳${own?` <span class="b">매물 보유 ${own}곳</span>`:''} <i>▾</i></button>
      <div class="aglist2" hidden><span class="agt-l">이 단지 문의 가능한 제휴 중개사<em>제휴·광고</em></span>${all.map(a=>chip(a,g,k,rank(a))).join('')}</div>`;
    A.log('rec', all.map(a=>a.id).sort().join(','), g, k);   // 카드에 추천 표시(펼치기 전)
    const btn = el.querySelector('.agopen'), box = el.querySelector('.aglist2');
    let logged = false;
    btn.onclick = ()=>{
      const show = box.hidden; box.hidden = !show;
      btn.querySelector('i').textContent = show ? '▴' : '▾';
      if (show && !logged){ logged = true; all.forEach(a=>A.log('imp', a.id, g, k)); JDJ.track('agent_open', {sgg:g, n:all.length, own}); }
    };
  });
}
function openAgent(id, g, k){
  const a = AG[id]; if (!a) return;
  const A = window.JDJ_AGENTS;
  A.log('view', id, g, k); JDJ.track('agent_view', {agent:id, sgg:g});
  const tel = String(a.ph||'').replace(/[^\d]/g,'');
  const kk = /^https:\/\//.test(a.kk||'') ? a.kk : '';
  let bg = $('agm');
  if (!bg){ bg = document.createElement('div'); bg.id='agm'; bg.className='agm-bg'; document.body.appendChild(bg);
    bg.addEventListener('click', e=>{ if(e.target===bg || e.target.classList.contains('x')) bg.classList.remove('open'); }); }
  bg.innerHTML = `<div class="agm" role="dialog" aria-modal="true"><button class="x" aria-label="닫기">×</button>
    <span class="tag">제휴·광고</span>
    <h3>${esc(a.n)}</h3>
    <dl><dt>대표</dt><dd>${esc(a.ceo)} 공인중개사</dd><dt>소재지</dt><dd>${esc(a.ogn)} ${esc(a.dong)}</dd>
      <dt>등록번호</dt><dd>${esc(a.reg)}</dd><dt>전화</dt><dd>${esc(a.ph)}</dd>
      ${a.dj.length?`<dt>매물 단지</dt><dd>${a.dj.filter(x=>x.startsWith(g+'|')).map(x=>esc(x.split('|')[2])).join(', ')||'-'}</dd>`:''}</dl>
    ${a.intro?`<p style="margin:0;font-size:14px">${esc(a.intro)}</p>`:''}
    <div class="acts">${tel?`<a class="btn primary" href="tel:${tel}" data-act="call">전화하기</a>`:''}${kk?`<a class="btn gold" href="${esc(kk)}" target="_blank" rel="noopener" data-act="kakao">카카오톡 문의</a>`:''}</div>
    <p class="disc">이 중개사무소는 장대장 리포트 제휴(광고) 사무소입니다. 장대장은 중개 행위에 관여하지 않으며, 매물 정보와 거래 조건은 해당 중개사무소에 직접 확인하세요.</p></div>`;
  bg.querySelectorAll('[data-act]').forEach(el=>el.addEventListener('click', ()=>{
    const t = el.dataset.act; A.log(t, id, g, k); A.flush(); JDJ.track('agent_'+t, {agent:id, sgg:g});
  }));
  bg.classList.add('open');
}
document.addEventListener('click', e=>{
  const b = e.target.closest('.agbtn'); if (!b) return;
  openAgent(b.dataset.a, b.dataset.g, b.dataset.k);
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ const bg=$('agm'); if(bg) bg.classList.remove('open'); } });

/* ---------- 시작 ---------- */
(async function(){
  try{
    IX = await loadIndex();
    S.sido = IX.sido.find(s=>s.name===Q.get('sd')) || defaultSido();
    S.sggs = (Q.get('g') && IX.sgg[Q.get('g')] && IX.sgg[Q.get('g')].sido===S.sido.name) ? new Set([Q.get('g')]) : new Set(defaultSggs(S.sido));
    cmpLoad(); buildSettings(); wireSettings();
    $('cmpBtn').onclick=()=>{ MODE==='cmp' ? goRec() : goCompare(); JDJ.track('cmp_toggle',{mode:MODE}); };
    setModeUi();
    $('backBtn').href = '../' + (location.search||'');
    await render();
    JDJ.track('report_view');
  }catch(e){
    $('report').innerHTML = `<div class="empty">실거래 데이터를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</div>`;
    console.error(e);
  }
})();
</script>
