<script>
var JB = (typeof window !== 'undefined' && window.JDJ_BASE) || (function (p) { var g = p.indexOf('/jangdaejang-calc/') === 0, b = { SITE: g ? '/jangdaejang-calc/' : '/', DATA: g ? '/jangdaejang-data/' : 'https://chrisjangdaejang-ux.github.io/jangdaejang-data/' }; if (typeof window !== 'undefined') window.JDJ_BASE = b; return b; })((typeof location !== 'undefined' && location.pathname) || '/jangdaejang-calc/');
const $ = id => document.getElementById(id);
const DATA = JB.DATA + 'data/';
/* 쉬운 말 문구(assets/plain-words.js): 용어 풀이는 리포트 한 장마다 처음 나올 때만 */
const PL = window.JDJ_PLAIN; let GLS = PL.gloss();
const FORM = 'https://docs.google.com/forms/d/e/1FAIpQLScCG7wzIlY3FE6EHU5QWo92uW5NQe7aiP-GJ9jvh41Rx2E8Zw/viewform';
const NOTES = (window.JDJ_REGION_NOTES||{notes:{},sources:[],asOf:''});
/* 행정구역 개편으로 코드가 바뀐 곳(예: 전남광주통합특별시 12xxx)은 '시도|시군구 이름'으로 기존 메모를 찾는다(assets/rec-core.js noteKey — 길잡이와 같은 함수) */
function noteKey(code){ return window.JDJ_REC.noteKey(NOTES, (typeof IX!=='undefined' && IX) || null, code); }
function noteOf(code){ return NOTES.notes[noteKey(code)]; }

/* 규제지역 (2026.7.1 기준): 서울 전역 + 경기 15곳 */
/* 규제지역 판정·LTV·점수·순위는 갈아타기 계산기와 같은 공통 모듈(assets/rec-core.js) */
const REC = window.JDJ_REC;
const REG_GG = REC.REG_GG, isReg = REC.isReg, isCap = REC.isCap, LTV = REC.LTV;
const TYPE_RATIO = {var:1, mix:.8, cyc:.4};
const TYPE_NAME = {var:'변동형', mix:'혼합형', cyc:'주기형'};
const OWN_NAME = {none:'무주택', first:'생애최초', one:'1주택(처분조건)', multi:'다주택'};
const GROUP_NAME = {reg:'규제지역', capfree:'비규제 수도권', local:'지방 비규제'};
const BANDS = ['40㎡ 이하','49㎡대','59㎡대','74㎡대','84㎡대','99㎡대','114㎡대','135㎡대','150㎡ 이상'];
const PY = 3.3058;

const num = s => { const v=parseFloat(String(s).replace(/[^0-9.]/g,'')); return isNaN(v)?0:v; };
const fmtW = m => { const t = fmt(m); return /원$/.test(t) ? t : t + '원'; };   /* '0원원' 방지 */
function fmt(man){ man=Math.round(man); if(man<=0) return '0원'; const e=Math.floor(man/10000), r=man%10000; return !e ? r.toLocaleString()+'만' : e+'억'+(r?' '+r.toLocaleString()+'만':''); }
function fmtS(man){ if(man>=10000) return (Math.round(man/1000)/10).toString().replace(/\.0$/,'')+'억'; return Math.round(man).toLocaleString()+'만'; }
function r100(m){ return Math.round(m/100)*100; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
/* 단지 '시세 흐름 보기' 단추 (assets/price-sheet.js 공용 시트) */
function WS(x){ return window.JDJ_WATCH ? JDJ_WATCH.star({sd:x.sd||sdIdOf(x.code), code:x.code, dong:x.dong, jibun:x.jb||'', apt:x.apt, band:x.band}, {small:true}) : ''; }   /* 관심 별(assets/watch.js) */
function PB(x, at, cls, apt){ return window.JDJ_PRICE ? JDJ_PRICE.btn({sd:x.sd||sdIdOf(x.code), sgg:x.code, dong:x.dong, apt:apt||x.apt, band:x.band, jibun:apt?'':x.jb}, at, {cls:cls||''}) : ''; }

/* ---------- 상태 ---------- */
/* 개인 금융값(연소득·현금·대출·이름·기타 비용)은 주소가 아니라 이 기기에만 보관(assets/share.js).
   예전 공유 링크처럼 주소에 개인값이 있으면: 주소에서 지우고, 이 기기에 저장된 내 값이 없으면 입력 화면으로 보냄 */
/* 이 기기에 저장된 값이 비어 있으면(연소득·현금이 0이거나 없음) 없는 것으로 본다 — 공유 링크로 처음 연 사람에게 '연소득 0원·대출 불가' 리포트가 뜨지 않게 */
/* 길잡이(solve/)의 '같은 조건으로 검색 화면에서 보기'로 온 경우(?from=guide): 길잡이가 이 탭에만 넘긴 연소득·현금(sessionStorage jdj_gfin, 30분)으로 계산 — 주소에는 개인값을 싣지 않음.
   이 기기에 저장된 값은 바꾸지 않아요(조건 수정에서 고치면 그때 저장). */
const GFIN = (function(){ try{ if(new URLSearchParams(location.search).get('from')!=='guide') return null; const g=JSON.parse(sessionStorage.getItem('jdj_gfin')||'null'); return g && g.at && Date.now()-g.at < 1800e3 ? g : null; }catch(e){ return null; } })();
const FIN = (function(){ const f = (window.JDJ_SHARE && JDJ_SHARE.loadFin()) || null;
  if (GFIN) return Object.assign({}, f||{}, {i:GFIN.i, c:GFIN.c, d:GFIN.d||0, e:GFIN.e!=null?GFIN.e:1000});
  if(!f) return null;
  const pos = v => parseFloat(String(v==null?'':v).replace(/[^0-9.]/g,''))>0; return (pos(f.i) || pos(f.c)) ? f : null; })();
if (window.JDJ_SHARE && JDJ_SHARE.hasPersonal(location.search)) {
  const clean = JDJ_SHARE.stripPersonal(location.search);
  if (!FIN) { const q=new URLSearchParams(clean); const b=new URLSearchParams(); ['r','sd','g'].forEach(k=>{ if(q.get(k)) b.set(k,q.get(k)); }); b.set('from','share'); location.replace('../?'+b.toString()); }
  history.replaceState(null,'',location.pathname+clean+location.hash);
}
const Q = new URLSearchParams(location.search);
const FV = (k,d)=> FIN && FIN[k]!=null && FIN[k]!=='' ? FIN[k] : d;
const S = {
  name: String(FV('n','')),
  income: num(FV('i',7000)), cash: num(FV('c',40000)), debt: num(FV('d',0)),
  own: Q.get('o')||'none', rtype: Q.get('t')||'cyc', rate: num(Q.get('rt')||4.0), term: parseInt(Q.get('tm')||30,10),
  etc: num(FV('e',1000)), region: Q.get('r')||'seoul',
  sido: null, sggs: new Set(), areas: new Set(['59㎡대','74㎡대','84㎡대']),
  /* 신축(준공 N년 이내)·집값 상한(만원) — 0 = 상관없음. 주소 nb·pm(개인값 아님) */
  newb: [5,10].includes(parseInt(Q.get('nb'),10)) ? parseInt(Q.get('nb'),10) : 0, pmax: Math.max(0, parseInt(Q.get('pm'),10)||0),
  /* 맞춤 단지 정렬(추천 순·역 가까운 순·신축 순·거래 많은 순)·재건축 단지만 보기 — 주소 so·rb(개인값 아님) · shown: '더 보기'로 펼친 곳 수 */
  sort: REC.sortId(Q.get('so')), rb: Q.get('rb')==='1', shown: REC.PAGE
};
/* 평형: 주소 ar(쉼표로 여러 개, 길잡이에서 올 때) */
{ const ar=(Q.get('ar')||'').split(',').filter(b=>BANDS.includes(b)); if (ar.length) S.areas=new Set(ar); }
let IX=null; const SIDO_CACHE={};
/* 지역 상관없음: 자료가 있는 전 시·도를 한 번에 본다 */
const ANY = {id:'all', name:'지역 상관없음', short:'상관없음', any:true};
let ALL_UNITS=null, ALL_P=null;

/* ---------- 계산 엔진 (계산기와 동일 기준) ---------- */
function groupOf(code){ return isReg(code) ? 'reg' : (isCap(code) ? 'capfree' : 'local'); }
/* 대출·최대 매수액은 계산기와 같은 공용 함수(assets/loan-core.js) */
function ctxFor(g){ return JDJ_LOAN.ctx({g, own:S.own, rtype:S.rtype, income:S.income, cash:S.cash, debt:S.debt, rate:S.rate, term:S.term, etc:S.etc}); }
const capByPrice = JDJ_LOAN.capByPrice, monthly = JDJ_LOAN.monthly, loanAt = JDJ_LOAN.loanAt, dsrMax = JDJ_LOAN.dsrMax;
function costDetail(P,c,large){ return JDJ_LOAN.costDetail(P,c,!!large); }
function need(P,c,dsr,large){ return JDJ_LOAN.need(P,c,dsr,!!large); }
function maxPrice(c,dsr){ return JDJ_LOAN.maxPrice(c,dsr,false); }
const BY_TXT = {LTV:'LTV(집값 대비 비율)', CAP:'가격구간별 대출 한도', DSR:'소득(DSR 40%)', DTI:'소득(DTI)', BAN:'주택구입 주담대 불가'};

/* ---------- 데이터 ---------- */
let MODEL=null, RAIL=null, MH=null, SUPPLY=null, EVD=null;
/* 근거 등급(data/evidence.json): 과거 같은 조건 단지의 2년 뒤 성적 — 무료 리포트는 등급 + 한 줄 요약만 */
const EVK=(x,kind)=>PL.evid(EVD, sdIdOf(x.code), (x.fx||{}).eb, kind, PL.regionInfo(IX,x.code).short, GLS);
const liR=r=>`<li class="${r[0]}">${esc(r[1])}${r[2]?PL.evHtml(r[2],false,esc):''}${r[3]||''}</li>`;   /* r[3]: 모듈이 이스케이프해 만든 펼침 문단(주변 개발사업) */
let DEVP=null, POLD=null;
/* 새 분석 설명(한 줄 결론 → 핵심 요약 → 줄별 자세히 보기, assets/narrative.js) — 대표 승인(11/20)으로 기본 적용, ?nar=0 이면 예전 설명 */
const NARON = !/[?&]nar=0(&|$)/.test(location.search) && !!window.JDJ_NAR;
function narFor(x, i){
  if (!NARON || !x.fx || x.fx.fv==null) return '';
  const N = JDJ_NAR.build(x.fx, {apt:x.apt, dong:x.dong, code:x.code, band:x.band, area:x.area, IX, EV:EVD, MH, SP:SUPPLY, PL, year:new Date().getFullYear(), s:x.series,
    regionUsed:!!(MODEL&&MODEL.region&&MODEL.region.used), jibun:x.jb, pol:POLD, dev: DEVP ? {data:DEVP, u:{code:x.code, dong:x.dong, jibun:x.jb}, o:{apt:x.apt, sggName}} : null});
  return JDJ_NAR.html(N, {id:'nar'+i});
}
let HZ=2;
try{ HZ = parseInt(new URLSearchParams(location.search).get('hz') || localStorage.getItem('jdj_hz') || '2',10); }catch(e){}
if(!(HZ>=1&&HZ<=10)) HZ=2;
/* 보유 기간별 모델: 2년은 기본 모델(항상 사용), 1·3·5·7년은 여러 시기 검증(3개 시기 이상 + 표본 외 상위20% 플러스)을 통과했을 때만 사용 */
/* 표본 외 검증(그 시기보다 과거만으로 학습 → 이후를 맞힘)을 2회 이상 했고 평균이 플러스인 기간만 사용 */
/* 보유 기간 모델 고르기·섞기·점수 넣기는 길잡이와 같은 공통 함수(assets/rec-core.js hzList·hzMix·applyHz) */
const VOK=m=>REC.VOK(m);
const HOK=h=>REC.hzList(MODEL,MH).includes(h);
const HLIST=()=>REC.hzList(MODEL,MH);
function hzMix(y){ return REC.hzMix(y, MODEL, MH); }
const MOD=h=>h===2?MODEL:(MH&&MH[h]);
const RZ_LV={1:'신속통합기획 대상지 선정',2:'신속통합기획 완료',3:'정비구역 지정',4:'추진위원회 승인',5:'조합설립인가',6:'건축심의',7:'사업시행인가',8:'관리처분인가',9:'이주',10:'착공'};
const rzYm=v=>v?`${v.slice(0,4)}.${v.slice(4)}`:'';
const rzSrc=z=>z.src==='busan'?'부산시 정비사업 추진현황 기준':z.src==='nat'?'국토교통부 전국 도시정비사업 통합 데이터 기준, 연 1회 갱신':'서울시 정비사업 추진현황·서울플랜+ 기준';
const rzText=z=>`${PL.rzText(z,GLS,rzYm)} (${rzSrc(z)})`;
const RUSED=()=>!!(MODEL&&MODEL.region&&MODEL.region.used);
async function loadIndex(){ try{ const m=await fetch(DATA+'model.json',{cache:'no-cache'}); MODEL=m.ok?await m.json():null; }catch(e){} try{ const mh=await fetch(DATA+'model_h.json',{cache:'no-cache'}); MH=mh.ok?await mh.json():null; }catch(e){} try{ const q=await fetch(DATA+'rail.json',{cache:'no-cache'}); RAIL=q.ok?await q.json():null; }catch(e){} try{ const q=await fetch(DATA+'supply.json',{cache:'no-cache'}); SUPPLY=q.ok?await q.json():null; }catch(e){} try{ const q=await fetch(DATA+'evidence.json',{cache:'no-cache'}); EVD=q.ok?await q.json():null; }catch(e){} try{ DEVP=window.JDJDev?await JDJDev.load(DATA):null; }catch(e){} try{ POLD=NARON&&window.JDJPolicy?await JDJPolicy.load(DATA):null; }catch(e){} const r=await fetch(DATA+'index.json',{cache:'no-cache'}); if(!r.ok) throw new Error('index'); return r.json(); }
/* 지역 상관없음: 시·도 파일을 하나씩 순서대로 불러온다(한꺼번에 받지 않아 휴대폰 데이터·메모리 부담을 나눔). 받은 파일은 다시 받지 않음 */
function loadAll(onStep){
  if (ALL_UNITS) return Promise.resolve(ALL_UNITS);
  if (ALL_P) return ALL_P;
  ALL_P = (async()=>{ const out=[]; let i=0;
    for (const sd of IX.sido){ if(onStep) onStep(i, IX.sido.length, sd.name);
      try{ const u=await loadSido(sd.id); for(const x of u) out.push(x); }catch(e){ console.warn('sido',sd.id,e); }
      i++; }

const XY_CACHE = {}; let MAP = null, PINS = [];
function goCard(i, id){ const c=$(id||('pk'+i)); if(!c) return; markPin(i); c.scrollIntoView({behavior:'smooth',block:'start'}); c.classList.add('flash'); setTimeout(()=>c.classList.remove('flash'),1600); }
function markPin(i){ PINS.forEach((m,j)=>{ const e=m.getElement&&m.getElement(); if(e) e.classList.toggle('on', j===i); m.setZIndexOffset(j===i?2000:(PINS.length-j)*10); });
  document.querySelectorAll('.rkrow').forEach(r=>r.classList.toggle('on', +r.dataset.i===i)); }
async function loadXY(id){ if(XY_CACHE[id]!==undefined) return XY_CACHE[id];
  try{ const r=await fetch(DATA+id+'_xy.json',{cache:'no-cache'}); XY_CACHE[id] = r.ok ? ((await r.json()).xy||{}) : {}; }catch(e){ XY_CACHE[id]={}; } return XY_CACHE[id]; }
let LF_P = null;
function loadLeaflet(){ if(window.L) return Promise.resolve(); if(LF_P) return LF_P;
  LF_P = new Promise((ok,no)=>{ const base=JB.SITE + 'assets/leaflet/';
    if(!document.querySelector('link[data-lf]')){ const l=document.createElement('link'); l.rel='stylesheet'; l.href=base+'leaflet.css'; l.dataset.lf='1'; document.head.appendChild(l); }
    const s=document.createElement('script'); s.src=base+'leaflet.js'; s.onload=()=>ok(); s.onerror=()=>{ LF_P=null; no(new Error('leaflet')); }; document.head.appendChild(s); });
  return LF_P; }
/* 핀이 겹치면 순위가 낮은 쪽을 숫자만 있는 작은 핀으로 (확대하면 다시 펼쳐짐) */
function declutter(){ if(!MAP) return; const placed=[];
  PINS.forEach(m=>{ const e=m.getElement&&m.getElement(); if(!e||!m.getLatLng) return;
    const pt=MAP.latLngToContainerPoint(m.getLatLng()), w=74, h=34, r={l:pt.x-w/2,r:pt.x+w/2,t:pt.y-h-6,b:pt.y};
    const hit=placed.some(q=>r.l<q.r&&r.r>q.l&&r.t<q.b&&r.b>q.t);
    e.classList.toggle('mcmp', hit); if(!hit) placed.push(r); }); }
async function drawMap(picked){
  const box=$('rkMap'); if(!box) return;
  if (MAP){ MAP.remove(); MAP=null; } PINS=[];
  const xy = {}; for (const id of [...new Set(picked.map(x=>sdIdOf(x.code)))]) Object.assign(xy, await loadXY(id));
  const pts = picked.map((x,i)=>({x,i,p:xy[`${x.code}|${x.dong}|${x.jb}`]})).filter(o=>o.p);
  if (!pts.length || $('rkMap')!==box) return;          /* 좌표 없는 단지는 목록에만 */
  await loadLeaflet(); if (!box.isConnected) return;
  box.hidden = false;
  MAP = L.map(box, {scrollWheelZoom:false, zoomControl:true, attributionControl:true, tap:false});
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> 기여자'}).addTo(MAP);
  MAP.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');
  const ringOf = x => (x.fx && x.fx.fv!=null) ? x.fx.fv : Math.round(x.score*100);
  for (const {x,i,p} of pts){
    const ic = L.divIcon({className:'mpinw', iconSize:null, html:`<button type="button" class="mpin ${i===0?'r1':''}" aria-label="추천 ${i+1}위 ${esc(x.apt)}, 점수 ${ringOf(x)}점 — 단지 카드로 이동"><span class="mf">${i+1}위 · ${ringOf(x)}</span><span class="mm">${i+1}</span></button>`});
    const m = L.marker([p[1],p[0]], {icon:ic, keyboard:false, title:x.apt, zIndexOffset:(picked.length-i)*10}).addTo(MAP);
    m.on('click', ()=>{ goCard(i); JDJ.track('report_map_pin',{rank:i+1}); });
    PINS[i] = m;
  }
  PINS = PINS.map(m=>m||{getElement:()=>null,setZIndexOffset:()=>{}});
  const b = L.latLngBounds(pts.map(o=>[o.p[1],o.p[0]]));
  MAP.on('zoomend', declutter);
  if (pts.length===1) MAP.setView(b.getCenter(), 15); else MAP.fitBounds(b, {padding:[46,46], maxZoom:16});
  declutter();

}

    const cand = list.filter(a=>a.r.includes(g));
    if (!cand.length){
      /* 제휴 중개사가 없는 구: 고객은 부동산 전문가 상담으로 연결, 중개사에겐 작은 모집 안내 */
      const apt = k.split('|')[2];
      const q = new URLSearchParams({usp:'pp_url'});
      q.set('entry.397234060', sggName(g)+' '+dong); q.set('entry.658364183', `[단지 문의] ${apt} (${sggName(g)} ${dong}) | ${JDJ.label()}`);
      el.innerHTML = `<a class="agopen noprint" href="${FORM}?${q.toString().replace(/\+/g,'%20')}" target="_blank" rel="noopener" data-track="danji_consult" style="text-decoration:none">이 단지 상담 받기 <i>→</i></a>
        <span class="agwant noprint" style="margin-left:10px;font-size:13.5px;font-weight:500;color:var(--muted)">공인중개사이신가요? <a href="../../agent/" target="_blank" rel="noopener" data-track="agent_join_click">이 지역 제휴 신청</a></span>`;
      return;
    }
    const rank = a => a.dj.includes(k) ? 0 : (a.og===g && a.dong===dong ? 1 : (a.og===g ? 2 : 3));
    /* 같은 순위(매물 보유·같은 동·같은 구) 안에서는 리뷰 보정 별점 순, 같으면 무작위 */
    const all = shuffle(cand).sort((x,y)=>rank(x)-rank(y) || rvSc(y)-rvSc(x));
    const own = all.filter(a=>rank(a)===0).length;
    el.innerHTML = `<button class="agopen noprint">공인중개사 연결하기 · ${all.length}곳${own?` <span class="b">매물 보유 ${own}곳</span>`:''} <i>▾</i></button>
      <div class="aglist2" hidden><span class="agt-l">이 단지 문의 가능한 제휴 중개사<em>제휴·광고</em></span>${all.map(a=>chip(a,g,k,rank(a))).join('')}<div class="ldslot noprint"></div></div>`;
    A.log('rec', all.map(a=>a.id).sort().join(','), g, k);   // 카드에 추천 표시(펼치기 전)
    const btn = el.querySelector('.agopen'), box = el.querySelector('.aglist2');
    let logged = false;
    btn.onclick = ()=>{
      const show = box.hidden; box.hidden = !show;
      btn.querySelector('i').textContent = show ? '▴' : '▾';
      if (show && !logged){ logged = true; all.forEach(a=>A.log('imp', a.id, g, k)); JDJ.track('agent_open', {sgg:g, n:all.length, own}); }
      if (show && window.JDJ_LEAD && !el.dataset.ld){ el.dataset.ld = '1'; JDJ_LEAD.mount(el.querySelector('.ldslot'), {src:'report', kind:'buy', g, gn:sggName(g), k, apt:k.split('|')[2]}); }
    };
  });
}

    ${a.intro?`<p style="margin:0;font-size:15px">${esc(a.intro)}</p>`:''}

  bg.querySelectorAll('[data-act]').forEach(el=>el.addEventListener('click', ()=>{

  }));
  bg.classList.add('open');
  /* 상담 리뷰 (실제로 이 사이트에서 전화·카톡 문의한 사람만 작성 가능) */
  const m = bg.querySelector('.agm'), wrap = document.createElement('div'); wrap.className='rvlist'; m.appendChild(wrap);
  const tk = rvTickets()[id];
  if (tk && Date.now()-tk.at>12*3600e3) wrap.insertAdjacentHTML('beforebegin', `<button class="btn" style="width:100%;margin-top:8px" id="rvWrite">이 공인중개사 상담 리뷰 쓰기</button>`);
  const wb = bg.querySelector('#rvWrite'); if (wb) wb.onclick=()=>{ bg.classList.remove('open'); rvForm(id, tk.name); };

      : '<small style="color:var(--muted)">아직 상담 리뷰가 없어요. 이 사이트에서 문의하신 분은 12시간 뒤부터 리뷰를 남길 수 있어요.</small>';
    wrap.querySelectorAll('[data-fl]').forEach(b=>b.onclick=()=>{ const why=prompt('신고 사유를 적어 주세요 (욕설·개인정보·허위 사실 등)'); if(!why) return;
      A.post({action:'flag', id:b.dataset.fl, why}).then(()=>{ b.textContent='신고됨'; b.disabled=true; }).catch(e=>alert(e.message)); });
  }).catch(()=>{});
}
/* ---------- 상담 리뷰 ---------- */
function rvTickets(){ try{ return JSON.parse(localStorage.getItem('jdj_rvq')||'{}'); }catch(e){ return {}; } }
function rvSave(o){ try{ localStorage.setItem('jdj_rvq', JSON.stringify(o)); }catch(e){} }
function rvTicket(id, name){ const o=rvTickets(); if(!o[id]) o[id]={at:Date.now(), name}; rvSave(o); }
const RV_TAGS=['친절해요','설명이 자세해요','연락이 빨라요','전문적이에요','부담 없이 상담해요'];
function rvForm(id, name){
  let box=$('rvbox'); if(box) box.remove();
  box=document.createElement('div'); box.id='rvbox'; box.className='rvbox noprint';
  box.innerHTML=`<button class="x" style="position:absolute;right:8px;top:4px;border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted)" aria-label="닫기">×</button>
    <b>${esc(name)} 상담은 어떠셨어요?</b><div style="font-size:13.5px;color:var(--muted)">별점은 그대로 공개되고, 다른 분들이 좋은 공인중개사를 고르는 데 쓰여요.</div>
    <div class="stars">${[1,2,3,4,5].map(n=>`<button data-s="${n}" aria-label="${n}점">★</button>`).join('')}</div>
    <div class="tags">${RV_TAGS.map(t=>`<label><input type="checkbox" value="${t}">${t}</label>`).join('')}</div>
    <textarea maxlength="300" placeholder="상담 후기 (선택, 300자) — 전화번호 등 개인정보는 자동으로 가려져요"></textarea>
    <div style="display:flex;gap:8px;margin-top:8px"><button class="btn primary" style="flex:1" id="rvSend">리뷰 남기기</button><button class="btn" id="rvLater">나중에</button><button class="btn" id="rvNo">상담 안 했어요</button></div>
    <div class="msg" id="rvMsg" style="font-size:13.5px;margin-top:6px"></div>`;
  document.body.appendChild(box);
  let S=0; box.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ S=+b.dataset.s; box.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on', +x.dataset.s<=S)); });
  const close=()=>box.remove();
  box.querySelector('.x').onclick=close;
  box.querySelector('#rvLater').onclick=()=>{ const o=rvTickets(); if(o[id]) o[id].snooze=Date.now(); rvSave(o); close(); };
  box.querySelector('#rvNo').onclick=()=>{ const o=rvTickets(); if(o[id]) o[id].done=1; rvSave(o); close(); };
  box.querySelector('#rvSend').onclick=()=>{
    const msg=box.querySelector('#rvMsg'); if(!S){ msg.textContent='별점을 골라 주세요.'; return; }
    const tags=[...box.querySelectorAll('.tags input:checked')].map(x=>x.value), text=box.querySelector('textarea').value;
    let vid=''; try{ vid=localStorage.getItem('jdj_vid')||''; }catch(e){}
    window.JDJ_AGENTS.post({action:'review', a:id, vid, s:S, tags, text}).then(()=>{
      const o=rvTickets(); if(o[id]) o[id].done=1; rvSave(o); JDJ.track('agent_review',{agent:id, s:S});
      box.innerHTML='<b>감사해요!</b> 리뷰가 등록됐어요. 다른 분들이 좋은 공인중개사를 고르는 데 큰 도움이 돼요.'; setTimeout(close, 2500);
    }).catch(e=>{ msg.textContent=e.message; });
  };
}
/* 리포트를 다시 열었을 때: 문의 후 12시간 지난 중개사 리뷰 요청(나중에 → 3일 뒤 다시, 한 번에 하나) */
setTimeout(()=>{ const o=rvTickets(), now=Date.now();
  const id=Object.keys(o).find(k=>!o[k].done && now-o[k].at>12*3600e3 && now-o[k].at<60*86400e3 && (!o[k].snooze || now-o[k].snooze>3*86400e3));
  if(id && window.JDJ_AGENTS && window.JDJ_AGENTS.ready) rvForm(id, o[id].name); }, 4000);
document.addEventListener('jdj:kchat', e=>{
  const d = e.detail||{}, a = AG[d.a]; if (!a) return;

  rvTicket(d.a, agName(a));
});

/* 카카오 간편 로그인(assets/auth.js): 키가 없으면 잠금·저장 단추 모두 없음. 로그인 전에는 카드 요약·점수까지, 상세(대출·현금·월 상환·이유 전체)는 로그인 뒤 */
function repLocked(){ return !!(window.JDJ_AUTH && JDJ_AUTH.on() && !JDJ_AUTH.user()); }
function repSnapshot(){
  const q=new URLSearchParams(window.JDJ_SHARE ? JDJ_SHARE.stripPersonal(location.search) : location.search); q.delete('from'); q.delete('full');
  if (S.sido && !q.get('sd')) q.set('sd', S.sido.any?'all':S.sido.name);
  q.set('hz', String(HZ));
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  const picks=(window.__PICKED||[]).slice(0,10).map(x=>({apt:x.apt, area:`${sggName(x.code)} ${x.dong}`, band:x.band, P:Math.round(x.P), fv:x.fx&&x.fx.fv!=null?x.fx.fv:null}));
  return {id:'r'+d.getTime().toString(36), t:`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`,

function repAuthUi(){

(async function(){
  try{
    IX = await loadIndex();
    S.sido = (Q.get('sd')==='all' || Q.get('sd')===ANY.name) ? ANY : (IX.sido.find(s=>s.name===Q.get('sd')) || defaultSido());
    S.sggs = (Q.get('g') && IX.sgg[Q.get('g')] && IX.sgg[Q.get('g')].sido===S.sido.name) ? new Set([Q.get('g')]) : new Set(defaultSggs(S.sido));
    /* 여러 구(주소 gs, 쉼표 — 길잡이 '같은 조건으로 검색 화면에서 보기') */
    { const gs=(Q.get('gs')||'').split(',').filter(g=>IX.sgg[g] && (S.sido.any || IX.sgg[g].sido===S.sido.name)); if (gs.length) S.sggs=new Set(gs); }
    /* 가족과 자세히 공유로 받은 경우: 보낸 분이 고른 구·시·군과 평형까지 그대로 (assets/share.js, 이 탭에서만) */
    { const SV = window.JDJ_SHARE && JDJ_SHARE.viewing(), x = (SV && SV.x) || null;
      if (x && Array.isArray(x.sg)){ const ok = x.sg.map(String).filter(g => IX.sgg[g] && (S.sido.any || IX.sgg[g].sido===S.sido.name)); if (ok.length) S.sggs = new Set(ok); }
      if (x && Array.isArray(x.ar) && x.ar.length) S.areas = new Set(x.ar.map(String).slice(0,12)); }
    cmpLoad(); buildSettings(); wireSettings();
    { const r=$('hzr'); if(r){ r.oninput=()=>{ rangeP(r); const v=$('hzv'); if(v) v.textContent=hzLbl(+r.value); }; r.onchange=()=>{ setHz(+r.value); JDJ.track('hz',{hz:r.value}); }; } } hzUi();
    $('cmpBtn').onclick=()=>{ MODE==='cmp' ? goRec() : goCompare(); JDJ.track('cmp_toggle',{mode:MODE}); };
    setModeUi();
    $('backBtn').href = '../' + (location.search ? location.search+'&full=1' : '?full=1');
    /* 공유: 요약(개인 숫자 없음) 또는 가족과 자세히(연소득·현금·대출·이름·기타 비용과 고른 조건을 주소 # 뒤에만) */
    if (window.JDJ_SHARE) JDJ_SHARE.setup({tool:'report', keep:['r','sd','g','gs','ar','nb','pm','o','so','rb'], detail(){
      const f = JDJ_SHARE.loadFin(), pos = v => parseFloat(String(v==null?'':v).replace(/[^0-9.]/g,''))>0;
      if (!f || !(pos(f.i) || pos(f.c))) return null;   // 예시 조건으로 보고 있으면 자세히 공유할 내 값이 없음 → 요약만
      const q = Object.fromEntries(new URLSearchParams(location.search)); ['from','full','src'].forEach(k => delete q[k]); q.hz = HZ;
      return {path:'buy/report/', q, ls:{jdj_fin: JSON.stringify({i:S.income, c:S.cash, d:S.debt, n:S.name, e:S.etc})}, x:{sg:[...S.sggs], ar:[...S.areas]}};
    }});
    if (window.JDJ_AUTH && JDJ_AUTH.user()) JDJ_AUTH.syncHomes();
    await render();
    repAuthUi();
    if (PL.autoGloss) PL.autoGloss($('report'));
    JDJ.track('report_view');
  }catch(e){
    $('report').innerHTML = `<div class="empty">실거래 데이터를 불러오지 못했어요. 잠시 후 새로고침해 주세요.</div>`;
    console.error(e);
  }
})();
