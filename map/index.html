const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const J = (u, o) => fetch(u, Object.assign({cache:'no-cache'}, o || {})).then(r => r.ok ? r.json() : null).catch(() => null);
const Q = new URLSearchParams(location.search);
const S = { mode: ['price','fv','jr'].includes(Q.get('m')) ? Q.get('m') : 'price', size: ['s','m','l'].includes(Q.get('sz')) ? Q.get('sz') : '',
  price: C.PRICES.some(p => p.id && p.id === Q.get('pr')) ? Q.get('pr') : '', dev: Q.get('ly') === 'dev' || Q.get('ly') === 'all', bun: Q.get('ly') === 'bun' || Q.get('ly') === 'all' };
let IX = null, GEO = null, MH = null, MREG = false, MAP = null, SEL = null, MOVED = false;
const SD = {};                       // 시·도 id → {st:'wait'|'ok'|'err', list, byKey}
const PINS = new Map();              // 지금 지도에 올린 말풍선 key → {h, html}
let LAY = { dev: null, bun: null };

/* ---------- 이름 ---------- */
const sggOf = code => (IX && IX.sgg[code]) || {};
const sidoOf = code => (IX && IX.sido.find(s => s.name === sggOf(code).sido)) || {};
const sggName = code => sggOf(code).name || '';

/* ---------- 위쪽 조작 칸 ---------- */
function drawControls(){
  $('mode').innerHTML = C.MODES.map(m => `<button type="button" data-m="${m.id}" class="${S.mode === m.id ? 'on' : ''}" aria-pressed="${S.mode === m.id}">${m.t}</button>`).join('');
  $('fil').innerHTML = C.SIZES.map(z => `<button type="button" class="chip${S.size === z.id ? ' on' : ''}" data-sz="${z.id}" aria-pressed="${S.size === z.id}"${z.d ? ` title="${z.d}"` : ''}>${z.t}</button>`).join('')
    + `<select class="chip${S.price ? ' on' : ''}" id="fPrice" aria-label="가격대">${C.PRICES.map(p => `<option value="${p.id}"${S.price === p.id ? ' selected' : ''}>${p.t}</option>`).join('')}</select>`
    + `<button type="button" class="chip lay${S.dev ? ' on' : ''}" data-ly="dev" aria-pressed="${S.dev}">개발사업</button>`
    + `<button type="button" class="chip lay bun${S.bun ? ' on' : ''}" data-ly="bun" aria-pressed="${S.bun}">분양 단지</button>`;
  $('fPrice').onchange = e => { S.price = e.target.value; after(); };
}
$('mode').addEventListener('click', e => { const b = e.target.closest('button[data-m]'); if (!b) return; S.mode = b.dataset.m; after(); });
$('fil').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.sz != null) S.size = b.dataset.sz;
  else if (b.dataset.ly) { S[b.dataset.ly] = !S[b.dataset.ly]; if (S[b.dataset.ly]) loadLayer(b.dataset.ly); }
  after();
});
function after(){ drawControls(); LASTLV = ''; legend(); render(); if (SEL && SEL.d) openCard(SEL.d, SEL.band, true); if (window.jdjStat) jdjStat('feature_use', {feature:'map_filter'}); }

let LEGOPEN = false, LASTLV = '';
function legend(){
  const el = $('legend'), lv = MAP && IX ? C.level(MAP.zoom()) : '';
  if (lv !== 'danji') { el.innerHTML = ''; return; }
  const scale = `<span class="scl">${S.mode === 'fv' ? '' : '배지 = '}미래가치 점수 낮음 <i class="t1"></i><i class="t2"></i><i class="t3"></i><i class="t4"></i><i class="t5"></i> 높음 ⓘ</span>`;
  el.innerHTML = `<button type="button" class="lgb" aria-expanded="${LEGOPEN}">${scale}</button>` + (LEGOPEN ? C.TONES.map(t => `<span><i class="${t[0]}"></i>${t[2]} · ${t[1]}</span>`).join('') + '<span class="sm">앞으로 2년, 같은 시·도 아파트와 비교한 점수(100점 만점)</span>' : '');
  el.querySelector('.lgb').onclick = () => { LEGOPEN = !LEGOPEN; legend(); render(); };
}

/* ---------- 자료 불러오기 (보이는 시·도만) ---------- */
function ensure(ids){
  let want = 0;
  for (const id of ids) {
    if (SD[id]) { if (SD[id].st === 'wait') want++; continue; }
    const sd = IX.sido.find(s => s.id === id); if (!sd) continue;
    SD[id] = { st: 'wait', list: [], byKey: new Map() }; want++;
    Promise.all([J(DATA + id + '.json'), J(DATA + (sd.xy || id + '_xy.json'))]).then(([u, x]) => {
      if (!u || !x) { SD[id].st = 'err'; render(); return; }
      const list = C.danjiList(u.units || [], x.xy || {}, id);
      SD[id] = { st: 'ok', list, byKey: new Map(list.map(d => [d.key, d])) };
      render();
      if (PENDING && PENDING.sd === id) { const d = SD[id].byKey.get(PENDING.d); const b = PENDING.b; PENDING = null; if (d) { MAP.setView(d.lat, d.lng, Math.max(MAP.zoom(), 16)); openCard(d, b); } }
    });
  }
  return want;
}
let PENDING = null;
function viewIds(bb){ const ids = C.sidosIn(GEO, bb); return ids || IX.sido.map(s => s.id); }

/* ---------- 말풍선 그리기 ---------- */
function node(cls, html, onClick){
  const n = document.createElement('div'); n.className = 'jm-n';
  const b = document.createElement('div'); b.className = 'jm-b ' + cls; b.innerHTML = html; n.appendChild(b);
  b.addEventListener('click', e => { e.stopPropagation(); if (MOVED) return; onClick(e); });
  return n;
}
function put(next){
  for (const [k, p] of PINS) if (!next.has(k)) { p.h.remove(); PINS.delete(k); }
  for (const [k, v] of next) {
    const p = PINS.get(k);
    if (p && p.sig === v.sig) { if (p.lat !== v.lat || p.lng !== v.lng) { p.h.move(v.lat, v.lng); p.lat = v.lat; p.lng = v.lng; } continue; }
    if (p) p.h.remove();
    const h = MAP.add(v.lat, v.lng, node(v.cls, v.html, v.tap), v.z || 0);
    PINS.set(k, { h, sig: v.sig, lat: v.lat, lng: v.lng });
  }
}
const pin = (m, k, o) => m.set(k, Object.assign({ sig: o.cls + '|' + o.html }, o));
function status(t){ $('mstat').textContent = t || ''; }
/* 말풍선을 두면 안 되는 칸(지도 좌표 px): 지도 위쪽 바깥, 위 안내, 범례, 오른쪽 버튼, 비교함, 지도 로고·축척·출처 */
function walls(){
  const mr = $('map').getBoundingClientRect(), H = mr.height, X = mr.width;   // 지도 네 가장자리 바깥(반쯤 잘린 말풍선 없게)
  const W = [{ l: -1e5, t: -1e5, r: 1e5, b: 0 }, { l: -1e5, t: H, r: 1e5, b: 1e5 }, { l: -1e5, t: -1e5, r: 0, b: 1e5 }, { l: X, t: -1e5, r: 1e5, b: 1e5 }];
  const add = el => { if (!el || el.hidden) return; const r = el.getBoundingClientRect(); if (!r.width || !r.height) return; W.push({ l: r.left - mr.left, t: r.top - mr.top, r: r.right - mr.left, b: r.bottom - mr.top }); };
  for (const id of ['mstat', 'legend', 'cmpbar']) if ($(id).childNodes.length) add($(id));
  add($('sheet'));                                                                         // 열린 카드 밑에 반쯤 걸린 말풍선 없게
  add(document.querySelector('.mside'));
  if (MAP.kind === 'kakao') W.push({ l: 0, t: H - 30, r: 190, b: H });   // 카카오 로고·축척(왼쪽 아래)
  else add($('map').querySelector('.leaflet-control-attribution'));
  return W;
}
const TW = C.textW;
/* 말풍선 자리(지도 좌표 px) 어림 — CSS .jm-b.* 크기와 맞춤 */
function gpBox(o){ const w = Math.max(56, TW(o.name, 13), TW(o.v, 12.5), TW(o.sub, 11)) + 20, h = 9 + 17 + (o.v ? 16 : 0) + (o.sub ? 14 : 0); return { l: o.x - w / 2, t: o.y - h / 2, r: o.x + w / 2, b: o.y + h / 2 }; }
function djBox(x, y, main, badge, name, more){
  const w = Math.max(TW(main, 14) + (badge ? TW(badge, 11.5) + 12 : 0), name ? Math.min(110, TW(name, 11.5)) : 0) + 18, h = 9 + 18 + (name ? 15 : 0);
  return { l: x - w / 2, t: y - 7 - h - (more ? 12 : 0), r: x + w / 2 + (more ? 12 : 0), b: y };
}

function render(){
  if (!MAP || !IX) return;
  const z = MAP.zoom(), lv = C.level(z), bb = MAP.bounds(), next = new Map(), gl = [], djc = [];
  let showName = false;
  saveUrl(z);
  let msg = '';
  if (lv === 'sido') {
    for (const s of IX.sido) {
      const g = GEO && GEO.sido[s.id]; if (!g) continue;
      const r = s.r || {}, v = S.mode === 'jr' ? (r.jr != null ? `전세 ${Math.round(r.jr)}%` : '') : S.mode === 'price' ? (r.mom != null ? `1년 ${r.mom > 0 ? '+' : ''}${r.mom}%` : '') : '';
      gl.push({ k: 'S' + s.id, lat: g.c[1], lng: g.c[0], cls: 'gp sd', name: s.short, v, p: (s.units || 0) * (s.id === 's00' ? 100 : 1),   // 겹치면 서울을 먼저(경기 가운데와 가까움)
      tap: () => MAP.setView(g.c[1], g.c[0], C.LV.sido + 2) });
    }
    msg = S.mode === 'price' ? '시·도별 최근 1년 아파트 시세 변동이에요. 지역을 누르면 가까이 볼 수 있어요.' : S.mode === 'jr' ? '시·도별 아파트 전세가율이에요. 지역을 누르면 가까이 볼 수 있어요.' : '미래가치 점수는 구·동·단지로 확대하면 보여요. 지역을 눌러 주세요.';
  } else if (lv === 'sgg') {
    const ids = viewIds(bb);
    let wait = S.mode === 'fv' ? ensure(ids) : 0;   // 구 순위(미래가치)는 단지 자료에 들어 있어 그때만 불러옴
    const gsBy = {};
    if (S.mode === 'fv') for (const id of ids) if (SD[id] && SD[id].st === 'ok') for (const d of SD[id].list) { if (gsBy[d.code] != null) continue; const f = d.bands.map(u => u[9]).find(f => f && typeof f === 'object' && f.gs != null); if (f) gsBy[d.code] = f.gs; }
    for (const code in (GEO ? GEO.sgg : {})) {
      const c = GEO.sgg[code]; if (!C.inBox(bb, c[1], c[0], 0.1)) continue;
      const g = sggOf(code); if (!g.name) continue;
      let v = '';
      if (S.mode === 'price') { const s = g.s || []; for (let i = s.length - 1; i >= Math.max(0, s.length - 3); i--) if (s[i] > 0) { v = C.ppyText(s[i]); break; } }
      else if (S.mode === 'jr') v = g.r && g.r.jr != null ? `전세 ${Math.round(g.r.jr)}%` : '';
      let cls = 'gp';
      if (S.mode === 'fv' && gsBy[code] != null && PL && PL.regionPlace) { const rp = PL.regionPlace(IX, code, gsBy[code]); if (rp) { v = `${rp.n}곳 중 ${/약 /.test(rp.text) ? '약 ' : ''}${rp.r}위`; cls += rp.pos === '상위권' ? ' t5' : rp.pos === '하위권' ? ' t1' : ' t3'; } }
      const gsv = S.mode === 'fv' ? gsBy[code] : null;
      gl.push({ k: 'G' + code, lat: c[1], lng: c[0], cls, name: g.name, v, p: (g.c || []).reduce((a, x) => a + x, 0),
        tap: gsv != null ? () => openGuCard(code, gsv) : () => MAP.setView(c[1], c[0], C.LV.sgg + 1) });
    }
    msg = wait ? '구별 미래가치 순위 자료를 불러오는 중이에요…' : S.mode === 'price' ? '구 전체 아파트 평당가(전용 3.3㎡당, 최근 3개월 실거래 중앙값)예요.' : S.mode === 'jr' ? '구 전체 아파트 전세가율(집값 대비 전셋값)이에요.' : '구별 미래가치 순위(같은 시·도 안 지역 흐름 점수)예요. 구를 누르면 이유가 보여요. 파랑 상위권 · 회색 중위권 · 주황 하위권';
  } else {
    const ids = viewIds(bb), wait = ensure(ids);   // (djc·showName 은 아래 겹침 정리 뒤 말풍선으로)
    const items = [];
    for (const id of ids) {
      const s = SD[id]; if (!s || s.st !== 'ok') continue;
      for (const d of s.list) { if (!C.inBox(bb, d.lat, d.lng, 0.15)) continue; const b = C.pick(d, IX.months, { size: S.size, price: S.price }); if (b) items.push({ d, b }); }
    }
    if (lv === 'dong') {
      for (const g of C.groups(items, 'dong')) {
        const v = C.groupText(S.mode, g);
        gl.push({ k: 'D' + g.k, lat: g.lat, lng: g.lng, cls: 'gp', name: g.dong, v, sub: `단지 ${g.n}`, p: g.n, tap: () => MAP.setView(g.lat, g.lng, C.LV.dong + 1) });
      }
      msg = S.mode === 'price' ? '동별 단지 평균 평당가예요. 동을 누르면 단지가 보여요.' : S.mode === 'fv' ? '동별 단지 미래가치 점수 평균이에요. 동을 누르면 단지가 보여요.' : '동별 단지 전세가율 평균이에요. 동을 누르면 단지가 보여요.';
    } else {
      const sz = MAP.size(), pts = [];
      for (const it of items) { const p = MAP.project(it.d.lat, it.d.lng); if (p.x < -60 || p.y < -60 || p.x > sz.w + 60 || p.y > sz.h + 60) continue; pts.push({ x: p.x, y: p.y, w: it.d.n, it }); }
      const big = z >= 15, cells = C.gather(pts, big ? 92 : 50, big ? 44 : 46);
      showName = z >= 16;
      for (const c of cells) {
        if (c.list.length > 1 && !big) {   // 묶음 동그라미: 자리는 처음 묶인 단지들 가운데(합쳐져도 안 움직이게)
          const ll = c.list.map(p => p.it.d), lat = C.mean(ll.map(d => d.lat)), lng = C.mean(ll.map(d => d.lng)), q = MAP.project(lat, lng);
          djc.push({ cl: true, lat, lng, list: c.list, p: 1e6 + c.list.length, box: { l: q.x - 28, t: q.y - 28, r: q.x + 28, b: q.y + 28 } });
          continue;
        }
        const { d, b } = c.list[0].it, main = C.mainText(S.mode, b), badge = S.mode !== 'fv' && b.fv != null ? String(b.fv) : '';
        const sel = !!(SEL && SEL.d && SEL.d.key === d.key);
        djc.push({ d, b, main, list: c.list, p: (sel ? 1e7 : 0) + (d.n || 0), box: djBox(c.list[0].x, c.list[0].y, main || '최근 거래 없음', badge, showName ? d.apt : '', c.list.length > 1) });
      }
      msg = items.length ? '' : (wait ? '' : (S.size || S.price) ? '이 화면에 고른 평형·가격대에 맞는 단지가 없어요.' : '이 화면에는 표시할 단지가 없어요.');
    }
    if (wait) msg = '단지 자료를 불러오는 중이에요…';
    else if (ids.some(id => SD[id] && SD[id].st === 'err')) msg = '일부 지역 자료를 불러오지 못했어요. 잠시 뒤 지도를 다시 움직여 주세요.';
  }
  if (!msg && ((S.dev && LAY.dev && LAY.dev.st === 'err') || (S.bun && LAY.bun && LAY.bun.st === 'err'))) msg = `${S.dev && LAY.dev && LAY.dev.st === 'err' ? '개발사업' : '분양 단지'} 자료를 불러오지 못했어요.`;
  else if (!msg && S.bun && z < 12 && lv !== 'sido') msg = '분양 단지는 조금 더 확대하면 보여요.';
  if (lv !== LASTLV) { LASTLV = lv; legend(); }
  status(msg);                                   // 안내·범례 크기가 정해진 뒤 그 자리를 비워 두고 말풍선을 놓는다
  const W = walls();
  /* 개발사업·분양 단지(켰을 때) 먼저 자리를 잡고 → 구·동·시·도 묶음 → 단지. 겹치면 점수(거래·단지 수) 높은 쪽만, 가까이 확대하면 나머지가 나와요 */
  for (const o of C.settle(layerPins(z, bb), W, 3)) { pin(next, o.k, o); W.push(o.box); }
  for (const o of C.settle(gl.map(o => { const q = MAP.project(o.lat, o.lng); o.x = q.x; o.y = q.y; o.box = gpBox(o); return o; }), W, 3))
    pin(next, o.k, { lat: o.lat, lng: o.lng, cls: o.cls, z: 500, tap: o.tap,
      html: `<b>${esc(o.name)}</b>${o.v ? `<span>${esc(o.v)}</span>` : ''}${o.sub ? `<small>${esc(o.sub)}</small>` : ''}` });
  for (const c of C.settle(djc, W, 3)) {
    const more = c.list.length - 1;
    if (c.cl) { const { lat, lng } = c; pin(next, 'C' + Math.round(lat * 2e3) + ',' + Math.round(lng * 2e3) + ',' + c.list.length, { lat, lng, cls: 'cl', html: `<b>${c.list.length}</b><small>단지</small>`, z: 600, tap: () => MAP.zoomBy(2, lat, lng) }); continue; }
    const { d, b, main } = c, t = C.tone(b.fv), solid = S.mode === 'fv';
    const badge = S.mode !== 'fv' && b.fv != null ? `<i class="${t}">${b.fv}</i>` : '';
    const html = `<span class="v">${badge}${esc(main || (S.mode === 'price' ? '최근 거래 없음' : '자료 없음'))}</span>${showName ? `<span class="nm">${esc(d.apt)}</span>` : ''}`
      + (more ? `<em class="more" data-more="1" title="가까이 보면 ${more}곳 더 보여요">+${more}</em>` : '');
    const cls = 'dj' + (solid ? ' solid ' + t : !main ? ' na' : '') + (SEL && SEL.d && SEL.d.key === d.key ? ' sel' : '');
    pin(next, 'A' + d.sd + d.key, { lat: d.lat, lng: d.lng, cls, html, z: Math.min(900, d.n), tap: e => { if (e && e.target && e.target.closest && e.target.closest('[data-more]')) MAP.zoomBy(2, d.lat, d.lng); else openCard(d); } });
  }
  if (ME) next.set('ME', { lat: ME.lat, lng: ME.lng, cls: 'me', html: '', sig: 'me' + ME.lat + ME.lng, z: 1000, tap: () => {} });
  put(next);
}

/* ---------- 레이어: 개발사업·분양 단지 ---------- */
async function loadLayer(k){
  if (LAY[k]) return;
  LAY[k] = { st: 'wait', list: [] };
  if (k === 'dev') {
    const d = window.JDJDev ? await JDJDev.load(DATA).catch(() => null) : null;
    LAY.dev = { st: d ? 'ok' : 'err', list: ((d && d.projects) || []).filter(p => Array.isArray(p.xy) && isFinite(p.xy[0]) && isFinite(p.xy[1])) };
  } else {
    const [n, p] = await Promise.all([J(DATA + 'bunyang/notices.json'), J(DATA + 'bunyang/plan.json')]);
    const T0 = window.JDJ_SALE ? JDJ_SALE.ymd(new Date()) : '';
    const rows = [...((n && n.rows) || []), ...((p && p.rows) || [])].filter(x => x && x.n && Array.isArray(x.xy) && isFinite(x.xy[0]) && isFinite(x.xy[1]));
    rows.forEach(x => { if (x.st !== 'plan' && window.JDJ_SALE) { const s = JDJ_SALE.status(x, T0); if (s) x.st = s; } });
    LAY.bun = { st: n || p ? 'ok' : 'err', list: rows.filter(x => ['pre', 'on', 'wait', 'mv', 'plan'].includes(x.st)) };
  }
  render();
}
const SALE_L = { pre: '분양예정', on: '청약중', wait: '발표 대기', mv: '입주예정', plan: '분양예정(시기 미정)' };
function layerPins(z, bb){
  const out = [];
  if (z < 10) return out;
  const one = (k, lat, lng, cls, text, zz, p, tap) => { const q = MAP.project(lat, lng), w = Math.min(150, TW(text, 12) + 14), h = 24;
    out.push({ k, lat, lng, cls, html: esc(text), z: zz, p, tap, box: { l: q.x - w / 2, t: q.y - 6 - h, r: q.x + w / 2, b: q.y } }); };
  if (S.dev && LAY.dev && LAY.dev.st === 'ok') for (const p of LAY.dev.list) {
    if (!C.inBox(bb, p.xy[1], p.xy[0], 0.1)) continue;
    one('L' + p.id, p.xy[1], p.xy[0], 'ly', `개발 · ${z >= 13 ? (p.short || p.name) : (p.types || ['사업'])[0]}`, 950, (SEL && SEL.lay === p.id ? 1e7 : 0) + 2e3, () => devCard(p));
  }
  if (S.bun && LAY.bun && LAY.bun.st === 'ok' && z >= 12) for (const x of LAY.bun.list) {
    if (!C.inBox(bb, x.xy[1], x.xy[0], 0.1)) continue;
    one('B' + x.id, x.xy[1], x.xy[0], 'ly bun', `${SALE_L[x.st] || '분양'}${z >= 15 ? ' · ' + x.n : ''}`, 940, (SEL && SEL.lay === x.id ? 1e7 : 0) + 1e3 + (+x.hh || 0) / 1e3, () => bunCard(x));
  }
  return out;
}
const fd = d => { if (!d) return ''; const a = String(d).split('-'); return a[0] + (a[1] ? '.' + (+a[1]) : '') + (a[2] ? '.' + (+a[2]) : ''); };
function devCard(p){
  SEL = { lay: p.id }; render();
  const last = (p.stages || []).slice(-1)[0], nx = (p.plan || [])[0], src = (p.src || [])[0];
  $('sheet').innerHTML = `<div class="grab"></div><div class="hd"><h2>${esc(p.name)}</h2><button type="button" class="x" aria-label="닫기">×</button></div>
    <p class="meta">개발사업 · ${esc((p.types || []).join('·'))}</p>
    <dl class="kv">${last ? `<dt>지금 단계</dt><dd><b>${esc(last.s)}</b> <span class="ppy">${esc(fd(last.d))}</span>${last.note ? `<small>${esc(last.note)}</small>` : ''}</dd>` : ''}
    ${nx ? `<dt>다음 계획</dt><dd>${esc(nx.s)} ${esc(fd(nx.d))}${nx.note ? `<small>${esc(nx.note)}</small>` : ''}</dd>` : ''}
    ${p.scale ? `<dt>규모</dt><dd>${esc(p.scale)}</dd>` : ''}</dl>
    ${p.xy_basis ? `<p class="note">지도 위치: ${esc(p.xy_basis)}</p>` : ''}
    ${src && src[1] && /^https:\/\//.test(src[1]) ? `<p class="src"><a href="${esc(src[1])}" target="_blank" rel="noopener noreferrer">공식 자료 보기 ›</a></p>` : ''}
    <p class="note">공식 원문으로 확인한 단계·날짜만 적었어요. 주변 단지를 누르면 그 단지 시세 화면에서 이 사업과의 거리도 볼 수 있어요.</p>`;
  showSheet();
}
function bunCard(x){
  SEL = { lay: x.id }; render();
  const tp = (x.ty || []).map(t => t[3]).filter(v => v > 0);
  $('sheet').innerHTML = `<div class="grab"></div><div class="hd"><h2>${esc(x.n)}</h2><button type="button" class="x" aria-label="닫기">×</button></div>
    <p class="meta">${esc(SALE_L[x.st] || '분양')}${x.k ? ' · ' + esc(x.k) : ''}${x.hh ? ' · ' + Number(x.hh).toLocaleString('ko-KR') + '세대' : ''}</p>
    <dl class="kv">${x.ad ? `<dt>위치</dt><dd>${esc(x.ad)}</dd>` : ''}
    ${tp.length ? `<dt>분양가</dt><dd><b>${esc(M.won(Math.min(...tp)))}</b>${tp.length > 1 && Math.max(...tp) > Math.min(...tp) ? ` ~ <b>${esc(M.won(Math.max(...tp)))}</b>` : ''}<small>공고의 주택형별 최고 분양가 기준</small></dd>` : ''}
    ${x.rc && x.rc[0] ? `<dt>청약 접수</dt><dd>${esc(x.rc[0].replace(/(\d{4})(\d\d)(\d\d)/, '$1.$2.$3'))}${x.rc[1] ? ' ~ ' + esc(x.rc[1].replace(/(\d{4})(\d\d)(\d\d)/, '$1.$2.$3')) : ''}</dd>` : ''}</dl>
    <div class="acts" style="grid-template-columns:1fr"><a href="/jangdaejang-calc/bunyang/" data-track="map_to_bunyang">분양 화면에서 자세히 보기</a></div>`;
  showSheet();
}

/* ---------- 구 카드(미래가치 보기에서 구 말풍선을 누르면): 실제 등수 + 공용 구 이유 문장(narrative.js guWhy — 순위 화면·리포트와 같은 문장) ---------- */
let EV = null, EVload = null;
function openGuCard(code, gs){
  if (EV === null && !EVload) EVload = J(DATA + 'evidence.json').then(j => { EV = j || false; if (SEL && SEL.gu === code) openGuCard(code, gs); });
  const g = sggOf(code), rp = PL && PL.regionPlace ? PL.regionPlace(IX, code, gs) : null, c = GEO && GEO.sgg[code];
  const gw = NAR && NAR.guWhy && EV !== null ? NAR.guWhy({ IX, code, gs, EV: EV || null, PL }) : null;
  const sd = (IX.sido || []).find(s => s.name === g.sido) || {};
  SEL = { gu: code };
  const tone = rp ? (rp.pos === '상위권' ? 't5' : rp.pos === '하위권' ? 't1' : 't3') : 'na';
  $('sheet').innerHTML = `<div class="grab"></div><div class="hd"><h2>${esc(g.name)}</h2><button type="button" class="x" aria-label="닫기">×</button></div>
    <p class="meta">앞으로 2년 지역 흐름(같은 시·도 안 비교)</p>
    <dl class="kv">
      <dt>순위</dt><dd>${rp ? `<div class="fvrow"><span class="fvb ${tone}">${esc(rp.pos)}</span><span class="head"><b>${esc(rp.text)}</b></span></div>` : '순위 자료가 없어요'}</dd>
      <dt>이유</dt><dd><span class="head">${gw ? esc(gw.line) : EV === null ? '이유를 불러오고 있어요…' : '이 구는 이유 자료가 없어요'}</span></dd>
    </dl>
    <div class="acts">${sd.id ? `<a href="/jangdaejang-calc/rank/?t=fv${sd.id !== 's00' ? '&sd=' + esc(sd.id) : ''}" data-track="map_to_rank">${esc(sd.short || '')} 순위 전체</a>` : ''}<button type="button" id="guZoom"${sd.id ? '' : ' style="grid-column:1/-1"'}>이 구 단지 보기</button></div>`;
  showSheet();
  $('guZoom').onclick = () => { closeSheet(); if (c) MAP.setView(c[1], c[0], C.LV.sgg + 1); };
  if (window.jdjStat && EV !== null) jdjStat('feature_use', {feature:'map_gu_card'});
}

/* ---------- 하단 카드 ---------- */
function showSheet(){
  const el = $('sheet'); el.hidden = false; el.scrollTop = 0; document.body.classList.add('has-sheet');
  el.querySelector('.x').onclick = closeSheet;
  render();
}
/* 카드에 가린 단지를 카드 위 지도 칸 가운데쯤으로 (넓은 화면은 카드가 왼쪽이라 그대로) */
function reveal(lat, lng){
  requestAnimationFrame(() => {
    const sz = MAP.size(), sh = $('sheet'), p = MAP.project(lat, lng);
    if (sh.hidden) return;
    if (innerWidth >= 900) {                                   // 넓은 화면: 카드는 왼쪽 → 오른쪽 빈 곳 가운데로
      const L0 = sh.getBoundingClientRect().right - $('mwrap').getBoundingClientRect().left + 16;
      if (p.x < L0 || p.y < 70 || p.y > sz.h - 90) MAP.panBy(p.x - (L0 + (sz.w - L0) / 2), p.y - (70 + (sz.h - 160) / 2));
      return;
    }
    const free = sz.h - sh.offsetHeight, top = 70;             // 지도는 검색·필터 칸 아래부터(위 안내 한 줄 비움)
    const want = Math.max(top + 30, (top + free) / 2);
    if (p.y > free - 30 || p.y < top) MAP.panBy(0, p.y - want);
  });
}
function closeSheet(){ $('sheet').hidden = true; document.body.classList.remove('has-sheet'); SEL = null; render(); }
function openCard(d, band, keep){
  const b = (band && d.bands.find(u => u[3] === band) ? C.bandInfo(d.bands.find(u => u[3] === band), IX.months) : null) || C.pick(d, IX.months, { size: S.size, price: S.price }) || C.bandInfo(d.bands[0], IX.months);
  SEL = { d, band: b.band };
  if (!keep) render();
  const f = (b.u[9] && typeof b.u[9] === 'object') ? b.u[9] : null;
  let head = '';
  if (f && f.fv != null && NAR) { try { head = NAR.build(f, { apt: d.apt, dong: d.dong, code: d.code, band: b.band, area: b.area, IX, MH, PL, year: new Date().getFullYear(), s: b.u[6], regionUsed: MREG }).head || ''; } catch (e) { head = ''; } }
  const meta = [`${sggName(d.code)} ${d.dong}`, d.by ? `${d.by}년 준공` : '', d.hh ? `${Number(d.hh).toLocaleString('ko-KR')}세대` : ''].filter(Boolean).join(' · ');
  const inCmp = loadCmp().some(x => C.cmpId(x) === C.cmpId(d));
  $('sheet').innerHTML = `<div class="grab"></div><div class="hd"><h2>${esc(d.apt)}</h2><button type="button" class="x" aria-label="닫기">×</button></div>
    <p class="meta">${esc(meta)}</p>
    ${d.bands.length > 1 ? `<div class="bands" role="group" aria-label="평형">${d.bands.map(u => `<button type="button" data-b="${esc(u[3])}" class="${u[3] === b.band ? 'on' : ''}" aria-pressed="${u[3] === b.band}">${esc(u[3])}</button>`).join('')}</div>` : ''}
    <dl class="kv">
      <dt>최근 시세</dt><dd>${b.price > 0 ? `<b>${esc(M.won(b.price))}</b><span class="ppy">${esc(C.ppyText(b.ppy))}</span><small>${esc(b.band)} · ${esc(M.ymLabel(b.at))} 기준 최근 3개월 실거래 중앙값</small>` : '최근 3개월 실거래가 없어요<small>시세·전망 보기에서 지난 거래를 볼 수 있어요</small>'}</dd>
      <dt>미래가치</dt><dd>${b.fv != null ? `<div class="fvrow"><span class="fvb ${C.tone(b.fv)}">${b.fv}점</span><span class="head">${esc(head || '100점 만점, 앞으로 2년 같은 시·도 아파트와 비교한 점수예요.')}</span></div>` : '이 평형은 미래가치 점수 자료가 없어요'}</dd>
      ${b.jr != null ? `<dt>전세가율</dt><dd><b>${esc(C.pct(b.jr))}</b><small>집값 대비 전셋값 비율</small></dd>` : ''}
    </dl>
    <div class="acts"><a href="${esc(C.mineUrl(d, b.band))}" data-track="map_to_mine">시세·전망 보기</a><button type="button" id="addCmp" class="${inCmp ? 'done' : ''}">${inCmp ? '비교함에 있어요' : '비교에 담기'}</button></div>`;
  showSheet();
  if (!keep) reveal(d.lat, d.lng);
  $('sheet').querySelectorAll('.bands button').forEach(x => x.onclick = () => openCard(d, x.dataset.b, true));
  $('addCmp').onclick = () => { saveCmp(C.cmpAdd(loadCmp(), Object.assign({}, d, { band: b.band }))); openCard(d, b.band, true); if (window.jdjStat) jdjStat('feature_use', {feature:'map_compare_add'}); };
  if (!keep && window.jdjStat) jdjStat('feature_use', {feature:'map_card'});
}

/* ---------- 비교함 (이 기기 sessionStorage, 최대 3곳) ---------- */
function loadCmp(){ try { const v = JSON.parse(sessionStorage.getItem(C.CMP_KEY) || '[]'); return Array.isArray(v) ? v.slice(-C.CMP_MAX) : []; } catch (e) { return []; } }
function saveCmp(l){ try { sessionStorage.setItem(C.CMP_KEY, JSON.stringify(l)); } catch (e) {} drawCmp(); }
function drawCmp(){
  const l = loadCmp(), el = $('cmpbar');
  el.hidden = !l.length; document.body.classList.toggle('has-cmp', !!l.length);
  if (!l.length) return;
  el.innerHTML = `<span class="nm">비교함 <b>${l.length}곳</b> · ${l.map(x => esc(x.apt)).join(', ')}</span>`
    + `<a href="${esc(C.askUrl(l))}" class="${l.length < 2 ? 'off' : ''}" data-track="map_to_ask"${l.length < 2 ? ' aria-disabled="true" title="2곳 이상 담으면 비교할 수 있어요"' : ''}>${l.length < 2 ? '1곳 더 담기' : '비교하기'}</a>`
    + `<button type="button" id="cmpClr" aria-label="비교함 비우기">비우기</button>`;
  $('cmpClr').onclick = () => { saveCmp([]); if (SEL && SEL.d) openCard(SEL.d, SEL.band, true); };
}

/* ---------- 검색 (mine-core searchDanji — 지금 불러온 시·도 + 검색어 앞 지역 이름) ---------- */
let qt = null;
function sidoFromQuery(q){
  const t = q.trim().split(/\s+/);
  if (t.length < 2) return null;
  const s = IX.sido.find(x => x.short === t[0] || x.name === t[0] || x.name.indexOf(t[0]) === 0 && t[0].length >= 2);
  return s ? { id: s.id, rest: t.slice(1).join(' ') } : null;
}
function centerSido(){
  if (!GEO) return null; const c = MAP.center();
  let best = null, bd = Infinity;
  for (const id in GEO.sido) { const b = GEO.sido[id].b; if (c.lng >= b[0] && c.lng <= b[2] && c.lat >= b[1] && c.lat <= b[3]) { const g = GEO.sido[id].c, dd = (g[0] - c.lng) ** 2 + (g[1] - c.lat) ** 2; if (dd < bd) { bd = dd; best = id; } } }
  return best;
}
function runSearch(){
  const q = $('q').value.trim(), out = $('sres');
  $('qClr').hidden = !q;
  if (!q) { out.innerHTML = ''; return; }
  const sq = sidoFromQuery(q), ids = sq ? [sq.id] : [...new Set([centerSido(), ...Object.keys(SD).filter(id => SD[id].st === 'ok')].filter(Boolean))];
  const text = sq ? sq.rest : q;
  if (ensure(ids)) { out.innerHTML = '<li class="msg">단지 목록을 불러오는 중이에요…</li>'; clearTimeout(qt); qt = setTimeout(runSearch, 500); return; }
  const res = [];
  for (const id of ids) { const s = SD[id]; if (!s || s.st !== 'ok') continue; for (const d of M.searchDanji(s.byKey, text, 8)) res.push(d); }
  const sdn = id => (IX.sido.find(s => s.id === id) || {}).short || '';
  out.innerHTML = res.length ? res.slice(0, 8).map(d => `<li><button type="button" data-sd="${d.sd}" data-k="${esc(d.key)}"><b>${esc(d.apt)}</b><small>${esc(sdn(d.sd))} ${esc(sggName(d.code))} ${esc(d.dong)}${d.by ? ' · ' + d.by + '년' : ''}</small></button></li>`).join('')
    : `<li class="msg">'${esc(text)}' 단지를 ${sq ? esc(sdn(sq.id)) + '에서' : '지금 지도 주변 지역에서'} 찾지 못했어요.${sq ? '' : " 다른 지역이면 '부산 해운대'처럼 지역 이름을 앞에 붙여 주세요."} 지도에는 미래가치 점수 자료가 있는 단지만 있어요.</li>`;
}
$('q').addEventListener('input', () => { clearTimeout(qt); qt = setTimeout(runSearch, 200); });
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); clearTimeout(qt); runSearch(); const f = $('sres').querySelector('button'); if (f) f.click(); } if (e.key === 'Escape') { $('sres').innerHTML = ''; } });
$('qClr').onclick = () => { $('q').value = ''; runSearch(); $('q').focus(); };
$('sres').addEventListener('click', e => {
  const b = e.target.closest('button[data-k]'); if (!b) return;
  const s = SD[b.dataset.sd], d = s && s.byKey.get(b.dataset.k); if (!d) return;
  $('sres').innerHTML = ''; $('q').blur();
  MAP.setView(d.lat, d.lng, 17); openCard(d);
  if (window.jdjStat) jdjStat('feature_use', {feature:'map_search'});
});

/* ---------- 내 위치 (권한이 없거나 실패하면 조용히 그대로) ---------- */
let ME = null;
$('me').onclick = () => {
  if (!navigator.geolocation) return;
  const b = $('me'); b.classList.add('busy');
  navigator.geolocation.getCurrentPosition(p => { b.classList.remove('busy'); ME = { lat: p.coords.latitude, lng: p.coords.longitude }; MAP.setView(ME.lat, ME.lng, 15); render(); },
    () => b.classList.remove('busy'), { enableHighAccuracy: false, timeout: 8000, maximumAge: 120000 });
};
$('zin').onclick = () => MAP.zoomBy(1);
$('zout').onclick = () => MAP.zoomBy(-1);

/* ---------- 주소(지금 보는 곳·필터)를 남겨 새로 고침·공유해도 같은 화면 ---------- */
let ut = null;
function saveUrl(z){
  clearTimeout(ut); ut = setTimeout(() => {
    const c = MAP.center(), u = new URL(location.href), p = u.searchParams;
    p.set('lat', c.lat.toFixed(5)); p.set('lng', c.lng.toFixed(5)); p.set('z', String(Math.round(z)));
    S.mode !== 'price' ? p.set('m', S.mode) : p.delete('m'); S.size ? p.set('sz', S.size) : p.delete('sz'); S.price ? p.set('pr', S.price) : p.delete('pr');
    (S.dev || S.bun) ? p.set('ly', S.dev && S.bun ? 'all' : S.dev ? 'dev' : 'bun') : p.delete('ly');
    if (SEL && SEL.d) { p.set('sd', SEL.d.sd); p.set('d', SEL.d.key); SEL.band ? p.set('b', SEL.band) : p.delete('b'); } else { p.delete('sd'); p.delete('d'); p.delete('b'); }
    history.replaceState(null, '', u);
  }, 300);
}

/* ---------- 위쪽 조작 칸 높이 → 지도 시작 위치(--mt) ---------- */
let MT = -1;
function syncTop(){
  const h = document.querySelector('.mtop').offsetHeight;
  if (h === MT) return; MT = h;
  $('mwrap').style.setProperty('--mt', h + 'px');
  if (MAP) { MAP.relayout(); render(); }
}
if (window.ResizeObserver) new ResizeObserver(syncTop).observe(document.querySelector('.mtop'));

/* ---------- 시작 ---------- */
async function init(){
  drawControls(); legend(); drawCmp(); syncTop();
  const [ix, geo, mj, mh] = await Promise.all([J(DATA + 'index.json'), J('/jangdaejang-calc/assets/map-geo.json'), J(DATA + 'model.json'), J(DATA + 'model_h.json')]);
  if (!ix) { status('지도 자료를 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.'); return; }
  IX = ix; GEO = geo; MH = mh; MREG = !!(mj && mj.region && mj.region.used);
  const lat = parseFloat(Q.get('lat')), lng = parseFloat(Q.get('lng')), z = parseInt(Q.get('z'), 10);
  const v = isFinite(lat) && isFinite(lng) && lat > 32 && lat < 39.5 && lng > 124 && lng < 132 ? { lat, lng, zoom: isFinite(z) ? Math.max(6, Math.min(19, z)) : 14 } : { lat: 37.5400, lng: 127.0050, zoom: 11 };
  try { MAP = await E.create($('map'), v); }
  catch (e) { status('지도를 불러오지 못했어요. 인터넷 연결을 확인하고 다시 열어 주세요.'); return; }
  document.documentElement.dataset.mapEngine = MAP.kind + (MAP.tiles ? ':' + MAP.tiles : '');
  MAP.onIdle(() => { MOVED = false; render(); });
  MAP.onMoveStart(() => { MOVED = true; });
  MAP.onTap(() => { $('sres').innerHTML = ''; if (!$('sheet').hidden) closeSheet(); });
  addEventListener('pointerdown', () => { MOVED = false; }, true);
  addEventListener('resize', () => { syncTop(); MAP.relayout(); render(); });
  if (S.dev) loadLayer('dev'); if (S.bun) loadLayer('bun');
  const qsd = Q.get('sd'), qd = Q.get('d');
  if (qsd && qd && IX.sido.some(s => s.id === qsd)) { PENDING = { sd: qsd, d: qd, b: Q.get('b') || '' }; ensure([qsd]); }
  render();
  if (window.jdjStat) jdjStat('feature_use', {feature:'map'});
}
init();
})();
</script>
</body>
