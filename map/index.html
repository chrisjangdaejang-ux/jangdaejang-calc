<script>
var JB = (typeof window !== 'undefined' && window.JDJ_BASE) || (function (p) { var g = p.indexOf('/jangdaejang-calc/') === 0, b = { SITE: g ? '/jangdaejang-calc/' : '/', DATA: g ? '/jangdaejang-data/' : 'https://chrisjangdaejang-ux.github.io/jangdaejang-data/' }; if (typeof window !== 'undefined') window.JDJ_BASE = b; return b; })((typeof location !== 'undefined' && location.pathname) || '/jangdaejang-calc/');
(function(){

const J = (u, o) => fetch(u, Object.assign({cache:'no-cache'}, o || {})).then(r => r.ok ? r.json() : null).catch(() => null);

/* '지도에서 보기'(assets/mapjump.js): 결과 화면에서 오면 그 집에 맞춰 열고, 표시 핀·카드·돌아가기, 주변 역·학교를 켬 */

S.poi = Q.get('po') ? Q.get('po') === '1' : F.on;
let FOC = null;                      // {keys:Set('sd|단지키'), want:[{sd,d,b}], pt:{lat,lng,prec,name,dong}, miss:[]}
let IX = null, GEO = null, MH = null, MREG = false, MAP = null, SEL = null, MOVED = false;

/* 단지 필터(평형·가격대·준공·역 거리) — 길잡이 '조건에 맞는 아파트 찾기'와 같은 함수(assets/map-core.js pick·danjiOk) */
const FOPT = () => ({ size: S.size, price: S.price, age: S.age, station: S.stn ? C.STATION : 0, year: +(String((IX && IX.updated) || '').slice(0, 4)) || new Date().getFullYear() });
/* ---------- 이름 ---------- */
const sggOf = code => (IX && IX.sgg[code]) || {};
const sidoOf = code => (IX && IX.sido.find(s => s.name === sggOf(code).sido)) || {};
const sggName = code => sggOf(code).name || '';

/* ---------- 위쪽 조작 칸 ---------- */
function drawControls(){
  $('mode').innerHTML = C.MODES.map(m => `<button type="button" data-m="${m.id}" class="${S.mode === m.id ? 'on' : ''}" aria-pressed="${S.mode === m.id}">${m.t}</button>`).join('');
  document.body.classList.toggle('reg', S.mode === 'reg');
  if (S.mode === 'reg') { $('fil').innerHTML = regChips(); return; }
  $('fil').innerHTML = C.SIZES.map(z => `<button type="button" class="chip${S.size === z.id ? ' on' : ''}" data-sz="${z.id}" aria-pressed="${S.size === z.id}"${z.d ? ` title="${z.d}"` : ''}>${z.t}</button>`).join('')
    + `<select class="chip${S.price ? ' on' : ''}" id="fPrice" aria-label="가격대">${C.PRICES.concat(C.PRICES.some(p => p.id === S.price) ? [] : [C.priceOf(S.price)]).filter(Boolean).map(p => `<option value="${p.id}"${S.price === p.id ? ' selected' : ''}>${p.t}</option>`).join('')}</select>`
    + `<select class="chip${S.age ? ' on' : ''}" id="fAge" aria-label="준공">${C.AGES.map(a => `<option value="${a.id}"${S.age === a.id ? ' selected' : ''}>${a.t}</option>`).join('')}</select>`
    + `<button type="button" class="chip${S.stn ? ' on' : ''}" data-sn="1" aria-pressed="${S.stn}" title="단지에서 가장 가까운 지하철역까지 걸어서 ${C.STATION}분 이내">역 ${C.STATION}분</button>`
    + `<span class="lgrp" role="group" aria-label="지도에 함께 보기"><span class="lgl">지도에 함께 보기</span>`
    + `<button type="button" class="chip lay fu${S.fut ? ' on' : ''}" data-ly="fut" aria-pressed="${S.fut}" title="공식 발표에 적힌 예정 연도만 보여 줘요">개발·교통 예정</button>`
    + `<button type="button" class="chip lay po${S.poi ? ' on' : ''}" data-ly="poi" aria-pressed="${S.poi}" title="운행 중인 지하철역과 중학교 위치(공공 자료)">역·학교</button>`
    + `<button type="button" class="chip lay bun${S.bun ? ' on' : ''}" data-ly="bun" aria-pressed="${S.bun}">분양 단지</button>`
    + (NB_OK || S.nb ? `<button type="button" class="chip lay nb${S.nb ? ' on' : ''}" data-ly="nb" aria-pressed="${S.nb}" title="건축 허가·착공 기록으로 찾은 소규모 신축(빌라·도시형·오피스텔·상가). 분양 여부는 이 자료로 알 수 없어요">신축 공사 중</button>` : '')
    + `</span>`;
  $('fPrice').onchange = e => { S.price = e.target.value; after(); };
  $('fAge').onchange = e => { S.age = +e.target.value || 0; after(); };
}
$('mode').addEventListener('click', e => { const b = e.target.closest('button[data-m]'); if (!b) return; S.mode = b.dataset.m; after(); });
$('fil').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.ri) { REG.ind = b.dataset.ri; after(); return; }
  if (b.dataset.sz != null) S.size = b.dataset.sz;
  else if (b.dataset.sn) S.stn = !S.stn;
  else if (b.dataset.ly) { S[b.dataset.ly] = !S[b.dataset.ly]; if (S[b.dataset.ly]) loadLayer(b.dataset.ly); }
  after();
});
function after(){
  if (S.mode === 'reg' && !$('sheet').hidden) closeSheet();
  drawControls(); LASTLV = ''; regPanel(); legend(); render();
  if (S.mode !== 'reg' && SEL && SEL.d) openCard(SEL.d, SEL.band, true);
  if (window.jdjStat) jdjStat('feature_use', {feature: S.mode === 'reg' ? 'map_region' : 'map_filter'});
}

let LEGOPEN = false, LASTLV = '', LGM = false;   // LGM: 휴대폰에서 범례를 펼쳤는지
/* 개발·교통 예정 범례: 점선 = 개통 예정 노선, 칠한 면 = 개발 구역, 글자의 연도 = 공식 발표 그대로(ⓘ 보는 법·못 그린 목록) */
/* 지도에 위치를 못 찍은 예정 사업 중 지금 화면 안 시·군·구(행정 코드)에 있는 것 — 범례 한 줄로 알려 주고 누르면 카드 */
function futNear(){
  if (!S.fut || !LAY.fut || LAY.fut.st !== 'ok' || !MAP || !GEO || S.mode === 'reg' || MAP.zoom() < JDJ_FUT.lineZ) return [];
  const bb = MAP.bounds();
  return (LAY.fut.d.omitted || []).filter(it => (it.sgg || []).some(c => GEO.sgg[c] && C.inBox(bb, GEO.sgg[c][1], GEO.sgg[c][0], 0)));
}
function futLegend(lv){
  if (!S.fut || !LAY.fut || LAY.fut.st !== 'ok' || !lv || lv === 'sido') return '';
  const nr = futNear();
  return `<div class="fut-lg"><span><i class="lg-line" aria-hidden="true"></i>개통 예정 노선</span><span><i class="lg-area" aria-hidden="true"></i>개발 구역</span>`
    + `<button type="button" class="fib" aria-label="개발·교통 예정 보는 법">연도는 공식 발표 그대로 ⓘ</button></div>`
    + nr.map(it => { const d = JDJ_FUT.dues(it), l = d[d.length - 1];
        return `<button type="button" class="fnr" data-fo="${esc(it.id)}"><i class="lg-dot" aria-hidden="true"></i><span><b>${esc(JDJ_FUT.label(it).name)}</b>${l ? ` · ${esc(l.say)}` : ` · ${esc(it.stage || '')}`}<small>이 화면 근처 · 위치는 지도에 표시하지 않았어요 ›</small></span></button>`; }).join('');
}
function legend(){
  const el = $('legend'), lv = MAP && IX ? C.level(MAP.zoom()) : '';
  if (S.mode === 'reg') { el.innerHTML = lv && lv !== 'sido' ? regLegend() : ''; el.onclick = e => { if (innerWidth <= 768) return; if (e.target.closest('#rlgb') || (RLEG && innerWidth < 900)) { RLEG = !RLEG; legend(); render(); } }; return legFold(); }
  el.onclick = e => { if (e.target.closest('.fib')) futInfo(); const fo = e.target.closest('[data-fo]'); if (fo) { const it = ((LAY.fut && LAY.fut.d.omitted) || []).find(x => x.id === fo.dataset.fo); if (it) futCard(it); } };
  const fu = futLegend(lv);
  /* 미래가치 · 구 단계: 구 말풍선 색(파랑·회색·주황)의 뜻 — ⓘ 칩과 같은 내용을 기호 설명에도 */
  if (lv === 'sgg' && S.mode === 'fv') { el.innerHTML = `<div class="gu-lg"><span><i class="dot t5" aria-hidden="true"></i>파랑 상위권</span><span><i class="dot t3" aria-hidden="true"></i>회색 중위권</span><span><i class="dot t1" aria-hidden="true"></i>주황 하위권</span><span class="sm">같은 시·도 안에서 매긴 구별 미래가치 순위예요</span></div>` + fu; return legFold(); }
  if (lv !== 'danji') { el.innerHTML = fu; return legFold(); }
  const scale = `<span class="scl">${S.mode === 'fv' ? '' : '배지 = '}미래가치 점수 낮음 <i class="t1"></i><i class="t2"></i><i class="t3"></i><i class="t4"></i><i class="t5"></i> 높음 ⓘ</span>`;
  el.innerHTML = `<button type="button" class="lgb" aria-expanded="${LEGOPEN}">${scale}</button>` + (LEGOPEN ? C.TONES.map(t => `<span><i class="${t[0]}"></i>${t[2]} · ${t[1]}</span>`).join('') + '<span class="sm">앞으로 2년, 같은 시·도 아파트와 비교한 점수(100점 만점)</span>' : '') + fu;
  el.querySelector('.lgb').onclick = () => { LEGOPEN = !LEGOPEN; legend(); render(); };
  legFold();
}
/* 휴대폰(768px 이하): 범례를 '범례' 단추로 접어 둠 — 누르면 펼치고, ✕ 나 지도 등 바깥을 누르면 다시 접음 */
function legFold(){
  const el = $('legend'), mob = innerWidth <= 768, has = !!el.childNodes.length;
  el.classList.toggle('mob', mob && has);
  el.classList.toggle('fold', mob && has && !LGM);
  if (!mob || !has) return;
  if (!LGM) {
    const n = el.querySelectorAll('.fnr').length, fut = !!el.querySelector('.fut-lg');
    /* 미래가치: 단추에도 지금 지도에 쓰인 색을 작은 점으로(구 = 3색, 단지 = 5색) */
    const tc = S.mode === 'fv' ? [...new Set([...el.querySelectorAll('i.t1,i.t2,i.t3,i.t4,i.t5')].map(i => (i.className.match(/\bt[1-5]\b/) || [])[0]))] : [];
    if (tc.length && tc[0] === 't1') tc.reverse();   // 높은 쪽(파랑)부터
    const dots = tc.length ? `<span class="lgdots" aria-hidden="true">${tc.map(t => `<i class="${t}"></i>`).join('')}</span>` : '';
    el.innerHTML = `<button type="button" class="lgpill" aria-expanded="false" aria-label="지도 기호 설명 펼치기">${dots}${fut ? '<i class="lg-line" aria-hidden="true"></i>' : ''}기호 설명${n ? ` <em>근처 예정 ${n}</em>` : ''}</button>`;
    return;
  }
  el.insertAdjacentHTML('afterbegin', '<div class="lghd"><b>지도 기호 설명</b><button type="button" class="lgx" aria-label="기호 설명 접기">✕</button></div>');
}
$('legend').addEventListener('click', e => {   // 접기·펼치기 단추는 범례 안 다른 동작보다 먼저
  const op = e.target.closest('.lgpill'), x = e.target.closest('.lgx');
  if (!op && !x) return;
  e.stopPropagation();
  LGM = !!op; if (S.mode === 'reg') RLEG = LGM || innerWidth >= 900;
  legend(); render();
}, true);
let LGW = innerWidth <= 768;
addEventListener('resize', () => { const w = innerWidth <= 768; if (w !== LGW) { LGW = w; LGM = false; legend(); } });

/* ---------- 자료 불러오기 (보이는 시·도만) ---------- */
/* ---------- 전세가율: 내 집 시세 화면과 같은 기준(assets/mine-core.js jrNow · price/h/{구}.json) ----------
   예전에는 sNN.json 모델 칸(fx.jr = 12개월 전세 ÷ 지금 시세)을 그대로 써서 같은 단지가 지도·관심 목록 41%, 내 집 시세 43%처럼 달라 보였어요(2026-11-26 통일).
   구 파일은 전세가율 보기(동·단지 단계)나 단지 카드를 열 때만 받아요. 받기 전·값이 없으면 숫자를 쓰지 않아요. */
const HJ = {};
function ensureHJ(codes){
  let want = 0;
  for (const g of codes) {
    if (HJ[g]) { if (HJ[g] === 'wait') want++; continue; }
    HJ[g] = 'wait'; want++;
    J(DATA + 'price/h/' + g + '.json').then(h => { HJ[g] = h ? M.histJrMap(h) : 'err'; render(); if (SEL && SEL.d && SEL.d.code === g) { const u = SEL.d.bands.find(x => x[3] === SEL.band); if (u) cardJr(SEL.d, { band: SEL.band, u }); } })
      .catch(() => { HJ[g] = 'err'; });
  }
  return want;
}
/** 단지·평형 전세가율(0~1): 받은 구면 값 또는 null, 아직 받는 중이면 undefined */
function hjOf(d, band){ const H = HJ[d.code]; if (H === 'wait' || H == null) return undefined; if (H === 'err') return null; const v = H.get([d.dong, d.jibun || '', d.apt, band].join('|')); return v > 0 ? v : null; }
function cardJr(d, b){
  const el = $('jrV'); if (!el) return;
  const show = v => { document.querySelectorAll('.jrr').forEach(x => { x.hidden = v === null; }); if (v != null) el.innerHTML = `<b>${esc(C.pct(v))}</b><small>최근 3개월 전세 ÷ 매매(내 집 시세와 같은 기준)</small>`; };
  const v = hjOf(d, b.band);

/* ---------- 개발·교통 예정 (assets/devmap-view.js, 자료 devmap.json) ----------

const SVGNS = 'http://www.w3.org/2000/svg';
function lineChart(el, series, fmt){
  series = series.filter(s => s.pts.length >= 2);
  const all = series.flatMap(s => s.pts);
  if (!all.length) { el.innerHTML = '<p class="rp-gpast">이 기간은 그래프로 볼 자료가 없어요.</p>'; return; }
  const Wd = Math.max(260, el.clientWidth || 320), H = 150, L = 50, RR = 10, T = 10, B = 20;
  const yms = [...new Set(all.map(p => p.ym))].sort(), x0 = yms[0], span = RC.ymDiff(x0, yms[yms.length - 1]) || 1;
  let lo = Math.min(...all.map(p => p.v)), hi = Math.max(...all.map(p => p.v)); const pad = (hi - lo) * 0.08 || hi * 0.05; lo -= pad; hi += pad;
  const tk = RC.ticks(lo, hi, 3).filter(v => v >= lo && v <= hi);
  const X = ym => L + (Wd - L - RR) * RC.ymDiff(x0, ym) / span, Y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  let g = tk.map(v => `<line x1="${L}" x2="${Wd - RR}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="#EEF0F2"/><text x="${L - 6}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="#6B7684">${RC.ppy(v)}</text>`).join('');
  g += `<text x="${L}" y="${H - 4}" font-size="11" fill="#6B7684">${RC.ymDot(x0)}</text><text x="${Wd - RR}" y="${H - 4}" text-anchor="end" font-size="11" fill="#6B7684">${RC.ymDot(yms[yms.length - 1])}</text>`;
  for (const s of series) {
    let d = '', prev = null;
    for (const p of s.pts) { d += (prev && RC.ymDiff(prev, p.ym) === 1 ? 'L' : 'M') + X(p.ym).toFixed(1) + ' ' + Y(p.v).toFixed(1); prev = p.ym; }
    g += `<path d="${d}" fill="none" stroke="${s.col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  g += `<line class="vl" y1="${T}" y2="${H - B}" stroke="#8B95A1" stroke-width="1" visibility="hidden"/>` + series.map((s, i) => `<circle class="pt${i}" r="4" fill="${s.col}" stroke="#fff" stroke-width="2" visibility="hidden"/>`).join('');
  el.innerHTML = `<div class="lg">${series.map(s => `<span><i style="background:${s.col}"></i>${s.nm} ${esc(fmt(s.pts[s.pts.length - 1].v))}</span>`).join('')}</div>`
    + `<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="${esc(series.map(s => s.nm).join('·'))} 평당가 추이">${g}<rect x="${L}" y="0" width="${Wd - L - RR}" height="${H}" fill="transparent"/></svg><div class="tip" hidden></div>`;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), vl = svg.querySelector('.vl');
  const show = e => {
    const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) * Wd / r.width;
    const ym = RC.ymAdd(x0, Math.max(0, Math.min(span, Math.round((x - L) / (Wd - L - RR) * span))));
    const vals = series.map(s => s.pts.find(p => p.ym === ym));
    if (!vals.some(Boolean)) return;
    vl.setAttribute('x1', X(ym)); vl.setAttribute('x2', X(ym)); vl.setAttribute('visibility', 'visible');
    vals.forEach((p, i) => { const c = svg.querySelector('.pt' + i); if (p) { c.setAttribute('cx', X(p.ym)); c.setAttribute('cy', Y(p.v)); c.setAttribute('visibility', 'visible'); } else c.setAttribute('visibility', 'hidden'); });
    tip.innerHTML = `<b>${esc(ymKo(ym))}</b>` + vals.map((p, i) => p ? `<br>${series[i].nm} ${esc(fmt(p.v))}` : '').join('');
    tip.hidden = false; tip.style.left = Math.max(60, Math.min(r.width - 60, X(ym) * r.width / Wd)) + 'px';
  };
  const hide = () => { tip.hidden = true; vl.setAttribute('visibility', 'hidden'); svg.querySelectorAll('circle').forEach(c => c.setAttribute('visibility', 'hidden')); };

}
function barChart(el, bars, div, title){
  if (!bars.length) { el.innerHTML = ''; return; }
  const Wd = Math.max(260, el.clientWidth || 320), H = 96, L = 6, RR = 6, T = 16, B = 18;

  bars.forEach((b, i) => {

    if (b.lab && (bars.length <= 14 || b.show || i === 0 || i === bars.length - 1 || /년$/.test(b.lab))) g += `<text x="${(x + (bw - gap) / 2).toFixed(1)}" y="${H - 4}" text-anchor="middle" font-size="10.5" fill="#6B7684">${esc(b.lab)}</text>`;
  });

  el.innerHTML = `<div class="lg">${esc(title)}</div><svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="${esc(title)}">${g}</svg>`;

/* 카드에 가린 단지를 카드 위 지도 칸 가운데쯤으로 (넓은 화면은 카드가 왼쪽이라 그대로) */
function reveal(lat, lng){
  requestAnimationFrame(() => {
    const sz = MAP.size(), sh = $('sheet'), p = MAP.project(lat, lng);
    if (sh.hidden) return;
    if (innerWidth >= 900) {                                   // 넓은 화면: 카드는 왼쪽 → 오른쪽 빈 곳 가운데로
      const L0 = sh.getBoundingClientRect().right - $('mwrap').getBoundingClientRect().left + 16;
      if (p.x < L0 || p.y < 70 || p.y > sz.h - 90) MAP.panBy(p.x - (L0 + (sz.w - L0) / 2), p.y - (70 + (sz.h - 160) / 2));
      return;
    }
    const free = sz.h - sh.offsetHeight, top = 70;             // 지도는 검색·필터 칸 아래부터(위 안내 한 줄 비움)
    const want = Math.max(top + 30, (top + free) / 2);
    if (p.y > free - 30 || p.y < top) MAP.panBy(0, p.y - want);
  });
}

/* ---------- 역·학교 (공공 자료 poi/sNN.json: 운행 중인 지하철역 = 서울시 역사마스터, 중학교 = 학교알리미) ---------- */

  J(DATA + 'poi/' + id + '.json').then(d => { POI[id] = d ? { st: 'ok', st_: d.st || [], sc: d.sc || [] } : { st: 'err' }; render(); });

function poiRender(z, bb, next, W){

    if (z >= 15) for (const x of POI[id].sc) if (C.inBox(bb, x[2], x[1], 0)) cand.push({ k: 'PC' + x[0], lat: x[2], lng: x[1], t: x[0].replace(/중학교$/, '중'), c: '중', cls: 'po sc' });
  }

  if (!l.length) return;
  el.innerHTML = `<span class="nm">비교함 <b>${l.length}곳</b> · ${l.map(x => esc(x.apt)).join(', ')}</span>`
    + `<a href="${esc(C.askUrl(l))}" class="${l.length < 2 ? 'off' : ''}" data-track="map_to_ask"${l.length < 2 ? ' aria-disabled="true" title="2곳 이상 담으면 비교할 수 있어요"' : ''}>${l.length < 2 ? '1곳 더 담기' : '비교하기'}</a>`
    + `<button type="button" id="cmpClr" aria-label="비교함 비우기">비우기</button>`;
  $('cmpClr').onclick = () => { saveCmp([]); if (SEL && SEL.d) openCard(SEL.d, SEL.band, true); };
}

/* ---------- 검색 (mine-core searchDanji — 지금 불러온 시·도 + 검색어 앞 지역 이름) ---------- */
let qt = null;
function sidoFromQuery(q){
  const t = q.trim().split(/\s+/);
  if (t.length < 2) return null;
  const s = IX.sido.find(x => x.short === t[0] || x.name === t[0] || x.name.indexOf(t[0]) === 0 && t[0].length >= 2);
  return s ? { id: s.id, rest: t.slice(1).join(' ') } : null;
}
function centerSido(){
  if (!GEO) return null; const c = MAP.center();
  let best = null, bd = Infinity;
  for (const id in GEO.sido) { const b = GEO.sido[id].b; if (c.lng >= b[0] && c.lng <= b[2] && c.lat >= b[1] && c.lat <= b[3]) { const g = GEO.sido[id].c, dd = (g[0] - c.lng) ** 2 + (g[1] - c.lat) ** 2; if (dd < bd) { bd = dd; best = id; } } }
  return best;
}
/* 시세 목록(price/sNN.json — 거래가 1건이라도 있으면 모두, 별칭 칸 포함): 점수 자료가 없는 단지·평형도 이름으로 찾게 */
const PLIST = {};
function ensurePrice(ids){
  let want = 0;
  for (const id of ids) {
    if (PLIST[id]) { if (PLIST[id].st === 'wait') want++; continue; }
    const sd = IX.sido.find(s => s.id === id); if (!sd) continue;
    PLIST[id] = { st: 'wait' }; want++;
    J(DATA + (sd.price || 'price/' + id + '.json')).then(j => { PLIST[id] = j && j.units ? { st: 'ok', g: M.groupDanji(j.units.map(M.listRow)) } : { st: 'err' }; });
  }
  return want;
}
const ALX = {};                                                     // alias/sNN.json(최근 3년 목록에 없는 K-apt 단지) — 결과가 없을 때만 읽음
function aliasX(id){ if (!ALX[id]) ALX[id] = J(DATA + 'alias/' + id + '.json').then(j => (j && j.x) || []); return ALX[id]; }
function runSearch(){
  const q = $('q').value.trim(), out = $('sres');
  $('qClr').hidden = !q;
  if (!q) { out.innerHTML = ''; return; }
  const sq = sidoFromQuery(q), ids = sq ? [sq.id] : [...new Set([centerSido(), ...Object.keys(SD).filter(id => SD[id].st === 'ok')].filter(Boolean))];
  const text = sq ? sq.rest : q;
  const w1 = ensure(ids), w2 = ensurePrice(ids);
  if (w1 || w2) { out.innerHTML = '<li class="msg">단지 목록을 불러오는 중이에요…</li>'; clearTimeout(qt); qt = setTimeout(runSearch, 400); return; }
  const res = [], seen = new Set();
  for (const id of ids) {
    const s = SD[id], p = PLIST[id];
    const pool = p && p.st === 'ok' ? p.g : (s && s.st === 'ok' ? s.byKey : null);
    if (!pool) continue;
    for (const d of M.searchDanji(pool, text, 12)) {
      if (seen.has(id + d.key)) continue; seen.add(id + d.key);
      const m = s && s.st === 'ok' ? s.byKey.get(d.key) : null;          // 지도에 있는(점수 자료가 있는) 단지면 지도 카드로
      res.push({ id, d, m, via: M.matchedAlias(d, text) });
    }
  }
  const sdn = id => (IX.sido.find(s => s.id === id) || {}).short || '';
  const row = x => {
    const d = x.d, by = x.m && x.m.by ? ' · ' + x.m.by + '년' : '';
    const via = x.via ? `<small class="via">'${esc(x.via)}'(으)로 찾았어요</small>` : '';
    const where = `${esc(sdn(x.id))} ${esc(sggName(d.code))} ${esc(d.dong)}`;
    if (x.m) return `<li><button type="button" data-sd="${x.id}" data-k="${esc(d.key)}"><b>${esc(d.apt)}</b><small>${where}${by}</small>${via}</button></li>`;
    const url = C.mineUrl({ sd: x.id, key: d.key }, (d.bands.find(u => u[3] === '84㎡대') || d.bands.slice().sort((a, b) => b[5] - a[5])[0] || [])[3]);
    return `<li><button type="button" data-href="${esc(url)}"><b>${esc(d.apt)}</b><small>${where} · 시세 보기(점수 자료 없음, 최근 3년 거래 ${d.n.toLocaleString()}건)</small>${via}</button></li>`;
  };
  if (res.length) { out.innerHTML = res.slice(0, 12).map(row).join(''); return; }
  // 결과 없음: 같은 동(검색어에 동 이름이 있으면)·비슷한 이름 후보 + K-apt 에는 있지만 시세 목록에 없는 단지 안내, 검색어만 익명으로 남김
  const cand = [];
  for (const id of ids) { const p = PLIST[id]; if (p && p.st === 'ok') for (const c of M.suggestDanji(p.g, text, 5)) cand.push(Object.assign({ id }, c)); }
  cand.sort((a, b) => b.s - a.s);
  const head = `<li class="msg">'${esc(text)}' 이름의 단지를 ${sq ? esc(sdn(sq.id)) + '에서' : '지금 지도 주변 지역에서'} 찾지 못했어요.${sq ? '' : " 다른 지역이면 '부산 해운대'처럼 지역 이름을 앞에 붙여 주세요."}</li>`;
  const sug = cand.length ? `<li class="msg">${cand[0].dong ? '이 동네 단지 중 이름이 비슷한 곳' : '이름이 비슷한 단지'}이에요</li>` + cand.slice(0, 5).map(c => row({ id: c.id, d: c.d, m: SD[c.id] && SD[c.id].st === 'ok' ? SD[c.id].byKey.get(c.d.key) : null, via: '' })).join('') : '';
  out.innerHTML = head + sug;
  M.logMiss(text, 'map');
  Promise.all(ids.map(aliasX)).then(xs => {
    if ($('q').value.trim() !== q) return;
    const rows = M.missRows([].concat(...xs), text, 2);
    if (!rows.length) return;
    out.insertAdjacentHTML('afterbegin', rows.map(r => `<li class="msg"><b>${esc(r[2])}</b> (${esc(sggName(r[0]))} ${esc(r[1])}${r[4] ? ' · ' + r[4] + '년' : ''})은 ${esc(M.MISS_WHY[r[5]] || M.MISS_WHY.none)}${r[5] === 'old' && r[6] ? ` (마지막 거래 ${esc(M.ymLabel(r[6]))})` : ''}. 그래서 시세를 보여 드릴 수 없어요.</li>`).join(''));
  });
}
$('q').addEventListener('input', () => { clearTimeout(qt); qt = setTimeout(runSearch, 200); });
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); clearTimeout(qt); runSearch(); const f = $('sres').querySelector('button'); if (f) f.click(); } if (e.key === 'Escape') { $('sres').innerHTML = ''; } });
$('qClr').onclick = () => { $('q').value = ''; runSearch(); $('q').focus(); };
$('sres').addEventListener('click', e => {
  const h = e.target.closest('button[data-href]'); if (h) { if (window.jdjStat) jdjStat('feature_use', {feature:'map_search_price'}); location.href = h.dataset.href; return; }
  const b = e.target.closest('button[data-k]'); if (!b) return;
  const s = SD[b.dataset.sd], d = s && s.byKey.get(b.dataset.k); if (!d) return;
  $('sres').innerHTML = ''; $('q').blur();
  MAP.setView(d.lat, d.lng, 17); openCard(d);
  if (window.jdjStat) jdjStat('feature_use', {feature:'map_search'});
});

/* ---------- 내 위치 (권한이 없거나 실패하면 조용히 그대로) ---------- */
let ME = null;
$('me').onclick = () => {
  if (!navigator.geolocation) return;
  const b = $('me'); b.classList.add('busy');
  navigator.geolocation.getCurrentPosition(p => { b.classList.remove('busy'); ME = { lat: p.coords.latitude, lng: p.coords.longitude }; MAP.setView(ME.lat, ME.lng, 15); render(); },
    () => b.classList.remove('busy'), { enableHighAccuracy: false, timeout: 8000, maximumAge: 120000 });
};
$('zin').onclick = () => MAP.zoomBy(1);
$('zout').onclick = () => MAP.zoomBy(-1);

/* ---------- 주소(지금 보는 곳·필터)를 남겨 새로 고침·공유해도 같은 화면 ---------- */
let ut = null;
function saveUrl(z){
  clearTimeout(ut); ut = setTimeout(() => {
    const c = MAP.center(), u = new URL(location.href), p = u.searchParams;
    p.set('lat', c.lat.toFixed(5)); p.set('lng', c.lng.toFixed(5)); p.set('z', String(Math.round(z)));
    S.mode !== 'price' ? p.set('m', S.mode) : p.delete('m'); S.size ? p.set('sz', S.size) : p.delete('sz'); S.price ? p.set('pr', S.price) : p.delete('pr');
    S.age ? p.set('ag', S.age) : p.delete('ag'); S.stn ? p.set('sn', '1') : p.delete('sn');
    S.bun ? p.set('ly', 'bun') : p.delete('ly'); S.fut ? p.delete('fu') : p.set('fu', '0');
    S.nb ? p.set('nb', '1') : p.delete('nb');
    S.poi === F.on ? p.delete('po') : p.set('po', S.poi ? '1' : '0');
    for (const [k, v, d] of [['ri', REG.ind, 'price'], ['rp', REG.per, '1y'], ['rf', REG.freq, 'm'], ['rs', REG.sd, ''], ['rg', REG.gu, '']]) S.mode === 'reg' && v && v !== d ? p.set(k, v) : p.delete(k);
    if (SEL && SEL.d) { p.set('sd', SEL.d.sd); p.set('d', SEL.d.key); SEL.band ? p.set('b', SEL.band) : p.delete('b'); } else { p.delete('sd'); p.delete('d'); p.delete('b'); }
    history.replaceState(null, '', u);
  }, 300);
}

/* ---------- 위쪽 조작 칸 높이 → 지도 시작 위치(--mt) ---------- */
let MT = -1;
function syncTop(){
  const h = document.querySelector('.mtop').offsetHeight;
  if (h === MT) return; MT = h;
  $('mwrap').style.setProperty('--mt', h + 'px');
  if (MAP) { MAP.relayout(); render(); }
}
if (window.ResizeObserver) new ResizeObserver(syncTop).observe(document.querySelector('.mtop'));
/* 지도 위 소식 한 줄: 닫기(✕) — 이번 방문 동안 지도 화면에서만 숨김(다른 화면의 소식 칸은 그대로) */
(function(){
  const slot = document.querySelector('.mtop .jas-top'); if (!slot) return;
  let off = false; try { off = sessionStorage.getItem('jdj_map_bar_x') === '1'; } catch (e) {}
  if (off) { document.body.classList.add('mtop-nobar'); return; }
  const addX = () => { if (!slot.querySelector('.jas-bar') || slot.querySelector('.jas-x')) return;
    slot.insertAdjacentHTML('beforeend', '<button type="button" class="jas-x" aria-label="이 소식 닫기">✕</button>'); };
  slot.addEventListener('click', e => { if (!e.target.closest('.jas-x')) return; e.preventDefault(); e.stopPropagation();
    document.body.classList.add('mtop-nobar'); try { sessionStorage.setItem('jdj_map_bar_x', '1'); } catch (er) {} syncTop(); }, true);
  if (window.MutationObserver) new MutationObserver(addX).observe(slot, { childList: true });
  addX();
})();
/* 지역 분석 칸 크기 → 지도 비키기(모바일: 아래 --mb, PC: 왼쪽 --ml) */
let MBL = '';
function syncPanel(){
  const el = $('rpanel'), wide = innerWidth >= 900, on = !el.hidden, li = $('mlist'), split = !on && innerWidth >= 1024 && li && li.offsetWidth > 0;
  document.body.classList.toggle('has-rp', on);
  const mb = on && !wide ? el.offsetHeight : 0, ml = on && wide ? el.offsetWidth : split ? li.offsetWidth : 0, k = mb + '|' + ml;
  if (k === MBL) return; MBL = k;
  $('mwrap').style.setProperty('--mb', mb + 'px'); $('mwrap').style.setProperty('--ml', ml + 'px');
  if (MAP) { MAP.relayout(); render(); }
}
if (window.ResizeObserver) new ResizeObserver(syncPanel).observe($('rpanel'));

/* ---------- 시작 ---------- */
async function init(){
  drawControls(); legend(); drawCmp(); syncTop();
  const [ix, geo, mj, mh] = await Promise.all([J(DATA + 'index.json'), J(JB.SITE + 'assets/map-geo.json'), J(DATA + 'model.json'), J(DATA + 'model_h.json')]);
  if (!ix) { status('지도 자료를 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.'); return; }
  IX = ix; GEO = geo; MH = mh; MREG = !!(mj && mj.region && mj.region.used);
  const lat = parseFloat(Q.get('lat')), lng = parseFloat(Q.get('lng')), z = parseInt(Q.get('z'), 10);
  const fv = isFinite(lat) && isFinite(lng) ? null : await focusInit().catch(() => null);   // 결과 화면에서 처음 온 때만(새로 고침이면 남겨 둔 lat·lng 그대로)
  if (!fv && F.on && !FOC && isFinite(lat)) await focusInit().catch(() => null);
  const v = fv || (isFinite(lat) && isFinite(lng) && lat > 32 && lat < 39.5 && lng > 124 && lng < 132 ? { lat, lng, zoom: isFinite(z) ? Math.max(6, Math.min(19, z)) : 14 } : { lat: 37.5400, lng: 127.0050, zoom: 11 });
  try { MAP = await E.create($('map'), v); }
  catch (e) { status('지도를 불러오지 못했어요. 인터넷 연결을 확인하고 다시 열어 주세요.'); return; }
  document.documentElement.dataset.mapEngine = MAP.kind + (MAP.tiles ? ':' + MAP.tiles : '');
  MAP.onIdle(() => { MOVED = false; render(); });
  MAP.onMoveStart(() => { MOVED = true; });
  MAP.onTap(() => { $('sres').innerHTML = ''; if (!$('sheet').hidden) closeSheet(); });
  addEventListener('pointerdown', () => { MOVED = false; }, true);
  addEventListener('resize', () => { syncTop(); syncPanel(); MAP.relayout(); render(); });
  if (S.fut) loadLayer('fut'); if (S.bun) loadLayer('bun'); if (S.nb) loadLayer('nb');
  fetch(DATA + 'newbuild.json', { method: 'HEAD', cache: 'no-cache' }).then(r => { if (r.ok && !NB_OK) { NB_OK = true; if (S.mode !== 'reg') drawControls(); } }).catch(() => {});
  if (S.mode === 'reg') { regPanel(); drawControls(); }
  const qsd = Q.get('sd'), qd = Q.get('d');
  if (FOC && FOC.want.length) ensure([...new Set(FOC.want.map(x => x.sd))].filter(id => IX.sido.some(s => s.id === id)));
  else if (qsd && qd && IX.sido.some(s => s.id === qsd)) { PENDING = { sd: qsd, d: qd, b: Q.get('b') || '' }; ensure([qsd]); }
  render();
  if (FOC && FOC.pt && !FOC.want.length) focusCard();
  if (F.on && window.jdjStat) jdjStat('feature_use', {feature: 'map_from_result'});
  if (window.jdjStat) jdjStat('feature_use', {feature:'map'});
}
init();
})();
</script>
