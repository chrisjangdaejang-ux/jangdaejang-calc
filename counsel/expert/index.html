<!DOCTYPE html>
<html lang="ko">
<head>

<!-- 고민 상담 전문가 신청 · 내 답변함 — COUNSEL_ENABLED 가 false 면 '준비 중'(운영자 미리 보기 제외). 검색 제외(noindex) -->
<script>window.JDJ_CONFIG = { tool:'counsel', GA4_ID:'G-V2VR9VL7EM', CLARITY_ID:'' };</script>
<script src="../../assets/pwa.js?v=2" defer></script>
<script src="../../assets/biz.js?v=3" defer></script>
<script src="../../assets/track.js?v=2"></script>
<script src="../../assets/agents.js"></script>
<script src="../../assets/config.js?v=11"></script>
<script src="../../assets/auth.js?v=10"></script>
<script src="../../assets/savefb.js?v=1"></script>

<script src="../../assets/counsel.js?v=1"></script>
<script src="../../assets/tabbar.js?v=5" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/aplus.css?v=46">
<script src="../../assets/back.js?v=1" defer></script>
</head>
<body>
<header class="top">
  <a class="brand" href="../../" aria-label="홈"><svg class="bi" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#4338CA"/><path d="M29 47 V78 H71 V47 Z" fill="#FFFFFF"/><path d="M20 51 L50 26 L80 51" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="50" cy="59" r="6" fill="#4338CA"/><path d="M46.5 62 L44 74 H56 L53.5 62 Z" fill="#4338CA"/><circle cx="76" cy="24" r="5" fill="#5EEAD4"/></svg><span data-site-name></span></a>
  <div class="badge plain">전문가</div>
</header>
<main class="cs-wrap" id="app"></main>
<footer class="foot">★ <span data-site-name></span> · <a href="../../">홈</a> · <a href="../../terms/#counsel">이용약관</a> · <a href="../../privacy/#counsel">개인정보처리방침</a></footer>
<script>
(function () {
  'use strict';
  var JB = (typeof window !== 'undefined' && window.JDJ_BASE) || (function (p) { var g = p.indexOf('/jangdaejang-calc/') === 0, b = { SITE: g ? '/jangdaejang-calc/' : '/', DATA: g ? '/jangdaejang-data/' : 'https://chrisjangdaejang-ux.github.io/jangdaejang-data/' }; if (typeof window !== 'undefined') window.JDJ_BASE = b; return b; })((typeof location !== 'undefined' && location.pathname) || '/jangdaejang-calc/');
  var CS = window.JDJ_CS, C = window.JDJ_CSCORE, F = window.JDJ_SAVEFB, app = document.getElementById('app'), esc = CS.esc, SITE = CS.site();
  document.title = '전문가로 답하기' + (SITE ? ' — ' + SITE : '');
  CS.style();
  if (!CS.enabled()) { app.innerHTML = CS.soonHtml(); return; }
  var head = '<h1>전문가로 답하기' + CS.pvTag() + '</h1><p class="cs-lead">자격을 확인한 전문가만 고민 상담에 답할 수 있어요. 답변 옆에 \'확인된 전문가\' 표시와 이름·소속이 함께 보여요.</p>';
  if (!CS.loggedIn()) { app.innerHTML = head + '<div class="cs-panel">' + CS.loginBox('전문가 신청') + '</div>'; return; }
  load();
  function load() {
    app.innerHTML = head + '<p class="cs-lead">불러오고 있어요…</p>';
    CS.post({ action: 'csProMine' }).then(function (j) {
      var p = j.pro;
      if (!p || p.st === '반려') return apply(p);
      if (p.st === '확인 대기') { app.innerHTML = head + '<div class="cs-panel cs-cream"><h2>자격을 확인하고 있어요</h2><p>' + esc(p.kn) + ' ' + esc(p.name) + '님의 신청을 받았어요. 운영자가 등록 정보를 확인한 뒤 적어 주신 이메일로 결과를 알려 드려요.</p></div>'; return; }
      if (p.st === '중지') return apply(p);
      inbox(j);
    }).catch(function (e) { app.innerHTML = head + '<div class="cs-empty">' + esc(e.message) + '</div>'; });
  }
  function apply(prev) {
    var kinds = Object.keys(C.PROS);
    app.innerHTML = head + (prev && prev.memo ? '<p class="cs-note warn">' + esc(prev.st === '중지' ? '답변이 멈춰 있어요' : '지난 신청은 반려됐어요') + ' — ' + esc(prev.memo) + '</p>' : '')
      + '<div class="cs-grid"><form class="cs-panel cs-form" id="f" novalidate><h2>전문가 신청</h2>'
      + '<div><span class="cs-lab">어떤 전문가인가요?</span><div class="cs-opt" role="radiogroup" style="margin-top:6px">' + kinds.map(function (k, i) {
        return '<label><input type="radio" name="kind" value="' + k + '"' + (i ? '' : ' checked') + '><span>' + esc(C.PROS[k].name) + '<small>' + esc(C.PROS[k].no || C.PROS[k].org) + ' 확인</small></span></label>';
      }).join('') + '</div><div id="kindNote"></div></div>'
      + '<div><label for="nm">이름</label><input id="nm" class="cs-inp" maxlength="20" autocomplete="name"></div>'
      + '<div id="noBox"><label for="no" id="noL"></label><input id="no" class="cs-inp" maxlength="30"></div>'
      + '<div><label for="org" id="orgL"></label><input id="org" class="cs-inp" maxlength="40"></div>'
      + '<div><label for="ar">활동 지역 <small style="font-weight:500;color:var(--sub2)">(선택)</small></label><input id="ar" class="cs-inp" maxlength="30" placeholder="예: 서울 강남구"></div>'
      + '<div><label for="in">한 줄 소개 <small style="font-weight:500;color:var(--sub2)">(선택 · 연락처·인터넷 주소는 쓸 수 없어요)</small></label><input id="in" class="cs-inp" maxlength="200" placeholder="예: 강남권 아파트 매매·임대차 상담 15년"></div>'
      + '<div><label for="ph">휴대폰 번호 <small style="font-weight:500;color:var(--sub2)">(운영자 확인 연락용 · 공개하지 않아요)</small></label><input id="ph" class="cs-inp" type="tel" inputmode="numeric" autocomplete="tel"></div>'
      + '<div><label for="em">이메일 <small style="font-weight:500;color:var(--sub2)">(결과·새 질문 알림용 · 공개하지 않아요)</small></label><input id="em" class="cs-inp" type="email" autocomplete="email"></div>'
      + '<label class="cs-check"><input type="checkbox" id="ag"> 자격 확인을 위해 이름·등록번호·소속·연락처를 수집·이용하는 데 동의해요. 운영자가 공개된 조회 서비스로 등록 여부를 확인하며, 이름·종류·소속·지역·소개는 답변 옆에 공개돼요.</label>'
      + '<div class="cs-acts"><button type="submit" class="cs-btn" id="send">신청하기</button></div><p class="cs-msg" id="msg" aria-live="polite"></p></form>'
      + '<aside class="cs-side"><section class="cs-panel cs-cream"><h2>답변 원칙</h2><ul><li>일반적인 안내로 답해 주세요. 확실하지 않은 숫자는 확인할 곳을 알려 주세요.</li><li>답변에는 연락처·홍보 문구를 쓸 수 없어요. 질문한 분이 고른 경우에만 연락처가 전해져요.</li><li>대출 질문에는 금융위원회에 등록된 대출모집인만 답할 수 있어요.</li><li>법령에서 자격이 필요한 업무(세무 대리·등기 대리·법률 사무 등)는 해당 자격을 가진 분만 맡을 수 있어요.</li></ul></section></aside></div>';
    var f = document.getElementById('f');
    function sync() {
      var k = f.querySelector('input[name=kind]:checked').value, P = C.PROS[k];
      document.getElementById('noBox').hidden = !P.no; document.getElementById('noL').textContent = P.no || '';
      document.getElementById('orgL').innerHTML = esc(P.org) + (P.orgNeed ? '' : ' <small style="font-weight:500;color:var(--sub2)">(선택)</small>');
      document.getElementById('kindNote').innerHTML = k === 'loan' ? '<p class="cs-note warn">금융위원회에 등록된 대출모집인만 신청할 수 있어요. 등록번호와 소속 금융회사(위탁사)를 확인해요.</p>'
        : k === 'sales' ? '<p class="cs-note">분양상담사는 국가 자격이 없어서 소속 분양대행사를 확인해요. 확인 메일을 받으면 재직 확인서나 명함을 회신해 주세요.</p>' : '';
    }
    f.addEventListener('change', function (e) { if (e.target.name === 'kind') sync(); });
    sync();
    f.onsubmit = function (e) {
      e.preventDefault();
      var m = document.getElementById('msg'), b = document.getElementById('send'), v = function (id) { return document.getElementById(id).value.trim(); };
      var body = { action: 'csProApply', kind: f.querySelector('input[name=kind]:checked').value, name: v('nm'), no: v('no'), org: v('org'), area: v('ar'), intro: v('in'), phone: v('ph'), email: v('em'), agree: document.getElementById('ag').checked };
      if (body.name.length < 2) return CS.msg(m, '이름을 적어 주세요.');
      if (!body.agree) return CS.msg(m, '자격 확인과 개인정보 수집·이용에 동의해 주세요.');
      if (F) F.busy(b, '보내는 중…'); else b.disabled = true;
      CS.post(body).then(load).catch(function (x) { if (F) F.restore(b); else b.disabled = false; CS.msg(m, x.message); });
    };
  }
  function qLine(x) {
    return '<a class="cs-item" href="' + esc(CS.link('counsel/?id=' + x.id)) + '"><div class="cs-meta"><span class="cs-tag gray">' + esc(x.cn) + '</span>' + (x.priv ? '<span class="cs-tag pv">1:1 비공개</span>' : x.pick ? '<span class="cs-tag">나를 지정</span>' : '')
      + '<span>' + esc(x.day) + '</span></div><h3>' + esc(x.title) + '</h3><p>' + esc(x.snip) + '</p></a>';
  }
  function inbox(j) {
    var p = j.pro;
    app.innerHTML = head + '<div class="cs-grid"><div>'
      + '<section class="cs-panel"><h2>나에게 온 질문 <span class="cs-tag' + (j.inbox.length ? ' pv' : ' gray') + '">' + j.inbox.length + '</span></h2><p class="cs-help">나를 지정한 질문과 1:1 비공개 상담이에요.</p>'
      + (j.inbox.length ? '<div class="cs-list" style="margin-top:8px">' + j.inbox.map(qLine).join('') + '</div>' : '<p class="cs-help">지금은 없어요.</p>') + '</section>'
      + '<section class="cs-panel"><h2>답을 기다리는 질문</h2><p class="cs-help">내가 답할 수 있는 공개 질문이에요(전문가 답변이 다섯 개 찬 질문은 빠져요).</p>'
      + (j.open.length ? '<div class="cs-list" style="margin-top:8px">' + j.open.map(qLine).join('') + '</div>' : '<p class="cs-help">지금은 없어요.</p>') + '</section>'
      + '<section class="cs-panel"><h2>내 답변과 받은 연락처</h2><p class="cs-help">질문한 분이 나를 골라 연락처를 보내면 여기에만 보여요. 상담 연결에만 써 주세요.</p>'
      + (j.answers.length ? '<table class="cs-table"><thead><tr><th>질문</th><th>받은 연락처</th></tr></thead><tbody>' + j.answers.map(function (a) {
        return '<tr><td>' + (a.qid ? '<a href="' + esc(CS.link('counsel/?id=' + a.qid)) + '">' + esc(a.title) + '</a>' : esc(a.title)) + '<div class="cs-help">' + esc(a.at) + (a.st !== '공개' ? ' · ' + esc(a.st) : '') + '</div></td>'
          + '<td>' + (a.contact ? '<b>' + esc(String(a.contact.phone).replace(/^(\d{3})(\d{3,4})(\d{4})$/, '$1-$2-$3')) + '</b>' + (a.contact.note ? '<div class="cs-help">' + esc(a.contact.note) + '</div>' : '') + '<div class="cs-help">' + esc(a.contact.at) + ' 받음</div>' : '<span class="cs-help">—</span>') + '</td></tr>';
      }).join('') + '</tbody></table>' : '<p class="cs-help">아직 쓴 답변이 없어요.</p>') + '</section></div>'
      + '<aside class="cs-side"><section class="cs-panel cs-cream"><h2><span class="cs-tag ok">✓ 확인된 전문가</span></h2><p><b>' + esc(p.name) + '</b> · ' + esc(p.kn) + (p.org ? '<br>' + esc(p.org) : '') + (p.area ? '<br>' + esc(p.area) : '') + '</p>'
      + '<p class="cs-help">소개를 바꾸고 싶으면 고객문의로 알려 주세요.</p></section></aside></div>';
  }
})();
</script>
</body>
</html>
