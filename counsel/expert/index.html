      + '<label class="cs-check"><input type="checkbox" id="ag"> 자격 확인을 위해 이름·등록번호·소속·연락처를 수집·이용하는 데 동의해요. 누구나 보는 곳에는 성+○○·직군·활동 구·경력·소개·사진만 보이고, 실명·사무소 이름·주소·등록번호·사무실 전화는 내가 상담 제안을 보내거나 채팅을 수락한 고객에게만 공개돼요.</label>'
      + '<div class="cs-acts"><button type="submit" class="cs-btn" id="send">신청하기</button></div><p class="cs-msg" id="msg" aria-live="polite"></p></form>'
      + '<aside class="cs-side"><section class="cs-panel cs-cream"><h2>답변 원칙</h2><ul><li>일반적인 안내로 답해 주세요. 확실하지 않은 숫자는 확인할 곳을 알려 주세요.</li><li>공개 답변에 적은 연락처·인터넷 주소는 자동으로 가려져요. 자세한 상담은 1:1 상담 채팅에서 이어가고, 채팅방 안에서는 연락처를 주고받을 수 있어요.</li><li>대출 질문에는 금융위원회에 등록된 대출모집인만 답할 수 있어요.</li><li>법령에서 자격이 필요한 업무(세무 대리·등기 대리·법률 사무 등)는 해당 자격을 가진 분만 맡을 수 있어요.</li></ul></section></aside></div>';
    var f = document.getElementById('f');
    function sync() {
      var k = f.querySelector('input[name=kind]:checked').value, P = C.PROS[k];
      document.getElementById('noBox').hidden = !P.no; document.getElementById('noL').textContent = P.no || '';

        : k === 'consult' ? '<p class="cs-note">부동산 컨설팅 사업자만 신청할 수 있어요. 사업자등록증(업종에 부동산 컨설팅·자문)과 방송 출연·강의·저서·칼럼 같은 활동 링크를 확인해요. 중개(거래 연결·계약 대행)는 공인중개사만 할 수 있어요. 세금·등기·법률·대출 분야에는 답할 수 없어요.</p>'
        : k === 'prof' ? '<p class="cs-note">대학·연구기관 재직을 확인해요. 소속·직위는 채팅 전에도 프로필에 보이고, 개인 연락처는 보이지 않아요. 세금·등기·법률·대출 분야에는 답할 수 없어요.</p>'
        : k === 'appraiser' ? '<p class="cs-note">한국감정평가사협회 등록 정보로 확인해요. 세금·등기·법률·대출 분야에는 답할 수 없어요.</p>'

    }
    function sync2() {
      var k = f.querySelector('input[name=kind]:checked').value, P = C.PROS[k];
      document.getElementById('ttBox').hidden = !P.title; if (P.title) document.getElementById('ttL').textContent = P.title;
      document.getElementById('lkBox').hidden = !(P.proof === 'biz' || P.proof === 'work');

      document.getElementById('lkH').textContent = P.proof === 'work' ? '교원·연구원 목록에 내 이름이 나오는 페이지예요. 없으면 아래에 재직증명서 사진을 올려 주세요.' : '방송 출연·강의·저서·칼럼처럼 활동을 확인할 수 있는 주소를 적어 주세요.';
      document.getElementById('pfBox').hidden = !(P.proof === 'biz' || P.proof === 'work');
      document.getElementById('pvL').textContent = P.proof === 'work' ? '재직증명서 사진(선택)' : '사업자등록증 사진';
      document.getElementById('pvH').textContent = (P.proof === 'work' ? '발급 3개월 안의 재직증명서를 찍어 주세요. ' : '업종(종목)에 부동산 컨설팅·자문이 보이게 찍어 주세요. ') + '운영자만 보고, 확인이 끝나면(승인이든 반려든) 바로 지워요.';

    }
    f.addEventListener('change', function (e) { if (e.target.name === 'kind') { sync(); sync2(); } });
    var proof = '';

      var file = this.files && this.files[0]; proof = ''; if (!file) return;
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () { var k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); proof = c.toDataURL('image/jpeg', 0.82); };

    };

      var file = this.files && this.files[0]; photo = ''; if (!file) return;
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () { var k = Math.min(1, 360 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); var q2 = 0.8; photo = c.toDataURL('image/jpeg', q2); while (photo.length > 44000 && q2 > 0.3) { q2 -= 0.1; photo = c.toDataURL('image/jpeg', q2); } };

    f.onsubmit = function (e) {

      if (F) F.busy(b, '보내는 중…'); else b.disabled = true;
      CS.post(body).then(load).catch(function (x) { if (F) F.restore(b); else b.disabled = false; CS.msg(m, x.message); });
    };
  }
  function qLine(x) {

      + (j.rooms.length ? '<div class="cs-list" style="margin-top:8px">' + j.rooms.map(function (r) {
        return '<a class="cs-item" href="' + esc(CS.link('counsel/chat/?id=' + r.id)) + '"><div class="cs-meta"><span>' + esc(r.other.name) + '</span><span>' + esc(r.day) + '</span>' + (r.st === '요청' ? '<span class="cs-tag pv">수락 기다림</span>' : r.st === '제안' ? '<span class="cs-tag">제안 보냄</span>' : r.st !== '진행' ? '<span class="cs-tag gray">' + esc({ '끝남': '끝난 상담', '거절': '거절함', '만료': '기간 지남', '사양': '괜찮다고 함' }[r.st] || r.st) + '</span>' : '') + (r.refund ? '<span class="cs-tag ok">하트 돌려받음</span>' : '') + (r.gotContact ? '<span class="cs-tag ok">연락처 받음</span>' : '') + (r.unread ? '<span class="cs-n">새 메시지</span>' : '') + '</div><h3>' + esc(r.title) + '</h3></a>';
      }).join('') + '</div>' : '<p class="cs-help">아직 상담 채팅이 없어요.</p>') + '</section>'
      + '<section class="cs-panel"><h2>내 답변</h2>'

      }).join('') + '</div>' : '<p class="cs-help">아직 쓴 답변이 없어요.</p>') + '</section></div>'

  }
