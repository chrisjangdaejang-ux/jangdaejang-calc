<style>
.pf-top{display:flex;gap:16px;align-items:center}
.pf-t{min-width:0}
.pf-t h1{margin:6px 0 2px}
.pf-ph{width:88px;height:88px;border-radius:50%;object-fit:cover;flex:none;background:var(--gray)}
.pf-ph0{display:inline-flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;color:var(--blue);background:#EEF0FF}
.pf-intro{margin:8px 0 0;font-size:15.5px;line-height:1.6;word-break:keep-all}
.pf-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.pf-stats div{border:1px solid var(--line);border-radius:16px;padding:12px 8px;background:#fff;text-align:center;min-width:0}
.pf-stats b{display:block;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.pf-stats span{display:block;font-size:14px;font-weight:700;color:var(--sub)}
.pf-stats small{display:block;font-size:12.5px;color:var(--sub2);margin-top:2px;line-height:1.35;word-break:keep-all}
@media(max-width:480px){.pf-top{flex-direction:column;align-items:flex-start}.pf-ph{width:72px;height:72px}}

<body>
<header class="top">
  <a class="brand" href="../../" aria-label="홈"><svg class="bi" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#4338CA"/><path d="M29 47 V78 H71 V47 Z" fill="#FFFFFF"/><path d="M20 51 L50 26 L80 51" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="50" cy="59" r="6" fill="#4338CA"/><path d="M46.5 62 L44 74 H56 L53.5 62 Z" fill="#4338CA"/><circle cx="76" cy="24" r="5" fill="#5EEAD4"/></svg><span data-site-name></span></a>
  <div class="badge plain">전문가 프로필</div>
</header>
<main class="cs-wrap" id="app"></main>
<footer class="foot">자격은 운영자가 공개 조회로 확인했어요. 순서와 노출은 돈으로 살 수 없어요.<br>★ <span data-site-name></span> · <a href="../../">홈</a> · <a href="../../terms/#counsel">이용약관</a> · <a href="../../privacy/#counsel">개인정보처리방침</a></footer>
<script>
(function () {
  'use strict';
  var JB = (typeof window !== 'undefined' && window.JDJ_BASE) || (function (p) { var g = p.indexOf('/jangdaejang-calc/') === 0, b = { SITE: g ? '/jangdaejang-calc/' : '/', DATA: g ? '/jangdaejang-data/' : 'https://chrisjangdaejang-ux.github.io/jangdaejang-data/' }; if (typeof window !== 'undefined') window.JDJ_BASE = b; return b; })((typeof location !== 'undefined' && location.pathname) || '/jangdaejang-calc/');
  var CS = window.JDJ_CS, C = window.JDJ_CSCORE, app = document.getElementById('app'), esc = CS.esc, SITE = CS.site();
  document.title = '전문가 프로필' + (SITE ? ' — ' + SITE : '');
  CS.style();
  if (!CS.enabled()) { app.innerHTML = CS.soonHtml(); return; }
  var id = String(new URLSearchParams(location.search).get('id') || '');
  if (!/^E[0-9A-F]{10}$/.test(id)) { app.innerHTML = '<div class="cs-soon"><h1>전문가를 찾지 못했어요</h1><p>전문가 찾기에서 다시 골라 주세요.</p><a href="' + esc(CS.link('counsel/pros/')) + '">전문가 찾기</a></div>'; return; }
  app.innerHTML = '<p class="cs-lead">불러오고 있어요…</p>';
  CS.post({ action: 'csProPage', id: id }).then(function (j) {
    var p = j.pro, st = p.stat || {};
    document.title = p.name + ' ' + p.kn + ' — 전문가 프로필' + (SITE ? ' · ' + SITE : '');
    var ph = p.photo ? '<img class="pf-ph" src="' + esc(p.photo) + '" alt="' + esc(p.name) + ' 프로필 사진">' : '<span class="pf-ph pf-ph0" aria-hidden="true">' + esc(p.name.slice(0, 1)) + '</span>';
    app.innerHTML = '<div class="cs-grid"><div>'
      + '<section class="cs-panel pf-top">' + ph + '<div class="pf-t"><div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center"><span class="cs-tag ok">✓ ' + esc(p.badge || C.badge(p.kind)) + '</span><span class="cs-tag gray">' + esc(p.kn) + '</span>' + CS.pvTag() + '</div>'
      + '<h1>' + esc(p.name) + '</h1><p class="cs-lead" style="margin:0">' + esc([p.org && p.title ? p.org + ' ' + p.title : p.org, p.gu, p.years ? '경력 ' + p.years + '년' : ''].filter(Boolean).join(' · ')) + '</p>' + (p.intro ? '<p class="pf-intro">' + esc(p.intro) + '</p>' : '') + '</div></section>'
      + '<div class="pf-stats"><div><b>' + (st.rating != null ? '★ ' + Number(st.rating).toFixed(1) : '—') + '</b><span>평점' + (st.ratings ? ' (' + st.ratings + '명)' : '') + '</span><small>채팅을 실제로 한 고객만</small></div>'
      + '<div><b>' + (st.resp != null ? Math.round(st.resp * 100) + '%' : '—') + '</b><span>응답률</span><small>채팅 요청 중 ' + C.CHAT.reqDays + '일 안 수락</small></div>'
      + '<div><b>' + (st.answers || 0) + '</b><span>공개 답변</span><small>' + esc(p.since ? p.since + ' 자격 확인' : '') + '</small></div></div>'
      + '<section class="cs-panel"><h2>답할 수 있는 분야</h2><p>' + esc((p.cats || []).join(' · ')) + '</p></section>'
      + '<section class="cs-panel"><h2>최근 답변</h2>' + (j.recent.length ? '<div class="cs-list" style="margin-top:8px">' + j.recent.map(function (r) {
        return '<a class="cs-item" href="' + esc(CS.link('counsel/?id=' + r.qid)) + '"><div class="cs-meta"><span class="cs-tag gray">' + esc(r.cn) + '</span><span>' + esc(r.day) + '</span></div><h3>' + esc(r.title) + '</h3><p>' + esc(r.snip) + '</p></a>';
      }).join('') + '</div>' : '<p class="cs-help">아직 공개 답변이 없어요.</p>') + '</section></div>'
      + '<aside class="cs-side"><section class="cs-panel cs-cream"><h2>이 전문가와 상담하기</h2><p>질문을 올리면서 이 전문가를 지정하면 1:1 상담 채팅을 요청해요. 질문과 채팅은 무료예요.</p>'
      + '<div class="cs-acts"><a class="cs-btn full" href="' + esc(CS.link('counsel/?w=1&to=' + p.id)) + '">이 전문가와 채팅하기</a></div><span class="cs-chatnote">' + esc(CS.CHAT_NOTE) + '</span></section>'
      + '<section class="cs-panel"><h2>안내</h2><ul><li>사무소 이름·주소·등록번호·연락처는 채팅이 열리면 그 고객에게 보여요.</li><li>평점은 실제로 상담 채팅을 한 고객만 남길 수 있어요.</li><li>순서와 노출은 돈으로 살 수 없어요.</li></ul>'
      + '<div class="cs-acts"><a class="cs-btn ghost full" href="' + esc(CS.link('counsel/pros/' + (p.gu ? '?gu=' + encodeURIComponent(p.gu) : ''))) + '">' + esc(p.gu ? p.gu + ' 전문가 더 보기' : '전문가 찾기') + '</a></div></section></aside></div>';
  }).catch(function (e) { app.innerHTML = '<div class="cs-soon"><h1>' + esc(e.code === 'closed' ? '준비 중이에요' : '전문가를 찾지 못했어요') + '</h1><p>' + esc(e.message) + '</p><a href="' + esc(CS.link('counsel/pros/')) + '">전문가 찾기</a></div>'; });
})();
</script>
