.wrap{max-width:640px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:clamp(24px,6vw,32px);margin:6px 0 10px;line-height:1.3}
.lead{font-size:16px;color:var(--sub2);margin:0 0 16px;line-height:1.6}
.box{border:1px solid var(--line);border-radius:18px;padding:16px;background:#fff;margin:14px 0}
.box h2{font-size:18px;font-weight:900;margin:0 0 10px}
.box h2 small{font-size:13.5px;color:var(--sub2);font-weight:700;margin-left:6px}
.gets{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:10px}
.gets li{display:flex;gap:10px;align-items:flex-start;font-size:15.5px;line-height:1.5}
.gets li b{display:block}
.gets li small{display:block;color:var(--sub2);font-size:13.5px}
.gets .ic{flex:none;width:28px;height:28px;border-radius:9px;background:var(--blue-l);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px}
.note{font-size:13.5px;color:var(--sub2);line-height:1.6;margin:10px 0 0}
.free{background:var(--gray);border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.6;color:var(--sub)}
.st{padding:28px 16px;text-align:center;border:1px dashed var(--line);border-radius:16px;background:#fff;font-size:16px;color:var(--sub)}

.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2)}
.row:last-child{border-bottom:0}
.row a{color:var(--text);text-decoration:none;min-width:0}
.row a b{font-size:15.5px}
.row small{display:block;font-size:13.5px;color:var(--sub2)}
.row button{flex:none;font:inherit;font-size:14px;font-weight:700;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--neg);cursor:pointer}
.empty{font-size:14.5px;color:var(--sub2);margin:0}
.picks{margin:4px 0 0;padding-left:18px;font-size:13.5px;color:var(--sub)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.who{display:flex;align-items:center;gap:12px}
.who .av{width:44px;height:44px;border-radius:50%;background:#FEE500;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:rgba(0,0,0,.85)}
.who b{font-size:19px}
.who small{display:block;color:var(--sub2);font-size:13.5px}
.del{border-color:#F3C6B5}
.del h2{color:#9A3412}
.btn.warn{background:#fff;border:1px solid #E58B6B;color:#9A3412}

.btn.primary{background:var(--blue);color:#fff}
.msg{font-size:14px;font-weight:700;margin-top:8px;min-height:20px}

<script>
var JB = (typeof window !== 'undefined' && window.JDJ_BASE) || (function (p) { var g = p.indexOf('/jangdaejang-calc/') === 0, b = { SITE: g ? '/jangdaejang-calc/' : '/', DATA: g ? '/jangdaejang-data/' : 'https://chrisjangdaejang-ux.github.io/jangdaejang-data/' }; if (typeof window !== 'undefined') window.JDJ_BASE = b; return b; })((typeof location !== 'undefined' && location.pathname) || '/jangdaejang-calc/');
(function(){
'use strict';
const A = window.JDJ_AUTH, $ = id => document.getElementById(id), app = $('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = v => window.JDJ_MINE ? JDJ_MINE.won(v) : (v || 0).toLocaleString() + '만원';
const q = new URLSearchParams(location.search);
const KIND = {trade:'새 실거래', high:'신고가', area:'지역 시세 흐름'};
const mineLink = h => `${JB.SITE}mine/?sd=${encodeURIComponent(h.sd)}&d=${encodeURIComponent([h.code, h.dong, h.jibun, h.apt].join('|'))}&b=${encodeURIComponent(h.band)}`;
const clean = () => history.replaceState(null, '', location.pathname);

function off(){
  app.innerHTML = `<h1>로그인 없이 모두 쓸 수 있어요</h1>
    <p class="lead">집예보는 지금 로그인 없이 시세·차트·미래가치 점수·실거래 목록·맞춤 리포트를 모두 보여 드려요. 내 집은 이 기기에 저장돼요.</p>
    <a class="btn primary" href="${JB.SITE}mine/">내 집 시세 보러 가기</a>`;
}
function intro(msg){
  app.innerHTML = `${msg || ''}<h1>카카오 간편 로그인</h1>
    <p class="lead">로그인하면 휴대폰과 PC 어디서든 같은 내 집 목록을 보고, 실거래 전체와 맞춤 리포트 상세까지 볼 수 있어요.</p>
    <div class="box"><ul class="gets">
      <li><span class="ic">1</span><span><b>실거래 전체 보기</b><small>최근 3년 거래 전부와 그보다 이전 연도별 시세</small></span></li>
      <li><span class="ic">2</span><span><b>내 집·관심 단지 여러 기기에 저장</b><small>휴대폰에서 저장한 집을 PC에서도 그대로</small></span></li>
      <li><span class="ic">3</span><span><b>맞춤 분석 리포트 상세 보기·저장</b><small>대출·필요 현금·월 상환과 추천 이유 전체, 리포트 다시 보기</small></span></li>
      <li><span class="ic">4</span><span><b>관심 단지·청약 알림을 메일로</b><small>관심 목록 단지에 새 거래·신고가가 나오거나 고른 청약 일정이 다가오면 하루 한 번 알려 드려요</small></span></li>
    </ul>
    ${A.btn('카카오 간편 로그인', 'login_page', 'full')}
    <p class="note">집예보가 카카오에서 받는 정보는 <b>카카오 회원번호와 닉네임</b>뿐이에요. 이메일·전화번호는 받지 않아요. <a href="${JB.SITE}privacy/#member">개인정보처리방침</a></p></div>
    <p class="free">로그인하지 않아도 시세·차트·미래가치 점수, 최근 실거래 5건, 이 기기에 내 집 저장, 맞춤 분석 리포트 요약은 지금처럼 그대로 볼 수 있어요.</p>`;
}
async function finishLogin(){
  const code = q.get('code'), state = q.get('state') || '';
  clean();
  app.innerHTML = '<div class="st">카카오 간편 로그인을 마무리하는 중이에요…</div>';
  try {
    const r = await A.finish(code, state);
    app.innerHTML = `<div class="st"><b>${esc(r.nick)} 님, ${r.isNew ? '반가워요' : '다시 오셨네요'}.</b><br>보던 화면으로 돌아가요…</div>`;
    setTimeout(() => location.replace(r.back), 700);
  } catch (e) {
    intro(`<div class="st err" style="margin-bottom:14px">${esc(e.message)}</div>`);
  }
}
function homesHtml(d){
  const list = d.homes || [];
  return `<div class="box"><h2>내 집<small>${list.length}/5</small></h2>${list.length ? list.map(h => `<div class="row"><a href="${esc(mineLink(h))}"><b>${esc(h.apt)} · ${esc(h.band)}</b><small>${esc(h.dong)}${h.bp ? ' · 매수가 ' + esc(won(h.bp)) : ''}</small></a></div>`).join('')
    : '<p class="empty">아직 저장한 집이 없어요. <a href="' + JB.SITE + 'mine/">내 집 시세</a>에서 단지를 고르고 [내 집으로 저장]을 눌러 주세요.</p>'}
    ${list.length ? '<p class="note">내 집을 지우거나 고치려면 <a href="' + JB.SITE + 'mine/">내 집 시세</a> 화면의 내 집 카드에서 [삭제]·[매수가·시기 고치기]를 눌러 주세요.</p>' : ''}</div>`;
}
function favsHtml(d){
  const list = d.favs || [];
  return `<div class="box"><h2>관심 단지<small>${list.length}곳</small></h2>${list.length ? list.map((f, i) => `<div class="row"><a href="${esc(mineLink(f))}"><b>${esc(f.apt)} · ${esc(f.band)}</b><small>${esc(f.dong)}${f.t ? ' · ' + esc(f.t) + ' 저장' : ''}</small></a><button type="button" data-fav="${i}">지우기</button></div>`).join('')
    : '<p class="empty">아직 관심 단지가 없어요. 내 집 시세 화면에서 [☆ 관심 단지로 저장]을 누르면 여기 모여요.</p>'}</div>`;
}
function repsHtml(d){
  const list = d.reports || [];
  return `<div class="box"><h2>저장한 리포트<small>${list.length}/10</small></h2>${list.length ? list.map((r, i) => `<div class="row" style="align-items:flex-start"><a href="${JB.SITE}buy/report/?${esc(r.q)}"><b>${esc(r.title || '맞춤 분석 리포트')}</b><small>${esc(r.t)} 저장 · 누르면 같은 조건으로 다시 열어요</small>
      ${r.picks && r.picks.length ? `<ol class="picks">${r.picks.slice(0, 5).map(p => `<li>${esc(p.apt)} ${esc(p.band)} · ${esc(won(p.P))}${p.fv != null ? ' · 미래가치 ' + p.fv : ''}</li>`).join('')}</ol>` : ''}</a><button type="button" data-rep="${i}">지우기</button></div>`).join('')
    : '<p class="empty">아직 저장한 리포트가 없어요. 맞춤 분석 리포트 화면에서 [내 계정에 리포트 저장]을 눌러 주세요.</p>'}
    <p class="note">리포트에는 지역·보유 기간 같은 조건과 그때 추천 단지 목록만 저장해요. 연소득·보유 현금 같은 금액은 저장하지 않아서, 다른 기기에서 열면 그 기기에 넣은 금액으로 다시 계산해요.</p></div>`;
}
function areasHtml(d){
  const a = d.areas && Array.isArray(d.areas.list) ? d.areas : {list: [], kinds: {}};
  const sh = s => String(s || '').replace(/(특별자치시|특별자치도|통합특별시|특별시|광역시)$/, '');
  const kinds = [a.kinds.notice !== false ? '새 분양 공고' : '', a.kinds.mu !== false ? '무순위·잔여세대 일정' : ''].filter(Boolean).join(' · ');
  return `<div class="box"><h2>관심 지역<small>${a.list.length}곳</small></h2>${a.list.length ? `<p class="empty">${a.list.map(x => esc(sh(x.sd) + ' ' + (x.g ? x.gn : '전체'))).join(' · ')}</p><p class="note">알림 신청: ${esc(kinds || '없음')} · <a href="${JB.SITE}bunyang/#area">분양 화면에서 바꾸기</a></p>`
    : '<p class="empty">관심 지역을 설정하면 새로운 분양 공고, 무순위 청약 일정을 가장 먼저 받아볼 수 있어요. <a href="' + JB.SITE + 'bunyang/#area">관심 지역 설정</a></p>'}</div>`;
}
function alertsHtml(al){
  return `<div class="box"><h2>예전 알림 신청<small>${al.length}개</small></h2>${al.length ? al.map(a => `<div class="row"><span><b>${esc(a.name)} · ${esc(KIND[a.kind] || a.kind)}</b><small>${esc(a.at)} 신청</small></span><button type="button" data-al="${esc(a.id)}">취소</button></div>`).join('')
    : '<p class="empty">예전에 신청한 알림이 없어요.</p>'}
    <p class="note">이제 알림은 관심 목록 단지와 고른 청약 조건으로 받아요. <a href="${JB.SITE}my/alerts/">알림 센터</a>에서 단지별로 켜고 끄고, 메일로 받을 수 있어요. 카카오톡 알림은 준비하고 있어요.</p></div>`;
}
/* v55 예측 맞히기 등급 배지(숨기기를 켰으면 보이지 않음) */
function qzTier(){
  const el = document.getElementById('qzTier'), api = (window.JDJ_AGENTS && JDJ_AGENTS.api) || ''; let s = ''; try { s = (JSON.parse(localStorage.getItem('jdj_auth') || 'null') || {}).s || ''; } catch (e) {}
  if (!el || !api || !s) return;
  fetch(api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'quizMine', s }) }).then(r => r.json()).then(j => {
    if (!j || !j.ok || !j.season || (j.prefs && j.prefs.hide) || !j.season.me.n) return;
    el.innerHTML = `<h2>예측 맞히기 등급<small>${esc(j.season.label)}</small></h2><p class="empty"><b>${esc(j.season.me.t)}</b> · 예측 ${j.season.me.n}번 · 정확도 ${j.season.me.acc}%${(j.grants || []).some(g => g.st === '대기') ? ' · 받을 보상이 있어요' : ''}</p><p class="note"><a href="${JB.SITE}quiz/#predict">예측 맞히기로 가기</a> · 등급 배지는 예측 맞히기 화면에서 숨길 수 있어요.</p>`;
    el.hidden = false;
  }).catch(() => {});
}
async function account(){
  app.innerHTML = '<div class="st">내 계정을 불러오는 중이에요…</div>';
  let st;
  try { st = await A.load(true); } catch (e) { if (!A.user()) return intro(`<div class="st err" style="margin-bottom:14px">${esc(e.message)}</div>`); app.innerHTML = `<div class="st err">${esc(e.message)}</div>`; return; }
  if (!st) return intro();
  const d = st.data, u = A.user();
  app.innerHTML = `<div class="who"><span class="av" aria-hidden="true">${esc((u.nick || '카')[0])}</span><div><b>${esc(u.nick)} 님</b><small>카카오 간편 로그인했어요</small></div></div>
    ${homesHtml(d)}${favsHtml(d)}${repsHtml(d)}${areasHtml(d)}${alertsHtml(st.alerts || [])}
    <div class="box" id="qzTier" hidden></div>
    <div class="box"><h2>로그아웃</h2><p class="empty">이 기기에서만 로그아웃해요. 이 기기에 저장된 내 집 목록은 그대로 남아요.</p><div class="acts" style="margin-top:10px"><button type="button" class="btn ghost" id="outBtn">로그아웃</button></div></div>
    <div class="box del"><h2>탈퇴</h2><p class="empty">탈퇴하면 집예보가 보관한 카카오 회원번호·닉네임과 계정에 저장한 내 집·관심 단지·리포트·알림 신청을 바로 지워요. 지운 뒤에는 되살릴 수 없어요. 이 기기 브라우저에 저장된 내 집 목록은 남아 있고, 브라우저 설정에서 지울 수 있어요.</p>
      <div class="acts" style="margin-top:10px"><button type="button" class="btn warn" id="delBtn">탈퇴하기</button></div><div class="msg" id="delMsg" role="status"></div></div>`;
  app.querySelectorAll('[data-fav]').forEach(b => b.onclick = () => { b.disabled = true; A.removeFav(d.favs[+b.dataset.fav]).then(account).catch(e => { b.textContent = e.message; }); });
  app.querySelectorAll('[data-rep]').forEach(b => b.onclick = () => { b.disabled = true; A.removeReport(d.reports[+b.dataset.rep].id).then(account).catch(e => { b.textContent = e.message; }); });
  app.querySelectorAll('[data-al]').forEach(b => b.onclick = () => { b.disabled = true; A.unsubscribe([b.dataset.al]).then(account).catch(e => { b.textContent = e.message; }); });
  qzTier();
  $('outBtn').onclick = () => { $('outBtn').disabled = true; A.logout().then(() => intro('<div class="st" style="margin-bottom:14px">로그아웃했어요.</div>')); };
  let arm = false;
  $('delBtn').onclick = () => {
    const b = $('delBtn'), m = $('delMsg');
    if (!arm){ arm = true; b.classList.add('armed'); b.textContent = '한 번 더 누르면 탈퇴해요'; setTimeout(() => { if (arm){ arm = false; b.classList.remove('armed'); b.textContent = '탈퇴하기'; } }, 6000); return; }
    b.disabled = true; m.style.color = '#4E5968'; m.textContent = '지우는 중이에요…';
    A.withdraw().then(() => { app.innerHTML = '<div class="st"><b>탈퇴했어요.</b><br>집예보가 보관하던 회원 정보와 계정에 저장한 자료를 모두 지웠어요.<br>로그인 없이 계속 쓸 수 있어요.</div><p style="text-align:center;margin-top:14px"><a class="btn ghost" href="' + JB.SITE + '">계산기 홈으로</a></p>'; })
      .catch(e => { m.style.color = '#C2410C'; m.textContent = e.message; b.disabled = false; });
  };
}
