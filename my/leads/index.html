<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="../../manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">

<link rel="apple-touch-icon" href="../../assets/icons/apple-180.png">
<title>내 상담 신청</title>
<!-- 분양 상담 연결 — 손님이 광고주에게 준 연락처 제공 동의를 보고 거두는 화면(숨김: LEADS_ENABLED false 면 준비 중 · 미리 보기 ?preview=leads) -->
<script>window.JDJ_CONFIG = { tool:'my_leads', GA4_ID:'G-V2VR9VL7EM', CLARITY_ID:'' };</script>
<script src="../../assets/track.js?v=3"></script>
<script src="../../assets/agents.js"></script>
<script src="../../assets/config.js?v=17"></script>
<script src="../../assets/auth.js?v=11"></script>
<script src="../../assets/leads-core.js?v=1"></script>
<script src="../../assets/leads.js?v=1"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/aplus.css?v=50">
<style>
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 40px}
h1{font-size:clamp(24px,6vw,30px);margin:4px 0 6px;letter-spacing:-.6px;word-break:keep-all}
.lead{margin:0 0 14px;font-size:15.5px;color:var(--sub2);line-height:1.6;word-break:keep-all}
.pvbar{background:#111827;color:#fff;font-size:12.5px;text-align:center;padding:5px 8px}.pvbar a{color:#FCD34D}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border-radius:14px;border:1px solid #1D4ED8;background:#1D4ED8;color:#fff;font:inherit;font-size:16px;font-weight:800;cursor:pointer;margin-top:10px;text-decoration:none}
.btn.s{background:#fff;color:#111827;border-color:#D1D5DB}.btn[disabled]{opacity:.6;cursor:not-allowed}
.soonbox{max-width:560px;margin:60px auto;text-align:center;line-height:1.7;color:var(--sub)}
.msg{font-size:14px;margin:8px 0 0;color:#B42318}.msg.ok{color:#0E7A4F}
.it{border:1px solid var(--line);border-radius:18px;padding:14px 16px;background:#fff;margin:0 0 10px}
.it h2{font-size:17px;margin:0 0 4px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;word-break:keep-all}
.it .lchip{font-size:12.5px;font-weight:800;border-radius:999px;padding:2px 9px;background:#F3F4F6;color:#374151}
.it .lchip.ok{background:#E9F6EF;color:#0E7A4F}.it .lchip.ask{background:#FFF6E5;color:#A15C07}.it .lchip.gone{background:#FDECEA;color:#B42318}
.it dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0 0;font-size:14.5px}.it dt{color:var(--sub2)}.it dd{margin:0;word-break:keep-all}
.it .btn{width:auto;display:inline-flex;min-height:44px;padding:0 16px;font-size:14.5px;background:#fff;color:#B42318;border-color:#F3C7C2}
.rule{display:grid;gap:8px;margin:0 0 16px}.rule div{border-radius:14px;padding:10px 14px;background:#F9FAFB;font-size:14px;line-height:1.55;color:var(--sub);word-break:keep-all}.rule b{display:block;color:var(--text)}
.empty{font-size:14.5px;color:var(--sub2);background:#F9FAFB;border-radius:12px;padding:14px}
</style>
<script src="../../assets/back.js?v=7" defer></script>
</head>
<body>
<header class="top">
  <a class="brand" href="../../" aria-label="집예보 홈"><svg class="bi" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#4338CA"/><path d="M29 47 V78 H71 V47 Z" fill="#FFFFFF"/><path d="M20 51 L50 26 L80 51" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="50" cy="59" r="6" fill="#4338CA"/><path d="M46.5 62 L44 74 H56 L53.5 62 Z" fill="#4338CA"/><circle cx="76" cy="24" r="5" fill="#5EEAD4"/></svg><span data-site-name>집예보</span></a>
  <div class="badge plain">내 상담 신청</div>
</header>
<div id="pv"></div>
<main class="wrap">
  <div class="soonbox" id="soon"><h1>준비 중이에요</h1><p>곧 이 화면에서 분양 현장에 보낸 상담 신청과 연락처 제공 동의를 보고 거둘 수 있어요.</p></div>
  <div id="page" hidden>
    <h1>내 상담 신청</h1>
    <p class="lead">분양 현장 광고주에게 연락처를 준 기록이에요. 무엇을 누구에게 줬는지 보고, 필요 없으면 바로 거둘 수 있어요.</p>
    <div class="rule">
      <div><b>한 곳에만 가요</b>신청한 현장의 광고주 한 곳에만 가고, 다른 회사에는 가지 않아요.</div>
      <div><b>거두면 바로 지워요</b>[동의 거두기]를 누르면 집예보에서 연락처를 지우고, 광고주에게도 지워 달라고 바로 알려요.</div>
    </div>
    <div id="acct"></div>
    <div id="list"></div>
  </div>
</main>
<footer class="foot">★ <span data-site-name>집예보</span> · <a href="../../">홈</a> · <a href="../../privacy/#lead">개인정보처리방침</a></footer>
<script>
(function () {
  'use strict';
  var L = window.JDJ_LEADS, C = window.JDJ_LDCORE, $ = function (id) { return document.getElementById(id); };
  var on = !!(L && L.on()); $('soon').hidden = on; $('page').hidden = !on; if (!on) return;
  var esc = L.esc, demo = L.demo(), F = {}; C.FIELDS.forEach(function (f) { F[f.k] = f.t.replace(/\(.*\)$/, ''); });
  if (demo) $('pv').innerHTML = '<div class="pvbar">미리 보기 · 예시 기록이에요 · 아무것도 보내지 않아요 · <a href="?preview=off">끄기</a></div>';
  var DATA = null;
  function get() {
    if (demo) return Promise.resolve({ list: [
      { id: 'L1', site: '예시 마곡 리버뷰(가상 현장)', co: '예시 시행사(가상)', day: '2026-11-27', st: C.ST.ok, grade: 'B', fields: ['time', 'budget'], cv: C.CONSENT_V, until: '2027-05-29' },
      { id: 'L2', site: '예시 하남 그린시티(가상 현장)', co: '예시 분양대행사(가상)', day: '2026-11-20', st: C.ST.ask, ask: true, grade: 'A', fields: ['time', 'noHome', 'memo'], cv: C.CONSENT_V, until: '2027-05-22' },
      { id: 'L3', site: '예시 역세권 소형 오피스텔(가상 현장)', co: '예시 시행사(가상)', day: '2026-11-02', st: C.ST.gone, gone: true, grade: 'C', fields: [], cv: C.CONSENT_V, until: '' } ] });
    return L.post({ action: 'leadMine' });
  }
  function paint() {
    var A = window.JDJ_AUTH;
    if (!demo && !(A && A.user())) { $('acct').innerHTML = '<p class="empty">카카오 간편 로그인하면 내 상담 신청이 보여요.</p>' + (A && A.btn ? A.btn('카카오 간편 로그인', location.pathname) : ''); return; }
    get().then(function (j) {
      DATA = j.list || [];
      if (!DATA.length) { $('list').innerHTML = '<p class="empty">아직 보낸 상담 신청이 없어요.</p>'; return; }
      $('list').innerHTML = DATA.map(function (x) {
        var cls = x.gone ? 'gone' : x.ask ? 'ask' : 'ok';
        return '<div class="it" data-id="' + esc(x.id) + '"><h2>' + esc(x.site) + ' <span class="lchip ' + cls + '">' + esc(x.gone ? '동의 거둠' : x.ask ? '확인 여쭤보는 중' : '광고주에게 보냄') + '</span></h2>'
          + '<dl><dt>받은 곳</dt><dd>' + esc(x.co) + '</dd><dt>보낸 날</dt><dd>' + esc(x.day) + '</dd>'
          + '<dt>보낸 것</dt><dd>' + esc(['이름', '휴대폰 번호', '상담 준비 정도(' + x.grade + '등급)'].concat((x.fields || []).map(function (k) { return F[k] || k; })).join(' · ')) + '</dd>'
          + '<dt>보관</dt><dd>' + esc(x.gone ? '지웠어요' : (x.until ? x.until + '까지(그 전에 상담이 끝나면 바로 지워요)' : '')) + '</dd>'
          + '<dt>동의 문구 판</dt><dd>' + esc(x.cv) + '</dd></dl>'
          + (x.ask ? '<p class="msg" style="color:#A15C07">광고주가 연락이 닿지 않는다고 알려 와서 알림톡·문자로 신청하셨는지 여쭤봤어요. 받은 링크에서 답해 주세요.</p>' : '')
          + (x.gone ? '' : '<button type="button" class="btn" data-off>동의 거두기</button>') + '<p class="msg" role="status"></p></div>';
      }).join('');
    }).catch(function (e) { $('list').innerHTML = '<p class="empty">' + esc(e.message) + '</p>'; });
  }
  $('list').onclick = function (e) {
    var b = e.target.closest('[data-off]'); if (!b) return;
    var card = b.closest('.it'), id = card.getAttribute('data-id');
    if (!confirm('이 현장 광고주에게 준 연락처 제공 동의를 거둘까요? 집예보에서 바로 지우고, 광고주에게도 지워 달라고 알려요.')) return;
    if (demo) { DATA.forEach(function (x) { if (x.id === id) { x.gone = true; x.ask = false; } }); card.querySelector('.msg').textContent = '미리 보기예요. 실제로는 바로 지워져요.'; b.remove(); return; }
    b.disabled = true;
    L.post({ action: 'leadWithdraw', id: id }).then(function () { paint(); }).catch(function (er) { b.disabled = false; card.querySelector('.msg').textContent = er.message; });
  };
  paint();
})();
</script>
</body>
</html>
