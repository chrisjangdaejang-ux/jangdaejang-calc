<style>
[hidden]{display:none!important}
.wrap{max-width:900px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:clamp(24px,6vw,32px);margin:4px 0 6px;letter-spacing:-.5px;word-break:keep-all}
.lead{margin:0 0 14px;font-size:15.5px;color:var(--sub2);line-height:1.6}
.soon{margin:18px 0;padding:28px 18px;border-radius:18px;border:1px dashed var(--line);text-align:center;line-height:1.7}
.soon h1{font-size:24px;margin:0 0 6px}.soon p{margin:0 0 14px;color:var(--sub);font-size:15.5px}
.soon a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 16px;border-radius:12px;background:var(--blue-l);color:var(--blue);font-weight:800;text-decoration:none}
.pv{display:inline-block;font-size:12.5px;font-weight:800;border-radius:999px;padding:3px 10px;background:#FFF4E0;color:#9A5B00;margin:0 0 6px}
.card{border:1px solid var(--line);border-radius:18px;padding:16px;background:#fff;margin:0 0 14px;min-width:0;scroll-margin-top:84px}
.card h2{font-size:18.5px;margin:0 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>p{margin:0 0 8px;font-size:14.5px;color:var(--sub2);line-height:1.6}
.state{border-radius:16px;padding:14px 16px;margin:0 0 14px;line-height:1.6;font-size:15px}
.state.ok{background:#E7F6EE;border:1px solid #B5E2C8}.state.wait{background:#FFF4E0;border:1px solid #F3D9A4}.state.bad{background:#FDECEC;border:1px solid #F5C2C0}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media(max-width:620px){.tiles{grid-template-columns:1fr 1fr}}
.tile{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--gray2);min-width:0}
.tile .k{font-size:13px;color:var(--sub2);font-weight:700}.tile .v{font-size:24px;font-weight:900;margin-top:2px}.tile .d{font-size:12.5px;color:var(--sub2)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.acts .btn{min-height:44px}
.inv{display:grid;grid-template-columns:1fr 150px;gap:14px;align-items:center}
@media(max-width:560px){.inv{grid-template-columns:1fr}}
.inv input{width:100%;min-height:46px;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:12px;padding:0 10px;background:var(--gray2)}
.qr{width:150px;height:150px;border:1px solid var(--line);border-radius:12px;padding:6px;background:#fff}
.qr svg{width:100%;height:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.chips button{font:inherit;font-size:14.5px;font-weight:700;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--sub);cursor:pointer}
.chips button.on{background:var(--text);border-color:var(--text);color:#fff}
textarea{width:100%;min-height:120px;font:inherit;font-size:16px;line-height:1.6;border:1px solid var(--line);border-radius:12px;padding:10px 12px;resize:vertical}
.cnt{font-size:13px;color:var(--sub2);text-align:right;margin:2px 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{min-width:0}
select,.f input[type=text],.f input[type=tel],.f input[type=email]{min-height:46px;font:inherit;font-size:15.5px;border:1px solid var(--line);border-radius:12px;padding:0 10px;background:#fff;max-width:100%}
.f{display:grid;gap:10px}.f label{font-size:14px;font-weight:800;color:var(--sub)}
.f input{width:100%}
.dongs{display:grid;gap:8px}
.dg{border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.dg b{font-size:16px}.dg .s{font-size:13px;color:var(--sub2)}.dg .sp{flex:1}
.dg .btn{min-height:44px;font-size:14px;padding:0 12px}
.post{border-top:1px solid var(--line2);padding:10px 0}
.post:first-of-type{border-top:0}
.post .hd{font-size:13px;color:var(--sub2);display:flex;gap:8px;flex-wrap:wrap}
.post .tx{margin:4px 0;font-size:15px;line-height:1.6;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:12.5px;font-weight:800;border-radius:999px;padding:1px 8px;background:var(--gray);color:var(--sub2)}
.tag.on{background:#E7F6EE;color:#0B5A3B}.tag.hold{background:#FFF4E0;color:#9A5B00}.tag.bad{background:#FDECEC;color:#B42318}
.pay{font-size:15.5px;line-height:1.7}
.paybig{font-size:clamp(18px,4.6vw,21px);font-weight:900;margin:6px 0;word-break:keep-all}
.near{display:grid;gap:6px;margin-top:8px}
</style>

<script>
(function () {
  'use strict';
  var DP = window.JDJ_DP, C = window.JDJ_DPCORE, A = window.JDJ_AUTH, F = window.JDJ_SAVEFB, app = document.getElementById('app');
  var esc = DP ? DP.esc : function (s) { return String(s); };
  var SITE = (DP && DP.site()) || '';
  document.title = '내 파트너 화면' + (SITE ? ' — ' + SITE : '');
  function soon() { app.innerHTML = '<div class="soon"><h1>준비 중이에요</h1><p>이 화면은 아직 열지 않았어요. 조금만 기다려 주세요.</p><a href="../../">홈으로 가기</a></div>'; }
  if (!DP || !DP.enabled()) return soon();
  var R = C.DP_RULE, won = function (n) { return Number(n).toLocaleString('ko-KR') + '원'; };
  var M = null, topic = '', photo = '';
  var md = function (y) { if (!y) return ''; var d = String(y).split('-'); return (+d[1]) + '월 ' + (+d[2]) + '일'; };
  var PAYNAME = { '시범': '시범 파트너 · 무료', '카드대기': '카드 등록 전', '정상': '자동 결제 중', '재시도': '결제 다시 시도 중', '실패': '결제 실패 · 노출 멈춤', '해지예정': '해지 예정' };

  function stateHtml(me) {
    if (me.st === '검토대기') return '<div class="state wait"><b>확인 중이에요.</b> 2영업일 안에 결과를 메일로 알려 드려요. 그동안 글은 쓸 수 없어요.</div>';
    if (me.st === '노출중지') return '<div class="state bad"><b>' + esc(md(me.stopUntil)) + '까지 노출이 멈춰 있어요.</b> 자리는 그대로예요. <a href="' + DP.link('dongne/terms/') + '#sanction">제재 기준 보기</a></div>';
    if (me.pay === '카드대기') return '<div class="state wait"><b>카드 등록을 마쳐야 보여요.</b> 아래 [카드 등록하기]를 눌러 주세요(0원 인증, 첫 달 무료).</div>';
    if (me.pay === '재시도') return '<div class="state bad"><b>결제가 되지 않았어요.</b> ' + R.retryDays + '일 동안 날마다 다시 시도해요. 카드를 바꾸려면 [카드 다시 등록하기]를 눌러 주세요.</div>';
    if (me.pay === '실패') return '<div class="state bad"><b>결제가 되지 않아 노출을 멈췄어요.</b> 카드를 다시 등록하면 바로 다시 보여요. 자리는 ' + esc(md(C.dpAddDays(me.failAt, R.retryDays + R.holdDays))) + '까지 지켜 드려요.</div>';
    if (me.pay === '해지예정') return '<div class="state wait"><b>' + esc(md(me.endAt)) + '까지 보이고 그 뒤 해지돼요.</b> 마음이 바뀌면 아래 [해지 취소]를 눌러 주세요.</div>';
    if (me.listing) return '<div class="state ok"><b>' + esc(me.office) + ' · 일반 등록</b><br>브리핑의 \'이 동네 중개사\' 목록에 보여요.</div>';
    return '<div class="state ok"><b>' + esc(me.office) + ' · 동네 파트너' + (me.foundOn ? ' · 창립 파트너' : '') + '</b><br>다음 아침 브리핑(' + esc(md(M.nextBrief)) + ')에 실리려면 오늘 밤 10시 전에 써 주세요.' + (me.idle ? ' 4주 넘게 글이 없어서 지금은 이름 카드만 뒤쪽에 보여요.' : '') + '</div>';
  }
  function offerHtml(me) {
    if (!(me.offers || []).length) return '';
    return '<section class="card" id="offer" style="border:2px solid #B8942A;background:#FBF8EF" aria-labelledby="hof"><h2 id="hof">대표 파트너 자리가 났어요</h2>' + me.offers.map(function (o) {
      return '<p><b>' + esc(o.dn) + '</b> · ' + esc(o.until) + '까지 받을 수 있어요.' + (me.listing ? ' 받으면 일반 등록이 대표 파트너로 바뀌어요(요금은 대표 파트너 요금, 다음 결제부터).' : '') + '</p><div class="acts"><button type="button" class="btn primary" data-claim="' + esc(o.k) + '">자리 받기</button><button type="button" class="btn" data-pass="' + esc(o.k) + '">다음 분께 넘기기</button></div>';
    }).join('') + '</section>';
  }
  function plusHtml(me) {
    if (me.listing) return '';
    if (!me.plusOn) return me.bundle ? '' : '<section class="card"><h2>중개사 플러스</h2><p>이 파트너에는 중개사 플러스가 들어 있지 않아요(포함 기간이 지난 뒤 가입). 필요하면 모닝 브리핑에서 따로 쓸 수 있어요. <a href="../../brief/subscribe/">모닝 브리핑 보기</a></p></section>';
    return '<section class="card" aria-labelledby="hplus"><h2 id="hplus">중개사 플러스 포함 <span class="tag on">쓰는 중</span></h2><p>월 ' + won(me.price && me.price.base || R.base) + '에 우리 동네 구독자 홍보 + 중개사 플러스 도구 전부. 파트너를 이어 가는 동안 계속 써요' + (me.plusUntil ? '(' + esc(md(me.plusUntil)) + '까지)' : '') + '.</p>'
      + '<div class="acts"><a class="btn" href="../../brief/manage/">모닝 브리핑 지역·손님 설정</a><a class="btn" href="../../agent/listing/">매물 설명서</a><a class="btn" href="../../agent/content/">블로그·인스타 글</a></div></section>';
  }
  function listingHtml(me) {
    return '<section class="card" aria-labelledby="hl"><h2 id="hl">일반 등록</h2><p>브리핑의 \'이 동네 중개사\' 목록에 사무소 이름과 [사무소 보기]가 보여요. 순서는 날마다 바뀌어요. 오늘의 한마디와 중개사 플러스는 대표 파트너에만 있어요.</p>'
      + '<p>사무소 동의 대표 파트너 자리가 나면 가입 순서대로 먼저 알려 드려요(48시간 안에 받기).</p><div class="acts"><a class="btn" href="' + DP.link('dongne/office/?id=' + encodeURIComponent(me.id)) + '">내 사무소 보기 화면</a></div></section>';
  }
  function tiles(s) {
    var t = function (k, a, b) { return '<div class="tile"><div class="k">' + k + '</div><div class="v">' + Number(a).toLocaleString('ko-KR') + '</div><div class="d">전체 ' + Number(b).toLocaleString('ko-KR') + '</div></div>'; };
    return '<section class="card" aria-labelledby="h1s"><h2 id="h1s">최근 30일 성과</h2><div class="tiles">' + t('보인 수', s.imp30, s.imp) + t('연락 누름', s.click30, s.click) + t('도움돼요', s.help30, s.help) + t('초대로 가입', s.sub30, s.sub) + '</div>'
      + '<p style="margin-top:8px">보인 수는 브리핑 메일·웹에 내 카드가 보인 횟수예요. 연락 누름은 [전화하기]를 누른 수예요.</p></section>';
  }
  function payHtml(me, cfg) {
    var pr = me.price, h = '<section class="card" aria-labelledby="hpay"><h2 id="hpay">결제</h2><div class="pay">';
    h += '<b>' + esc(PAYNAME[me.pay] || me.pay) + '</b> · ' + (me.plan === 'y' ? '연간' : '월간') + ' · ' + me.keys.length + '개 동';
    if (me.pay === '시범') h += '<br>지금은 시범 운영이라 카드 등록 없이 무료예요. 정식 결제가 열리면 미리 알려 드리고, 카드를 등록하고 따로 동의하신 경우에만 결제돼요.';
    else {
      h += '<br>' + (me.plan === 'y' ? '연 ' : '월 ') + won(pr.total) + (pr.extraN ? ' (기본 ' + won(pr.base) + ' + 추가 동 ' + pr.extraN + '곳 × ' + won(pr.extraEach) + (me.foundOn ? ', 창립 파트너 20% 할인' : '') + ')' : '') + (me.card ? ' · ' + esc(me.card) : '');
      if (me.payText) h += '<p class="paybig">' + esc(me.payText) + '</p>';
    }
    h += '</div><div class="acts">';
    if (cfg.billing && (me.pay === '카드대기' || me.pay === '시범')) h += '<button type="button" class="btn primary" id="cardGo">카드 등록하기</button>';
    if (cfg.billing && (me.pay === '재시도' || me.pay === '실패' || me.pay === '정상')) h += '<button type="button" class="btn" id="cardGo">카드 다시 등록하기</button>';
    if (cfg.billing && me.pay !== '해지예정') h += '<button type="button" class="btn" id="planGo">' + (me.plan === 'y' ? '월간으로 바꾸기' : '연간으로 바꾸기(2개월 할인)') + '</button>';
    h += me.pay === '해지예정' ? '<button type="button" class="btn" id="undoGo">해지 취소</button>' : '<button type="button" class="btn" id="byeGo">해지하기</button>';
    return h + '</div><p style="margin-top:8px">해지는 버튼 한 번이면 바로 돼요. 해지해도 그달 말까지는 지금처럼 보여요.' + (me.founding ? ' 창립 파트너 혜택은 해지하거나 결제가 끊긴 지 30일이 지나면 사라지고 다시 가입해도 돌려받지 못해요.' : '') + '</p><div id="payMsg"></div></section>';
  }
  function inviteHtml(me) {
    var url = DP.inviteUrl(me.code, me.g, me.dn);
    return '<section class="card" aria-labelledby="hinv"><h2 id="hinv">내 초대 링크 · QR</h2><p>손님께 보내면 \'' + esc(me.office) + '가 보내 드리는 동네 브리핑\'으로 무료 체험을 시작해요. 가입하면 내 성과에 \'초대로 가입\'으로 쌓여요.</p>'
      + '<div class="inv"><div><input type="text" id="invUrl" readonly value="' + esc(url) + '" aria-label="초대 링크"><div class="acts"><button type="button" class="btn primary" id="copy">링크 복사</button></div></div><div class="qr" aria-label="초대 QR">' + DP.qrSvg(url) + '</div></div></section>';
  }
  function writeHtml(me) {
    var can = me.st === '승인' && me.pay !== '카드대기' && me.pay !== '실패';
    return '<section class="card" id="write" aria-labelledby="hw"><h2 id="hw">오늘의 우리 동네 한마디</h2>'
      + (can ? '' : '<p>승인되고 노출 중일 때 쓸 수 있어요.</p>')
      + '<p>하루 한 글, 밤 10시 전에 쓰면 다음 날 아침 브리핑에 실려요. 동마다 하루 한 글이 크게 소개되는데, 최근 2주 동안 글을 쓴 날이 많을수록 자주 소개되고 다른 날에는 작은 카드에 내 글 첫 줄이 보여요.</p>'
      + '<div class="chips" role="group" aria-label="주제">' + C.DP_TOPICS.map(function (t) { return '<button type="button" data-tp="' + t[0] + '">' + esc(t[1]) + '</button>'; }).join('') + '</div>'
      + '<textarea id="txt" maxlength="' + R.textMax + '" placeholder="예: 오늘 개포동은 전세 문의가 많았어요. 학기 시작 전에 이사하려는 가족이 늘었어요."' + (can ? '' : ' disabled') + '></textarea><div class="cnt"><span id="cnt">0</span> / ' + R.textMax + '자</div>'
      + '<div class="row"><select id="wkey" aria-label="어느 동 소식인지">' + me.keys.map(function (k) { return '<option value="' + esc(k.k) + '">' + esc(k.dn) + '</option>'; }).join('') + '</select>'
      + '<label class="btn" style="min-height:46px;display:inline-flex;align-items:center">사진 1장(선택)<input type="file" id="wph" accept="image/*" hidden></label><span id="phn" class="cnt" style="margin:0"></span></div>'
      + '<p style="font-size:13.5px;color:var(--sub2);margin:8px 0">가격 예측·담합·매물 홍보·전화번호·링크·욕설·비방은 올라가지 않아요. 사진은 확인 뒤 보여요.</p>'
      + '<button type="button" class="btn primary" id="wgo" style="width:100%;min-height:52px"' + (can ? '' : ' disabled') + '>올리기</button><div id="wmsg"></div></section>';
  }
  function postsHtml(list) {
    if (!list.length) return '';
    var tag = function (p) { return p.st === '공개' ? '<span class="tag on">공개</span>' : p.st === '검토대기' ? '<span class="tag hold">확인 중</span>' : '<span class="tag bad">' + esc(p.st) + '</span>'; };
    return '<section class="card" aria-labelledby="hp"><h2 id="hp">내가 쓴 글</h2>' + list.map(function (p) {
      return '<div class="post"><div class="hd">' + tag(p) + '<span>' + esc(p.tn) + '</span><span>' + esc(C.dpSplit(p.key).dn) + '</span><span>' + esc(md(p.day)) + ' 아침 브리핑</span><span>도움돼요 ' + p.help + '</span>' + (p.imgSt ? '<span>사진: ' + esc(p.imgSt) + '</span>' : '') + '</div>'
        + '<p class="tx">' + esc(p.text) + '</p>' + (p.why ? '<p class="hd">' + esc(p.why) + '</p>' : '') + '<button type="button" class="btn" style="min-height:44px" data-del="' + esc(p.id) + '">지우기</button></div>';
    }).join('') + '</section>';
  }
  function dongsHtml(me, cfg) {
    var cap = cfg.billing ? R.max : R.incl;
    return '<section class="card" aria-labelledby="hd"><h2 id="hd">내 동 <span class="tag">' + me.keys.length + ' / ' + cap + '</span></h2>'
      + '<p>' + (me.listing ? '일반 등록은 자리 제한이 없어요. 가까운 동을 더하거나 바꿀 수 있어요(같은 자리는 30일에 한 번).' : '대표 파트너는 한 동에 ' + R.slots + '자리예요. 사무소 동 말고는 다른 가까운 동으로 바꿀 수 있어요(같은 자리는 30일에 한 번). 비운 자리는 그 동 일반 등록 회원과 대기 순서대로 48시간 받기 제안이 가요.') + '</p><div class="dongs">'
      + me.keys.map(function (k) {
        return '<div class="dg"><b>' + esc(k.dn) + '</b><span class="s">' + (k.office ? '사무소 동 · ' : '') + (me.listing ? '일반 등록' : '자리 ' + k.used + '/' + (k.max || R.slots)) + (k.swap && !k.swap.ok ? ' · ' + k.swap.wait + '일 뒤 바꾸기 가능' : '') + '</span><span class="sp"></span>'
          + (k.office ? '' : '<button type="button" class="btn" data-swap="' + esc(k.k) + '"' + (k.swap && !k.swap.ok ? ' disabled' : '') + '>다른 동으로 바꾸기</button><button type="button" class="btn" data-drop="' + esc(k.k) + '">빼기</button>') + '</div>';
      }).join('') + '</div>'
      + (me.waits.length ? '<p style="margin-top:8px">대기 중: ' + me.waits.map(function (k) { return esc(C.dpSplit(k).dn); }).join(', ') + '</p>' : '')
      + '<div class="acts"><button type="button" class="btn" id="nearGo">가까운 동 보기·더하기·대기</button></div><div id="nearBox"></div><div id="dmsg"></div></section>';
  }
  function profileHtml(me) {
    return '<section class="card" aria-labelledby="hpf"><h2 id="hpf">내 정보</h2>'
      + '<p>브리핑 카드에는 사무소 이름·소재지·연락처·등록번호·성명이 함께 보여요(공인중개사법).</p><div style="background:var(--gray2);border-radius:14px;padding:4px 12px;margin:0 0 10px">' + DP.cardHtml(me, { nocall: true }) + '</div>'
      + '<div class="f"><div><label for="pIntro">한 줄 소개(40자)</label><input type="text" id="pIntro" maxlength="40" value="' + esc(me.intro) + '"></div>'
      + '<div><label for="pTel">사무소 전화번호</label><input type="tel" id="pTel" maxlength="20" value="' + esc(me.tel) + '"></div>'
      + '<div><label for="pMail">알림 받을 이메일</label><input type="email" id="pMail" maxlength="80" value="' + esc(me.mail) + '"></div>'
      + '<button type="button" class="btn primary" id="pSave">내 정보 저장</button></div>'
      + '<details style="margin-top:12px"><summary style="min-height:44px;display:flex;align-items:center;font-weight:800;cursor:pointer">사무소 주소 바꾸기</summary>'
      + '<p style="font-size:14px;color:var(--sub2)">사무소를 옮겼다면 새 주소를 적고 새 동을 골라 주세요. 등록관청에 이전 신고를 하셨는지 운영자가 확인해요.</p>'
      + '<div class="f"><input type="text" id="mAddr" maxlength="120" placeholder="새 사무소 주소" aria-label="새 사무소 주소"><div class="row"><select id="mSg" aria-label="시·군·구"></select><select id="mDn" aria-label="동"></select></div><button type="button" class="btn" id="mGo">사무소 주소 바꾸기</button></div></details></section>';
  }

  function draw() {
    var me = M.me, cfg = M.cfg;
    app.innerHTML = (cfg.preview ? '<span class="pv">운영자 미리 보기</span>' : '') + '<h1>' + esc(me.office) + '</h1><p class="lead">' + esc(me.dn) + ' · ' + esc(PAYNAME[me.pay] || '') + (me.foundOn ? ' · 창립 파트너' : '') + '</p>'
      + stateHtml(me) + offerHtml(me) + plusHtml(me) + tiles(M.stats) + (me.listing ? listingHtml(me) : writeHtml(me) + postsHtml(M.posts)) + inviteHtml(me) + dongsHtml(me, cfg) + payHtml(me, cfg) + profileHtml(me);
    bind();
    if (location.hash === '#write') { var w = document.getElementById('write'); if (w) w.scrollIntoView(); }
  }
  function reload() { return DP.post({ action: 'dpMine' }).then(function (m) { M = m; if (!m.me) { location.href = DP.link('dongne/'); return; } draw(); }); }
  function act(btn, body, okMsg, after) {
    F.busy(btn);
    return DP.post(body).then(function (j) { F.ok(btn, typeof okMsg === 'function' ? okMsg(j) : okMsg); setTimeout(reload, 1400); return j; }).catch(function (e) { F.err(btn, e.message); });
  }
  function bind() {
    var me = M.me;
    if (document.getElementById('wgo')) (function () {
    document.querySelectorAll('[data-tp]').forEach(function (b) { b.onclick = function () { topic = b.getAttribute('data-tp'); document.querySelectorAll('[data-tp]').forEach(function (x) { x.classList.toggle('on', x === b); }); }; });
    var tx = document.getElementById('txt'); tx.oninput = function () { document.getElementById('cnt').textContent = tx.value.length; };
    document.getElementById('wph').onchange = function () { var f = this.files && this.files[0]; DP.shrink(f).then(function (d) { photo = d; document.getElementById('phn').textContent = d ? '사진 1장 골랐어요' : ''; }).catch(function (e) { photo = ''; document.getElementById('phn').textContent = e.message; }); };
    var wgo = document.getElementById('wgo');
    wgo.onclick = function () {
      if (!topic) return F.err(wgo, '주제를 먼저 골라 주세요.', { msg: 'wmsg' });
      if (tx.value.trim().length < 10) return F.err(wgo, '10글자 이상 적어 주세요.', { msg: 'wmsg' });
      F.busy(wgo, '올리는 중…');
      DP.post({ action: 'dpWrite', topic: topic, text: tx.value, key: document.getElementById('wkey').value, photo: photo }).then(function (j) {
        F.ok(wgo, j.held ? '확인 뒤 올라가요. 보통 하루 안에 확인해요.' : md(j.day) + ' 아침 브리핑에 실려요.' + (j.photoWait ? ' 사진은 확인 뒤 보여요.' : ''), { msg: 'wmsg' }); tx.value = ''; photo = ''; setTimeout(reload, 1800);
      }).catch(function (e) { F.err(wgo, e.message, { msg: 'wmsg' }); });
    };
    })();
    document.querySelectorAll('[data-del]').forEach(function (b) { b.onclick = function () { act(b, { action: 'dpPostDel', id: b.getAttribute('data-del') }, '지웠어요'); }; });
    var cp = document.getElementById('copy'); cp.onclick = function () { var i = document.getElementById('invUrl'); (navigator.clipboard ? navigator.clipboard.writeText(i.value) : Promise.reject()).then(function () { F.ok(cp, '복사했어요'); }, function () { i.select(); document.execCommand && document.execCommand('copy'); F.ok(cp, '복사했어요'); }); };
    document.querySelectorAll('[data-drop]').forEach(function (b) { b.onclick = function () { act(b, { action: 'dpProfile', drop: b.getAttribute('data-drop') }, '뺐어요. 대기 1번에게 넘어가요.'); }; });
    document.querySelectorAll('[data-swap]').forEach(function (b) { b.onclick = function () { showNear(b.getAttribute('data-swap')); }; });
    document.getElementById('nearGo').onclick = function () { showNear(''); };
    var pS = document.getElementById('pSave'); pS.onclick = function () { act(pS, { action: 'dpProfile', intro: document.getElementById('pIntro').value, tel: document.getElementById('pTel').value, mail: document.getElementById('pMail').value }, '저장했어요'); };
    var by = document.getElementById('byeGo'); if (by) by.onclick = function () { act(by, { action: 'dpCancel' }, function (j) { return j.now ? '해지했어요.' : md(j.endAt) + '까지 보이고 해지돼요.'; }); };
    var ud = document.getElementById('undoGo'); if (ud) ud.onclick = function () { act(ud, { action: 'dpCancel', undo: true }, '해지를 취소했어요'); };
    var pg = document.getElementById('planGo'); if (pg) pg.onclick = function () { act(pg, { action: 'dpPlan', plan: me.plan === 'y' ? 'm' : 'y' }, function (j) { return '다음 결제일' + (j.from ? '(' + md(j.from) + ')' : '') + '부터 바뀌어요'; }); };
    var cg = document.getElementById('cardGo'); if (cg) cg.onclick = function () {
      F.busy(cg, '여는 중…');
      (me.ck ? Promise.resolve({ ck: me.ck }) : DP.post({ action: 'dpBillingIssue', start: true })).then(function (j) { return DP.cardAuth(j.ck, M.cfg.clientKey, 'dongne/my/'); }).catch(function (e) { F.err(cg, e.message); });
    };
    document.querySelectorAll('[data-claim]').forEach(function (b) { b.onclick = function () { act(b, { action: 'dpClaim', key: b.getAttribute('data-claim') }, function (j) { return j.wasListing ? '대표 파트너가 됐어요. 내일 아침부터 소개돼요.' : '자리를 받았어요. 내일 아침부터 보여요.'; }); }; });
    document.querySelectorAll('[data-pass]').forEach(function (b) { b.onclick = function () { act(b, { action: 'dpClaim', key: b.getAttribute('data-pass'), no: true }, '다음 분께 넘겼어요'); }; });
    moveBind();
  }
  function showNear(swapFrom) {
    var me = M.me, box = document.getElementById('nearBox'), key = C.dpKey(me.g, me.dn);
    box.innerHTML = '<p class="lead">가까운 동을 찾고 있어요…</p>';
    DP.near(key).then(function (r) {
      var keys = r.list.map(function (x) { return x.key; });
      return DP.post({ action: 'dpSlots', keys: keys }).then(function (j) {
        var used = {}; Object.keys(j.slots || {}).forEach(function (k) { used[k] = j.slots[k].used; });
        var mine = me.keys.map(function (k) { return k.k; }), cap = M.cfg.billing ? R.max : R.incl, room = me.keys.length < cap;
        box.innerHTML = DP.miniMap(key, r.rows, r.list, mine, used) + (swapFrom ? '<p><b>' + esc(C.dpSplit(swapFrom).dn) + '</b> 대신 받을 동을 골라 주세요.</p>' : '') + '<div class="near">' + r.list.filter(function (x) { return mine.indexOf(x.key) < 0; }).map(function (x) {
          var u = used[x.key] || 0, mx = (j.slots[x.key] && j.slots[x.key].max) || C.dpSlotsOf(x.key), full = !me.listing && u >= mx, dn = C.dpSplit(x.key).dn;
          var btn = full ? '<button type="button" class="btn" data-wait="' + esc(x.key) + '">대기 걸기</button>' : swapFrom ? '<button type="button" class="btn primary" data-to="' + esc(x.key) + '">이 동으로 바꾸기</button>' : room ? '<button type="button" class="btn primary" data-add="' + esc(x.key) + '">더하기</button>' : '';
          return '<div class="dg"><b>' + esc(dn) + '</b><span class="s">' + x.km + 'km · ' + (me.listing ? '일반 등록' : full ? '자리 마감' : '남은 자리 ' + (mx - u)) + '</span><span class="sp"></span>' + btn + '</div>';
        }).join('') + '</div>' + (!room && !swapFrom ? '<p style="font-size:13.5px;color:var(--sub2)">' + (M.cfg.billing ? '동은 ' + R.max + '개까지예요.' : '시범 운영 중에는 ' + R.incl + '개 동까지예요. 동 추가(월 ' + won(R.extra) + ')는 정식 결제가 열리면 할 수 있어요.') + '</p>' : '');
        box.querySelectorAll('[data-to]').forEach(function (b) { b.onclick = function () { act(b, { action: 'dpSwap', from: swapFrom, to: b.getAttribute('data-to') }, '바꿨어요. 내일 아침 브리핑부터 보여요.'); }; });
        box.querySelectorAll('[data-add]').forEach(function (b) { b.onclick = function () { act(b, { action: 'dpAdd', key: b.getAttribute('data-add') }, function (j) { return j.price && j.price.extraN && j.from ? '더했어요. ' + md(j.from) + ' 결제부터 ' + won(j.price.total) + '이에요.' : '더했어요.'; }); }; });
        box.querySelectorAll('[data-wait]').forEach(function (b) { b.onclick = function () { act(b, { action: 'dpWait', key: b.getAttribute('data-wait') }, function (j) { return j.already ? '이미 대기 중이에요' : '대기 ' + (j.n || '') + '번이에요. 자리가 나면 메일로 알려 드려요.'; }); }; });
      });
    }).catch(function (e) { box.innerHTML = '<p class="lead">' + esc(e.message) + '</p>'; });
  }
  function moveBind() {
    var me = M.me, sg = document.getElementById('mSg'), dn = document.getElementById('mDn'), go = document.getElementById('mGo');
    fetch((window.JDJ_BASE || {}).DATA + 'data/index.json').then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }).then(function (ix) {
      var SG = (ix && ix.sgg) || {}, sd = SG[me.g] ? SG[me.g].sido : '';
      var list = Object.keys(SG).filter(function (g) { return SG[g].sido === sd; }); if (window.JDJ_KO) list = JDJ_KO.sortBy(list, function (g) { return SG[g].name; });
      sg.innerHTML = list.map(function (g) { return '<option value="' + g + '"' + (g === me.g ? ' selected' : '') + '>' + esc(SG[g].name) + '</option>'; }).join('') || '<option value="' + esc(me.g) + '">' + esc(me.g) + '</option>';
      var fill = function () { DP.dongsOf(sg.value).then(function (ds) { dn.innerHTML = ds.map(function (d) { return '<option' + (d === me.dn ? ' selected' : '') + '>' + esc(d) + '</option>'; }).join(''); }); };
      sg.onchange = fill; fill();
    });
    go.onclick = function () { act(go, { action: 'dpMove', addr: document.getElementById('mAddr').value, g: sg.value, dn: dn.value }, function (j) { return j.same ? '주소를 바꿨어요' : '사무소 동을 바꿨어요. 운영자가 이전 신고를 확인해요.'; }); };
  }

  function start() {
    if (!A || !A.user()) { app.innerHTML = '<h1>내 파트너 화면</h1>' + (A && A.on() ? A.gate('동네 파트너를 신청한 계정으로 카카오 간편 로그인을 해 주세요.', '카카오 간편 로그인', 'dongne_my') : '<p class="lead">로그인 기능을 준비 중이에요.</p>'); return; }
    var bk = window.JDJ_BILL && JDJ_BILL.back();
    var pre = bk && bk.ok ? DP.post({ action: 'dpBillingIssue', authKey: bk.authKey, customerKey: bk.customerKey }).then(function (j) { return { msg: j.first ? '카드를 등록했어요. 첫 결제일은 ' + md(j.first) + '이에요.' : '카드를 등록했어요.' }; }, function (e) { return { err: e.message }; })
      : Promise.resolve(bk ? { err: bk.msg } : null);
    pre.then(function (note) {
      return DP.post({ action: 'dpMine' }).then(function (m) {
        M = m;
        if (!m.cfg || (!m.cfg.open && !m.cfg.preview)) return soon();
        if (m.cfg.rule) Object.assign(C.DP_RULE, m.cfg.rule);
        if (!m.me) { app.innerHTML = '<div class="soon"><h1>아직 파트너가 아니에요</h1><p>동네 파트너를 신청하면 이 화면에서 성과와 글쓰기를 할 수 있어요.</p><a href="' + DP.link('dongne/') + '">동네 파트너 신청하기</a></div>'; return; }
        draw();
        if (note) { var pm = document.getElementById('payMsg'); pm.innerHTML = '<p class="sf-msg ' + (note.err ? 'sf-r' : 'sf-g') + '">' + esc(note.err || note.msg) + '</p>'; pm.scrollIntoView(); }
      });
    }).catch(function (e) {
      if (e.code === 'closed' || e.code === 'unknown') return soon();
      app.innerHTML = '<div class="soon"><h1>잠시 뒤 다시 열어 주세요</h1><p>' + esc(e.message) + '</p><a href="../../">홈으로 가기</a></div>';
    });
  }
  start();
})();
</script>
</body>
</html>
