<script>
(function () {
  'use strict';

  var R = C.DP_RULE, won = function (n) { return Number(n).toLocaleString('ko-KR') + '원'; };
  var st = { tier: 'partner', plan: 'm', kind: 'owner', g: '', gn: '', dn: '', sd: '', picks: [], near: [], rows: {}, used: {}, photo: '', cfg: null };

    return pv + '<h1>우리 동네 소식을 아침 브리핑에 전하는 중개사</h1>'
      + '<p class="lead"><b>월 ' + won(R.base) + '에 우리 동네 구독자 홍보' + (cfg.bundleOk ? ' + 중개사 플러스 도구 전부' : '') + '</b><br>' + esc(SITE) + ' 모닝 브리핑을 받는 우리 동네 구독자에게, 사무소 이름과 함께 짧은 동네 소식을 보여 드려요. 한 동에 ' + R.slots + '곳까지만 받아요.</p>'
      + (plus ? '<p class="plusline">' + esc(plus) + '<small>내 손님 브리핑 10명 · 주간 시장 리포트 · 매물 설명서 · 블로그·인스타 글 · 받는 지역 20곳. 파트너를 이어 가는 동안 계속 써요.</small></p>' : '')
      + '<ol class="how"><li><b>신청하면 바로 확인</b><span>중개사무소 등록번호를 공공 자료로 확인해요. 보통 바로 승인돼요. 확인이 필요하면 2영업일 안에 알려 드려요.</span></li>'
      + '<li><b>오늘의 한마디</b><span>하루 한 번, 거래 분위기·전세·재건축·학군·교통 중에 골라 200자 안으로 써요. 밤 10시 전에 쓰면 다음 날 아침 브리핑에 실리고, 자주 쓸수록 크게 소개되는 날이 많아져요.</span></li>'
      + '<li><b>동네 구독자에게 노출</b><span>광고성 정보 받기에 동의한 구독자의 브리핑 맨 아래 \'우리 동네 중개사 한마디 (제휴)\' 칸에 보여요.</span></li></ol>'
      + '<section class="price" aria-label="요금"><h2>요금</h2><table>'
      + '<tr><td>첫 달</td><td>무료</td></tr>'
      + '<tr><td>월간 · 사무소 동 + 가까운 동 2곳(모두 3개 동)</td><td>월 ' + won(R.base) + '</td></tr>'
      + '<tr><td>연간 · 12개월(2개월 할인)</td><td>연 ' + won(R.yearBase) + '</td></tr>'

      + (cfg.listingTier ? '<tr><td>일반 등록 · \'이 동네 중개사\' 목록(자리 제한 없음, 한마디·플러스 없음)</td><td>월 ' + won(R.listingPrice) + ' · 연 ' + won(R.listingPrice * 10) + '</td></tr>' : '') + '</table>'
      + '<p>가입할 때 카드를 등록하고(0원 인증), 둘째 달부터 자동으로 결제돼요. 결제 7일 전에 메일로 알려 드리고(연간은 30일·7일 전), 해지는 버튼 하나로 바로 돼요. 해지해도 그달 말까지는 보여요.</p>'
      + '<p><b>창립 파트너</b>(문을 연 날부터 3개월 안에 신청): 구독을 이어 가는 동안 \'창립 파트너\' 표시, 같은 동 안에서 먼저 보이기, 추가 동 20% 할인. 해지하거나 결제가 끊긴 지 30일이 지나면 혜택이 사라지고 다시 가입해도 돌려받지 못해요.</p>'
      + (bt ? '<p>' + esc(bt) + '</p>' : '')

      + '</section>'
      + '<p class="hint" style="margin:-6px 0 18px">한 동에 ' + R.slots + '자리예요. 먼저 신청한 순서로 받고, 자리가 차면 대기 순서대로 자리가 날 때 메일로 알려 드려요. 가맹점·대리점이 아니고, 간판·상표는 쓸 수 없어요(온라인 \'동네 파트너\' 표시만). <a href="' + DP.link('dongne/terms/') + '">동네 파트너 약관 보기</a></p>';
  }

  function formHtml() {
    var cap = st.cfg.billing ? R.max - 1 : R.incl - 1;
    return '<section class="form" id="formBox" aria-labelledby="fh"><h2 id="fh">파트너 신청</h2><p class="hint">보통 바로 승인돼요. 확인이 필요하면 2영업일 안에 알려 드려요.</p>'
      + (st.cfg.listingTier ? '<div class="fg"><div class="full"><label class="l">신청 종류</label><div class="seg2" id="tierSeg" role="group" aria-label="신청 종류"><button type="button" data-t="partner" class="on">대표 파트너 (' + R.slots + '자리)</button><button type="button" data-t="listing">일반 등록</button></div><p class="hint" id="tierHint">대표 파트너는 오늘의 한마디로 크게 소개되고 중개사 플러스가 들어 있어요. 일반 등록은 \'이 동네 중개사\' 목록에만 보여요(자리 제한 없음).</p></div></div>' : '')
      + '<div class="fg"><div class="full"><label class="l">구분</label><div class="seg2" role="group" aria-label="개업·소속 구분"><button type="button" data-k="owner" class="on">개업공인중개사</button><button type="button" data-k="member">소속공인중개사</button></div></div>'
      + '<div><label class="l" for="office">사무소 이름</label><input type="text" id="office" maxlength="40" autocomplete="organization" placeholder="예: 행복공인중개사사무소"></div>'
      + '<div><label class="l" for="reg">중개사무소 개설등록번호</label><input type="text" id="reg" maxlength="30" inputmode="text" placeholder="예: 11680-2020-00123"></div>'
      + '<div><label class="l" for="name">성명 <small id="nameHint">(개업공인중개사)</small></label><input type="text" id="name" maxlength="20" autocomplete="name"></div>'
      + '<div id="ceoBox" hidden><label class="l" for="ceo">대표(개업공인중개사) 성명</label><input type="text" id="ceo" maxlength="20"></div>'
      + '<div><label class="l" for="tel">사무소 전화번호 <small>(카드에 보여요)</small></label><input type="tel" id="tel" maxlength="20" autocomplete="tel" placeholder="예: 02-1234-5678"></div>'
      + '<div><label class="l" for="mail">알림 받을 이메일 <small>(보이지 않아요)</small></label><input type="email" id="mail" maxlength="80" autocomplete="email"></div>'
      + '<div class="full"><label class="l" for="addr">사무소 주소</label><div class="row"><input type="text" id="addr" maxlength="120" placeholder="예: 서울 강남구 개포로 000, 1층 (개포동)"><button type="button" class="btn addrbtn" id="find">주소 찾기</button></div>'
      + '<div id="pcBox" hidden style="margin-top:8px;border:1px solid var(--line);border-radius:12px;overflow:hidden;height:420px"></div>'
      + '<div class="row" style="margin-top:8px"><select id="sd" aria-label="시·도"><option value="">시·도</option></select><select id="sg" aria-label="시·군·구"><option value="">시·군·구</option></select><select id="dn" aria-label="사무소 동"><option value="">동</option></select></div>'
      + '<p class="hint" id="dnHint">[주소 찾기]로 주소를 고르면 사무소 동이 저절로 골라져요.</p></div>'
      + '<div class="full"><label class="l">가까운 동 고르기 <small>(사무소 동 말고 ' + cap + '곳까지)</small></label><div id="nearBox"><p class="hint">사무소 동을 고르면 가까운 동이 보여요.</p></div></div>'
      + '<div><span class="l" style="display:block;font-size:14.5px;font-weight:800;color:var(--sub);margin-bottom:5px">사진 <small style="font-weight:500;color:var(--sub2)">(선택 · 얼굴이나 사무소, 확인 뒤 보여요)</small></span><label class="btn" style="min-height:48px;display:inline-flex;align-items:center;cursor:pointer">사진 고르기<input type="file" id="photo" accept="image/*" hidden></label> <span class="hint" id="photoName"></span></div>'
      + '<div><label class="l" for="intro">한 줄 소개 <small>(선택 · 40자)</small></label><input type="text" id="intro" maxlength="40" placeholder="예: 개포동에서 15년째 동네 소식을 전해요"></div>'
      + '<div class="full"><label class="l">동의</label><div class="agree">'
      + '<label class="ag"><input type="checkbox" id="agAll"><span><b>모두 동의</b></span></label>'
      + '<label class="ag"><input type="checkbox" data-ag="rules"><span>[필수] 글쓰기 규칙: 가격 예측·담합·매물 홍보·전화번호·링크·욕설·비방은 쓰지 않아요. <a href="' + DP.link('dongne/terms/') + '#rules">보기</a></span></label>'
      + '<label class="ag"><input type="checkbox" data-ag="ad"><span>[필수] 광고 표시 규칙: 카드에 사무소 이름·소재지·연락처·등록번호·성명이 함께 보여요(공인중개사법). <a href="' + DP.link('dongne/terms/') + '#ad">보기</a></span></label>'
      + '<label class="ag"><input type="checkbox" data-ag="privacy"><span>[필수] 개인정보 수집·이용: 성명·전화·이메일·주소를 파트너 운영에만 쓰고, 그만두면 지워요. <a href="' + DP.link('dongne/terms/') + '#privacy">보기</a></span></label>'
      + '<label class="ag"><input type="checkbox" data-ag="terms"><span>[필수] 동네 파트너 약관 <a href="' + DP.link('dongne/terms/') + '">보기</a></span></label></div></div></div>'
      + (st.cfg.billing ? '<div class="full"><label class="l">결제 방식</label><div class="seg2" id="planSeg" role="group" aria-label="결제 방식"><button type="button" data-p="m" class="on">월간</button><button type="button" data-p="y">연간(2개월 할인)</button></div></div>' : '')
      + '<div id="priceNow" class="hint"></div>'
      + (st.cfg.billing ? '<div class="paybox" id="payBox"><p class="paybig" id="payBig"></p><label class="ag"><input type="checkbox" id="agPay"><span>[필수] 위 날짜부터 자동으로 결제되는 데 동의해요. 결제 7일 전에 메일로 알려 주고, 해지는 버튼 하나로 할 수 있어요.</span></label></div>' : '')
      + '<button type="button" class="btn primary go" id="go">파트너 신청하기</button><div id="msg" class="msg" role="status"></div>'
      + '<p class="legal">신청한 등록번호는 공공데이터포털의 공인중개사사무소 자료로 확인해요. 휴업·폐업이거나 정보가 다르면 운영자가 확인한 뒤 결과와 이유를 메일로 알려 드려요.</p></section>';
  }

  function priceNow() {
    var n = 1 + st.picks.length, p = C.dpPrice(n, { plan: st.plan, founding: st.tier !== 'listing' && st.cfg.founding, listing: st.tier === 'listing' }), f = st.cfg.firstCharge || C.dpFirstCharge(C.dpYmd(Date.now())), d = f.split('-');
    if (!st.cfg.billing) { document.getElementById('priceNow').innerHTML = '고른 동 ' + n + '곳 · 시범 운영이라 지금은 무료예요(카드 등록 없음).'; return; }
    document.getElementById('priceNow').innerHTML = '고른 동 ' + n + '곳 · 첫 달 무료 · 그 뒤 ' + (p.plan === 'y' ? '연 ' : '월 ') + won(p.total) + (p.extraN ? ' (추가 동 ' + p.extraN + '곳' + (st.tier !== 'listing' && st.cfg.founding ? ', 창립 파트너 20% 할인' : '') + ')' : '');
    document.getElementById('payBig').textContent = (+d[1]) + '월 ' + (+d[2]) + '일부터 ' + (p.plan === 'y' ? '매년 ' : '매월 ') + won(p.total) + '이 자동 결제돼요';
  }
  function drawNear() {
    var box = document.getElementById('nearBox'), key = C.dpKey(st.g, st.dn);
    if (!key) { box.innerHTML = '<p class="hint">사무소 동을 고르면 가까운 동이 보여요.</p>'; return; }
    box.innerHTML = '<p class="hint">가까운 동을 찾고 있어요…</p>';
    DP.near(key).then(function (r) {
      st.rows = r.rows; st.near = r.list;
      var keys = [key].concat(r.list.map(function (x) { return x.key; }));
      return DP.post({ action: 'dpSlots', keys: keys }).then(function (j) { st.used = {}; st.max = {}; Object.keys(j.slots || {}).forEach(function (k) { st.used[k] = j.slots[k].used; st.max[k] = j.slots[k].max || C.dpSlotsOf(k); }); }).catch(function () { st.used = {}; }).then(function () { paintNear(key); });
    });
  }
  function paintNear(key) {
    var box = document.getElementById('nearBox'), cap = st.cfg.billing ? R.max - 1 : R.incl - 1;
    st.picks = st.picks.filter(function (k) { return st.near.some(function (x) { return x.key === k; }); });
    if (!st.near.length) { box.innerHTML = '<p class="hint">이 동은 가까운 동 자료가 아직 없어요. 사무소 동만으로 신청할 수 있어요.</p>'; priceNow(); return; }
    var mine = st.used[key] || 0, mx = function (k) { return (st.max && st.max[k]) || C.dpSlotsOf(k); }, lst = st.tier === 'listing';
    box.innerHTML = DP.miniMap(key, st.rows, st.near, st.picks, lst ? {} : st.used)
      + '<p class="hint' + (!lst && mine >= mx(key) ? ' full' : '') + '" id="slotNote">사무소 동 ' + esc(st.dn) + ' 대표 파트너: ' + (mine >= mx(key) ? '자리가 다 찼어요. ' + (st.cfg.listingTier ? (lst ? '일반 등록으로 바로 시작하면 자리가 날 때 먼저 알려 드려요(48시간 안에 받기).' : '[일반 등록]으로 바로 시작하면 자리가 날 때 먼저 알려 드려요(48시간 안에 받기). 대표 파트너로 신청하면 대기 순서에 올라요.') : '신청하면 대기 순서에 올려 드려요.') : '남은 자리 ' + (mx(key) - mine) + '곳 / ' + mx(key) + '곳') + '</p>'
      + '<div class="picks">' + st.near.map(function (x) {
        var u = st.used[x.key] || 0, full = !lst && u >= mx(x.key), on = st.picks.indexOf(x.key) >= 0, dn = x.key.slice(6), gn = x.key.slice(0, 5) !== st.g ? ' (다른 구)' : '';
        return '<label class="pk' + (full ? ' pkfull' : '') + '"><input type="checkbox" data-pk="' + esc(x.key) + '"' + (on ? ' checked' : '') + '><span>' + esc(dn) + esc(gn) + '</span><span class="s">' + x.km + 'km · ' + (lst ? '일반 등록' : full ? '마감(대기)' : '남은 자리 ' + (mx(x.key) - u)) + '</span></label>';
      }).join('') + '</div>';
    box.querySelectorAll('[data-pk]').forEach(function (c) {
      c.onchange = function () {
        var k = c.getAttribute('data-pk');
        if (c.checked && st.picks.length >= cap) { c.checked = false; window.JDJ_SAVEFB && JDJ_SAVEFB.err(c.closest('.pk'), '사무소 동 말고 ' + cap + '곳까지 고를 수 있어요.' + (st.cfg.billing ? '' : ' 동 추가는 정식 결제가 열리면 할 수 있어요.'), { after: box }); return; }
        st.picks = st.picks.filter(function (x) { return x !== k; }); if (c.checked) st.picks.push(k);
        paintNear(key);
      };
    });
    priceNow();
  }

  /* 시·도 → 시·군·구 → 동 */
  var SG = {};
  function fillSd() {
    return fetch((window.JDJ_BASE || {}).DATA + 'data/index.json').then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }).then(function (ix) {
      SG = (ix && ix.sgg) || {};
      var sds = window.JDJ_KO ? JDJ_KO.sortSido(Array.from(new Set(Object.values(SG).map(function (x) { return x.sido; })))) : [];
      document.getElementById('sd').innerHTML = '<option value="">시·도</option>' + sds.map(function (x) { return '<option>' + esc(x) + '</option>'; }).join('');
    });
  }
  function fillSg(want) {
    var sd = document.getElementById('sd').value, list = Object.keys(SG).filter(function (g) { return SG[g].sido === sd; });
    if (window.JDJ_KO) list = JDJ_KO.sortBy(list, function (g) { return SG[g].name; });
    document.getElementById('sg').innerHTML = '<option value="">시·군·구</option>' + list.map(function (g) { return '<option value="' + g + '"' + (g === want ? ' selected' : '') + '>' + esc(SG[g].name) + '</option>'; }).join('');
  }
  function fillDn(want) {
    var g = document.getElementById('sg').value, sel = document.getElementById('dn');
    st.g = g; st.gn = g && SG[g] ? SG[g].name : '';
    if (!g) { sel.innerHTML = '<option value="">동</option>'; st.dn = ''; drawNear(); return Promise.resolve(); }
    return DP.dongsOf(g).then(function (list) {
      if (want && list.indexOf(want) < 0) list = list.concat([want]);
      sel.innerHTML = '<option value="">동</option>' + list.map(function (d) { return '<option' + (d === want ? ' selected' : '') + '>' + esc(d) + '</option>'; }).join('');
      st.dn = sel.value; drawNear();
    });
  }
  function setPlace(g, dn) {
    var sdName = SG[g] ? SG[g].sido : '';
    if (!sdName) { document.getElementById('dnHint').textContent = '시·군·구를 찾지 못했어요. 아래 칸에서 직접 골라 주세요.'; return; }
    document.getElementById('sd').value = sdName; fillSg(g); fillDn(dn);
    document.getElementById('dnHint').textContent = '사무소 동: ' + dn + ' (맞지 않으면 직접 바꿔 주세요)';
  }
  /* 주소 찾기: 우편번호 서비스(누를 때만 불러옴). 못 불러오면 주소 글자의 '(○○동)'으로 찾고, 아니면 직접 고르기 */
  function findAddr() {
    var box = document.getElementById('pcBox');
    var run = function () {
      box.hidden = false;
      new window.daum.Postcode({ width: '100%', height: '100%', oncomplete: function (d) {
        box.hidden = true;
        document.getElementById('addr').value = (d.roadAddress || d.jibunAddress || d.address || '') + (d.bname ? ' (' + d.bname + ')' : '');
        var dn = /리$/.test(d.bname || '') && d.bname1 ? d.bname1 : (d.bname || d.bname1 || '');
        setPlace(String(d.sigunguCode || ''), dn);
      } }).embed(box);
    };
    if (window.daum && window.daum.Postcode) return run();
    var s = document.createElement('script'); s.src = 'https://t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js'; s.async = true;
    s.onload = run;
    s.onerror = function () { guessFromText(); document.getElementById('dnHint').textContent = '주소 찾기를 열지 못했어요. 주소를 적고 아래 칸에서 시·도·시·군·구·동을 골라 주세요.'; };
    document.head.appendChild(s);
  }
  function guessFromText() {
    var a = document.getElementById('addr').value, m = /\(([가-힣0-9·.]+(?:동|가|읍|면|리))/.exec(a) || /\s([가-힣0-9·.]+동)\s/.exec(a + ' ');
    if (m && st.g) fillDn(m[1]);
  }

  function collect() {
    var v = function (id) { return document.getElementById(id).value.trim(); };
    var ag = {}; document.querySelectorAll('[data-ag]').forEach(function (c) { ag[c.getAttribute('data-ag')] = c.checked; });
    var need = [['office', '사무소 이름'], ['reg', '개설등록번호'], ['name', '성명'], ['tel', '사무소 전화번호'], ['mail', '이메일'], ['addr', '사무소 주소']].filter(function (x) { return !v(x[0]); });
    if (st.kind === 'member' && !v('ceo')) need.push(['ceo', '대표 성명']);
    if (need.length) throw new Error(need.map(function (x) { return x[1]; }).join('·') + '을 적어 주세요.');
    if (!C.dpKey(st.g, st.dn)) throw new Error('사무소 동을 골라 주세요. [주소 찾기]를 누르면 저절로 골라져요.');
    if (Object.keys(ag).some(function (k) { return !ag[k]; })) throw new Error('필수 동의 네 가지에 모두 체크해 주세요.');
    if (st.cfg.billing) { if (!document.getElementById('agPay').checked) throw new Error('자동 결제 동의에 따로 체크해 주세요.'); ag.pay = true; }
    return { action: 'dpApply', kind: st.kind, office: v('office'), reg: v('reg'), name: v('name'), ceo: v('ceo'), tel: v('tel'), mail: v('mail'), addr: v('addr'),
      g: st.g, gn: (SG[st.g] || {}).name || '', dn: st.dn, picks: st.picks, intro: v('intro'), agree: ag, v: st.cfg.terms, photo: st.photo, plan: st.plan, tier: st.tier };
  }
  function bindForm() {
    document.querySelectorAll('#tierSeg button').forEach(function (b) { b.onclick = function () {
      st.tier = b.getAttribute('data-t'); document.querySelectorAll('#tierSeg button').forEach(function (x) { x.classList.toggle('on', x === b); });
      document.getElementById('fh').textContent = st.tier === 'listing' ? '일반 등록 신청' : '파트너 신청'; if (C.dpKey(st.g, st.dn)) paintNear(C.dpKey(st.g, st.dn)); else priceNow();
    }; });
    document.querySelectorAll('#planSeg button').forEach(function (b) { b.onclick = function () {
      st.plan = b.getAttribute('data-p'); document.querySelectorAll('#planSeg button').forEach(function (x) { x.classList.toggle('on', x === b); }); priceNow();
    }; });
    document.querySelectorAll('.seg2 button[data-k]').forEach(function (b) { b.onclick = function () {
      st.kind = b.getAttribute('data-k'); document.querySelectorAll('.seg2 button[data-k]').forEach(function (x) { x.classList.toggle('on', x === b); });
      document.getElementById('ceoBox').hidden = st.kind !== 'member'; document.getElementById('nameHint').textContent = st.kind === 'member' ? '(소속공인중개사 본인)' : '(개업공인중개사)';
    }; });
    document.getElementById('find').onclick = findAddr;
    document.getElementById('addr').onblur = guessFromText;
    document.getElementById('sd').onchange = function () { fillSg(''); fillDn(''); };
    document.getElementById('sg').onchange = function () { fillDn(''); };
    document.getElementById('dn').onchange = function () { st.dn = this.value; drawNear(); };
    document.getElementById('photo').onchange = function () { var f = this.files && this.files[0], me = this; DP.shrink(f).then(function (d) { st.photo = d; document.getElementById('photoName').textContent = d ? '사진 1장 골랐어요' : ''; }).catch(function (e) { me.value = ''; st.photo = ''; document.getElementById('photoName').textContent = e.message; }); };
    var all = document.getElementById('agAll'), items = document.querySelectorAll('[data-ag]');
    all.onchange = function () { items.forEach(function (c) { c.checked = all.checked; }); };
    items.forEach(function (c) { c.onchange = function () { all.checked = Array.from(items).every(function (x) { return x.checked; }); }; });
    var go = document.getElementById('go');
    go.onclick = function () {
      var body; try { body = collect(); } catch (e) { JDJ_SAVEFB.err(go, e.message, { msg: 'msg' }); return; }
      JDJ_SAVEFB.busy(go, '확인하는 중…');
      DP.post(body).then(function (j) {
        if (j.ck) return DP.cardAuth(j.ck, st.cfg.clientKey, 'dongne/my/').catch(function (e) { location.href = DP.link('dongne/my/'); throw e; });   // 정식 결제: 토스 카드 인증 창(0원) → 내 파트너 화면에서 등록 마무리
        var got = (j.got || []).map(function (k) { return k.slice(6); }), wt = (j.wait || []).map(function (k) { return k.slice(6); });
        document.getElementById('formBox').outerHTML = '<div class="ok" role="status"><b>' + (j.auto ? '승인됐어요' : '신청을 받았어요') + '</b><br>'
          + (j.auto ? (j.listing ? '공공 자료로 바로 확인됐어요. 브리핑의 \'이 동네 중개사\' 목록에 보여요.' : '공공 자료로 바로 확인됐어요. 이제 오늘의 우리 동네 한마디를 쓸 수 있어요.') : '확인이 필요해서 2영업일 안에 결과를 메일로 알려 드려요.')
          + '<br>받은 동: ' + (got.length ? esc(got.join(', ')) : '없음') + (wt.length ? '<br>대기한 동: ' + esc(wt.join(', ')) + ' (자리가 나면 메일로 알려 드려요)' : '')
          + '<br>시범 운영이라 카드 등록 없이 무료예요.' + (j.founding ? '<br>창립 파트너예요.' : '') + (j.bundle ? '<br>중개사 플러스 도구가 함께 들어 있어요. 모닝 브리핑을 매일 아침 받아요.' : '')
          + '<br><a class="btn primary" style="margin-top:10px" href="' + DP.link('dongne/my/') + '">내 파트너 화면 열기</a></div>';
      }).catch(function (e) { JDJ_SAVEFB.err(go, e.message, { msg: 'msg' }); });
    };
  }

  function start() {
    DP.post({ action: 'dpConfig' }).then(function (cfg) {
      if (!cfg.open && !cfg.preview) return soon();
      st.cfg = cfg; if (cfg.rule) Object.assign(C.DP_RULE, cfg.rule);   // 서버 설정값(동마다 자리·요금 등)
      var h = intro(cfg);
      if (!A || !A.user()) {
        app.innerHTML = h + '<section class="form"><h2>파트너 신청</h2>' + (A && A.on() ? A.gate('신청은 카카오 간편 로그인 뒤에 할 수 있어요. 알림 메일과 내 파트너 화면에 쓰여요.', '카카오 간편 로그인', 'dongne') : '<p class="hint">로그인 기능을 준비 중이에요.</p>') + '</section>';
        return;
      }
      return DP.post({ action: 'dpMine' }).then(function (m) {
        if (m.me) { app.innerHTML = h + '<div class="ok"><b>이미 동네 파트너예요</b><br>' + esc(m.me.office) + ' · ' + esc(m.me.st) + '<br><a class="btn primary" style="margin-top:10px" href="' + DP.link('dongne/my/') + '">내 파트너 화면 열기</a></div>'; return; }
        app.innerHTML = h + formHtml(); bindForm(); priceNow();
        return fillSd();
      });
    }).catch(function (e) {
      if (e.code === 'closed' || e.code === 'unknown') return soon();
      app.innerHTML = '<div class="soon"><h1>잠시 뒤 다시 열어 주세요</h1><p>' + esc(e.message) + '</p><a href="../">홈으로 가기</a></div>';
    });
  }
  start();
})();
</script>
</body>
</html>
