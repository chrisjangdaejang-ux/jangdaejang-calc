<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="../../assets/icons/favicon-48.png">
<title>사무소 보기</title>
<!-- 동네 중개사(대표 파트너·일반 등록) 사무소 카드 — PARTNER_ENABLED 가 false 면 '준비 중'(운영자 미리 보기 제외). 전화번호는 [전화번호 보기]를 눌러야 보여요. 검색 제외 -->
<script>window.JDJ_CONFIG = { tool:'dongne_office', GA4_ID:'G-V2VR9VL7EM', CLARITY_ID:'' };</script>
<script src="../../assets/track.js?v=2"></script>
<script src="../../assets/agents.js"></script>
<script src="../../assets/config.js?v=11"></script>
<script src="../../assets/auth.js?v=11"></script>
<script src="../../assets/savefb.js?v=1"></script>
<script src="../../assets/dongne-core.js?v=2"></script>
<script src="../../assets/dongne.js?v=2"></script>
<script src="../../assets/tabbar.js?v=8" defer></script>
<link rel="stylesheet" href="../../assets/aplus.css?v=49">
<style>
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:22px 16px 60px}
.soon{margin:18px 0;padding:28px 18px;border-radius:18px;border:1px dashed var(--line);text-align:center;line-height:1.7}
.soon a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 16px;border-radius:12px;background:var(--blue-l);color:var(--blue);font-weight:800;text-decoration:none}
.oc{border:1px solid var(--line);border-radius:18px;padding:18px;background:#fff}
.oc h1{font-size:clamp(22px,5.6vw,28px);margin:6px 0 4px;word-break:keep-all}
.oc .ok{display:inline-block;font-size:12.5px;font-weight:800;color:#0B5A3B;background:#E7F6EE;border-radius:8px;padding:2px 8px}
.oc .tg{display:inline-block;font-size:12.5px;font-weight:800;color:#8A6A12;background:#F6EDD3;border-radius:8px;padding:2px 8px;margin-left:4px}
.oc dl{display:grid;grid-template-columns:88px 1fr;gap:8px 10px;margin:14px 0;font-size:15.5px;line-height:1.55}
.oc dt{color:var(--sub2);font-weight:700}.oc dd{margin:0;overflow-wrap:anywhere}
.acts{display:flex;gap:8px;flex-wrap:wrap}.acts .btn{min-height:48px}
.note{font-size:13px;color:var(--sub2);line-height:1.6;margin:12px 0 0}
</style>
<script src="../../assets/back.js?v=1" defer></script>
</head>
<body>
<header class="top"><a class="brand" href="../../" aria-label="홈"><span data-site-name></span></a><div class="badge plain">사무소 보기</div></header>
<main class="wrap" id="app"><p>불러오고 있어요…</p></main>
<script>
(function () {
  'use strict';
  var DP = window.JDJ_DP, app = document.getElementById('app'), esc = DP ? DP.esc : String;
  function soon(t) { app.innerHTML = '<div class="soon"><h1>' + (t || '준비 중이에요') + '</h1><p>' + (t ? '이 사무소는 지금 보여 드릴 수 없어요.' : '이 화면은 아직 열지 않았어요.') + '</p><a href="../../">홈으로 가기</a></div>'; }
  if (!DP || !DP.enabled()) return soon();
  var id = String(new URLSearchParams(location.search).get('id') || '');
  if (!/^D[0-9A-F]{9}$/.test(id)) return soon('사무소를 찾지 못했어요');
  DP.post({ action: 'dpOffice', id: id, v: DP.vid() }).then(function (j) {
    var p = j.p; if (!p) return soon('사무소를 찾지 못했어요');
    document.title = p.office + ' — 사무소 보기';
    app.innerHTML = '<section class="oc">' + (p.verified ? '<span class="ok">공공 자료로 등록 확인</span>' : '') + (p.listing ? '' : '<span class="tg">' + (p.found ? '창립 파트너' : '동네 파트너') + '</span>')
      + '<h1>' + esc(p.office) + '</h1>' + (p.intro ? '<p>' + esc(p.intro) + '</p>' : '')
      + '<dl><dt>소재지</dt><dd>' + esc(p.addr) + '</dd><dt>등록번호</dt><dd>' + esc(p.reg) + '</dd><dt>성명</dt><dd>' + esc(p.kind === 'member' ? '대표 ' + p.ceo + ' · 소속공인중개사 ' + p.name : '대표 ' + p.name) + '</dd><dt>연락처</dt><dd id="tel">[전화번호 보기]를 누르면 보여요</dd></dl>'
      + '<div class="acts"><button type="button" class="btn primary" id="rv">전화번호 보기</button><button type="button" class="btn" data-dp-prep="' + esc(p.id) + '">이 사무소 신고</button></div>'
      + '<p class="note">이 정보는 사무소가 직접 내고 공공 자료로 확인한 내용이에요. 중개는 사무소가 직접 해요.</p></section>';
    DP.style(); DP.bind(app);
    var rv = document.getElementById('rv');
    rv.onclick = function () { JDJ_SAVEFB.busy(rv, '불러오는 중…'); DP.post({ action: 'dpOffice', id: id, reveal: true, v: DP.vid() }).then(function (k) {
      var t = (k.p && k.p.tel) || ''; document.getElementById('tel').innerHTML = t ? '<a href="tel:' + esc(t.replace(/[^0-9]/g, '')) + '">' + esc(t) + '</a>' : '없어요';
      rv.outerHTML = t ? '<a class="btn primary" href="tel:' + esc(t.replace(/[^0-9]/g, '')) + '">전화 걸기</a>' : '';
    }).catch(function (e) { JDJ_SAVEFB.err(rv, e.message); }); };
  }).catch(function () { soon('잠시 뒤 다시 열어 주세요'); });
})();
</script>
</body>
</html>
