<script>
var JB = (typeof window !== 'undefined' && window.JDJ_BASE) || (function (p) { var g = p.indexOf('/jangdaejang-calc/') === 0, b = { SITE: g ? '/jangdaejang-calc/' : '/', DATA: g ? '/jangdaejang-data/' : 'https://chrisjangdaejang-ux.github.io/jangdaejang-data/' }; if (typeof window !== 'undefined') window.JDJ_BASE = b; return b; })((typeof location !== 'undefined' && location.pathname) || '/jangdaejang-calc/');
(function () {
  'use strict';
  const R = window.JDJ_REDEV, esc = R.esc, $ = id => document.getElementById(id);
  const S = { type: '', stage: '', gu: '', q: '', mv: false, ok: false, sort: 'soon', shown: 20, sel: null };
  let D = null, MAP = null, SH = [], PINS = [];
  const track = (n, p) => { try { if (window.JDJ_TRACK) JDJ_TRACK.event(n, p || {}); } catch (e) {} };

  function chips() {
    const t = [['', '전체']].concat(Object.keys(R.TYPES).map(k => [k, R.TYPES[k]])).concat([['sh', '신속통합기획']]);
    $('fType').innerHTML = t.map(([k, n]) => `<button class="chip${S.type === k ? ' on' : ''}" data-k="${k}">${k && k !== 'sh' ? `<i class="dot" style="background:${R.COLOR[k]}"></i>` : ''}${esc(n)}</button>`).join('');
    $('fStage').innerHTML = [['', '전체']].concat(R.SG.map(g => [g[0], g[1]])).map(([k, n]) => `<button class="chip${S.stage === k ? ' on' : ''}" data-k="${k}">${esc(n)}</button>`).join('');
    $('fQuick').innerHTML = [['soon', '착공 예상 빠른 순', S.sort === 'soon'], ['stage', '단계 높은 순', S.sort === 'stage'], ['ok', '맞힌 기록 있는 예상만', S.ok], ['mv', '이주 앞둔 구역 주변 전세', S.mv]]
      .map(([k, n, on]) => `<button class="chip${on ? ' on' : ''}" data-k="${k}">${esc(n)}</button>`).join('');
  }
  function bind() {
    $('fType').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.type = b.dataset.k; S.shown = 20; track('redev_filter', { f: 'type', v: S.type }); draw(); };
    $('fStage').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.stage = b.dataset.k; S.shown = 20; track('redev_filter', { f: 'stage', v: S.stage }); draw(); };
    $('fQuick').onclick = e => {
      const b = e.target.closest('button'); if (!b) return; const k = b.dataset.k;
      if (k === 'ok') S.ok = !S.ok; else if (k === 'mv') S.mv = !S.mv; else S.sort = k;
      S.shown = 20; track('redev_filter', { f: k }); draw();
    };
    $('fGu').onchange = () => { S.gu = $('fGu').value; S.shown = 20; draw(true); };
    let tq; $('fQ').oninput = () => { clearTimeout(tq); tq = setTimeout(() => { S.q = $('fQ').value.trim(); S.shown = 20; draw(true); }, 250); };
    $('list').onclick = e => {
      const m = e.target.closest('[data-more]'); if (m) { const z = byId(m.dataset.more); const box = m.parentElement.querySelector('.det'); if (box) { box.remove(); m.textContent = '단계 이력·자세히 보기'; } else { m.insertAdjacentHTML('afterend', detail(z)); m.textContent = '접기'; track('redev_detail', { id: z.id }); } return; }
      const fw = e.target.closest('[data-follow]'); if (fw && PRO) { const z = byId(fw.dataset.follow), r = PRO.toggleZone(z); track('redev_follow', { id: z.id, on: r.on ? 1 : 0 });
        if (r.full) { fw.textContent = '따라보기는 20곳까지예요'; return; }
        fw.outerHTML = followBtn(z).trim();
        const msg = document.getElementById('z-' + z.id); if (msg && r.on) { const p = document.createElement('p'); p.className = 'note'; p.setAttribute('role', 'status'); p.innerHTML = `다음 단계로 넘어가면 알려 드려요. 메일로 받으려면 <a href="${JB.SITE}my/alerts/#pv">알림 센터</a>에서 '따라보는 구역 단계 변화'를 켜 주세요.`; msg.appendChild(p); }
        return; }
      const f = e.target.closest('[data-fly]'); if (f) { fly(byId(f.dataset.fly)); return; }
      if (e.target.closest('#moreList')) { S.shown += 20; list(); }
    };
  }
  const byId = id => D.z.find(z => z.id === id);

  function current() { return R.sort(R.filter(D.z, S), S.sort); }
  function draw(fit) { chips(); list(); shapes(fit); }

  function stageLine(z) {
    const on = z.t === 'nt' ? 0 : (z.st || 0);
    const bar = z.t === 'nt' ? '' : `<div class="lvbar" aria-hidden="true">${Array.from({ length: 10 }, (_, i) => `<i class="${i < on ? 'on' : ''}"></i>`).join('')}</div>`;
    const last = (z.h || []).filter(h => h[0] === z.st).map(h => h[1])[0];
    return bar + `<div class="stg">지금 단계: ${esc(z.sn || '확인 필요')}${last ? ` <small>(${R.ym(last)})</small>` : ''}${z.x ? ' <small>· 원자료 날짜 확인 필요</small>' : ''}</div>`;
  }
  function spBox(z) {
    const s = R.speed(z, D);
    if (s.state !== 'est') return `<div class="sp ref">${esc(s.head)}</div>`;
    const bd = s.badge === 'ok' ? '<span class="bd ok">맞힌 기록 있음</span>' : '<span class="bd ref">참고</span>';
    return `<div class="sp${s.badge === 'ok' ? '' : ' ref'}">${bd}<b>${esc(s.mine)}</b><br>${esc(s.head)}.</div>`;
  }
  function card(z) {
    const tb = `<span class="tb" style="background:${R.COLOR[z.t] || '#4E5968'}">${esc(R.typeName(z))}</span>${z.sh ? '<span class="tb sh">신속통합기획</span>' : ''}`;
    const loc = [z.gn, z.umd].filter(Boolean).join(' ');
    const fly = z.pt ? `<button class="more" data-fly="${esc(z.id)}">지도에서 보기</button>` : '';
    return `<div class="zc${S.sel === z.id ? ' sel' : ''}" id="z-${esc(z.id)}"><div class="hd"><div><div>${tb}</div><div class="nm">${esc(z.n)}</div><div class="loc">${esc(loc)}${z.new ? ` · 새로 지을 집 ${z.new.toLocaleString('ko-KR')}세대` : ''}</div></div></div>
      ${stageLine(z)}${spBox(z)}
      <button class="more" data-more="${esc(z.id)}">단계 이력·자세히 보기</button> ${fly}${followBtn(z)}</div>`;
  }
  /* 먼저 챙겨 드려요: 구역 따라보기(assets/proactive.js — 기능이 꺼져 있으면 버튼이 없음). 구역 id·단계 번호·이름만 저장 */
  const PRO = window.JDJ_PRO || null;
  function followBtn(z) {
    if (!PRO || !PRO.on() || z.t === 'nt') return '';
    const on = PRO.followed(z.id);
    return ` <button class="more" data-follow="${esc(z.id)}" aria-pressed="${on}" style="${on ? 'color:#5B3FB0;border-color:#B9A8EE;background:#F7F4FF' : ''}">${on ? '★ 단계 알림 받는 중' : '☆ 단계 바뀌면 알림'}</button>`;
  }
  function detail(z) {
    const tl = R.timeline(z, D).map(r => `<li class="${r.est ? 'est' : ''}"><b>${esc(r.name)}</b> ${esc(r.at)}${r.est ? (r.ok ? ' <span class="bd ok">맞힌 기록 있음</span>' : ' <span class="bd ref">참고</span>') : ''}${r.plain ? `<small>${esc(r.plain)}</small>` : ''}</li>`).join('');
    let h = `<div class="det"><h4>단계 이력(실제 날짜)</h4>${tl ? `<ul class="tl">${tl}</ul>` : '<p class="note">원자료에 단계 날짜가 없어요.</p>'}`;
    if (z.t !== 'nt') h += `<p class="note">날짜: 서울시 정비사업 추진현황(${esc(R.ym(D.asof))} 기준) — 인가 날짜는 처음 받은 날 기준이에요.</p>`;
    else if (z.srcs && z.srcs.length) h += `<p class="note">출처: ${z.srcs.map((u, i) => `<a href="${esc(u)}" target="_blank" rel="noopener">발표·보도 ${i + 1} ↗</a>`).join(' · ')}</p>`;
    const s = R.speed(z, D);
    if (s.state === 'est') h += `<h4>착공 예상은 어떻게 나왔나요</h4><p class="note">${esc(s.who)} 구역 기준이에요. ${esc(s.why)}</p>`;
    const m = R.mv(z, D);
    if (m) {
      h += `<h4>이주 앞둔 구역 주변 전세</h4><p class="note" style="color:var(--ink)">${esc(m.head)}</p>`;
      if (m.rows.length) h += `<table class="mvt"><tbody>${m.rows.map(r => `<tr><td class="n">${esc(r.dong)}<br><small>${esc(r.gn)} · ${r.km}km</small></td><td><span class="${r.up ? 'up' : r.flat ? '' : 'dn'}">${esc(r.line)}</span><br><small>최근 1년 전세 보증금 변화 · ${esc(r.at)} 기준</small></td></tr>`).join('')}</tbody></table>`;
      else h += `<p class="note">${esc(m.none)}</p>`;
      h += `<p class="note">${esc(m.note)}</p>`;
    }
    const links = [];
    (z.nb || []).forEach(nb => links.push([R.nbHref(JB.SITE, nb), `${nb.n} 미래가치 보기 <small style="color:var(--muted);font-weight:500">(${nb.by}년 준공 · ${nb.km}km)</small>`, 'redev_to_mine']));
    links.push([JB.SITE + 'tax/', '집 살 때 세금(취득세) 계산', 'redev_to_tax']);
    links.push([JB.SITE + 'tax/transfer/', '집 팔 때 세금(양도세) 계산', 'redev_to_transfer']);
    if (z.g) links.push([JB.SITE + 'villa/', '이 근처 빌라 실거래·입주권 위험 보기', 'redev_to_villa']);
    if (window.JDJ_CS && z.gn) h += JDJ_CS.slot({ gu: z.gn, cat: 'redev' });   // 이 동네 확인된 전문가(재개발·재건축 상담을 해 온 분 먼저, 꺼져 있으면 빈 글자)
    h += `<h4>함께 보면 좋아요</h4>${z.nb && z.nb.length ? `<p class="note" style="margin-top:0">가까운 새 아파트(준공 ${D.new_years}년 안, ${D.near_km}km 안)의 미래가치를 보면 이 구역이 다 지어진 뒤 모습을 가늠하는 데 도움이 돼요.</p>` : ''}<div class="links">${links.map(([u, t, tr]) => `<a href="${esc(u)}" data-track="${tr}">${t}<span>›</span></a>`).join('')}</div></div>`;
    return h;
  }
  function list() {
    const zs = current();
    const est = zs.filter(z => z.sp && z.sp.y && !R.started(z)), ok = est.filter(z => z.sp.ok).length;
    $('sum').innerHTML = zs.length ? `구역 <b>${zs.length.toLocaleString('ko-KR')}곳</b> · 착공 예상이 있는 곳 ${est.length}곳(맞힌 기록 있음 ${ok}곳)` : '';
    if (!zs.length) { $('list').innerHTML = '<div class="empty">조건에 맞는 구역이 없어요. 위에서 고른 조건을 바꿔 보세요.</div>'; return; }
    $('list').innerHTML = zs.slice(0, S.shown).map(card).join('') + (zs.length > S.shown ? `<button class="morebtn" id="moreList">더 보기 (${(zs.length - S.shown).toLocaleString('ko-KR')}곳 남음)</button>` : '');
  }

  /* ---------- 지도 ---------- */
  function clearMap() { SH.forEach(s => s.remove()); PINS.forEach(p => p.remove()); SH = []; PINS = []; }
  function shapes(fit) {
    if (!MAP) return;
    clearMap();
    const zs = current().filter(z => z.pt);
    const b = MAP.bounds(), z0 = MAP.zoom(), inB = z => z.pt[0] >= b.w && z.pt[0] <= b.e && z.pt[1] >= b.s && z.pt[1] <= b.n;
    zs.forEach(z => {
      const c = R.COLOR[z.t] || '#4E5968', on = S.sel === z.id;
      if (z.poly) SH.push(MAP.shape('area', z.poly.map(r => r.map(p => [p[1], p[0]])), { color: c, weight: on ? 4 : 2, dash: !!z.sh, fill: c, fillOpacity: on ? 0.35 : 0.2 }, () => pick(z)));
    });
    const vis = zs.filter(inB);
    vis.slice(0, 260).forEach(z => {
      const c = R.COLOR[z.t] || '#4E5968';
      const node = document.createElement('div');
      const showLabel = z0 >= 14 || S.sel === z.id;
      node.innerHTML = `<button class="zp" aria-label="${esc(z.n)} ${esc(z.sn || '')}"><i style="background:${c}"></i></button>${showLabel ? `<span class="zl">${esc(z.n)} · ${esc(R.SHORT[z.st] || z.sn || '')}</span>` : ''}`;
      node.querySelector('button').onclick = ev => { ev.stopPropagation(); pick(z); };
      PINS.push(MAP.add(z.pt[1], z.pt[0], node, S.sel === z.id ? 50 : 0));
    });
    if (fit && zs.length) {
      const xs = zs.map(z => z.pt[0]), ys = zs.map(z => z.pt[1]);
      const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = (Math.min(...ys) + Math.max(...ys)) / 2, span = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys));
      MAP.setView(cy, cx, span > 0.25 ? 11 : span > 0.08 ? 13 : 14);
    }
  }
  function pick(z) {
    S.sel = z.id; track('redev_pick', { id: z.id });
    const zs = current(), i = zs.findIndex(x => x.id === z.id);
    if (i >= S.shown) S.shown = i + 1;
    list(); shapes();
    const el = document.getElementById('z-' + z.id);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      const m = el.querySelector('[data-more]'); if (m && !el.querySelector('.det')) m.click();
    }
  }
  function fly(z) { if (!z || !z.pt || !MAP) return; S.sel = z.id; MAP.setView(z.pt[1], z.pt[0], 15); $('map').scrollIntoView({ behavior: 'smooth', block: 'start' }); list(); shapes(); }

  function legend() {
    $('legend').innerHTML = Object.keys(R.TYPES).filter(k => k !== 'nt').map(k => `<span><i style="background:${R.COLOR[k]}"></i>${esc(R.TYPES[k])}</span>`).join('') + '<span><i class="dash"></i>신속통합기획(점선)</span>';
    const nP = D.z.filter(z => z.poly).length, nPt = D.z.filter(z => z.pt && !z.poly).length, nNo = D.z.filter(z => !z.pt && z.t !== 'nt').length;
    $('mapNote').textContent = `면으로 표시한 ${nP}곳은 서울시가 공개한 정비구역 경계(법적 효력 없는 참고자료)예요. 점으로 표시한 ${nPt}곳은 경계가 너무 작아 약 100m 단위로 단순화하면 모양이 무너지거나 경계 자료가 없는 곳이라, 경계 가운데나 구역 대표 지번 위치에 표시했어요. 위치 자료가 없는 ${nNo}곳과 1기 신도시는 목록에만 있어요.`;
  }
  function how() {
    const rows = R.holdRows(D), a = D.hold_all || {};
    $('howBody').innerHTML = `<p>① <b>자료</b>: 서울시 정비사업 추진현황(${esc(R.ym(D.asof))} 기준)의 단계별 첫 인가 날짜예요. 이 자료에는 지금 진행 중인 구역만 있고 이미 다 지어진 구역은 빠져 있어서, ${esc(R.ym(D.obs_from))}부터의 착공만 셌어요. 그 뒤에 착공한 구역은 아직 공사 중이라 자료에 모두 남아 있어요.</p>
      <p>② <b>보통 몇 년</b>: 조합설립인가·사업시행인가·관리처분인가 가운데 그 구역이 마지막으로 받은 인가부터 착공까지 걸린 기간을, 같은 사업 종류·같은 권역(도심·동북·서북·서남·동남) 구역끼리 모았어요. 착공한 구역이 ${D.min_ev}곳보다 적으면 서울 전체로 넓히고, 그래도 적으면 모든 사업 종류를 함께 봤어요. 아직 착공 전인 구역도 "그때까지 착공하지 않음"으로 함께 셌어요. "보통"은 10곳 중 가운데 6곳(20%~80%)이 들어가는 범위예요.</p>
      <p>③ <b>이 구역 착공 예상</b>: 이 구역이 지금까지 기다린 기간보다 더 오래 걸린 구역들만 모아, 그중 20%~80%가 착공한 시기로 계산했어요.</p>
      <p>④ <b>과거로 돌아가 맞혀 보기</b>: ${(D.cuts || []).map(R.ym).join('·')} 시점으로 돌아가 그때까지의 날짜만으로 다시 계산한 뒤, ${esc(R.ym(D.asof))}까지 실제로 착공했는지 맞혀 봤어요. 기준: ${D.nmin_ok}번 이상 맞혀 본 결과가 있고, 절반 이상 맞고, "모두 착공 안 함"이라고 했을 때보다 더 잘 맞힌 경우만 <span class="bd ok">맞힌 기록 있음</span>, 나머지는 <span class="bd ref">참고</span>예요. 전체로는 ${a.n || 0}번 중 ${a.hit || 0}번 맞았어요(${a.rate != null ? Math.round(a.rate * 100) : '-'}%, "모두 착공 안 함"이면 ${a.brate != null ? Math.round(a.brate * 100) : '-'}%).</p>
      <div style="overflow-x:auto"><table><thead><tr><th>기준 단계</th><th>사업 종류</th><th class="num">맞힘</th><th class="num">모두 '안 함'</th><th>표시</th></tr></thead><tbody>${rows.map(r => `<tr><td>${esc(r.stage)}</td><td>${esc(r.typ)}</td><td class="num">${r.hit}/${r.n} (${Math.round(r.rate * 100)}%)</td><td class="num">${Math.round(r.brate * 100)}%</td><td>${r.ok ? '<span class="bd ok">맞힌 기록 있음</span>' : '<span class="bd ref">참고</span>'}</td></tr>`).join('')}</tbody></table></div>
      <p class="note">새 추진현황 자료가 매주 쌓일 때마다 다시 계산해요. 관찰 기간이 짧아 착공 예상 연도 범위가 모두 지난 사례는 아직 없어요. 그래서 연도 범위까지 맞혔는지는 다음 자료부터 확인할 수 있어요. 착공 예상은 과거 흐름을 바탕으로 한 값이라, 조합 분쟁·소송·인허가 지연에 따라 크게 달라질 수 있어요.</p>`;
  }
  function src() {
    const S2 = D.src || {};
    const l = (k, extra) => S2[k] ? `<a href="${esc(S2[k][1])}" target="_blank" rel="noopener">${esc(S2[k][0])}</a>${extra || ''}` : '';
    $('src').innerHTML = '자료: ' + [l('stage', `(${esc(D.src_file || '')})`), l('plan'), l('poly'), l('rent', ' — 이주 주변 전세'), l('region', ' — 권역 구분'), '1기 신도시 선도지구는 국토교통부·경기도 발표와 보도(구역마다 링크)'].filter(Boolean).join(' · ') + `. 자료 만든 날 ${esc(D.v)}.`;
  }

  async function start() {
    chips(); bind();
    try {
      const r = await fetch(JB.DATA + 'data/redev/zones.json'); if (!r.ok) throw new Error('nodata');
      D = await r.json();
    } catch (e) {
      $('list').innerHTML = '<div class="empty">구역 자료를 준비하고 있어요. 매일 새벽 자료를 만든 뒤부터 보여 드려요.</div>';
      $('map').style.display = 'none'; return;
    }
    const gus = {}; D.z.forEach(z => { if (z.g) gus[z.g] = z.gn; });
    $('fGu').innerHTML = '<option value="">서울 전체</option>' + Object.keys(gus).sort((a, b) => gus[a].localeCompare(gus[b], 'ko')).map(g => `<option value="${g}">${esc(gus[g])}</option>`).join('') + '<option value="" disabled>1기 신도시는 사업 종류에서 골라요</option>';
    legend(); how(); src(); list();
    try { const q = new URLSearchParams(location.search).get('z'); const zq = q && byId(q); if (zq) setTimeout(() => pick(zq), 0); } catch (e) {}   // 알림 메일의 '구역 지도에서 보기'
    try {
      MAP = await window.JDJ_MAPE.create($('map'), { lat: 37.555, lng: 126.99, zoom: 11 });
      MAP.onIdle(() => shapes());
      shapes();
    } catch (e) { $('map').innerHTML = '<div class="empty">지도를 불러오지 못했어요. 아래 목록은 그대로 볼 수 있어요.</div>'; }
  }
  start();
})();
</script>
<script src="../../assets/guide-next.js?v=2" defer></script>
