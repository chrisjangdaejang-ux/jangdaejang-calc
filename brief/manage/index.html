<style>
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick select,.inp{font:inherit;font-size:16px;min-height:48px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text);width:100%;box-sizing:border-box}
.pick .full{grid-column:1/-1}
.al{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.al li{display:inline-flex;align-items:center;gap:4px;border:1px solid #D6E2FF;background:#F4F7FF;border-radius:999px;padding:0 4px 0 12px;min-height:40px;font-weight:700;font-size:15px}
.al button{border:0;background:none;font-size:20px;min-width:36px;min-height:36px;cursor:pointer;color:var(--sub2)}
.al small{font-weight:500;color:var(--sub2)}
.fl{display:block;font-size:14.5px;font-weight:700;margin:12px 0 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:clamp(24px,6vw,32px);margin:4px 0 8px}
.lead{margin:0 0 16px;color:var(--sub);line-height:1.6}
.sb{border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 12px}
.sb h2{font-size:18px;font-weight:900;margin:0 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sb dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 10px;font-size:15px}
.sb dt{color:var(--sub2)}.sb dd{margin:0;font-weight:700}
.tg{font-size:12.5px;font-weight:800;border-radius:6px;padding:1px 7px;background:#E8F0FF;color:#1F4FD1}
.tg.off{background:#F2F4F6;color:#4E5968}
.row2{display:flex;flex-wrap:wrap;gap:8px}
.inp,select.inp{font:inherit;font-size:16px;min-height:46px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:#fff;width:100%;box-sizing:border-box;margin:6px 0}
.note{font-size:13.5px;color:var(--sub2);line-height:1.65;margin:12px 0 0}
details{margin:8px 0 0}summary{cursor:pointer;font-weight:700;min-height:40px;display:flex;align-items:center}
.chg{margin:10px 0 0;border:1px solid #D6E2FF;background:#F8FAFF;border-radius:14px;padding:12px 14px}
.chg h3{margin:0 0 8px;font-size:16px;font-weight:900}
.chg .opt{display:grid;gap:6px}
.chg .opt label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;cursor:pointer;line-height:1.45}
.chg .opt label:has(input:checked){border-color:var(--blue);background:#F4F7FF}
.chg .opt input{margin-top:3px;width:18px;height:18px;flex:none}
.chg .opt b{display:block;font-size:15.5px}.chg .opt small{display:block;font-size:13px;color:var(--sub2)}
.q{margin:10px 0 0;border-radius:12px;background:#fff;border:1px solid var(--line);padding:12px 14px;font-size:15px;line-height:1.6}
.q .amt{display:block;font-size:24px;font-weight:900;color:var(--blue);margin:2px 0}
.q small{display:block;color:var(--sub2);font-size:13.5px}
.nx{font-size:14px;margin:8px 0 0;background:#FBF4E2;border:1px solid #EAD9A8;color:#6B5310;border-radius:10px;padding:8px 12px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.nx button{font:inherit;font-size:13.5px;border:0;background:none;color:#1F4FD1;text-decoration:underline;cursor:pointer;min-height:36px}
.inv{border:1px solid #EAD9A8;background:linear-gradient(180deg,#FFFBF0,#fff);border-radius:16px;padding:16px;margin:0 0 12px}
.inv h2{font-size:18px;font-weight:900;margin:0 0 4px}
.inv p{margin:0 0 10px;font-size:14.5px;line-height:1.6;color:var(--sub)}
.inv .btn{width:100%}
.inv small{display:block;font-size:13px;color:var(--sub2);margin:8px 0 0;line-height:1.55}
.tg.lv{background:#FBF4E2;color:#8A6A12}
.sb h3{font-size:16px;font-weight:900;margin:16px 0 8px}
.cu{border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 10px;background:#FCFDFF}
.cu-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 2px}.cu-h b{font-size:15.5px}
.cu-h button,.lk button{font:inherit;font-size:14px;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--sub);cursor:pointer}
.pick3{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 0}.pick3 .full{grid-column:1/-1}.pick3 .inp{margin:0}
.pick3 .btn{min-height:46px}
.lk{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:8px 0 0;font-size:13.5px;color:var(--sub2)}
.pf{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}.pf .full{grid-column:1/-1}.pf .inp{margin:4px 0 8px}
.wk{list-style:none;margin:0;padding:0}.wk li{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding:8px 0;font-weight:700}
.wk a{white-space:nowrap}
@media (max-width:420px){.pick3,.pf{grid-template-columns:1fr}.pick3 .full,.pf .full{grid-column:auto}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/jangdaejang-calc/" aria-label="집예보 홈"><svg class="bi" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#B8942A"/><path d="M5 12.5 12 6.5l7 6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M7.5 11v7h9v-7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/><circle cx="18.2" cy="5.8" r="1.8" fill="#fff"/></svg>집예보</a>
  <div class="badge plain" data-brief-name>집예보 모닝 브리핑</div>
</header>
<main class="wrap" id="main"><p class="note">불러오는 중…</p></main>
<footer class="foot">★ <span data-site-name>집예보</span> · <a href="../" data-brief-name>집예보 모닝 브리핑</a> · <a href="../manage/">내 구독 관리</a> · <a href="../../refund/">환불 정책</a></footer>
<script>
(function(){
'use strict';
const P = JDJ_PAY, A = window.JDJ_AUTH, B = JDJ_BRIEF, esc = P.esc, main = document.getElementById('main');
const sess = () => { try { return (JSON.parse(localStorage.getItem('jdj_auth') || 'null') || {}).s || ''; } catch(e){ return ''; } };
const call = (a, b) => P.post(a, Object.assign({ s: sess() }, b || {}));
const BUDGETS = ['3억 미만', '3억~6억', '6억~9억', '9억~15억', '15억 이상'], AGES = ['20대', '30대', '40대', '50대', '60대 이상'];
async function draw(note){
  if (!A || !A.on() || !A.user()) { main.innerHTML = `<h1>내 구독 관리</h1><p class="lead">카카오로 로그인하면 구독 상태를 보고 바꿀 수 있어요.</p>${A && A.on() ? A.btn('카카오로 로그인', 'brief_manage') : ''}`; return; }
  let r; try { r = await call('briefMine'); } catch(e){ main.innerHTML = `<h1>내 구독 관리</h1><div class="msg err">${esc(e.message)}</div>`; return; }
  const cy = r.brief.cy || {}, td = new Date().toISOString().slice(0, 10);
  /* 지금 쓰는 요금제(받는 중이거나 시작 예정) 중 한도가 가장 큰 것 — 한도는 brief-core.js 요금제 표 */
  const live = r.subs.filter(x => (x.active || x.start > td) && x.state !== '해지' && x.state !== '변경');
  const curT = live.map(x => B.PRICE[x.tier]).filter(Boolean).sort((a, b) => b.areas - a.areas || b.apts - a.apts)[0] || B.PRICE.brief;
  const paidEver = r.subs.some(x => x.orderId && !x.refund);
  const ON = s => s.state === '이용' && s.orderId && s.left > 0 && s.end >= td;   // 요금제를 바꿀 수 있는 이용권
  try { const td = new Date().toISOString().slice(0, 10); localStorage.setItem('jdj_brief_sub', r.subs.some(x => x.active || (x.start > td && x.state !== '해지')) ? '1' : '0'); } catch(e){}
  main.innerHTML = `<span class="tag">${esc(B.NAME)}</span><h1>내 구독 관리</h1>${note ? `<div class="msg info">${note}</div>` : ''}
    <section class="sb" id="ed"><h2>받는 지역·관심 단지·청약 정보</h2>
      <p class="note" style="margin-top:0">지금 요금제(${esc(curT.label)})는 지역 ${curT.areas}곳, 관심 단지 ${curT.apts}개까지 보내 드려요.</p>
      <div class="pick"><select id="sd" aria-label="시·도"></select><select id="sg" aria-label="시·군·구"></select>
        <select id="dn" class="full" aria-label="동"><option value="">구 전체</option></select><button type="button" class="btn full" id="add">이 지역 넣기</button></div>
      <ul class="al" id="al"></ul>
      <label class="fl" for="apts">관심 단지(쉼표로 구분, ${curT.apts}개까지) — 급매 레이더·전세가율·순위 변화를 따로 모아 드려요</label>
      <input class="inp" id="apts" maxlength="1200" placeholder="예: 리센츠, 잠실엘스" value="${esc((r.brief.apts || []).join(', '))}">
      ${curT.urgPick ? `<label class="fl" for="urg">급매 알림 기준 — 최근 3개월 같은 평형 중간값보다</label>
      <select class="inp" id="urg">${[5, 6, 7, 8, 9, 10, 12, 15, 20].map(v => `<option value="${v}" ${(r.brief.urg || B.URG.def) === v ? 'selected' : ''}>${v}% 이상 싸게 팔리면 알려 주기${v === B.URG.def ? ' (기본)' : ''}</option>`).join('')}</select>
      <p class="note" style="margin:4px 0 0">숫자를 낮추면 더 많은 거래를 알려 드리고, 높이면 아주 싸게 팔린 거래만 알려 드려요.</p>` : ''}
      <label class="fl">청약 정보(선택) — 청약 기회 코너에서 넣어 볼 만한 단지를 골라 드려요</label>
      <div class="g2"><input class="inp" id="cyScore" inputmode="numeric" placeholder="청약 가점(0~84)" value="${esc(cy.score == null ? '' : cy.score)}"><input class="inp" id="cyNohome" inputmode="numeric" placeholder="무주택 기간(년)" value="${esc(cy.nohome == null ? '' : cy.nohome)}"></div>
      <p class="note" style="margin:4px 0 0">가점을 모르면 <a href="../../chungyak/">청약 가점 계산</a>에서 먼저 계산해 보세요.</p>
      <label class="fl">예산·나이(선택)</label>
      <div class="g2"><select class="inp" id="budget"><option value="">예산 고르지 않음</option>${BUDGETS.map(x => `<option ${r.brief.budget === x ? 'selected' : ''}>${x}</option>`).join('')}</select>
        <select class="inp" id="age"><option value="">나이 고르지 않음</option>${AGES.map(x => `<option ${r.brief.age === x ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
      <p class="note" style="margin:4px 0 0">예산·나이는 광고주에게 보여 주는 익명 통계(10명 미만인 칸은 숨김)에만 써요. 누구인지는 알 수 없어요.</p>
      <div class="row2"><button type="button" class="btn primary" id="saveEd">저장하기</button>${(r.brief.areas || [])[0] ? `<a class="btn" href="../?d=${encodeURIComponent(B.dKey(r.brief.areas[0].g, r.brief.areas[0].dn))}">오늘 브리핑 보기</a>` : ''}</div>
      <div id="edMsg" class="msg" role="status" hidden></div></section>
    <div id="plus"></div>
    ${paidEver ? `<section class="inv" id="inv"><h2>친구 초대하고 1개월 무료</h2>
      <p>초대 링크로 온 친구가 이용권을 결제하면 두 분 모두 1개월을 무료로 더 받아요. 다음 결제가 1개월 뒤로 미뤄지는 방식이에요.</p>
      <button type="button" class="btn primary" id="invBtn">친구 초대하고 1개월 무료</button><div id="invMsg" class="msg" role="status" hidden></div>
      <small>친구 1명당 한 번 · 무료 체험만 하면 보상이 없어요 · 한 사람이 받는 보상은 1년에 ${B.REF.yearMax}개월까지 · 현금으로 돌려 드리지 않아요. <a href="../../terms/#brief-ref">자세한 조건</a></small></section>` : ''}
    ${r.subs.length ? r.subs.slice().reverse().filter(s => s.state !== '변경').map(s => `<section class="sb"><h2>${esc(s.label ? `${s.label} 요금제` : s.product)} <span class="tg ${s.active ? '' : 'off'}">${s.active ? '받는 중' : s.state === '해지' ? '해지됨' : s.start > td ? '시작 예정' : '끝남'}</span>${s.reward ? '<span class="tg lv">친구 초대 보상</span>' : ''}</h2>
      <dl><dt>이용 기간</dt><dd>${esc(s.start)} ~ ${esc(s.end)}${s.active ? ` (남은 날 ${s.left}일)` : ''}</dd><dt>받는 곳</dt><dd>${s.channel === 'kakao' ? '카카오톡' : '이메일'} · ${esc(s.contact)}</dd><dt>보낸 브리핑</dt><dd>${s.sent}회</dd>${s.refund ? `<dt>환불</dt><dd>${esc(s.refund)}</dd>` : ''}${s.broker ? `<dt>중개사 확인</dt><dd>${esc(s.broker.review === '확인됨' ? '확인됐어요' : s.broker.review === '확인 안 됨' ? '확인되지 않았어요(운영자가 연락드려요)' : '확인하고 있어요')}</dd>` : ''}</dl>
      ${s.next ? `<div class="nx"><span>다음 이용권부터 <b>${esc(s.nextLabel)}</b> 요금제로 바뀌어요. 지금 요금제는 ${esc(s.end)}까지 그대로예요.</span><button type="button" data-keep="${s.id}" data-tier="${esc(s.tier)}">바꾸지 않기</button></div>` : ''}
      ${ON(s) ? `<div class="row2" style="margin-top:8px"><button type="button" class="btn" data-chg="${s.id}">요금제 바꾸기</button></div><div class="chg" id="chg-${s.id}" hidden></div>` : ''}
      ${s.state !== '해지' && s.end >= td ? `<details><summary>받는 방법 바꾸기</summary>
        <select class="inp" data-ch="${s.id}"><option value="email">이메일</option><option value="kakao" ${r.channels.kakao ? '' : 'disabled'}>카카오톡${r.channels.kakao ? '' : ' (준비 중)'}</option></select>
        <input class="inp" data-ct="${s.id}" placeholder="새 이메일 또는 휴대폰 번호"><button class="btn" data-up="${s.id}">저장</button></details>
      <div class="row2" style="margin-top:8px"><button class="btn" data-stop="${s.id}">받지 않기(해지)</button>${s.orderId && !s.refund && s.refundEst > 0 ? `<button class="btn" data-ref="${s.id}">환불 요청(예정 ${s.refundEst.toLocaleString('ko-KR')}원)</button>` : ''}</div>` : ''}</section>`).join('')
      : `<div class="msg info">아직 구독이 없어요. <a href="../subscribe/">${B.TRIAL_DAYS}일 무료로 시작하기</a></div>`}
    <p class="note">자동 결제는 없어요. 해지하면 다음 날부터 보내지 않아요. 환불은 첫 브리핑 전이면 전액, 받기 시작한 뒤에는 남은 날만큼 일할로 해 드려요(영업일 3일 안 처리). 더 높은 요금제로 바꾸면 오늘 바로 바뀌고 남은 날만큼 차액만 내요. 더 낮은 요금제는 다음 이용권부터 바뀌어요. <a href="../../refund/#brief">환불 정책</a></p>`;
  /* 받는 지역·관심 단지·청약 정보 편집(회원 저장 자료 brief) */
  const ed = { areas: (r.brief.areas || []).slice() };
  const max = curT.areas, $ = id => document.getElementById(id);
  const IX = await fetch('/jangdaejang-data/data/index.json').then(x => x.ok ? x.json() : null).catch(() => null), SG = (IX && IX.sgg) || {};
  const sds = [...new Set(Object.values(SG).map(x => x.sido))];
  $('sd').innerHTML = sds.map(x => `<option>${esc(x)}</option>`).join('');
  const fillDn = async () => { const g = $('sg').value; $('dn').innerHTML = '<option value="">구 전체</option>'; const S = g && await fetch(B.DATA + g + '.json').then(x => x.ok ? x.json() : null).catch(() => null); if (S && $('sg').value === g) $('dn').innerHTML += (S.dongs || []).map(x => `<option>${esc(x[0])}</option>`).join(''); };
  const fillG = () => { const sd = $('sd').value; $('sg').innerHTML = Object.entries(SG).filter(([, x]) => x.sido === sd).map(([g, x]) => `<option value="${g}">${esc(x.name)}</option>`).join(''); fillDn(); };
  if (ed.areas[0] && ed.areas[0].sd) $('sd').value = ed.areas[0].sd;
  $('sd').onchange = fillG; $('sg').onchange = fillDn; fillG();
  const drawA = () => { $('al').innerHTML = ed.areas.map((a, i) => `<li>${esc(a.gn + (a.dn ? ' ' + a.dn : ''))}${i >= max ? ' <small>(이 상품에선 안 보냄)</small>' : ''}<button type="button" data-i="${i}" aria-label="${esc(a.gn)} 빼기">×</button></li>`).join('');
    $('al').querySelectorAll('button[data-i]').forEach(b => b.onclick = () => { ed.areas.splice(+b.dataset.i, 1); drawA(); }); };
  drawA();
  const edMsg = (t, bad) => { const m = $('edMsg'); m.hidden = false; m.className = 'msg ' + (bad ? 'err' : 'info'); m.textContent = t; };
  $('add').onclick = () => { const g = $('sg').value, dn = $('dn').value; if (!g || ed.areas.some(a => a.g === g && a.dn === dn)) return;
    if (ed.areas.length >= B.MAX.areas) return edMsg(`지역은 ${B.MAX.areas}곳까지 넣을 수 있어요.`, 1); ed.areas.push({ g, gn: SG[g].name, sd: SG[g].sido, dn }); drawA(); };
  $('saveEd').onclick = async () => {
    const num = (v, lo, hi) => { v = String(v).trim(); if (v === '') return null; const n = Math.round(+v); return n >= lo && n <= hi ? n : NaN; };
    const sc = num($('cyScore').value, 0, 84), nh = num($('cyNohome').value, 0, 40);
    if (Number.isNaN(sc)) return edMsg('청약 가점은 0~84 사이 숫자로 넣어 주세요.', 1);

    </div>`).join('') : '<p class="note" style="margin:0 0 8px">아직 등록한 손님이 없어요. [+ 손님 추가]를 눌러 시작해 주세요.</p>';
    $('cuList').querySelectorAll('.cu').forEach(el => {
      const i = +el.dataset.i, c = list[i];
      el.querySelector('[data-del]').onclick = () => { if (!c.id || confirm(`${c.label || '이 손님'}을(를) 빼고 저장할까요? 이 손님 링크도 막혀요.`)) { list.splice(i, 1); drawList(); } };
      el.querySelectorAll('[data-f]').forEach(f => f.oninput = f.onchange = () => { c[f.dataset.f] = f.value; });
      el.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { c.apts.splice(+b.dataset.rm, 1); drawList(); });
      const rl = el.querySelector('[data-relink]');
      if (rl) rl.onclick = async () => { if (!confirm('새 링크를 만들까요? 이미 보낸 예전 링크로는 더 볼 수 없어요.')) return;
        try { const x = await call('bpRelink', { id: c.id }); msg('새 링크를 만들었어요. 손님에게 새 링크를 보내 주세요.'); refresh(x); } catch(e){ msg(e.message, 1); } };
      const sd = el.querySelector('[data-k="sd"]'); if (!sd) return;
      const sg = el.querySelector('[data-k="sg"]'), ap = el.querySelector('[data-k="apt"]'), dl = el.querySelector('datalist');
      let opts = [];
      const g0 = c.g || (c.apts[0] || {}).g || (myAreas[0] || {}).g || '';
      if (g0 && SG[g0]) sd.value = SG[g0].sido;
      const fillG = () => { sg.innerHTML = Object.entries(SG).filter(([, x]) => x.sido === sd.value).map(([g, x]) => `<option value="${g}">${esc(x.name)}</option>`).join(''); };
      const fillA = async () => { const g = sg.value; opts = []; dl.innerHTML = ''; const a = await aptsOf(g); if (sg.value !== g) return; opts = a; dl.innerHTML = a.map(x => `<option value="${esc(x.a + ' (' + x.d + ')')}"></option>`).join(''); };
      sd.onchange = () => { fillG(); fillA(); }; sg.onchange = fillA;
      fillG(); if (g0 && SG[g0] && SG[g0].sido === sd.value) sg.value = g0; fillA();
      el.querySelector('[data-k="add"]').onclick = () => {
        const t = ap.value.trim(), g = sg.value;
        const hit = opts.find(x => `${x.a} (${x.d})` === t) || (opts.filter(x => x.a === t).length === 1 ? opts.find(x => x.a === t) : null);
        if (!hit) return msg(opts.length ? '목록에 있는 단지 이름을 골라 주세요. 같은 이름이 여러 동에 있으면 동까지 골라 주세요.' : '단지 목록을 불러오는 중이에요. 잠시 뒤 다시 눌러 주세요.', 1);
        if (c.apts.some(a => a.g === g && a.d === hit.d && a.a === hit.a)) return msg('이미 넣은 단지예요.', 1);
        if (c.apts.length >= L.apts) return msg(`손님 한 분에 단지는 ${L.apts}곳까지예요.`, 1);
        c.apts.push({ g, d: hit.d, a: hit.a }); if (!c.g) { c.g = g; c.gn = (SG[g] || {}).name || ''; }
        $('cuMsg').hidden = true; drawList();
      };
    });
  }
  $('cuAdd').onclick = () => { if (list.length >= L.customers) return; list.push({ label: '', purpose: '', g: '', gn: '', apts: [] }); drawList();
    const last = $('cuList').querySelector('.cu:last-child [data-f="label"]'); if (last) last.focus(); };
  const refresh = x => { list.length = 0; (x.customers || []).forEach(c => list.push(Object.assign({}, c, { apts: (c.apts || []).slice() }))); drawList(); CB.mountCards($('ccList'), x, { focus, place: 'manage' }); };
  $('cuSave').onclick = async () => {
    const e1 = pfErr(); if (e1) { $('pfBox').open = true; return msg(e1, 1); }
    list.forEach(c => { c.gn = c.g ? ((SG[c.g] || {}).name || c.gn || '') : ''; });
    const cl = CB.cleanList(list, L); if (cl.err) return msg(cl.err, 1);
    try { $('cuSave').disabled = true; const x = await call('bpSave', { profile: PR.cleanProfile(prof), customers: cl.list });
      msg('저장했어요. 새로 넣은 단지는 내일 아침 카드부터 들어가요.'); refresh(x); }
    catch(e){ msg(e.message || '저장하지 못했어요. 잠시 뒤 다시 해 주세요.', 1); }
    finally { $('cuSave').disabled = false; }
  };
  drawList();
  CB.mountCards($('ccList'), d, { focus, place: 'manage' });
  if (location.hash === '#cards' || focus) setTimeout(() => { const s2 = focus ? document.getElementById('c-' + focus) : $('cards'); if (s2) s2.scrollIntoView({ block: 'start' }); }, 300);
}
draw(new URLSearchParams(location.search).get('fail') ? '결제를 마치지 못해서 요금제는 그대로예요. 다시 해 보시거나 고객문의로 알려 주세요.' : '');
})();
</script>
<script>window.JDJ_BRIEF && JDJ_BRIEF.fillNames();</script>
</body>
