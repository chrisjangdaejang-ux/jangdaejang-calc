<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="/jangdaejang-calc/manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" type="image/png" href="/jangdaejang-calc/assets/icons/favicon-48.png">
<meta name="robots" content="noindex">
<script src="/jangdaejang-calc/assets/biz.js" defer></script>
<title>내 구독 관리 — 집예보</title>
<script>window.JDJ_CONFIG = { tool:'brief', GA4_ID:'G-V2VR9VL7EM', CLARITY_ID:'' };</script>
<script src="../../assets/track.js?v=2"></script>
<script src="../../assets/stat.js?v=7"></script>
<script src="../../assets/config.js?v=3"></script>
<script src="../../assets/agents.js"></script>
<script src="../../assets/auth.js?v=3"></script>
<script src="../../assets/pay.js?v=3"></script>
<script src="../../assets/brief-core.js?v=2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/jangdaejang-calc/assets/aplus.css?v=42">
<link rel="stylesheet" href="/jangdaejang-calc/assets/pay.css?v=2">
<script src="/jangdaejang-calc/assets/nw.js?v=1" defer></script>
<style>
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:clamp(24px,6vw,32px);margin:4px 0 8px}
.lead{margin:0 0 16px;color:var(--sub);line-height:1.6}
.sb{border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 12px}
.sb h2{font-size:18px;font-weight:900;margin:0 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sb dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 10px;font-size:15px}
.sb dt{color:var(--sub2)}.sb dd{margin:0;font-weight:700}
.tg{font-size:12.5px;font-weight:800;border-radius:6px;padding:1px 7px;background:#E8F0FF;color:#1F4FD1}
.tg.off{background:#F2F4F6;color:#4E5968}
.row2{display:flex;flex-wrap:wrap;gap:8px}
.inp,select.inp{font:inherit;font-size:16px;min-height:46px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:#fff;width:100%;box-sizing:border-box;margin:6px 0}
.note{font-size:13.5px;color:var(--sub2);line-height:1.65;margin:12px 0 0}
details{margin:8px 0 0}summary{cursor:pointer;font-weight:700;min-height:40px;display:flex;align-items:center}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/jangdaejang-calc/" aria-label="집예보 홈"><svg class="bi" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#B8942A"/><path d="M5 12.5 12 6.5l7 6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M7.5 11v7h9v-7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/><circle cx="18.2" cy="5.8" r="1.8" fill="#fff"/></svg>집예보</a>
  <div class="badge plain">아침 브리핑</div>
</header>
<main class="wrap" id="main"><p class="note">불러오는 중…</p></main>
<footer class="foot">★ 집예보 · <a href="../">아침 브리핑</a> · <a href="../manage/">내 구독 관리</a> · <a href="../../refund/">환불 정책</a></footer>
<script>
(function(){
'use strict';
const P = JDJ_PAY, A = window.JDJ_AUTH, B = JDJ_BRIEF, esc = P.esc, main = document.getElementById('main');
const sess = () => { try { return (JSON.parse(localStorage.getItem('jdj_auth') || 'null') || {}).s || ''; } catch(e){ return ''; } };
const call = (a, b) => P.post(a, Object.assign({ s: sess() }, b || {}));
async function draw(note){
  if (!A || !A.on() || !A.user()) { main.innerHTML = `<h1>내 구독 관리</h1><p class="lead">카카오로 로그인하면 구독 상태를 보고 바꿀 수 있어요.</p>${A && A.on() ? A.btn('카카오로 로그인', 'brief_manage') : ''}`; return; }
  let r; try { r = await call('briefMine'); } catch(e){ main.innerHTML = `<h1>내 구독 관리</h1><div class="msg err">${esc(e.message)}</div>`; return; }
  const areas = (r.brief.areas || []).map(a => a.gn + (a.dn ? ' ' + a.dn : ''));
  main.innerHTML = `<span class="tag">아침 브리핑</span><h1>내 구독 관리</h1>${note ? `<div class="msg info">${note}</div>` : ''}
    <section class="sb"><h2>받는 동네</h2><p>${areas.length ? esc(areas.join(', ')) : '아직 고른 동네가 없어요.'}</p><div class="row2"><a class="btn" href="../subscribe/">동네 바꾸기</a>${(r.brief.areas || [])[0] ? `<a class="btn" href="../?d=${encodeURIComponent(B.dKey(r.brief.areas[0].g, r.brief.areas[0].dn))}">오늘 브리핑 보기</a>` : ''}</div></section>
    ${r.subs.length ? r.subs.slice().reverse().map(s => `<section class="sb"><h2>${esc(s.product)} <span class="tg ${s.active ? '' : 'off'}">${s.active ? '받는 중' : s.state === '해지' ? '해지됨' : s.start > new Date().toISOString().slice(0, 10) ? '시작 예정' : '끝남'}</span></h2>
      <dl><dt>이용 기간</dt><dd>${esc(s.start)} ~ ${esc(s.end)}${s.active ? ` (남은 날 ${s.left}일)` : ''}</dd><dt>받는 곳</dt><dd>${s.channel === 'kakao' ? '카카오톡' : '이메일'} · ${esc(s.contact)}</dd><dt>보낸 브리핑</dt><dd>${s.sent}회</dd>${s.refund ? `<dt>환불</dt><dd>${esc(s.refund)}</dd>` : ''}</dl>
      ${s.state !== '해지' && s.end >= new Date().toISOString().slice(0, 10) ? `<details><summary>받는 방법 바꾸기</summary>
        <select class="inp" data-ch="${s.id}"><option value="email">이메일</option><option value="kakao" ${r.channels.kakao ? '' : 'disabled'}>카카오톡${r.channels.kakao ? '' : ' (준비 중)'}</option></select>
        <input class="inp" data-ct="${s.id}" placeholder="새 이메일 또는 휴대폰 번호"><button class="btn" data-up="${s.id}">저장</button></details>
      <div class="row2" style="margin-top:8px"><button class="btn" data-stop="${s.id}">받지 않기(해지)</button>${s.orderId && !s.refund ? `<button class="btn" data-ref="${s.id}">환불 요청(예정 ${s.refundEst.toLocaleString('ko-KR')}원)</button>` : ''}</div>` : ''}</section>`).join('')
      : `<div class="msg info">아직 구독이 없어요. <a href="../subscribe/">${B.TRIAL_DAYS}일 무료로 시작하기</a></div>`}
    <p class="note">자동 결제는 없어요. 해지하면 다음 날부터 보내지 않아요. 환불은 첫 브리핑 전이면 전액, 받기 시작한 뒤에는 남은 날만큼 일할로 해 드려요(영업일 3일 안 처리). <a href="../../refund/">환불 정책</a></p>`;
  const act = async (fn, ok) => { try { await fn(); draw(ok); } catch(e){ alert(e.message); } };
  main.querySelectorAll('[data-stop]').forEach(b => b.onclick = () => confirm('내일부터 브리핑을 보내지 않을까요? 남은 기간 환불은 [환불 요청]으로 따로 해요.') && act(() => call('briefStop', { id: b.dataset.stop }), '해지했어요. 내일부터 보내지 않아요.'));
  main.querySelectorAll('[data-ref]').forEach(b => b.onclick = () => { const why = prompt('환불 사유(선택)를 적어 주세요. 요청하면 바로 발송이 멈춰요.', ''); if (why !== null) act(() => call('briefRefund', { id: b.dataset.ref, reason: why }), '환불 요청을 받았어요. 영업일 3일 안에 결제한 수단으로 돌려 드려요.'); });
  main.querySelectorAll('[data-up]').forEach(b => b.onclick = () => { const id = b.dataset.up; act(() => call('briefUpdate', { id, channel: main.querySelector(`[data-ch="${id}"]`).value, contact: main.querySelector(`[data-ct="${id}"]`).value }), '받는 방법을 바꿨어요.'); });
}
draw();
})();
</script>
</body>
</html>
