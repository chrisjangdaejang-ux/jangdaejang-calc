.pn-it>.m{display:block;font-size:13.5px;color:var(--sub2);margin:2px 0 0;line-height:1.5}
.pn-t{margin:8px 0 2px;padding:9px 11px;background:var(--gray2);border:1px solid var(--line2);border-radius:10px;font-size:14px;line-height:1.6;color:var(--sub)}
.pn-t p{margin:0 0 4px;word-break:keep-all}.pn-t p:last-child{margin:0}
.pn-t b{color:var(--text);font-weight:800}
.pn-it a.o{display:inline-flex;align-items:center;min-height:40px;font-size:14.5px;font-weight:700;color:var(--blue);text-decoration:none}
.pn-it a.o:hover{text-decoration:underline}
.pn-mine{border:1px solid var(--creamb);background:var(--creamc);border-radius:16px;padding:14px 14px 6px;margin:0 0 14px}
.pn-mine>h3{margin:0 0 2px;font-size:17px;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pn-mine>h3:before{content:'';width:8px;height:8px;border-radius:50%;background:var(--brand);flex:none}
.pn-mine>h3 small{font-size:13.5px;font-weight:500;color:var(--sub2)}
.pn-mine>p.sub{margin:0 0 4px}
.pn-mine .pn-g{margin-top:8px}
html.cardmode{zoom:1!important}body.cardmode{margin:0;background:#fff}
body.cardmode>header.top,body.cardmode>.foot,body.cardmode>.wrap,body.cardmode .jtab{display:none!important}
@media(max-width:420px){.stats b{font-size:19px}.stats small{font-size:12.5px}.tl .pr b{font-size:15.5px}}
.bad{margin:16px 0 0}
.bad-in{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff}
.bad-k{display:inline-block;font-size:12px;font-weight:800;color:#4E5968;background:#F2F4F6;border-radius:6px;padding:1px 7px;margin-right:6px}
.bad-a{font-size:13px;color:var(--sub2)}
.bad-t{display:block;font-size:16.5px;font-weight:800;color:var(--text);text-decoration:none;margin:6px 0 2px;word-break:keep-all}
.bad-d{margin:0;font-size:14.5px;color:var(--sub);line-height:1.55}
.bad-n{margin:6px 0 0;font-size:12.5px;color:var(--sub2)}

<script>
var JB = (typeof window !== 'undefined' && window.JDJ_BASE) || (function (p) { var g = p.indexOf('/jangdaejang-calc/') === 0, b = { SITE: g ? '/jangdaejang-calc/' : '/', DATA: g ? '/jangdaejang-data/' : 'https://chrisjangdaejang-ux.github.io/jangdaejang-data/' }; if (typeof window !== 'undefined') window.JDJ_BASE = b; return b; })((typeof location !== 'undefined' && location.pathname) || '/jangdaejang-calc/');
(function(){
'use strict';
const B = window.JDJ_BRIEF, esc = B.esc, $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const D = B.parseD(Q.get('d'));
const PRO = Q.get('v') === 'pro', CARD = Q.get('card') === '1';
const J = u => fetch(u, {cache:'no-cache'}).then(r => r.ok ? r.json() : null).catch(() => null);
const T = (n, p) => { try { window.JDJ && JDJ.track && JDJ.track(n, p || {}); } catch(e){} };
const LOGO = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#B8942A"/><path d="M5 12.5 12 6.5l7 6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M7.5 11v7h9v-7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/><circle cx="18.2" cy="5.8" r="1.8" fill="#fff"/></svg>';
let apts = [], MYCY = null, HOMES = [];
try { const c = JSON.parse(localStorage.getItem('jdj_brief_cy') || 'null'); if (c && c.score !== '' && c.score != null) MYCY = c; } catch(e){}
try { const h = JSON.parse(localStorage.getItem('jdj_myhome') || 'null'); if (h && Array.isArray(h.list)) HOMES = h.list.filter(x => x && x.apt).slice(0, 5); } catch(e){}
try { const a = JSON.parse(localStorage.getItem('jdj_brief_apts') || '[]'); if (Array.isArray(a)) apts = a.slice(0, 10).map(String); } catch(e){}

function url(g, dn, pro){ const p = new URLSearchParams(); p.set('d', B.dKey(g, dn)); if (pro) p.set('v', 'pro'); return '?' + p.toString(); }

/* ---------- 카드(1080×1080) ---------- */
function cardHtml(S, dn, pro){
  const c = B.card(S, dn, pro);
  return `<div class="bc" id="bcard" role="img" aria-label="${esc(c.area)} ${esc(B.NAME)} 카드">
    <div class="bh"><div class="logo">${LOGO}${esc(B.SITE)} <span>모닝 브리핑</span></div><div class="dt">${esc(c.date)}</div></div>
    <div class="ar"><small>${esc(c.win || '새로 올라온')} 실거래</small>${esc(c.sd ? c.sd + ' ' : '')}${esc(c.area)}</div>
    <div class="st">${c.stats.map((s, i) => `<div class="${i === 1 ? 'hi' : ''}"><b>${esc(s.v)}</b><small>${esc(s.k)}</small></div>`).join('')}</div>
    ${c.top ? `<div class="tp">${c.top.tag ? `<em class="${/낮음/.test(c.top.tag) ? 'dn' : ''}">${esc(c.top.tag)}</em>` : ''}<b>${esc(c.top.name)}</b><span>${esc(c.top.price)} · ${esc(c.top.when)}</span></div>` : ''}
    <div class="ln">${esc(c.line.replace(/^"|"$/g, ''))}</div>
    <div class="ft"><span>국토교통부 실거래 공개 자료 기준<br>신고가 = 같은 단지·같은 평형 이전 최고가를 넘은 거래</span><span><b>${esc(B.SITE)}</b></span></div>
  </div>`;
}
/* 전국 공통 카드(1080×1080): 오늘의 부동산 시장 */
function marketCardHtml(M){
  const k = M.kr || {}, h = (k.hi || [])[0], d = (k.drop || [])[0];
  const box = (x, tag, dn) => { const t = B.topText(x); return `<div><em class="${dn ? 'dn' : ''}">${esc(tag)}</em><b>${esc(t.where)} ${esc(t.name)}</b><span>${esc(t.price)} · ${esc(t.sub)}</span></div>`; };
  return `<div class="bc" id="bcard" role="img" aria-label="${esc(B.NAME)} 오늘의 부동산 시장 카드">
    <div class="bh"><div class="logo">${LOGO}${esc(B.SITE)} <span>모닝 브리핑</span></div><div class="dt">${esc(B.dateLabel(M.date))}</div></div>
    <div class="ar"><small>${esc(B.windowText(M.win) || '새로 올라온')} 실거래 · 전국</small>오늘의 부동산 시장</div>
    <div class="st"><div><b>${Number(k.n || 0).toLocaleString('ko-KR')}건</b><small>새 매매</small></div><div class="hi"><b>${k.nhi || 0}건</b><small>그중 신고가</small></div><div><b>${(M.cy || {}).n || 0}곳</b><small>이번 주 청약 접수</small></div></div>
    <div class="mk">${h ? box(h, '전국 최고 신고가') : ''}${d ? box(d, '최근 2년 최고가 대비 가장 큰 하락', true) : ''}</div>
    <div class="ln" style="-webkit-line-clamp:2;font-size:27px;margin-top:20px">${esc((M.lines || [])[1] || '')}</div>
    <div class="ft"><span>국토교통부 실거래 공개 자료 · 청약홈 공고 기준<br>신고가 = 같은 단지·같은 평형 이전 최고가를 넘은 거래</span><span><b>${esc(B.SITE)}</b></span></div>
  </div>`;
}

/* ---------- ① 오늘의 부동산 시장 (전국 공통) ---------- */
let MKT_SCOPE = 'kr';
function mktTopLi(x, i){
  const t = B.topText(x), mine = apts.includes(x.a);
  const tg = [x.x ? '직거래' : '', x.sus ? '특수 거래 의심' : ''].filter(Boolean);
  return `<li class="${mine ? 'mine' : ''}"><div class="nm"><b><span class="rk">${i + 1}</span> ${esc(t.name)}</b><small>${esc(t.where)} · 전용 ${x.ar}㎡${x.f != null ? ' · ' + x.f + '층' : ''}</small>${tg.map(g => `<span class="tg x">${esc(g)}</span>`).join('')}${t.sub ? `<small>${esc(t.sub)}</small>` : ''}</div>
    <div class="pr"><b>${esc(t.price)}</b><small>${esc(t.when)}</small></div></li>`;
}
/* 앞의 n개만 보이고 나머지는 [n건 더 보기] */
function fold(items, n, id){ return `<ul class="tl" id="${id}">${items.slice(0, n).join('')}</ul>` + (items.length > n ? `<button type="button" class="more" data-more="${id}">${items.length - n}건 더 보기</button><template id="${id}-t">${items.slice(n).join('')}</template>` : ''); }
function foldBox(items, n, id){ return `<div id="${id}">${items.slice(0, n).join('')}</div>` + (items.length > n ? `<button type="button" class="more" data-more="${id}">${items.length - n}곳 더 보기</button><template id="${id}-t">${items.slice(n).join('')}</template>` : ''); }
function bindMore(){ document.querySelectorAll('[data-more]').forEach(b => b.onclick = () => { const id = b.dataset.more; $(id).insertAdjacentHTML('beforeend', $(id + '-t').innerHTML); b.remove(); }); }
function marketHtml(M){
  if (!M) return '';
  const K = M[MKT_SCOPE] || {}, wt = B.windowText(M.win) || '새로 올라온';
  const old = S0date && M.date !== S0date ? ` · ${esc(B.dateLabel(M.date))} 자료` : '';
  let h = `<section class="part" id="mkt" aria-labelledby="h-m"><h2 id="h-m"><span class="no">1</span>오늘의 부동산 시장 <small>전국 공통${old}</small></h2>
    <p class="sub">동네와 상관없이 모든 구독자에게 같은 내용이에요. ${esc(B.windowDetail(M.win).replace('처음 보인 거래', '처음 보인 전국 거래'))}.</p>
    <div class="one"><h2>오늘의 한 줄</h2>${(M.lines || []).map((x, i) => `<p class="${i ? 'c' : ''}">${esc(x)}</p>`).join('')}</div>
    ${pnewsHtml(M.pnews)}
    <div class="seg" role="group" aria-label="지역"><button type="button" data-ms="kr" aria-pressed="${MKT_SCOPE === 'kr'}">전국</button><button type="button" data-ms="seoul" aria-pressed="${MKT_SCOPE === 'seoul'}">서울</button></div>
    <div class="mk2"><div class="sec" style="margin:0"><h2>${esc(wt)} 신고가 TOP <small>${K.nhi || 0}건 중 금액 순</small></h2>
      ${(K.hi || []).length ? fold(K.hi.map(mktTopLi), 3, 'mh') : '<div class="empty">이번에는 신고가가 없어요.</div>'}</div>
    <div class="sec" style="margin:0"><h2>큰 하락 거래 TOP <small>${K.ndrop || 0}건 중 하락률 순</small></h2>
      ${(K.drop || []).length ? fold(K.drop.map(mktTopLi), 3, 'md') : '<div class="empty">최근 2년 최고가보다 10% 넘게 낮은 1억 원 이상 거래가 없어요.</div>'}</div></div>
    <p class="sub" style="margin-top:6px">큰 하락 = 같은 단지·같은 평형 최근 2년 최고가보다 10% 넘게 낮은 거래(1억 원 이상, 직거래·원룸형·튀는 최고가 제외). 급매 레이더와 같은 기준으로 최근 3개월 같은 평형 중간값보다 30% 넘게 싼 거래(지분·가족 간 거래 등일 수 있음)는 '특수 거래 의심'으로 표시하고 맨 아래로 내렸어요${K.nsus ? `(${K.nsus}건)` : ''}.</p>`;
  /* 상승 전환 신호(전국) */
  if ((M.rise || []).length) h += `<div class="sec"><h2>상승 전환 신호 TOP <small>전국 · 300세대 이상</small></h2><p class="sub">최근 6개월 거래량 증가가 그 시·도 상위 20%이고, 시세가 내리다가 최근 3개월 다시 오른 단지예요.</p>
    ${fold(M.rise.map((r, i) => `<li><div class="nm"><b><span class="rk">${i + 1}</span> ${esc(r.a)} ${esc(r.b)}</b><small>${esc([r.sd, r.d].join(' '))} · 직전 3개월 ${esc(B.pct(r.prev))}</small></div><div class="pr"><b>${esc(B.pct(r.chg))}</b><small>최근 3개월</small></div></li>`), 3, 'mr')}
    ${M.ev && M.evsd && M.ev[M.evsd[M.rise[0].sd]] ? `<p class="sub" style="margin-top:6px">${esc(B.evText(M.ev[M.evsd[M.rise[0].sd]], M.rise[0].sd))}</p>` : ''}</div>`;
  /* 순위 변화(전국) */
  if (M.rank && ((M.rank.up || []).length || (M.rank.down || []).length)) h += `<div class="sec"><h2>미래가치 순위가 크게 바뀐 단지 <small>${esc(M.rank.from.slice(5).replace('-', '/'))} → ${esc(M.rank.to.slice(5).replace('-', '/'))}</small></h2>
    ${fold([].concat(M.rank.up || [], M.rank.down || []).map(r => { const x = B.rankText(r); return `<li><div class="nm"><b>${esc(x.name)}</b><small>${esc(x.where)} · 시·도 안 등수</small></div><div class="pr"><b style="color:${x.up ? '#C2410C' : '#1F4FD1'}">${esc(x.mv)}</b><small>${esc(x.val)}</small></div></li>`; }), 4, 'mk')}</div>`;
  /* 청약 기회 */
  const cyo = (M.cyopp || []).filter(n => (n.low || []).length), mm = MYCY ? B.cyMatch(M.cyopp, MYCY.score) : [];
  h += `<div class="sec"><h2>청약 기회</h2><p class="sub">접수가 끝나지 않은 공고 중 분양가가 주변 신축·준신축 시세 대비 '하위 구간에 가까운' 면적대예요(${esc(B.SITE)} 청약 분양가 분석).</p>
    ${cyo.length ? cyo.slice(0, 5).map(n => `<div class="box"><b>${esc(n.n)}</b> <span class="tg x">${esc([n.sd, n.g].filter(Boolean).join(' '))}</span><br>${n.low.map(b => `${['60㎡ 이하', '60~85㎡', '85㎡ 초과'][b.b]} 분양가 3.3㎡당 ${Number(b.ppy).toLocaleString('ko-KR')}만 원 · 주변(${esc(b.scope)} ${b.n}건) 하위 구간에 가까워요`).map(esc).join('<br>')}<br><small>접수 ${esc(B.ds(n.rc[0]))}${n.rc[1] && n.rc[1] !== n.rc[0] ? '~' + esc(B.ds(n.rc[1])) : ''}</small>${n.u ? ` · <a href="${esc(n.u)}" target="_blank" rel="noopener">청약홈 공고</a>` : ''}</div>`).join('') : '<div class="empty">지금 주변 시세 대비 하위 구간에 가까운 공고는 없어요.</div>'}
    ${MYCY ? `<h3 style="font-size:16px;margin:12px 0 6px">내 가점 ${esc(MYCY.score)}점으로 넣어 볼 만한 단지</h3>${mm.length ? mm.slice(0, 6).map(x => `<div class="box"><b>${esc(x.n.n)}</b> <span class="tg ${x.g === 'hi' ? 'hi' : 'x'}">${esc(x.label)}</span><br>${esc(x.band)} 예상 최저 당첨 가점 ${x.lo}~${x.hi}점</div>`).join('') : '<div class="empty">지금 공고 중 내 가점이 예상 범위에 드는 곳이 없어요.</div>'}<p class="sub">예상 당첨 가점은 청약 화면과 같은 값(과거 당첨 결과로 만든 범위)이에요. 가점은 <a href="manage/">구독 관리</a>에서 바꿀 수 있어요.</p>` : '<p class="sub">구독 관리에서 청약 가점을 넣어 두면 넣어 볼 만한 단지를 골라 드려요.</p>'}</div>`;
  if (M.score) h += `<div class="sec"><h2>지난 예측 성적</h2><div class="box">${esc(M.score.m)}에 공개한 ${M.score.h}년 예측을 실제 결과와 맞춰 보니, 미래가치 상위 20% 단지가 하위 20%보다 ${esc(B.pct(M.score.diff))}p ${M.score.hit ? '더 올랐어요(맞음)' : '덜 올랐어요(틀림)'}.</div></div>`;
  const rt = B.rateText(M.rate);
  h += `<div class="sec"><h2>금리·대출·세금</h2><p class="sub">${esc(B.SITE)} 정책 목록(공식 발표·국회·법제처로 확인한 것)에서 최근 ${M.policy_days || 14}일 안에 단계가 바뀌었거나 앞으로 ${M.policy_days || 14}일 안에 시행·종료되는 것을 보여 드려요.</p>
    ${rt.length ? `<div class="box">${rt.map(esc).join('<br>')}<br><small>한국은행 통계(KOSIS) 월 자료예요.</small></div>` : ''}
    ${(M.policy || []).length ? M.policy.map(p => `<div class="box"><b>${esc(p.name)}</b> <span class="tg x">${esc(p.stage)} ${esc(p.d.slice(5).replace('-', '/'))}</span> <span class="tg x">${esc(p.scope)}</span><br>${esc(p.up ? (p.note || p.plain || '') : (p.plain || ''))}${p.src && p.src[1] ? ` · <a href="${esc(p.src[1])}" target="_blank" rel="noopener">공식 발표</a>` : ''}${(p.types || []).indexOf('대출') >= 0 ? ` · <a href="../loan/" data-track="brief_to_loan">내 대출 한도 다시 계산</a>` : ''}</div>`).join('')
      : '<div class="empty">최근 2주 동안 단계가 바뀐 금리·대출·세금 정책은 없어요.</div>'}</div>`;
  const cy = M.cy || {};

/* 카드 저장: 서버가 만든 그림(data/brief/card/)이 있으면 그것을, 없으면 이 화면의 카드를 그림으로 */
async function saveCard(S, dn, btn){
  const name = `${B.NAME.replace(/\s+/g, '_')}_${S.name}${dn ? '_' + dn : ''}_${S.date}.png`;
  const pre = `${B.DATA}card/${B.dKey(S.g, dn)}.png`;
  try {
    const r = await fetch(pre, {cache:'no-cache'});
    if (r.ok && /image/.test(r.headers.get('content-type') || '')) { const b = await r.blob(); return dl(b, name); }
  } catch(e){}
  try {
    const el = $('bcard'), clone = el.cloneNode(true);
    const css = [...document.styleSheets].map(s => { try { return [...s.cssRules].map(x => x.cssText).join('\n'); } catch(e){ return ''; } }).join('\n');
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml"><style>${css.replace(/@import[^;]+;/g, '')}</style>${clone.outerHTML}</div></foreignObject></svg>`;
    const img = new Image(); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    await img.decode();
    const cv = document.createElement('canvas'); cv.width = cv.height = 1080; cv.getContext('2d').drawImage(img, 0, 0);
    cv.toBlob(b => b ? dl(b, name) : fallback(), 'image/png');
  } catch(e){ fallback(); }
  function fallback(){ alert('이 브라우저에서는 바로 저장하지 못했어요. [카드만 크게 보기]를 눌러 화면을 캡처해 주세요.'); }
  function dl(b, n){ const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = n; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); btn.textContent = '저장했어요'; T('brief_card_save'); }
}

/* ---------- 구독 여부(이 기기에서 확인한 값) ---------- */
function isSub(){ try { return localStorage.getItem('jdj_brief_sub') === '1'; } catch(e){ return false; } }
async function checkSub(){
  const A = window.JDJ_AUTH, api = (window.JDJ_AGENTS || {}).api;
  if (!A || !A.on || !A.on() || !A.user() || !api) return null;
  try {
    const s = (JSON.parse(localStorage.getItem('jdj_auth') || 'null') || {}).s || '';
    const r = await fetch(api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'briefMine', s }) }).then(x => x.json());
    if (!r || !r.ok) return null;
    const today = new Date().toISOString().slice(0, 10);
    const on = !!(r && r.subs && r.subs.some(x => x.active || (x.start > today && x.state !== '해지')));
    try { localStorage.setItem('jdj_brief_sub', on ? '1' : '0'); } catch(e){}
    return on ? r : null;
  } catch(e){ return null; }
}

  <section class="sl-sec faq" aria-labelledby="sl-q"><h2 id="sl-q">자주 묻는 질문</h2>
    <details><summary>정말 무료로 시작할 수 있나요?</summary><p>네. 처음 ${TD}일은 무료이고, 카드 번호 같은 결제 수단을 미리 넣지 않아요. ${TD}일이 지나도 자동으로 돈이 나가지 않아요. 계속 받고 싶을 때만 1개월 이용권을 사시면 돼요.</p></details>
    <details><summary>언제, 어디로 받나요?</summary><p>매일 아침 7시대에 보내 드려요(자료가 늦으면 9시대). 지금은 이메일로 보내 드리고, 카카오톡 알림이 열리면 카카오톡으로도 받을 수 있어요. 같은 내용을 웹에서도 볼 수 있어요.</p></details>
    <details><summary>요금제는 쓰다가 바꿀 수 있나요?</summary><p>네. 월 요금이 더 비싼 요금제로 바꾸면 오늘 바로 바뀌고, 이번 이용권의 남은 날만큼 차액만 내요(바꾸기 전에 금액을 먼저 보여 드려요). 더 싼 요금제로 바꾸면 지금 이용권이 끝난 뒤 다음 이용권부터 바뀌어요. [내 구독 관리]의 [요금제 바꾸기]에서 해요.</p></details>
    <details><summary>동네는 바꿀 수 있나요?</summary><p>언제든 바꿀 수 있어요. 구독 관리 화면에서 바꾸면 다음 날 아침 브리핑부터 바뀐 동네로 보내 드려요. 관심 단지와 청약 가점도 같은 화면에서 바꿔요.</p></details>
    <details><summary>부동산을 잘 몰라도 읽을 수 있나요?</summary><p>네. 어려운 말은 처음 나올 때 쉬운 말로 풀어 드리고, 숫자는 '얼마에 팔렸고, 전보다 얼마나 비싼지'처럼 바로 이해되게 써요.</p></details>
    <details><summary>해지하거나 환불받을 수 있나요?</summary><p>언제든 해지할 수 있어요. 첫 브리핑을 받기 전이면 전액, 받기 시작한 뒤에는 남은 날만큼 돌려 드려요. 자세한 내용은 <a href="../refund/">환불 정책</a>에 있어요.</p></details>
  </section>

  <section class="sl-end"><h2>내일 아침부터 받아 보세요</h2><div class="sl-cta">${cta('end')}<small>${TD}일 무료 · 결제 수단 없이 시작 · 언제든 해지</small></div></section>

  ${areas.length ? `<section class="sl-pick" aria-labelledby="h-pick"><h2 id="h-pick">먼저 내 동네 오늘 브리핑 보기</h2><p class="sub">구독하기 전에 고른 동네의 오늘 브리핑을 웹에서 볼 수 있어요.</p>
    <div class="pick"><select id="pSd" aria-label="시·도">${JDJ_KO.sortSido(new Set(areas.map(a => a.sd))).map(x => `<option>${esc(x)}</option>`).join('')}</select><select id="pG" aria-label="시·군·구"></select>
      <select id="pDn" class="full" aria-label="동"><option value="">구 전체</option></select></div>
    <div class="row2"><button type="button" class="btn" id="pGo">오늘 브리핑 보기</button></div></section>` : ''}
  </div>`;
}
async function chooser(){
  $('main').classList.add('sales');
  const [IX, MH] = await Promise.all([J(B.DATA + 'index.json'), J(JB.DATA + 'data/model_h.json')]);
  if (!window.JDJ_PLAIN) await new Promise(r => { addEventListener('DOMContentLoaded', r, { once: true }); setTimeout(r, 1500); });
  document.title = `${B.NAME} — 매일 아침 내 동네 집값 변화와 기회를 한 번에`;
  $('main').innerHTML = salesHtml(IX, MH);
  T('brief_sales_view');
  const areas = (IX && IX.areas) || [];
  if (areas.length) {
    const fillG = () => { const sd = $('pSd').value; $('pG').innerHTML = JDJ_KO.sortBy(areas.filter(a => a.sd === sd), a => a.name).map(a => `<option value="${a.g}">${esc(a.name)}</option>`).join(''); fillDn(); };
    const fillDn = async () => { const g = $('pG').value; $('pDn').innerHTML = '<option value="">구 전체</option>'; if (!g) return; const S = await J(B.DATA + g + '.json'); if (S && $('pG').value === g) $('pDn').innerHTML += JDJ_KO.sortBy(S.dongs, x => x[0]).map(x => `<option>${esc(x[0])}</option>`).join(''); };
    $('pSd').onchange = fillG; $('pG').onchange = fillDn; fillG();
    $('pGo').onclick = () => { const g = $('pG').value; if (g) location.search = url(g, $('pDn').value, false); };
  }
  /* 이미 구독 중이면 내 첫 지역 브리핑으로 */
  const r = await checkSub();
  const a0 = r && r.brief && (r.brief.areas || [])[0];
  if (a0) location.replace('?d=' + encodeURIComponent(B.dKey(a0.g, a0.dn)));
}

(async function(){
  B.fillNames();
  /* 메일 링크로 들어온 날 기록(열람률 — 구독 id 해시만) 뒤 주소에서 지움 */
  if (Q.get('src') === 'mail' && /^[0-9a-f]{10}$/.test(Q.get('k') || '')) {
    const api = (window.JDJ_AGENTS || {}).api;
    if (api) fetch(`${api}?action=briefSeen&k=${Q.get('k')}&d=${encodeURIComponent(Q.get('day') || '')}`, { mode: 'no-cors' }).catch(() => {});
    try { ['src', 'k', 'day'].forEach(x => Q.delete(x)); history.replaceState(null, '', '?' + Q.toString()); } catch(e){}
  }
  if (Q.get('m') === '1' && CARD) {
    const M = await J(B.DATA + 'market.json');
    if (M) { document.documentElement.classList.add('cardmode'); document.body.classList.add('cardmode'); $('cardRoot').innerHTML = marketCardHtml(M); return; }
  }
  if (!D) { if (CARD) document.body.classList.remove('cardmode'); return chooser(); }
  const [S, M, WA, WM] = await Promise.all([J(B.DATA + D.g + '.json'), J(B.DATA + 'market.json'), J(B.DATA + 'wk/' + D.g + '.json'), J(B.DATA + 'wk/market.json')]);
  /* 지난주 우리 지역은?: 월요일 오전 7시 발표 단계가 brief/wk/ 에 올림(그 전에는 파일이 없음). 그날 브리핑 날짜와 같을 때만 */
  if (S && WA && WA.date === S.date) S.wk = WA;
  if (M && WM && WM.date === M.date) M.wk = WM;
  if (!S) { $('main').innerHTML = `<h1>브리핑을 찾지 못했어요</h1><p class="lead">이 동네 브리핑이 아직 없어요. 구독하시면 다음 날 아침부터 만들어 드려요.</p><a class="btn primary" href="subscribe/">구독 안내 보기</a> <a class="btn" href="./">다른 동네 고르기</a>`; return; }
  if (CARD) { document.documentElement.classList.add('cardmode'); document.body.classList.add('cardmode'); $('cardRoot').innerHTML = cardHtml(S, D.dn, PRO); return; }
  render(S, M);
})();
})();
</script>
