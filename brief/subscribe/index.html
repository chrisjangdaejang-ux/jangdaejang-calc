<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="/jangdaejang-calc/manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" type="image/png" href="/jangdaejang-calc/assets/icons/favicon-48.png">
<meta name="robots" content="noindex">
<script src="/jangdaejang-calc/assets/biz.js" defer></script>
<title>아침 브리핑 받기 — 집예보</title>
<script>window.JDJ_CONFIG = { tool:'brief', GA4_ID:'G-V2VR9VL7EM', CLARITY_ID:'' };</script>
<script src="../../assets/track.js?v=2"></script>
<script src="../../assets/stat.js?v=7"></script>
<script src="../../assets/config.js?v=3"></script>
<script src="../../assets/agents.js"></script>
<script src="../../assets/auth.js?v=3"></script>
<script src="../../assets/pay.js?v=3"></script>
<script src="../../assets/brief-core.js?v=1"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/jangdaejang-calc/assets/aplus.css?v=42">
<link rel="stylesheet" href="/jangdaejang-calc/assets/pay.css?v=1">
<script src="/jangdaejang-calc/assets/nw.js?v=1" defer></script>
<style>
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:clamp(24px,6vw,32px);margin:4px 0 8px}
.lead{margin:0 0 16px;color:var(--sub);line-height:1.6}
.step{border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 12px;background:#fff}
.step h2{font-size:18px;font-weight:900;margin:0 0 4px}
.step .sub{font-size:14px;color:var(--sub2);margin:0 0 10px;line-height:1.55}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick select,.inp{font:inherit;font-size:16px;min-height:48px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text);width:100%;box-sizing:border-box}
.pick .full{grid-column:1/-1}
.al{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.al li{display:inline-flex;align-items:center;gap:4px;border:1px solid #D6E2FF;background:#F4F7FF;border-radius:999px;padding:0 4px 0 12px;min-height:40px;font-weight:700;font-size:15px}
.al button{font:inherit;border:0;background:none;color:var(--sub2);min-width:36px;min-height:36px;cursor:pointer;font-size:18px}
.opt{display:grid;gap:8px}
.opt label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;line-height:1.5}
.opt label:has(input:checked){border-color:var(--blue);background:#F4F7FF}
.opt label.off{opacity:.55;cursor:not-allowed}
.opt input{margin-top:4px;width:18px;height:18px;flex:none}
.opt b{display:block;font-size:16px}
.opt small{display:block;font-size:13.5px;color:var(--sub2)}
.agree{display:grid;gap:8px;margin:6px 0 0}
.agree label{display:flex;gap:8px;align-items:flex-start;font-size:15px;line-height:1.5;cursor:pointer}
.agree input{margin-top:4px;width:18px;height:18px;flex:none}
.agree details{font-size:13.5px;color:var(--sub2);margin:-2px 0 4px 26px;line-height:1.6}
.agree summary{cursor:pointer;color:var(--sub);min-height:32px}
.go{display:grid;gap:8px;margin:14px 0 0}
.go .btn{width:100%}
.msg{margin:10px 0 0}
.note{font-size:13.5px;color:var(--sub2);line-height:1.65;margin:12px 0 0}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/jangdaejang-calc/" aria-label="집예보 홈"><svg class="bi" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#B8942A"/><path d="M5 12.5 12 6.5l7 6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M7.5 11v7h9v-7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/><circle cx="18.2" cy="5.8" r="1.8" fill="#fff"/></svg>집예보</a>
  <div class="badge plain">아침 브리핑</div>
</header>
<main class="wrap" id="main"><p class="note">불러오는 중…</p></main>
<footer class="foot">★ 집예보 · <a href="../">아침 브리핑</a> · <a href="../manage/">내 구독 관리</a> · <a href="../../refund/">환불 정책</a> · <a href="../../privacy/">개인정보처리방침</a></footer>
<script>
(function(){
'use strict';
const B = JDJ_BRIEF, P = JDJ_PAY, A = window.JDJ_AUTH, esc = B.esc, $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const J = u => fetch(u, {cache:'no-cache'}).then(r => r.ok ? r.json() : null).catch(() => null);
const sess = () => { try { return (JSON.parse(localStorage.getItem('jdj_auth') || 'null') || {}).s || ''; } catch(e){ return ''; } };
const call = (action, body) => P.post(action, Object.assign({ s: sess() }, body || {}));
const st = { areas: [], apts: [], plan: Q.get('p') === 'brief_pro' ? 'brief_pro' : 'brief', channel: 'email', trialUsed: false, active: false, kakao: false };

async function boot(){
  if (!A || !A.on() || !A.user()) {
    $('main').innerHTML = `<span class="tag">아침 브리핑 받기</span><h1>카카오로 로그인하고<br>동네를 골라 주세요</h1>
      <p class="lead">구독은 카카오 로그인 회원만 할 수 있어요. 받을 동네는 내 계정에 저장돼서 언제든 바꿀 수 있어요. 카카오에서 받는 정보는 회원번호와 닉네임뿐이에요.</p>
      ${A && A.on() ? A.btn('카카오로 로그인하고 계속하기', 'brief_sub') : '<div class="msg err">로그인 기능을 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.</div>'}
      <p class="note">처음 ${B.TRIAL_DAYS}일은 무료예요. 결제 수단을 미리 등록하지 않고, 자동으로 결제되지도 않아요.</p>`;
    return;
  }
  const [IX, cfg, mine, me] = await Promise.all([J('/jangdaejang-data/data/index.json'), J((P.api() || '') + '?action=briefConfig'),
    call('briefMine').catch(() => null), A.load().catch(() => null)]);
  st.kakao = !!(cfg && cfg.channels && cfg.channels.kakao);
  st.trialUsed = !!(mine && mine.trialUsed);
  st.active = !!(mine && mine.subs.some(x => x.active || x.start > new Date().toISOString().slice(0, 10) && x.state !== '해지'));
  const sv = (me && me.data && me.data.brief) || (mine && mine.brief) || { areas: [], apts: [] };
  st.areas = (sv.areas || []).slice(); st.apts = (sv.apts || []).slice();
  const d0 = B.parseD(Q.get('d'));
  const SG = (IX && IX.sgg) || {};
  if (d0 && SG[d0.g] && !st.areas.some(a => a.g === d0.g && a.dn === d0.dn)) st.areas.unshift({ g: d0.g, gn: SG[d0.g].name, sd: SG[d0.g].sido, dn: d0.dn });
  const fail = Q.get('fail') ? `<div class="msg err">결제를 마치지 못했어요${Q.get('message') ? ': ' + esc(Q.get('message')) : ''}. 다시 시도해 주세요.</div>` : '';
  const sds = [...new Set(Object.values(SG).map(x => x.sido))];
  $('main').innerHTML = `<span class="tag">아침 브리핑 받기</span><h1>매일 아침, 우리 동네 실거래</h1>${fail}
    <section class="step"><h2>1. 받을 동네</h2><p class="sub">시·군·구 전체 또는 동을 골라요. 일반은 ${B.PRICE.brief.areas}곳, 중개사용은 ${B.PRICE.brief_pro.areas}곳까지 보내 드려요.</p>
      <div class="pick"><select id="sd" aria-label="시·도">${sds.map(s => `<option>${esc(s)}</option>`).join('')}</select><select id="sg" aria-label="시·군·구"></select>
        <select id="dn" class="full" aria-label="동"><option value="">구 전체</option></select><button type="button" class="btn full" id="add">이 동네 넣기</button></div>
      <ul class="al" id="al"></ul>
      <label class="sub" for="apts" style="display:block;margin:12px 0 4px">관심 단지(선택, 쉼표로 구분) — 브리핑에서 맨 위에 보여 드려요</label>
      <input class="inp" id="apts" maxlength="200" placeholder="예: 리센츠, 잠실엘스" value="${esc(st.apts.join(', '))}"></section>
    <section class="step"><h2>2. 상품</h2><div class="opt">
      <label><input type="radio" name="plan" value="brief" ${st.plan === 'brief' ? 'checked' : ''}><span><b>일반 · 월 ${B.PRICE.brief.amount.toLocaleString('ko-KR')}원</b><small>동네 3곳 · 새 실거래·신고가·전세·분양·정책·오늘의 한 줄</small></span></label>
      <label><input type="radio" name="plan" value="brief_pro" ${st.plan === 'brief_pro' ? 'checked' : ''}><span><b>중개사용 · 월 ${B.PRICE.brief_pro.amount.toLocaleString('ko-KR')}원</b><small>동네 10곳 · 일반 내용 + 손님께 할 이야기 3줄 + 고객 공유용 카드 이미지</small></span></label></div>
      <p class="note">1개월 이용권이에요(부가세 포함). 자동으로 다시 결제되지 않고, 끝나기 3일 전과 마지막 날에 알려 드려요.</p></section>
    <section class="step"><h2>3. 받는 방법</h2><div class="opt">
      <label class="${st.kakao ? '' : 'off'}"><input type="radio" name="ch" value="kakao" ${st.kakao ? '' : 'disabled'}><span><b>카카오톡 ${st.kakao ? '' : '(준비 중)'}</b><small>${st.kakao ? '집예보 카카오톡 채널 알림톡으로 받아요(휴대폰 번호 필요)' : '카카오 알림톡 심사가 끝나면 열려요. 그동안 이메일로 받고, 나중에 [내 구독 관리]에서 바꿀 수 있어요.'}</small></span></label>
      <label><input type="radio" name="ch" value="email" ${st.kakao ? '' : 'checked'}><span><b>이메일</b><small>매일 아침 7시대에 보내 드려요</small></span></label></div>
      <input class="inp" id="contact" style="margin-top:10px" autocomplete="email" placeholder="받을 이메일 주소" maxlength="100">
      <div class="agree">
        <label><input type="checkbox" id="privacy"><span>[필수] 발송용 연락처 수집·이용에 동의해요</span></label>
        <details><summary>자세히 보기</summary>항목: 이메일 또는 휴대폰 번호(고른 받는 방법 하나) · 목적: 신청한 아침 브리핑과 이용 기간 안내 발송 · 보관: 이용 기간이 끝난 뒤 30일까지(그 뒤 바로 지움). 동의하지 않으면 브리핑을 보내 드릴 수 없어요.</details>
        <label><input type="checkbox" id="terms"><span>[필수·결제 시] 1개월 이용권·환불 안내를 확인했어요</span></label>
        <details><summary>자세히 보기</summary>첫 브리핑을 받기 전에는 결제일부터 7일 안에 전액 환불, 받기 시작한 뒤에는 남은 날만큼 일할 환불(위약금 없음)해 드려요. 자동 연장·자동 결제는 없어요. <a href="../../refund/">환불 정책</a></details>
        <label><input type="checkbox" id="ad"><span>[선택] 광고성 정보(집예보 새 서비스·할인 안내) 받기 — 브리핑과 따로, 언제든 끌 수 있어요</span></label>
      </div></section>
    <div class="go">${st.trialUsed || st.active ? '' : `<button type="button" class="btn primary" id="trial">${B.TRIAL_DAYS}일 무료로 시작하기</button>`}
      <button type="button" class="btn ${st.trialUsed || st.active ? 'primary' : ''}" id="pay">결제하고 받기</button>
      ${st.active ? '<button type="button" class="btn" id="saveOnly">동네만 저장하기(다음 날 아침부터 반영)</button>' : ''}</div>
    <div id="msg" class="msg" role="status"></div>
    <p class="note">브리핑은 공공 자료(국토교통부 실거래·청약홈·집예보 정책 목록)로 만들고, 같은 내용을 웹에서도 볼 수 있어요. <a href="../?d=11710-${encodeURIComponent('잠실동')}">예시 보기</a></p>`;
  const fillG = () => { const sd = $('sd').value; $('sg').innerHTML = Object.entries(SG).filter(([, x]) => x.sido === sd).map(([g, x]) => `<option value="${g}">${esc(x.name)}</option>`).join(''); fillDn(); };
  const fillDn = async () => { const g = $('sg').value; $('dn').innerHTML = '<option value="">구 전체</option>'; const S = await J(B.DATA + g + '.json'); if (S && $('sg').value === g) $('dn').innerHTML += (S.dongs || []).map(x => `<option>${esc(x[0])}</option>`).join(''); };
  $('sd').onchange = fillG; $('sg').onchange = fillDn;
  if (d0 && SG[d0.g]) { $('sd').value = SG[d0.g].sido; } fillG();
  const max = () => B.PRICE[st.plan].areas;
  const drawA = () => { $('al').innerHTML = st.areas.map((a, i) => `<li>${esc(a.gn + (a.dn ? ' ' + a.dn : ''))}${i >= max() ? ' <small>(이 상품에선 안 보냄)</small>' : ''}<button type="button" data-i="${i}" aria-label="${esc(a.gn)} 빼기">×</button></li>`).join('') || '<li style="border-style:dashed;background:#fff">아직 고른 동네가 없어요</li>';
    $('al').querySelectorAll('button[data-i]').forEach(b => b.onclick = () => { st.areas.splice(+b.dataset.i, 1); drawA(); }); };
  $('add').onclick = () => { const g = $('sg').value, dn = $('dn').value; if (!g) return; if (st.areas.some(a => a.g === g && a.dn === dn)) return;
    if (st.areas.length >= 10) return msg('동네는 10곳까지 고를 수 있어요.', 1); st.areas.push({ g, gn: SG[g].name, sd: SG[g].sido, dn }); drawA(); };
  document.querySelectorAll('input[name=plan]').forEach(r => r.onchange = () => { st.plan = r.value; drawA(); sync(); });
  document.querySelectorAll('input[name=ch]').forEach(r => r.onchange = () => { st.channel = r.value; $('contact').placeholder = r.value === 'kakao' ? '받을 휴대폰 번호' : '받을 이메일 주소'; $('contact').autocomplete = r.value === 'kakao' ? 'tel' : 'email'; });
  const sync = () => { $('pay').textContent = `월 ${B.PRICE[st.plan].amount.toLocaleString('ko-KR')}원 결제하고 받기`; };
  drawA(); sync();
  const saveAreas = () => A.update(d => { d.brief = { areas: st.areas, apts: $('apts').value.split(',').map(s => s.trim()).filter(Boolean).slice(0, 10), v: st.plan === 'brief_pro' ? 'pro' : '' }; })
    .then(() => { try { localStorage.setItem('jdj_brief_apts', JSON.stringify($('apts').value.split(',').map(s => s.trim()).filter(Boolean).slice(0, 10))); } catch(e){} });
  const base = () => { const ch = (document.querySelector('input[name=ch]:checked') || {}).value;
    if (!st.areas.length) throw new Error('받을 동네를 하나 이상 넣어 주세요.');
    if (!ch) throw new Error('받는 방법을 골라 주세요.');
    if (!$('privacy').checked) throw new Error('발송용 연락처 수집·이용에 동의해 주세요.');
    return { channel: ch, contact: $('contact').value.trim(), privacy: true, ad: $('ad').checked }; };
  function msg(t, bad){ $('msg').className = 'msg ' + (bad ? 'err' : 'info'); $('msg').innerHTML = t; }
  const busy = (b, on, t) => { b.disabled = on; if (t) b.textContent = t; };
  if ($('trial')) $('trial').onclick = async () => {
    const b = $('trial');
    try { const x = base(); busy(b, true, '시작하는 중…'); await saveAreas(); const r = await call('briefTrial', x);
      msg(`무료 체험을 시작했어요(${esc(r.sub.start)} ~ ${esc(r.sub.end)}). 내일 아침부터 ${esc(r.sub.contact)}(으)로 보내 드려요. <a href="../manage/">내 구독 관리</a>`); b.remove();
      if (window.JDJ && JDJ.track) JDJ.track('brief_trial_start', { n: st.areas.length });
    } catch(e){ busy(b, false, `${B.TRIAL_DAYS}일 무료로 시작하기`); msg(esc(e.message), 1); }
  };
  if ($('saveOnly')) $('saveOnly').onclick = () => saveAreas().then(() => msg('동네를 저장했어요. 다음 날 아침 브리핑부터 바뀌어요.')).catch(e => msg(esc(e.message), 1));
  $('pay').onclick = async () => {
    const b = $('pay');
    try {
      const x = base(); if (!$('terms').checked) throw new Error('1개월 이용권·환불 안내를 확인해 주세요.');
      busy(b, true, '결제창을 여는 중…'); await saveAreas();
      const o = await call('briefOrder', Object.assign(x, { product: st.plan, agree: true }));
      await new Promise((ok, no) => { if (window.TossPayments) return ok(); const s = document.createElement('script'); s.src = P.SDK; s.onload = ok; s.onerror = () => no(new Error('결제창을 불러오지 못했어요.')); document.head.appendChild(s); });
      const toss = window.TossPayments(P.CLIENT_KEY), w = toss.payment({ customerKey: window.TossPayments.ANONYMOUS || 'ANONYMOUS' });
      const root = location.origin + '/jangdaejang-calc/brief/';
      const req = { method: 'CARD', amount: { currency: 'KRW', value: o.amount }, orderId: o.orderId, orderName: o.orderName, successUrl: root + 'paid/', failUrl: root + 'subscribe/?fail=1', card: { flowMode: 'DEFAULT' } };
      if (x.channel === 'email') req.customerEmail = x.contact.toLowerCase(); else req.customerMobilePhone = x.contact.replace(/[^0-9]/g, '');
      await w.requestPayment(req);
    } catch(e){ busy(b, false); sync(); msg(esc(e && e.code === 'USER_CANCEL' ? '결제를 취소했어요.' : (e.message || '결제를 시작하지 못했어요.')), 1); }
  };
}
boot();
})();
</script>
</body>
</html>
