<style>
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:clamp(24px,6vw,32px);margin:4px 0 8px}
.lead{margin:0 0 16px;color:var(--sub);line-height:1.6}
.step{border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 12px;background:#fff}
.step h2{font-size:18px;font-weight:900;margin:0 0 4px}
.step .sub{font-size:14px;color:var(--sub2);margin:0 0 10px;line-height:1.55}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick select,.inp{font:inherit;font-size:16px;min-height:48px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text);width:100%;box-sizing:border-box}
.pick .full{grid-column:1/-1}
.repBox{margin:10px 0 4px;padding:10px;border:1px dashed var(--line);border-radius:12px;background:#FBF8EF}
.repBox .btn{width:100%}
.al{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.al li{display:inline-flex;align-items:center;gap:4px;border:1px solid #D4D1F5;background:#F5F4FD;border-radius:999px;padding:0 4px 0 12px;min-height:40px;font-weight:700;font-size:15px}
.al button{font:inherit;border:0;background:none;color:var(--sub2);min-width:44px;min-height:44px;cursor:pointer;font-size:18px}
.opt{display:grid;gap:8px}
.opt label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;line-height:1.5}
.opt label:has(input:checked){border-color:var(--blue);background:#F5F4FD}
.opt label.off{opacity:.55;cursor:not-allowed}
.opt input{margin-top:4px;width:18px;height:18px;flex:none}
.opt b{display:block;font-size:16px}
.opt small{display:block;font-size:13.5px;color:var(--sub2)}
.agree{display:grid;gap:8px;margin:6px 0 0}
.agree label{display:flex;gap:8px;align-items:flex-start;font-size:15px;line-height:1.5;cursor:pointer}
.agree input{margin-top:4px;width:18px;height:18px;flex:none}
.agree details{font-size:13.5px;color:var(--sub2);margin:-2px 0 4px 26px;line-height:1.6}
.agree summary{cursor:pointer;color:var(--sub);min-height:32px}
.go{display:grid;gap:8px;margin:14px 0 0}
.go .btn{width:100%}
.msg{margin:10px 0 0}
.note{font-size:13.5px;color:var(--sub2);line-height:1.65;margin:12px 0 0}
.opt em.lt{font-style:normal;font-size:12.5px;font-weight:800;color:#8A6A12;background:#FBF4E2;border:1px solid #EAD9A8;border-radius:6px;padding:0 6px;margin-left:4px;vertical-align:1px}
.amn{margin:-4px 0 4px 26px;font-size:13px;color:var(--sub2);line-height:1.6}
#amLock{color:#8A6A12;font-weight:700}
.adpair{display:grid;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
.adpair label.dis{opacity:.55;cursor:not-allowed}
.bk{margin:10px 0 0;border:1px solid #D4D1F5;background:#F8FAFF;border-radius:14px;padding:12px 14px}
.step{scroll-margin-top:72px}
/* 무료 체험을 아직 안 쓴 사람: 맨 위 체험 안내 + 시작 버튼, 요금제는 접어서 아래에 */
.trialbox{border:2px solid var(--blue);background:#F5F4FD;border-radius:16px;padding:16px;margin:0 0 14px}
.trialbox .tt{margin:0;font-size:19px;font-weight:900;line-height:1.45;color:var(--text);word-break:keep-all}
.trialbox .tt span{white-space:nowrap}
.trialbox .ts{margin:6px 0 12px;font-size:14.5px;color:var(--sub);line-height:1.6;word-break:keep-all}
.trialbox .btn{width:100%}
.fmsg{margin:0 0 10px}
.go .btn.big{min-height:56px}
details.plans{padding:0}
details.plans>summary{list-style:none;cursor:pointer;padding:16px 44px 16px 16px;position:relative;min-height:48px}
details.plans>summary::-webkit-details-marker{display:none}
details.plans>summary::after{content:'펼치기';position:absolute;right:14px;top:16px;font-size:13px;font-weight:700;color:var(--blue)}
details.plans[open]>summary::after{content:'접기'}
details.plans>summary h2{font-size:16px;line-height:1.5;word-break:keep-all}
details.plans>summary .sub{margin:2px 0 0}
details.plans .in{padding:0 16px 16px}
details.plans #pay{width:100%;margin-top:12px;font-size:15px;min-height:44px}
.paynote{font-size:13px;color:var(--sub2);margin:6px 0 0;line-height:1.55}
.stk{display:none}
@media (max-width:640px){
  body.has-stk{padding-bottom:84px}
  .stk{display:block;position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
  .stk[hidden]{display:none}
  .stk .btn{width:100%;min-height:52px}
}
</style>

<header class="top">
  <a class="brand" href="../../" aria-label="집예보 홈"><svg class="bi" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#4338CA"/><path d="M29 47 V78 H71 V47 Z" fill="#FFFFFF"/><path d="M20 51 L50 26 L80 51" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="50" cy="59" r="6" fill="#4338CA"/><path d="M46.5 62 L44 74 H56 L53.5 62 Z" fill="#4338CA"/><circle cx="76" cy="24" r="5" fill="#5EEAD4"/></svg>집예보</a>

<script>
var JB = (typeof window !== 'undefined' && window.JDJ_BASE) || (function (p) { var g = p.indexOf('/jangdaejang-calc/') === 0, b = { SITE: g ? '/jangdaejang-calc/' : '/', DATA: g ? '/jangdaejang-data/' : 'https://chrisjangdaejang-ux.github.io/jangdaejang-data/' }; if (typeof window !== 'undefined') window.JDJ_BASE = b; return b; })((typeof location !== 'undefined' && location.pathname) || '/jangdaejang-calc/');
(function(){
'use strict';
const B = JDJ_BRIEF, P = JDJ_PAY, A = window.JDJ_AUTH, esc = B.esc, $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const J = u => fetch(u, {cache:'no-cache'}).then(r => r.ok ? r.json() : null).catch(() => null);
const sess = () => { try { return (JSON.parse(localStorage.getItem('jdj_auth') || 'null') || {}).s || ''; } catch(e){ return ''; } };
const call = (action, body) => P.post(action, Object.assign({ s: sess() }, body || {}));
const st = { adOn: false, amAd: false, areas: [], apts: [], plan: (B.PRICE[Q.get('p')] || {}).show ? Q.get('p') : 'brief', channel: 'email', trialUsed: false, active: false, kakao: false };
const won = n => Number(n).toLocaleString('ko-KR');
/* 어느 권유 자리에서 왔는지(cta= — assets/brief-cta.js 첫 화면 카드·맞춤 권유·바닥 띠, assets/ad-slot.js 의 집예보 소식 칸 slot_칸이름).
   카카오 간편 로그인으로 화면을 다녀와도 이 탭 안에서는 기억해서, 체험을 시작하면 그 자리 이름으로 'sub' 를 남김(주소 이름 src 는 유입 채널이라 안 씀) */
const CTA = (() => { const v = Q.get('cta') || '', ok = /^[a-z][a-z_]{2,40}$/.test(v); try { if (ok) sessionStorage.setItem('jdj_bcta_src', v); return ok ? v : (sessionStorage.getItem('jdj_bcta_src') || ''); } catch(e){ return ok ? v : ''; } })();
const ctaStat = act => { if (!CTA) return; try { if (window.jdjStat) jdjStat('brief_cta', { cta_at: CTA, act }); } catch(e){} };

async function boot(){
  if (!A || !A.on() || !A.user()) {
    const pd = B.parseD(Q.get('d'));
    $('main').innerHTML = `<span class="tag">${esc(B.NAME)} 받기</span><h1>카카오 간편 로그인하고<br>동네를 골라 주세요</h1>
      ${pd && pd.dn ? `<p class="lead"><b>${esc(pd.dn)}</b>을(를) 받을 동네로 미리 골라 둘게요. 로그인 뒤 바꿀 수도 있어요.</p>` : ''}
      <p class="lead">구독은 카카오 간편 로그인 회원만 할 수 있어요. 받을 동네는 내 계정에 저장돼서 언제든 바꿀 수 있어요. 카카오에서 받는 정보는 회원번호와 닉네임뿐이에요.</p>
      ${A && A.on() ? A.btn('카카오 간편 로그인하고 계속하기', 'brief_sub') : '<div class="msg err">로그인 기능을 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.</div>'}
      <p class="note">처음 ${B.TRIAL_DAYS}일은 무료예요. 결제 수단을 미리 등록하지 않고, 자동으로 결제되지도 않아요.</p>`;
    return;
  }
  const [IX, cfg, mine, me] = await Promise.all([J(JB.DATA + 'data/index.json'), J((P.api() || '') + '?action=briefConfig'),
    call('briefMine').catch(() => null), A.load().catch(() => null)]);
  st.kakao = !!(cfg && cfg.channels && cfg.channels.kakao);
  const PAID = !!(window.JDJ_SITE && JDJ_SITE.PAID_OPEN) && !(cfg && cfg.paid === false);   // 통신판매업 신고 전에는 결제 잠금(assets/config.js PAID_OPEN · 서버 briefConfig.paid)
  st.trialUsed = !!(mine && mine.trialUsed);
  st.adm = !!(mine && mine.adm);   // 운영자(대표) 모드: 지역·관심 단지 제한 없음(요금제·결제는 그대로)
  st.amAd = !!(mine && mine.amAd && mine.amAd.on);   // 처음 신청이면 둘 다 꺼진 채로 시작
  st.adOn = !!(mine && mine.adc && mine.adc.on);
  st.active = !!(mine && mine.subs.some(x => x.active || x.start > new Date().toISOString().slice(0, 10) && x.state !== '해지'));
  try { if (mine) localStorage.setItem('jdj_brief_sub', st.active ? '1' : '0'); } catch(e){}
  if (!Q.get('p') && mine && mine.next && (B.PRICE[mine.next] || {}).show) st.plan = mine.next;   // 구독 관리에서 '다음 이용권부터' 고른 요금제
  const sv = (me && me.data && me.data.brief) || (mine && mine.brief) || { areas: [], apts: [] };
  st.areas = (sv.areas || []).slice(); st.apts = (sv.apts || []).slice();
  const d0 = B.parseD(Q.get('d'));
  /* 유료 구매·결과 화면의 '매일 아침 이어서 받아 보세요' 칸에서 미리 넣기에 동의하고 오면 ap=단지 이름(최대 3개)을 관심 단지 앞에 넣어요 */
  String(Q.get('ap') || '').split(',').map(x => x.trim()).filter(x => x && x.length <= 40 && !/[<>"'&]/.test(x)).slice(0, 3).reverse().forEach(a => { if (!st.apts.includes(a)) st.apts.unshift(a); });
  const SG = (IX && IX.sgg) || {};
  if (d0 && SG[d0.g] && !st.areas.some(a => a.g === d0.g && a.dn === d0.dn)) st.areas.unshift({ g: d0.g, gn: SG[d0.g].name, sd: SG[d0.g].sido, dn: d0.dn });
  const fail = Q.get('fail') ? `<div class="msg err">결제를 마치지 못했어요${Q.get('message') ? ': ' + esc(Q.get('message')) : ''}. 다시 시도해 주세요.</div>` : '';
  const sds = JDJ_KO.sortSido(new Set(Object.values(SG).map(x => x.sido)));
  /* v72 유료 구매 고객 30일 무료 + 카드 등록(assets/products.js buyerTrialOn — BUYER_TRIAL_ENABLED·BILLING_OPEN·PAID_OPEN, 서버 briefBuyerTrial).
     이 기기에서 산 유료 리포트 주문(jdj_orders)이 있고 ?bbt=1 로 왔을 때만. 일반 방문자는 카드 없이 7일 무료 그대로 */
  const BBT = (() => { const C = window.JDJ_PRODUCTS; if (st.active || !C || !C.buyerTrialOn() || Q.get('bbt') !== '1' || !(cfg && cfg.billing !== false)) return null;
    const o = (P.orders() || []).find(x => x && x.o && x.t && C.idOfServerName(x.product)); return o || null; })();
  const TR = (!st.trialUsed && !st.active) || !!BBT;   // 무료 체험을 아직 안 쓴 사람: 체험을 먼저, 요금제는 나중에 고르는 것으로 보여 줌
  const TD = BBT ? 30 : B.TRIAL_DAYS, trialLbl = BBT ? '카드 등록하고 30일 무료로 시작하기' : `${TD}일 무료로 시작하기`;
  const bbtBox = BBT ? `<div class="msg info" id="bbtBox" style="text-align:left"><b>유료 리포트를 산 분께 드리는 혜택이에요: 30일 무료</b><br>
      · 지금은 결제되지 않아요. 카드만 등록해 두고 30일 동안 매일 아침 받아요.<br>
      · 30일 뒤 유료로 이어 가려면 <b>체험 중에 따로 [유료로 계속 받기]에 동의</b>해 주셔야 해요. 동의하지 않으면 아무것도 결제되지 않고 끝나요.<br>
      · 해지는 내 구독 관리와 모든 안내 메일에서 버튼 한 번으로 돼요.
      <label style="display:flex;gap:8px;align-items:flex-start;margin-top:8px;min-height:44px"><input type="checkbox" id="bbtAgree"><span>[필수] 30일 무료 체험 시작과 카드 등록(지금 결제 없음) 안내를 확인했어요</span></label></div>` : '';
  const secArea = n => `<section class="step"><div class="msg err fmsg" hidden></div><h2>${n}. 받을 동네</h2><p class="sub">시·군·구 전체 또는 동을 골라요. ${st.adm ? '<b>운영자: 제한 없음</b> — 원하는 만큼 넣을 수 있어요.' : `${B.shownTiers().map(t => `${esc(t.label)} ${t.areas}곳`).join(' · ')}까지 보내 드려요.`}</p>
      <div class="pick"><select id="sd" aria-label="시·도">${sds.map(s => `<option>${esc(s)}</option>`).join('')}</select><select id="sg" aria-label="시·군·구"></select>
        <select id="dn" class="full" aria-label="동"><option value="">구 전체</option></select><button type="button" class="btn full" id="add">이 동네 넣기</button></div>
      <ul class="al" id="al"></ul>
      ${st.adm ? `<div class="repBox" id="repBox"><button type="button" class="btn full" id="repAdd">시·도마다 대표 지역 1곳씩 한 번에 넣기</button>
        <p class="note" style="margin:4px 0 0">운영자만 보여요. 전국 시·도마다 대표 시·군·구 1곳씩(17곳)을 지금 목록 뒤에 더해요. 이미 있는 곳은 다시 넣지 않아요.</p></div>` : ''}
      <label class="sub" for="apts" style="display:block;margin:12px 0 4px">관심 단지(선택, 쉼표로 구분) — 브리핑에서 맨 위에 보여 드려요 <span id="aptN"></span></label>
      <input class="inp" id="apts" maxlength="1200" placeholder="예: 리센츠, 잠실엘스" value="${esc(st.apts.join(', '))}"></section>`;
  const planOpts = `<div class="opt">
      ${B.shownTiers().map(t => `<label><input type="radio" name="plan" value="${t.id}" ${st.plan === t.id ? 'checked' : ''}><span><b>${esc(t.label)} · 월 ${won(t.amount)}원${t.launch ? ' <em class="lt">런칭가</em>' : ''}</b><small>${esc(t.inc.join(' · '))}</small></span></label>`).join('')}</div>
      <div id="brokerBox" class="bk" hidden><label class="sub" for="broker" style="display:block;margin:0 0 4px"><b>중개사무소 등록번호</b> (필수)</label>
        <input class="inp" id="broker" maxlength="30" autocomplete="off" placeholder="예: 11680-2020-00123">
        <p class="note" style="margin:6px 0 0">중개사 요금제는 공인중개사 전용 할인가라서 등록번호를 확인해요. 사무소 등록증에 적힌 번호를 그대로 적어 주세요. 번호는 운영자가 직접 확인하는 데에만 써요.</p></div>
      <p class="note">1개월 이용권이에요(부가세 포함). 자동으로 다시 결제되지 않고, 끝나기 3일 전과 마지막 날에 알려 드려요. 쓰는 중에 월 요금이 더 비싼 요금제로 바꾸면 남은 날만큼 차액만 내요.</p>`;
  const termsIn = `<label><input type="checkbox" id="terms"><span>[필수·결제 시] 1개월 이용권·환불 안내를 확인했어요</span></label>
        <details><summary>자세히 보기</summary>첫 브리핑을 받기 전에는 결제일부터 7일 안에 전액 환불, 받기 시작한 뒤에는 남은 날만큼 일할 환불(위약금 없음)해 드려요. 자동 연장·자동 결제는 없어요. <a href="../../refund/">환불 정책</a></details>`;
  const termsH = `<div class="agree" style="margin-top:12px">${termsIn}</div>`;
  const secCh = n => `<section class="step"><div class="msg err fmsg" hidden></div><h2>${n}. 받는 방법</h2><div class="opt">
      <label class="${st.kakao ? '' : 'off'}"><input type="radio" name="ch" value="kakao" ${st.kakao ? '' : 'disabled'}><span><b>카카오톡 ${st.kakao ? '' : '(준비 중)'}</b><small>${st.kakao ? `${esc(B.SITE)} 카카오톡 채널 알림톡으로 받아요(휴대폰 번호 필요)` : '카카오 알림톡 심사가 끝나면 열려요. 그동안 이메일로 받고, 나중에 [내 구독 관리]에서 바꿀 수 있어요.'}</small></span></label>
      <label><input type="radio" name="ch" value="email" ${st.kakao ? '' : 'checked'}><span><b>이메일</b><small>매일 아침 7시대에 보내 드려요</small></span></label></div>
      <input class="inp" id="contact" style="margin-top:10px" autocomplete="email" placeholder="받을 이메일 주소" maxlength="100">
      <div class="agree">
        <label><input type="checkbox" id="privacy"><span>[필수] 발송용 연락처 수집·이용에 동의해요</span></label>
        <details><summary>자세히 보기</summary>항목: 이메일 또는 휴대폰 번호(고른 받는 방법 하나) · 목적: 신청한 ${esc(B.NAME)}와 이용 기간 안내 발송 · 보관: 이용 기간이 끝난 뒤 30일까지(그 뒤 바로 지움). 동의하지 않으면 브리핑을 보내 드릴 수 없어요.</details>
        ${TR ? '' : termsIn}
        <div class="adpair">
        <label><input type="checkbox" id="ad" ${st.adOn ? 'checked' : ''}><span>[선택] 광고성 정보 받기(${esc(B.SITE)} 새 서비스·할인 안내, 브리핑 메일 속 광고) — 브리핑과 따로, 언제든 끌 수 있어요</span></label>
        <label id="amL" class="${st.adOn ? '' : 'dis'}"><input type="checkbox" id="amAd" ${st.adOn && st.amAd ? 'checked' : ''} ${st.adOn ? '' : 'disabled'}><span>이른 아침(오전 7시) 브리핑 메일 속 광고 받기 (선택)</span></label>
        <p class="amn" id="amLock" ${st.adOn ? 'hidden' : ''}>먼저 '광고성 정보 받기'에 동의해야 고를 수 있어요</p>
        <p class="amn">브리핑 메일이 오전 8시 전에 도착해서, 메일 안에 광고를 넣으려면 따로 동의가 필요해요. 동의하지 않아도 브리핑은 똑같이 받고, 광고는 웹 화면에서만 보여요. 언제든 끌 수 있어요.</p>
      </div></div></section>`;
  const foot = `<div id="msg" class="msg" role="status"></div>
    <p class="note">브리핑은 공공 자료(국토교통부 실거래·청약홈·${esc(B.SITE)} 정책 목록)로 만들고, 같은 내용을 웹에서도 볼 수 있어요. <a href="../?d=11710-${encodeURIComponent('잠실동')}">예시 보기</a></p>`;
  $('main').innerHTML = `<span class="tag">${esc(B.NAME)} 받기</span><h1>매일 아침, 오늘의 시장과<br>내 동네·내 단지 소식</h1>${fail}` + (TR
    ? `<div class="trialbox" id="trialBox"><p class="tt">${BBT ? '<span>구매 고객 30일 무료</span> · <span>지금 결제 없음</span> · <span>따로 동의해야 유료 전환</span>' : `<span>${TD}일 무료 체험</span> · <span>결제 수단 없이 시작</span> · <span>자동 결제 없음</span>`}</p>
        <p class="ts">${BBT ? '동네와 받을 연락처를 고르고 카드를 등록하면 내일 아침부터 30일 동안 무료로 보내 드려요.' : ''}${BBT ? '' : `카드 등록 없이 동네와 받을 연락처만 고르면 내일 아침부터 ${TD}일 동안 무료로 보내 드려요. 체험이 끝나도 저절로 돈이 나가지 않아요.`}</p>
        ${bbtBox}<button type="button" class="btn primary big trialBtn" id="trialTop">${trialLbl}</button></div>
      ${secArea(1)}${secCh(2)}
      <div class="go"><button type="button" class="btn primary big trialBtn" id="trial">${trialLbl}</button>
        <p class="paynote" style="text-align:center">결제 수단 없이 시작해요 · 자동 결제 없음</p></div>
      ${foot}
      <details class="step plans" id="plans" ${Q.get('p') ? 'open' : ''}><summary><h2>체험이 끝난 뒤 계속 받고 싶을 때 고르는 요금제예요</h2><p class="sub">지금은 결제되지 않아요. 체험 없이 바로 이용권을 사고 싶을 때만 펼쳐 보세요.</p></summary>
        <div class="in">${planOpts}<div id="paidInfo" data-jdj-plan></div>${PAID ? termsH : ''}<button type="button" class="btn ghost" id="pay" ${PAID ? '' : 'disabled'}>${PAID ? '결제하고 받기' : '유료 이용권은 곧 열려요'}</button>
        <p class="paynote">${PAID ? '누르면 결제 창이 열려요.' : '지금은 결제를 받지 않아요.'} 무료 체험은 위의 [${trialLbl}] 버튼을 눌러요.</p><p class="paynote">공공데이터를 정리·분석한 정보 제공 서비스이며, 특정 부동산의 매수·매도를 권유하지 않아요.</p></div></details>
      <div class="stk" id="stk"><button type="button" class="btn primary trialBtn" id="trialStk">${trialLbl}</button></div>`
    : `${secArea(1)}<section class="step"><h2>2. 요금제</h2>${planOpts}<div id="paidInfo" data-jdj-plan></div></section>${secCh(3)}
    <div class="go">${PAID ? '' : '<div class="msg info">유료 이용권은 곧 열려요. 지금은 7일 무료 체험만 할 수 있어요.</div>'}<button type="button" class="btn primary" id="pay" ${PAID ? '' : 'disabled'}>${PAID ? '결제하고 받기' : '유료 이용권은 곧 열려요'}</button>
      ${st.active ? '<button type="button" class="btn" id="saveOnly">동네만 저장하기(다음 날 아침부터 반영)</button>' : ''}</div>
    ${foot}`);
  const fillG = () => { const sd = $('sd').value; $('sg').innerHTML = JDJ_KO.sortBy(Object.entries(SG).filter(([, x]) => x.sido === sd), e => e[1].name).map(([g, x]) => `<option value="${g}">${esc(x.name)}</option>`).join(''); fillDn(); };
  const fillDn = async () => { const g = $('sg').value; $('dn').innerHTML = '<option value="">구 전체</option>'; const S = await J(B.DATA + g + '.json'); if (S && $('sg').value === g) $('dn').innerHTML += JDJ_KO.sortBy(S.dongs, x => x[0]).map(x => `<option>${esc(x[0])}</option>`).join(''); };
  $('sd').onchange = fillG; $('sg').onchange = fillDn;
  if (d0 && SG[d0.g]) { $('sd').value = SG[d0.g].sido; } fillG();
  const max = () => st.adm ? B.ADMIN.areas : B.PRICE[st.plan].areas, LIM = st.adm ? B.ADMIN : B.MAX;
  const aptList = () => $('apts').value.split(',').map(s => s.trim()).filter(Boolean);
  const dupN = (m => (Object.values(SG).forEach(x => m[x.name] = (m[x.name] || 0) + 1), m))({}), aName = a => (dupN[a.gn] > 1 && a.sd ? a.sd + ' ' : '') + a.gn;
  const drawA = () => { $('al').innerHTML = st.areas.map((a, i) => `<li>${esc(aName(a) + (a.dn ? ' ' + a.dn : ''))}${i >= max() ? ' <small>(이 상품에선 안 보냄)</small>' : ''}<button type="button" data-i="${i}" aria-label="${esc(a.gn)} 빼기">×</button></li>`).join('') || '<li style="border-style:dashed;background:#fff">아직 고른 동네가 없어요</li>';
    $('al').querySelectorAll('button[data-i]').forEach(b => b.onclick = () => { st.areas.splice(+b.dataset.i, 1); drawA(); }); };
  $('add').onclick = () => { const g = $('sg').value, dn = $('dn').value; if (!g) return; if (st.areas.some(a => a.g === g && a.dn === dn)) return;
    if (st.areas.length >= LIM.areas) return msg(`동네는 ${LIM.areas}곳까지 고를 수 있어요.`, 1); st.areas.push({ g, gn: SG[g].name, sd: SG[g].sido, dn }); drawA(); };
  if ($('repAdd')) $('repAdd').onclick = () => { const x = B.repAreas(SG, st.areas, LIM.areas); st.areas = x.areas; drawA();
    msg(x.added ? `${x.added}곳을 더했어요. 지금 모두 ${st.areas.length}곳이에요.${x.missing.length ? ` (못 찾은 곳: ${esc(x.missing.join(', '))})` : ''}`
      : (x.missing.length ? `더할 곳이 없어요. 못 찾은 곳: ${esc(x.missing.join(', '))}` : '대표 지역이 이미 모두 들어 있어요.'), !x.added && x.missing.length); };
  document.querySelectorAll('input[name=plan]').forEach(r => r.onchange = () => { st.plan = r.value; drawA(); sync(); });
  document.querySelectorAll('input[name=ch]').forEach(r => r.onchange = () => { st.channel = r.value; $('contact').placeholder = r.value === 'kakao' ? '받을 휴대폰 번호' : '받을 이메일 주소'; $('contact').autocomplete = r.value === 'kakao' ? 'tel' : 'email'; });
  const sync = () => { const T = B.PRICE[st.plan];
    if (window.JDJ_PRODUCTS && $('paidInfo') && $('paidInfo').getAttribute('data-p') !== st.plan) { $('paidInfo').innerHTML = JDJ_PRODUCTS.box(st.plan, { mode: 'info' }); $('paidInfo').setAttribute('data-p', st.plan); }   // 고른 요금제에 담긴 것·환불(assets/products.js) $('pay').textContent = PAID ? `월 ${won(T.amount)}원 결제하고 받기` : '유료 이용권은 곧 열려요'; $('brokerBox').hidden = !T.broker;
    const n = aptList().length; $('aptN').textContent = `(${T.label} ${T.apts}개까지${n > T.apts ? ` · 지금 ${n}개라 앞의 ${T.apts}개만 보내요` : ''})`; };
  $('apts').oninput = sync;
  drawA(); sync();
  /* 이른 아침 광고는 '광고성 정보 받기'가 켜져 있을 때만 고를 수 있음(자동으로 켜지 않음) */
  $('ad').onchange = () => { const on = $('ad').checked; $('amAd').disabled = !on; if (!on) $('amAd').checked = false; $('amL').className = on ? '' : 'dis'; $('amLock').hidden = on; };
  const saveAreas = () => A.update(d => { d.brief = { ...(d.brief || {}), areas: st.areas, apts: aptList().slice(0, LIM.apts), v: B.PRICE[st.plan].pro ? 'pro' : '' }; })
    .then(() => { try { localStorage.setItem('jdj_brief_apts', JSON.stringify(aptList().slice(0, B.PRICE[st.plan].apts))); } catch(e){} });
  const base = () => { const ch = (document.querySelector('input[name=ch]:checked') || {}).value;
    const need = (t, el) => Object.assign(new Error(t), { el: $(el) });
    if (!st.areas.length) throw need('받을 동네를 하나 이상 넣어 주세요. 고른 뒤 [이 동네 넣기]를 눌러요.', 'add');
    if (!ch) throw need('받는 방법을 골라 주세요.', 'contact');
    if (!$('contact').value.trim()) throw need(ch === 'kakao' ? '받을 휴대폰 번호를 적어 주세요.' : '받을 이메일 주소를 적어 주세요.', 'contact');
    if (!$('privacy').checked) throw need('발송용 연락처 수집·이용에 동의해 주세요.', 'privacy');
    return { channel: ch, contact: $('contact').value.trim(), privacy: true, ad: $('ad').checked, amAd: $('ad').checked && $('amAd').checked, ref: B.myRef(), dp: window.JDJ_DP && JDJ_DP.enabled() ? JDJ_DP.inviteCode() : '' }; };
  function msg(t, bad){ $('msg').className = 'msg ' + (bad ? 'err' : 'info'); $('msg').innerHTML = t; }
  /* 빠진 칸이 있으면 그 칸이 있는 단계로 옮겨 가서 바로 위에 알려 줌(맨 위 버튼을 눌러도 무엇이 빠졌는지 보이게) */
  const fieldErr = e => { document.querySelectorAll('.fmsg').forEach(x => { x.hidden = true; });
    const sec = e && e.el && e.el.closest('.step'), f = sec && sec.querySelector('.fmsg'); if (!f) return false;
    f.textContent = e.message; f.hidden = false; sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    setTimeout(() => { try { e.el.focus({ preventScroll: true }); } catch(x){} }, 350); return true; };
  const busy = (b, on, t) => { b.disabled = on; if (t) b.textContent = t; };
  const tBtns = () => [...document.querySelectorAll('.trialBtn')];
  const SF = window.JDJ_SAVEFB;
  const startTrial = async ev => {
    const cb = ev && ev.currentTarget;
    if (BBT) {   // v72 구매 고객 30일 무료: 동의 → 서버가 주문 확인 → 토스 카드 등록 창(돌아오면 구독 관리에서 체험 시작)
      try { const x = base(); if (!$('bbtAgree').checked) throw Object.assign(new Error('30일 무료 체험·카드 등록 안내를 확인하고 체크해 주세요.'), { el: $('bbtAgree') });
        tBtns().forEach(b => busy(b, true, '카드 등록 창을 여는 중…')); await saveAreas();
        const r = await call('briefBuyerTrial', Object.assign(x, { orderId: BBT.o, token: BBT.t, product: st.plan, agree: true }));
        if (window.JDJ && JDJ.track) JDJ.track('brief_trial_start', { n: st.areas.length, cta: CTA || '', kind: 'buyer' });
        ctaStat('sub');
        await JDJ_BILL.cardAuth(r.ck, r.clientKey, 'brief/manage/');
      } catch(e){ tBtns().forEach(b => busy(b, false, trialLbl)); if (fieldErr(e)) return; msg(esc(e.message), 1); }
      return;
    }
    try { const x = base(); tBtns().forEach(b => busy(b, true, '시작하는 중…')); await saveAreas(); const r = await call('briefTrial', x);
      document.querySelectorAll('.fmsg').forEach(f => { f.hidden = true; });
      const ok = `무료 체험을 시작했어요(${esc(r.sub.start)} ~ ${esc(r.sub.end)}). 내일 아침부터 ${esc(r.sub.contact)}(으)로 보내 드려요.${r.ref === 'ok' ? ' 친구 초대로 오셨어요. 이용권을 결제하면 두 분 모두 1개월 무료로 더 받아요.' : ''} <a href="../manage/">내 구독 관리</a>`;
      msg(ok); tBtns().forEach(b => b.remove()); if ($('stk')) $('stk').remove(); document.body.classList.remove('has-stk');
      if ($('trialBox')) $('trialBox').querySelector('.ts').innerHTML = ok;
      ($('trialBox') || $('msg')).scrollIntoView({ behavior: 'smooth', block: 'start' });
      try { localStorage.setItem('jdj_brief_sub', '1'); } catch(e){}
      if (window.JDJ && JDJ.track) JDJ.track('brief_trial_start', { n: st.areas.length, cta: CTA || '' });
      ctaStat('sub'); try { sessionStorage.removeItem('jdj_bcta_src'); } catch(e){}
    } catch(e){ tBtns().forEach(b => busy(b, false, trialLbl)); if (fieldErr(e)) return;
      msg(esc(e.message), 1);
      /* 누른 버튼 바로 아래에도 빨간 안내(아래 고정 버튼이면 안내 칸으로 스크롤) — assets/savefb.js */
      if (cb && cb.id !== 'trialStk' && cb.id !== 'trial') SF.err(cb, e.message); else SF.err(null, esc(e.message), { msg: 'msg', html: true }); }
  };
  tBtns().forEach(b => { b.onclick = startTrial; });
  /* 휴대폰: 화면 아래 고정 버튼(맨 위·맨 아래 버튼이 보일 때는 숨김) */
  if ($('stk') && 'IntersectionObserver' in window) {
    document.body.classList.add('has-stk');
    const seen = new Set(), io = new IntersectionObserver(es => { es.forEach(x => x.isIntersecting ? seen.add(x.target) : seen.delete(x.target)); if ($('stk')) $('stk').hidden = seen.size > 0; });
    ['trialTop', 'trial'].forEach(id => $(id) && io.observe($(id)));
  }
  /* [동네만 저장하기]: '저장 중…' → '✓ 저장했어요', 안내는 버튼 바로 아래 칸(#msg)에, 화면 밖이면 그 자리로 스크롤 */
  if ($('saveOnly')) $('saveOnly').onclick = () => { SF.busy('saveOnly'); saveAreas().then(() => SF.ok('saveOnly', '동네를 저장했어요. 다음 날 브리핑부터 바뀌어요.', { msg: 'msg' })).catch(e => SF.err('saveOnly', esc(e.message), { msg: 'msg', html: true })); };
  $('pay').onclick = async () => {
    if (!PAID) return msg('유료 이용권은 곧 열려요. 지금은 7일 무료 체험만 할 수 있어요.', 1);
    const b = $('pay');
    try {
      const x = base(); if (!$('terms').checked) throw new Error('1개월 이용권·환불 안내를 확인해 주세요.');
      if (B.PRICE[st.plan].broker) { const bn = B.brokerNo($('broker').value); if (!bn.ok) { $('broker').focus(); throw new Error(bn.err + ' 중개사 전용 할인가라서 확인해요.'); } x.broker = bn.norm; }
      busy(b, true, '결제창을 여는 중…'); await saveAreas();
      const o = await call('briefOrder', Object.assign(x, { product: st.plan, agree: true }));
      if (window.JDJ && JDJ.track) JDJ.track('brief_subscribe', { cta: CTA || '' });   // 구독 결제 시작(금액·연락처 없이 어느 자리에서 왔는지만)
      await new Promise((ok, no) => { if (window.TossPayments) return ok(); const s = document.createElement('script'); s.src = P.SDK; s.onload = ok; s.onerror = () => no(new Error('결제창을 불러오지 못했어요.')); document.head.appendChild(s); });
      const toss = window.TossPayments(P.CLIENT_KEY), w = toss.payment({ customerKey: window.TossPayments.ANONYMOUS || 'ANONYMOUS' });
      const root = location.origin + JB.SITE + 'brief/';
      const req = { method: 'CARD', amount: { currency: 'KRW', value: o.amount }, orderId: o.orderId, orderName: o.orderName, successUrl: root + 'paid/', failUrl: root + 'subscribe/?fail=1', card: { flowMode: 'DEFAULT' } };
      if (x.channel === 'email') req.customerEmail = x.contact.toLowerCase(); else req.customerMobilePhone = x.contact.replace(/[^0-9]/g, '');
      await w.requestPayment(req);
    } catch(e){ busy(b, false); sync(); if (fieldErr(e)) return; SF.err(null, esc(e && e.code === 'USER_CANCEL' ? '결제를 취소했어요.' : (e.message || '결제를 시작하지 못했어요.')), { msg: 'msg', html: true }); }
  };
}
boot();
})();
</script>
<script>window.JDJ_BRIEF && JDJ_BRIEF.fillNames();</script>
</body>
