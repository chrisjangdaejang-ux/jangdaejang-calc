<body>
<header class="top">
  <a class="brand" href="/jangdaejang-calc/" aria-label="집예보 홈"><svg class="bi" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#B8942A"/><path d="M5 12.5 12 6.5l7 6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M7.5 11v7h9v-7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/><circle cx="18.2" cy="5.8" r="1.8" fill="#fff"/></svg>집예보</a>
  <div class="badge plain">프리미엄 리포트</div>
</header>
<main class="pay" id="main">
  <div class="eyebrow">프리미엄 리포트 · 결제 확인</div>
  <h1>결제를 확인하고 있습니다</h1>
  <div class="msg info"><span class="spin"></span>잠시만 기다려 주세요. 이 화면을 닫지 마세요.</div>
</main>
<footer class="foot">★ 집예보 · <a href="/jangdaejang-calc/">홈</a></footer>
<script>
(function(){
  const P = JDJ_PAY, esc = P.esc, main = document.getElementById('main');
  const Q = new URLSearchParams(location.search);
  const paymentKey = Q.get('paymentKey') || '', orderId = Q.get('orderId') || '', amount = Number(Q.get('amount'));
  const head = '<div class="eyebrow">프리미엄 리포트 · 결제 확인</div>';
  function done(j){
    P.saveOrder({ o: j.orderId, t: j.token, product: j.product, names: j.names, paidAt: j.paidAt });
    history.replaceState(null, '', location.pathname + '?done=' + encodeURIComponent(j.orderId));   // 주소창에서 결제키 지우기
    const url = P.viewUrl(j.orderId, j.token);
    main.innerHTML = head + `<h1>결제가 완료되었습니다</h1>
      <section class="card2 key">
        <dl class="kv"><dt>주문번호</dt><dd>${esc(j.orderId)}</dd><dt>상품</dt><dd>장대장 ${esc(j.product)}</dd><dt>단지</dt><dd>${esc(j.names)}</dd>
        <dt>결제 금액</dt><dd>${P.won(j.amount)}</dd><dt>결제일</dt><dd>${esc(j.paidAt)}</dd></dl>
        <div class="btnrow"><a class="btn2 blue" href="${esc(url)}">리포트 보러 가기</a></div>
      </section>
      <div class="msg info"><b>주문번호를 보관해 주세요.</b> 다른 기기에서는 [프리미엄 리포트 → 구매한 리포트 다시 보기]에서 주문번호와 연락처(휴대폰 뒤 4자리 또는 이메일)로 다시 열 수 있습니다. 이 기기에서는 자동으로 기억합니다.</div>
      <div class="msg info">리포트를 <b>열기 전</b>에는 결제일부터 7일 이내 전액 환불을 요청할 수 있습니다. 리포트 화면에 들어가면 먼저 환불 가능 여부를 보여 드리고, [리포트 열기]를 누를 때 제공이 시작됩니다.</div>`;
  }
  function fail(msg, retry){
    main.innerHTML = head + `<h1>결제를 완료하지 못했습니다</h1><div class="msg err">${esc(msg)}</div>
      ${retry ? '<div class="btnrow"><button type="button" class="btn2 blue" id="retry">다시 확인하기</button></div>' : ''}
      <p class="links">결제 금액이 빠져나갔는데 이 화면이 보이면 주문번호(${esc(orderId || '-')})와 함께 고객문의로 알려 주세요. 승인되지 않은 결제는 자동으로 취소되며, 확인 후 바로 처리해 드립니다.</p>
      <div class="btnrow"><a class="btn2" href="${P.ROOT}">프리미엄 리포트 안내로</a></div>`;
    const r = document.getElementById('retry'); if (r) r.onclick = () => location.reload();
  }
  if (!paymentKey || !orderId || !(amount > 0)) {
    const mine = P.orders()[0];
    if (Q.get('done') && mine && mine.o === Q.get('done')) return done({ orderId: mine.o, token: mine.t, product: mine.product, names: mine.names, paidAt: mine.paidAt, amount: (P.PRODUCTS[Object.keys(P.PRODUCTS).find(k => P.PRODUCTS[k].name === mine.product)] || {}).amount });
    return fail('결제 정보가 없습니다. 결제 화면에서 다시 시도해 주세요.', false);
  }
  P.post('confirmPayment', { paymentKey, orderId, amount })
    .then(j => { P.stat(); done(j); })
    .catch(x => fail(x.message, !!x.net));
})();
</script>
</body>
