</head>
<body>
<header class="top">
  <a class="brand" href="../../" aria-label="집예보 홈"><svg class="bi" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#4338CA"/><path d="M29 47 V78 H71 V47 Z" fill="#FFFFFF"/><path d="M20 51 L50 26 L80 51" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="50" cy="59" r="6" fill="#4338CA"/><path d="M46.5 62 L44 74 H56 L53.5 62 Z" fill="#4338CA"/><circle cx="76" cy="24" r="5" fill="#5EEAD4"/></svg>집예보</a>
  <div class="badge plain">프리미엄 리포트</div>
</header>
<main class="pay" id="main">
  <div class="eyebrow">프리미엄 리포트 · 결제 확인</div>
  <h1>결제를 확인하고 있어요</h1>
  <div class="msg info"><span class="spin"></span>잠시만 기다려 주세요. 이 화면을 닫지 마세요.</div>
</main>
<footer class="foot">★ 집예보 · <a href="../../">홈</a></footer>
<script>
(function(){
  const P = JDJ_PAY, esc = P.esc, main = document.getElementById('main');
  const Q = new URLSearchParams(location.search);
  const paymentKey = Q.get('paymentKey') || '', orderId = Q.get('orderId') || '', amount = Number(Q.get('amount'));
  const head = '<div class="eyebrow">프리미엄 리포트 · 결제 확인</div>';
  function done(j){
    P.saveOrder({ o: j.orderId, t: j.token, product: P.prodName(j.product), names: j.names, paidAt: j.paidAt });
    history.replaceState(null, '', location.pathname + '?done=' + encodeURIComponent(j.orderId));   // 주소창에서 결제키 지우기
    const url = P.viewUrl(j.orderId, j.token);
    main.innerHTML = head + `<h1>결제가 완료됐어요</h1>
      <section class="card2 key">
        <dl class="kv"><dt>주문번호</dt><dd>${esc(j.orderId)}</dd><dt>상품</dt><dd>${esc(((window.JDJ_SITE && window.JDJ_SITE.SITE_NAME) || '집예보'))} ${esc(P.prodName(j.product))}</dd><dt>단지</dt><dd>${esc(j.names)}</dd>
        <dt>결제 금액</dt><dd>${P.won(j.amount)}</dd><dt>결제일</dt><dd>${esc(j.paidAt)}</dd></dl>
        <div class="btnrow"><a class="btn2 blue" href="${esc(url)}">리포트 보러 가기</a></div>
      </section>
      <div class="msg info"><b>주문번호를 보관해 주세요.</b> 다른 기기에서는 [프리미엄 리포트 → 구매한 리포트 다시 보기]에서 주문번호와 연락처(휴대폰 뒤 4자리 또는 이메일)로 다시 열 수 있어요. 이 기기에서는 자동으로 기억해요.</div>
      <div class="msg info">리포트를 <b>열기 전</b>에는 결제일부터 7일 이내 전액 환불을 요청할 수 있어요. 리포트 화면에 들어가면 먼저 환불 가능 여부를 보여 드리고, [리포트 열기]를 누를 때 제공이 시작돼요.</div>`;
    /* 결제 완료 → '매일 아침 이어서 받아 보세요'(산 상품·고른 단지에 맞춘 모닝 브리핑 안내). 단지는 이 탭의 결제 화면 주소(k=)에서만 읽어요 */
    if (window.JDJ_PRODUCTS) { let ks = []; try { ks = new URLSearchParams((sessionStorage.getItem('jdj_pay_back') || '').split('?')[1] || '').get('k') || ''; ks = ks ? ks.split('!') : []; } catch (e) { ks = []; }
      main.insertAdjacentHTML('beforeend', JDJ_PRODUCTS.briefCard(JDJ_PRODUCTS.idOfServerName(j.product) || 'single', JDJ_PRODUCTS.ctxFromKeys(ks))); }
  }
  function fail(msg, retry){
    main.innerHTML = head + `<h1>결제를 완료하지 못했어요</h1><div class="msg err">${esc(msg)}</div>
      ${retry ? '<div class="btnrow"><button type="button" class="btn2 blue" id="retry">다시 확인하기</button></div>' : ''}
      <p class="links">결제 금액이 빠져나갔는데 이 화면이 보이면 주문번호(${esc(orderId || '-')})와 함께 고객문의로 알려 주세요. 승인되지 않은 결제는 자동으로 취소되며, 확인 후 바로 처리해 드려요.</p>
      <div class="btnrow"><a class="btn2" href="${P.ROOT}">프리미엄 리포트 안내로</a></div>`;
    const r = document.getElementById('retry'); if (r) r.onclick = () => location.reload();
  }
  if (orderId.indexOf(P.REVIEW_PREFIX) === 0) {   // 심사용 테스트 결제: 승인 요청을 보내지 않음(청구 없음)
    history.replaceState(null, '', location.pathname + '?review=1');
    main.innerHTML = head + `<h1>테스트 결제창 확인을 마쳤어요</h1>
      <div class="msg info"><b>테스트 결제 · 실제 청구 없음</b><br>토스페이먼츠 테스트 환경에서 결제창이 정상으로 열리고 돌아왔어요. 심사용 테스트라 결제 승인 요청을 보내지 않았고, 돈이 빠져나가지 않아요.</div>
      <section class="card2 key"><dl class="kv"><dt>테스트 주문번호</dt><dd>${esc(orderId)}</dd><dt>금액</dt><dd>${amount > 0 ? P.won(amount) : '-'}</dd></dl></section>
      <p class="links">공공데이터를 정리·분석한 정보 제공 서비스이며, 특정 부동산의 매수·매도를 권유하지 않아요.</p>
      <div class="btnrow"><a class="btn2" href="${P.ROOT}">프리미엄 리포트 안내로</a></div>`;
    return;
  }
  if (!paymentKey || !orderId || !(amount > 0)) {
    const mine = P.orders()[0];
    if (Q.get('done') && mine && mine.o === Q.get('done')) return done({ orderId: mine.o, token: mine.t, product: mine.product, names: mine.names, paidAt: mine.paidAt, amount: (P.PRODUCTS[Object.keys(P.PRODUCTS).find(k => P.PRODUCTS[k].name === mine.product)] || {}).amount });
    return fail('결제 정보가 없어요. 결제 화면에서 다시 시도해 주세요.', false);
  }
  P.post('confirmPayment', { paymentKey, orderId, amount })
    .then(j => { P.stat(); done(j); })
    .catch(x => fail(x.message, !!x.net));
})();
</script>
</body>
</html>
