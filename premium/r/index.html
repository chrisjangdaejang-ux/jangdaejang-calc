<script>/* 고객 링크의 # 값(링크 id.토큰)은 통계 도구가 주소를 읽기 전에 주소창에서 지우고 이 탭에만 둡니다 */
(function(){ var h = location.hash, ok = /^#P[0-9A-F]{11}\.[0-9a-fA-F]{64}$/;
  if (ok.test(h)) { try { sessionStorage.setItem('jdj_pro_in', h); } catch (e) {} try { history.replaceState(null, '', location.pathname); } catch (e) {} }
  else { try { h = sessionStorage.getItem('jdj_pro_in') || ''; } catch (e) { h = ''; } }
  window.JDJ_PRO_IN = ok.test(h) ? h : ''; })();</script>

<header class="top">
  <a class="brand" href="/jangdaejang-calc/?utm_source=pro" aria-label="집예보 홈"><svg class="bi" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#B8942A"/><path d="M5 12.5 12 6.5l7 6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M7.5 11v7h9v-7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/><circle cx="18.2" cy="5.8" r="1.8" fill="#fff"/></svg>집예보</a>

</header>
<main class="pay" id="main">
  <div id="box"><div class="msg info"><span class="spin"></span>리포트를 열고 있어요…</div></div>
</main>
<footer class="foot">★ 집예보 · <a href="/jangdaejang-calc/?utm_source=pro">홈</a></footer>
<script>
(function(){
  const P = JDJ_PAY, R = JDJ_PRO, esc = P.esc, box = document.getElementById('box');
  const h = R.parseHash(window.JDJ_PRO_IN);
  const errBox = m => { box.innerHTML = `<h1>리포트를 열 수 없어요</h1><div class="msg err">${esc(m)}</div>
    <div class="btnrow"><a class="btn2" href="/jangdaejang-calc/?utm_source=pro">집예보에서 직접 찾아보기</a></div>`; };
  if (!h) return errBox('링크 주소가 끝까지 복사되지 않았어요. 받은 메시지의 링크를 다시 눌러 주세요.');
  const st = (f) => { try { if (window.jdjStat) window.jdjStat('feature_use', { feature: f }); } catch (e) {} };
  P.post('proOpen', { id: h.id, tk: h.tk }).then(async j => {
    const v = j.report, p = R.cleanProfile(v.profile);
    document.title = p.office + ' · 단지 분석 리포트 | 집예보';
    box.innerHTML = `<div class="noprint btnrow" style="margin:0 0 10px"><button type="button" class="btn2" id="pdfBtn">PDF로 저장 · 인쇄</button></div>
      ${R.headHtml(p)}<div id="rep"></div>`;
    document.getElementById('pdfBtn').onclick = () => window.print();
    st('pro_view');
    box.addEventListener('click', e => {
      if (e.target.closest('[data-pro-ask]')) { document.body.insertAdjacentHTML('beforeend', R.askSheet(p)); st('pro_ask'); return; }
    });
    document.body.addEventListener('click', e => {
      const c = e.target.closest('[data-pro-click]');
      if (c) P.post('proClick', { id: h.id, tk: h.tk, kind: c.dataset.proClick }).catch(() => {});
      const sh = document.querySelector('.pro-sheet');
      if (sh && (e.target.closest('[data-pro-close]') || e.target === sh)) sh.remove();
    });
    const secs = R.cleanSecs(v.secs);
    try {
      await JDJ_PREMIUM.render(document.getElementById('rep'), v.keys || [], { product: '', orderId: '', paidAt: '', expires: v.expires }, {
        readOnly: secs.indexOf('money') >= 0 ? 'money' : 1, cond: v.cond || null,
        cover: (o, items, dataTo) => R.coverHtml(p, { items, client: v.client, created: v.created, expires: v.expires, dataTo }),
        after: (b, items, x) => {
          R.apply(b, { profile: p, secs, notes: v.notes });
          const now = String(x.dataTo || '').slice(0, 6), then = String(v.dataTo || '');
          b.insertAdjacentHTML('beforeend', R.footHtml({ refresh: true }));
          if (then && now && then !== now) b.querySelector('.pr-cover').insertAdjacentHTML('afterend', `<p class="pro-fresh">보낸 뒤 새 실거래 자료(${esc(R.ym6(now))}까지)가 들어와 숫자가 바뀌었을 수 있어요. 전문가 의견은 ${esc(R.ym6(then))} 자료를 보고 쓴 글이에요.</p>`);
        }
      });
    } catch (e) { document.getElementById('rep').innerHTML = '<div class="msg err">실거래 자료를 불러오지 못했어요. 잠시 뒤 새로고침해 주세요.</div>'; }
  }).catch(x => errBox(x.message));
})();
</script>
