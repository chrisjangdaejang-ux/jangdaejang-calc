<body>
<header class="top">
  <a class="brand" href="../../" aria-label="집코드 홈"><svg class="bi" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#4338CA"/><path d="M29 47 V78 H71 V47 Z" fill="#FFFFFF"/><path d="M20 51 L50 26 L80 51" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="50" cy="59" r="6" fill="#4338CA"/><path d="M46.5 62 L44 74 H56 L53.5 62 Z" fill="#4338CA"/><circle cx="76" cy="24" r="5" fill="#5EEAD4"/></svg>집코드</a>
  <div class="badge plain">프리미엄 리포트</div>
</header>
<main class="pay" id="main">
  <div class="eyebrow">프리미엄 리포트</div>
  <div id="box"><div class="msg info"><span class="spin"></span>주문을 확인하고 있습니다…</div></div>
</main>
<footer class="foot">★ 집코드 · <a href="../../">홈</a></footer>
<script>
var JB = (typeof window !== 'undefined' && window.JDJ_BASE) || (function (p) { var g = p.indexOf('/jangdaejang-calc/') === 0, b = { SITE: g ? '/jangdaejang-calc/' : '/', DATA: g ? '/jangdaejang-data/' : 'https://chrisjangdaejang-ux.github.io/jangdaejang-data/' }; if (typeof window !== 'undefined') window.JDJ_BASE = b; return b; })((typeof location !== 'undefined' && location.pathname) || '/jangdaejang-calc/');
(function(){
  const P = JDJ_PAY, esc = P.esc, box = document.getElementById('box');
  const Q = new URLSearchParams(location.search), o = Q.get('o') || '', t = Q.get('t') || '';
  const again = `<div class="btnrow"><a class="btn2" href="${P.ROOT}#again">구매한 리포트 다시 보기</a></div>`;
  const kv = s => `<dl class="kv"><dt>주문번호</dt><dd>${esc(s.orderId)}</dd><dt>상품</dt><dd>${esc(((window.JDJ_SITE && window.JDJ_SITE.SITE_NAME) || '집코드'))} ${esc(s.product)}</dd><dt>단지</dt><dd>${esc(s.names)}</dd><dt>결제</dt><dd>${P.won(s.amount)} · ${esc(s.paidAt)}</dd></dl>`;
  const errBox = m => { box.innerHTML = `<h1>리포트를 열 수 없습니다</h1><div class="msg err">${esc(m)}</div>${again}`; };
  if (!o || !t) return errBox('주소에 주문 정보가 없습니다. 결제 완료 화면의 링크로 들어오시거나, 주문번호와 연락처로 다시 찾아 주세요.');

  function gate(s){
    if (s.refund) {
      box.innerHTML = `<h1>환불 요청이 접수된 주문입니다</h1><section class="card2">${kv(s)}
        <div class="msg info">환불 요청 상태: <b>${esc(s.refund)}</b><br>영업일 기준 3일 이내에 처리해 드립니다. 결제 수단으로 환불되며, 카드사 사정에 따라 반영까지 며칠 더 걸릴 수 있습니다.</div></section>`;
      return;
    }
    if (s.expired) return errBox('열람 기간(결제일부터 1년)이 지났습니다.');
    box.innerHTML = `<h1>리포트를 열기 전에 확인해 주세요</h1>
      <section class="card2">${kv(s)}</section>
      ${s.refundable
        ? `<div class="msg ok"><b>아직 열람 전이라 ${esc(s.refundUntil)}까지(결제일부터 7일) 전액 환불이 가능합니다.</b></div>`
        : `<div class="msg info">결제일부터 7일이 지나 단순 변심 환불 기간은 끝났습니다. 시스템 오류나 상품 안내와 다른 내용은 언제든 환불을 요청하실 수 있습니다.</div>`}
      <section class="gate">
        <h2>리포트 열기</h2>
        <p style="margin:0 0 6px;font-size:14.5px;color:var(--sub)">[리포트 열기]를 누르면 리포트 제공이 시작되어, 「전자상거래법」 제17조 제2항 제5호에 따라 단순 변심으로 인한 청약철회(환불)가 제한됩니다.</p>
        <div class="btnrow"><button type="button" class="btn2 blue" id="openBtn">확인했습니다 · 리포트 열기</button></div>
      </section>
      <section class="card2"><h2>환불 요청</h2>
        <p style="margin:0;font-size:14.5px;color:var(--sub)">요청을 남기면 운영자가 확인 후 토스페이먼츠를 통해 결제를 취소해 드립니다(영업일 3일 이내). 자동으로 바로 취소되지는 않습니다.</p>
        <div class="pfield"><label for="rsn">사유 (선택)</label><select id="rsn"><option>단순 변심</option><option>잘못 결제함(상품·단지 선택 실수)</option><option>리포트가 열리지 않음(오류)</option><option>기타</option></select></div>
        <button type="button" class="btn2 warn" id="refBtn" style="width:100%">환불 요청하기</button>
        <div class="msg" id="rMsg" role="alert"></div>
      </section>`;
    document.getElementById('openBtn').onclick = openIt;
    document.getElementById('refBtn').onclick = async () => {
      const b = document.getElementById('refBtn'), m = document.getElementById('rMsg');
      b.disabled = true; m.className = 'msg info'; m.innerHTML = '<span class="spin"></span>접수 중…';
      try { const j = await P.post('refundRequest', { o, t, reason: document.getElementById('rsn').value }); gate(j.order); window.scrollTo(0, 0); }
      catch (x) { b.disabled = false; m.className = 'msg err'; m.textContent = x.message; }
    };
  }
  async function openIt(){
    const b = document.getElementById('openBtn'); if (b) { b.disabled = true; b.textContent = '여는 중…'; }
    try {
      const j = await P.post('openReport', { o, t, open: true });
      P.saveOrder({ o, t, product: j.order.product, names: j.order.names, paidAt: j.order.paidAt });
      show(j);
    } catch (x) { errBox(x.message); }
  }
  async function show(j){
    const ks = j.keys || [];
    if (window.JDJ_CYP && ks.length === 1 && JDJ_CYP.isCyKey(ks[0])) {   /* 청약 분양가 리포트 */
      box.innerHTML = `<div class="vtools noprint btnrow" style="margin:0 0 6px"><button type="button" class="btn2 blue" id="pdfBtn">PDF로 저장 · 인쇄</button><a class="btn2" href="${JB.SITE}chungyak/">청약 공고 목록</a></div>
        <div class="links noprint" style="margin:0 0 8px">최초 열람 ${esc(j.order.firstViewAt)} · PDF 저장은 인쇄 창에서 대상(프린터)을 [PDF로 저장]으로 고르세요.</div><div id="rep"></div>`;
      document.getElementById('pdfBtn').onclick = () => window.print();
      document.title = '집코드 청약 분양가 리포트 · ' + j.order.names;
      P.stat();
      try { await JDJ_CYP.renderPaid(document.getElementById('rep'), ks[0], j.order); }
      catch (e) { document.getElementById('rep').innerHTML = '<div class="msg err">분석 자료를 불러오지 못했습니다. 당첨자 발표가 끝나 자료가 내려간 공고일 수 있어요. 고객문의로 알려 주시면 확인 후 PDF로 보내 드리거나 환불 정책에 따라 전액 환불해 드립니다.</div>'; }
      return;
    }
    box.innerHTML = `<div class="vtools noprint btnrow" style="margin:0 0 6px"><button type="button" class="btn2 blue" id="pdfBtn">PDF로 저장 · 인쇄</button><a class="btn2" href="${P.ROOT}pro/?o=${encodeURIComponent(o)}&t=${encodeURIComponent(t)}">내 이름으로 고객에게 보내기</a><a class="btn2" href="${P.ROOT}">프리미엄 리포트 안내</a></div>
      <div class="links noprint" style="margin:0 0 6px">공인중개사·분양대행사·부동산 컨설턴트·세무사 등 전문가라면 이 리포트에 상호·로고·연락처와 내 의견을 넣어 고객에게 링크나 PDF로 보낼 수 있어요. 집코드 숫자는 그대로예요.</div>
      <div class="links noprint" style="margin:0 0 8px">최초 열람 ${esc(j.order.firstViewAt)} · PDF 저장은 인쇄 창에서 대상(프린터)을 [PDF로 저장]으로 고르세요.</div><div id="rep"></div>`;
    document.getElementById('pdfBtn').onclick = () => window.print();
    document.title = ((window.JDJ_SITE && window.JDJ_SITE.SITE_NAME) || '집코드') + ' 프리미엄 리포트 · ' + j.order.names;
    P.stat();
    try { await JDJ_PREMIUM.render(document.getElementById('rep'), j.keys || [], j.order); }
    catch (e) { document.getElementById('rep').innerHTML = '<div class="msg err">실거래 자료를 불러오지 못했습니다. 잠시 후 새로고침해 주세요. 계속 열리지 않으면 환불 정책에 따라 전액 환불해 드립니다.</div>'; }
  }
  P.post('openReport', { o, t })
    .then(j => j.order.viewed ? openIt() : gate(j.order))
    .catch(x => errBox(x.message));
})();
</script>
