<header class="top">
  <a class="brand" href="/jangdaejang-calc/" aria-label="집예보 홈"><svg class="bi" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#B8942A"/><path d="M5 12.5 12 6.5l7 6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M7.5 11v7h9v-7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/><circle cx="18.2" cy="5.8" r="1.8" fill="#fff"/></svg>집예보</a>
  <div class="badge plain">프리미엄 리포트</div>
</header>
<main class="pay">
  <div class="eyebrow">프리미엄 리포트 · 결제</div>
  <h1 id="ft">결제가 완료되지 않았습니다</h1>
  <div class="msg err" id="fm"></div>
  <section class="card2">
    <h2>안내</h2>
    <ul style="margin:0;padding-left:20px;font-size:14.5px;color:var(--sub)">
      <li>결제가 완료되지 않아 <b>금액은 청구되지 않았습니다.</b> 카드사 승인 문자가 왔다면 자동 취소되며, 취소 시점은 카드사마다 다를 수 있습니다.</li>
      <li>같은 상품으로 다시 결제하려면 아래 [다시 결제하기]를 눌러 주세요.</li>
      <li>문제가 계속되면 화면 아래 고객문의로 주문번호와 함께 알려 주세요.</li>
    </ul>
    <dl class="kv" id="fk" style="margin-top:12px"></dl>
    <div class="btnrow"><a class="btn2 blue" id="again" href="/jangdaejang-calc/premium/">다시 결제하기</a><a class="btn2" href="/jangdaejang-calc/premium/">프리미엄 리포트 안내</a></div>
  </section>
</main>
<footer class="foot">★ 집예보 · <a href="/jangdaejang-calc/">홈</a></footer>
<script>
(function(){
  const P = JDJ_PAY, esc = P.esc, $ = id => document.getElementById(id);
  const Q = new URLSearchParams(location.search);
  const code = Q.get('code') || '', msg = Q.get('message') || '', oid = Q.get('orderId') || '';
  const cancel = code === 'PAY_PROCESS_CANCELED' || code === 'USER_CANCEL';
  $('ft').textContent = cancel ? '결제를 취소했습니다' : '결제가 완료되지 않았습니다';
  $('fm').textContent = cancel ? '결제창에서 결제를 취소하셨습니다. 금액은 청구되지 않았습니다.' : (msg || '결제 중 문제가 생겼습니다.');
  $('fk').innerHTML = (oid ? `<dt>주문번호</dt><dd>${esc(oid)}</dd>` : '') + (code ? `<dt>오류 코드</dt><dd>${esc(code)}</dd>` : '');
  let back = ''; try { back = sessionStorage.getItem('jdj_pay_back') || ''; } catch(e){}
  if (/^\/jangdaejang-calc\/premium\/checkout\/\?/.test(back)) $('again').href = back;
})();
</script>
