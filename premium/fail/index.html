<script>
var JB = (typeof window !== 'undefined' && window.JDJ_BASE) || (function (p) { var g = p.indexOf('/jangdaejang-calc/') === 0, b = { SITE: g ? '/jangdaejang-calc/' : '/', DATA: g ? '/jangdaejang-data/' : 'https://chrisjangdaejang-ux.github.io/jangdaejang-data/' }; if (typeof window !== 'undefined') window.JDJ_BASE = b; return b; })((typeof location !== 'undefined' && location.pathname) || '/jangdaejang-calc/');
(function(){
  const P = JDJ_PAY, esc = P.esc, $ = id => document.getElementById(id);
  const Q = new URLSearchParams(location.search);
  const code = Q.get('code') || '', msg = Q.get('message') || '', oid = Q.get('orderId') || '';
  const cancel = code === 'PAY_PROCESS_CANCELED' || code === 'USER_CANCEL';
  $('ft').textContent = cancel ? '결제를 취소했어요' : '결제가 완료되지 않았어요';
  $('fm').textContent = cancel ? '결제창에서 결제를 취소하셨어요. 금액은 청구되지 않았어요.' : (msg || '결제 중 문제가 생겼어요.');
  $('fk').innerHTML = (oid ? `<dt>주문번호</dt><dd>${esc(oid)}</dd>` : '') + (code ? `<dt>오류 코드</dt><dd>${esc(code)}</dd>` : '');
  let back = ''; try { back = sessionStorage.getItem('jdj_pay_back') || ''; } catch(e){}
  if (back.indexOf(JB.SITE + 'premium/checkout/?') === 0) $('again').href = back;
})();
