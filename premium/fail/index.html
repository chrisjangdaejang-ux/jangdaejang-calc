<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" type="image/png" href="/jangdaejang-calc/assets/icons/favicon-48.png">
<script src="/jangdaejang-calc/assets/biz.js" defer></script>
<title>결제 실패·취소 · 프리미엄 리포트 | 장대장 계산기</title>
<script>window.JDJ_CONFIG = { tool:'premium', GA4_ID:'G-V2VR9VL7EM', CLARITY_ID:'' };</script>
<script src="../../assets/track.js"></script>
<script src="../../assets/stat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/jangdaejang-calc/assets/aplus.css?v=38">
<link rel="stylesheet" href="/jangdaejang-calc/assets/pay.css?v=1">
<script src="/jangdaejang-calc/assets/agents.js"></script>
<script src="/jangdaejang-calc/assets/pay.js?v=1"></script>
</head>
<body>
<header class="top">
  <a class="brand" href="/jangdaejang-calc/"><span class="star" aria-hidden="true">★</span> 장대장 <span class="acc">계산기</span></a>
  <div class="badge">PREMIUM INSIGHT</div>
</header>
<main class="pay">
  <div class="eyebrow">프리미엄 리포트 · 결제</div>
  <h1 id="ft">결제가 완료되지 않았습니다</h1>
  <div class="msg err" id="fm"></div>
  <section class="card2">
    <h2>안내</h2>
    <ul style="margin:0;padding-left:20px;font-size:14.5px;color:var(--sub)">
      <li>결제가 완료되지 않아 <b>금액은 청구되지 않았습니다.</b> 카드사 승인 문자가 왔다면 자동 취소되며, 취소 시점은 카드사마다 다를 수 있습니다.</li>
      <li>같은 상품으로 다시 결제하려면 아래 [다시 결제하기]를 눌러 주세요.</li>
      <li>문제가 계속되면 화면 아래 고객문의로 주문번호와 함께 알려 주세요.</li>
    </ul>
    <dl class="kv" id="fk" style="margin-top:12px"></dl>
    <div class="btnrow"><a class="btn2 blue" id="again" href="/jangdaejang-calc/premium/">다시 결제하기</a><a class="btn2" href="/jangdaejang-calc/premium/">프리미엄 리포트 안내</a></div>
  </section>
</main>
<footer class="foot">★ 장대장부동산그룹 · <a href="/jangdaejang-calc/">계산기 홈</a></footer>
<script>
(function(){
  const P = JDJ_PAY, esc = P.esc, $ = id => document.getElementById(id);
  const Q = new URLSearchParams(location.search);
  const code = Q.get('code') || '', msg = Q.get('message') || '', oid = Q.get('orderId') || '';
  const cancel = code === 'PAY_PROCESS_CANCELED' || code === 'USER_CANCEL';
  $('ft').textContent = cancel ? '결제를 취소했습니다' : '결제가 완료되지 않았습니다';
  $('fm').textContent = cancel ? '결제창에서 결제를 취소하셨습니다. 금액은 청구되지 않았습니다.' : (msg || '결제 중 문제가 생겼습니다.');
  $('fk').innerHTML = (oid ? `<dt>주문번호</dt><dd>${esc(oid)}</dd>` : '') + (code ? `<dt>오류 코드</dt><dd>${esc(code)}</dd>` : '');
  let back = ''; try { back = sessionStorage.getItem('jdj_pay_back') || ''; } catch(e){}
  if (/^\/jangdaejang-calc\/premium\/checkout\/\?/.test(back)) $('again').href = back;
})();
</script>
</body>
</html>
