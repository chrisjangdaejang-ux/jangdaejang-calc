<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="../../manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="../../assets/icons/favicon-48.png">
<link rel="apple-touch-icon" href="../../assets/icons/apple-180.png">
<script src="../../assets/pwa.js?v=3" defer data-nobar></script>
<title>주간 블로그·인스타 글 | 집예보</title>
<meta name="description" content="내 지역의 이번 주 실거래·신고가·하락 거래·청약 일정을 공개 자료로 정리한 블로그 글, 인스타 카드 이미지, 설명글을 한 번에 만들어요.">
<script>window.JDJ_CONFIG = { tool:'agent_content', GA4_ID:'G-V2VR9VL7EM', CLARITY_ID:'' };</script>
<script src="../../assets/config.js?v=14"></script>
<script src="../../assets/track.js?v=3"></script>
<script src="../../assets/agents.js"></script>
<script src="../../assets/auth.js?v=11"></script>
<script src="../../assets/brief-core.js?v=12"></script>
<script src="../../assets/pro-report.js?v=7"></script>
<script src="../../assets/broker-tools.js?v=7"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/aplus.css?v=50">
<style>
[hidden]{display:none!important}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:clamp(22px,5.4vw,30px);margin:4px 0 6px;line-height:1.3;letter-spacing:-.03em}
.lead{font-size:15.5px;color:#4E5968;margin:0 0 14px;line-height:1.6}
.ed,.box{border:1px solid var(--line);border-radius:18px;padding:16px;background:#fff;margin:12px 0}
.ed h2,.box h2{font-size:17px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ed label,.bt-l{display:block;font-size:13.5px;font-weight:700;color:#4E5968;margin:10px 0 5px}
.ed input,.ed select{width:100%;box-sizing:border-box;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;color:#191F28}
.bt-two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media(max-width:560px){.bt-two{grid-template-columns:1fr}}
.hint,.bt-h{font-size:13px;color:#4E5968;margin:4px 0 0;line-height:1.5}
.err,.bt-e{color:#C2410C;font-weight:700;font-size:14px;margin-top:8px;min-height:1em}
.quota{font-size:14px;background:#F2F6FF;border-radius:12px;padding:10px 12px;margin:10px 0 0;line-height:1.55}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.acts .btn{min-height:44px;font-size:15px}
.meta{font-size:13.5px;color:#4E5968;margin:0 0 8px;line-height:1.55}
.post{white-space:pre-wrap;font-size:15px;line-height:1.75;background:#F9FAFB;border-radius:12px;padding:14px 16px;max-height:520px;overflow:auto;word-break:keep-all}
.post b.t{display:block;font-size:17px;margin:0 0 8px}
.cap{white-space:pre-wrap;font-size:14.5px;line-height:1.7;background:#F9FAFB;border-radius:12px;padding:12px 14px;word-break:keep-all}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:620px){.cards{grid-template-columns:1fr 1fr}}
.cards figure{margin:0}
.cards canvas{width:100%;height:auto;border:1px solid var(--line);border-radius:10px;display:block}
.cards figcaption{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:#4E5968;margin-top:4px}
.cards figcaption button{font:inherit;font-size:12.5px;font-weight:700;color:var(--blue);background:none;border:0;cursor:pointer;min-height:44px;padding:0 4px}
.ok{color:#0E7A4F;font-weight:700;font-size:13.5px;min-height:1em;margin:6px 0 0}
.st0{padding:24px 16px;text-align:center;border:1px dashed var(--line);border-radius:16px;font-size:15.5px;color:#3E4754}
</style>
<script src="../../assets/back.js?v=3" defer></script>
</head>
<body>
<header class="top"><a class="brand" href="../../" aria-label="집예보 홈"><svg class="bi" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#4338CA"/><path d="M29 47 V78 H71 V47 Z" fill="#FFFFFF"/><path d="M20 51 L50 26 L80 51" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="50" cy="59" r="6" fill="#4338CA"/><path d="M46.5 62 L44 74 H56 L53.5 62 Z" fill="#4338CA"/><circle cx="76" cy="24" r="5" fill="#5EEAD4"/></svg><span data-site-name>집예보</span></a><a class="badge plain" href="../my/" style="text-decoration:none">중개사 대시보드</a></header>
<div class="wrap">
  <h1>주간 블로그·인스타 글</h1>
  <p class="lead">고른 지역의 실거래·신고가·하락 거래·청약 일정을 공개 자료로 정리해 블로그 글, 인스타 카드 이미지, 설명글을 한 번에 만들어요. 매주 월요일 아침 새 재료가 준비돼요.</p>

  <div class="ed" id="ed">
    <h2>1. 지역 고르기</h2>
    <label for="area">지역 (시·군·구)</label><select id="area"></select>
    <p class="hint" id="areaH"></p>
    <h2 style="margin-top:16px">2. 내 표시 정보</h2>
    <div id="prof"></div>
    <div class="quota" id="quota" hidden></div>
    <div class="err" id="err" role="alert"></div>
    <div class="acts"><button class="btn primary" id="make" type="button">이번 주 글 만들기</button></div>
  </div>

  <div id="out" hidden>
    <section class="box">
      <h2>블로그 글 <span><button class="btn ghost" id="again" type="button" style="min-height:40px;font-size:14px">다른 문장으로 바꾸기</button></span></h2>
      <p class="meta" id="bMeta"></p>
      <div class="post" id="post"></div>
      <div class="acts"><button class="btn primary" id="cpBlog" type="button">글 복사</button><button class="btn" id="dlTxt" type="button">txt로 받기</button><button class="btn" id="dlMd" type="button">md로 받기</button></div>
      <p class="ok" id="bOk" aria-live="polite"></p>
    </section>
    <section class="box">
      <h2>인스타 카드 이미지 <small style="font-weight:500;color:#4E5968;font-size:13px" id="cMeta"></small></h2>
      <div class="cards" id="cards"></div>
      <div class="acts"><button class="btn primary" id="dlZip" type="button">카드 전부 받기 (zip)</button></div>
      <p class="ok" id="cOk" aria-live="polite"></p>
    </section>
    <section class="box">
      <h2>인스타 설명글 · 해시태그</h2>
      <div class="cap" id="cap"></div>
      <div class="acts"><button class="btn primary" id="cpCap" type="button">설명글 복사</button></div>
      <p class="ok" id="pOk" aria-live="polite"></p>
    </section>
    <p class="hint">숫자는 모두 공개 자료 그대로예요. 글을 고쳐 쓸 때도 숫자와 출처·기간은 바꾸지 말고, '수익 보장·무조건' 같은 표현은 넣지 말아 주세요(표시·광고 규정).</p>
  </div>
</div>
<script>
var JB = (typeof window !== 'undefined' && window.JDJ_BASE) || (function (p) { var g = p.indexOf('/jangdaejang-calc/') === 0, b = { SITE: g ? '/jangdaejang-calc/' : '/', DATA: g ? '/jangdaejang-data/' : 'https://chrisjangdaejang-ux.github.io/jangdaejang-data/' }; if (typeof window !== 'undefined') window.JDJ_BASE = b; return b; })((typeof location !== 'undefined' && location.pathname) || '/jangdaejang-calc/');
(function(){
'use strict';
const $ = id => document.getElementById(id);
const T = window.JDJ_BT, PR = window.JDJ_PRO, SITE = T.SITE, esc = T.esc;
const KIT = JB.DATA + 'data/brief/kit/';
let IDX = null, K = null, PROF = null, SEED = 0, CARDS = [];
const qg = new URLSearchParams(location.search).get('g');

async function showQuota(){
  const q = await T.quota(), el = $('quota');
  if (q.soft){ el.hidden = true; return; }
  el.hidden = false;
  if (q.login){ el.innerHTML = `주간 글은 ${SITE} 모닝 브리핑 플러스·중개사용·중개사 플러스에 들어 있어요. 로그인하면 쓸 수 있는 지역 수를 알려 드려요. ${window.JDJ_AUTH ? window.JDJ_AUTH.btn('카카오 간편 로그인', 'agent_content') : ''}`; return; }
  if (q.err){ el.textContent = q.err; return; }
  const L = T.limitsFor(q.tier), used = (q.used && q.used.kit) || [];
  el.innerHTML = q.tier && L.kitAreas ? `${esc(q.label || '')} 이용 중 · 이번 주 글은 지역 <b>${L.kitAreas}곳</b>까지 만들 수 있어요${used.length ? ` (쓴 지역: ${used.map(g => esc(nameOf(g))).join(', ')})` : ''}. 같은 지역은 몇 번이든 다시 만들 수 있어요.`
    : `주간 글은 ${SITE} 모닝 브리핑 중개사용(지역 ${T.limitsFor('brief_pro').kitAreas}곳)·중개사 플러스(지역 ${T.limitsFor('brief_pro_plus').kitAreas}곳)에 들어 있어요. 중개사가 아닌 분양·컨설팅 전문가는 플러스로 쓸 수 있어요. <a href="${JB.SITE}brief/subscribe/?p=brief_pro">구독 알아보기</a>`;
}
const nameOf = g => { const a = (IDX && IDX.areas || []).find(x => x.g === g); return a ? `${a.sd} ${a.name}` : g; };

async function make(){
  const err = $('err'); err.textContent = '';
  const g = $('area').value; if (!g){ err.textContent = '지역을 골라 주세요.'; return; }
  const pe = PROF.errs(); if (pe.length){ PROF.tried(); err.textContent = pe.length > 1 ? `내 표시 정보에 빠진 칸이 ${pe.length}개 있어요. 위 안내를 확인해 주세요.` : pe[0]; return; }
  $('make').disabled = true;
  try {
    const u = await T.use('kit', g);
    if (u.login){ err.textContent = '로그인한 뒤 만들 수 있어요.'; showQuota(); return; }
    if (u.err){ err.textContent = u.err; return; }
    K = await fetch(KIT + g + '.json', {cache:'no-cache'}).then(r => r.ok ? r.json() : null).catch(() => null);
    if (!K){ err.textContent = '이 지역은 아직 이번 주 재료가 없어요. 모닝 브리핑 관심 지역에 넣어 두면 다음 날 아침부터 준비돼요.'; return; }
    SEED = K.seed >>> 0;
    history.replaceState(null, '', '?g=' + g);
    JDJ.track && JDJ.track('agent_content_make', { sgg: g, role: PROF.get().role });
    if (!u.soft) showQuota();
    await draw();
  } finally { $('make').disabled = false; }
}
let B = null, C = null;
async function draw(){
  const prof = PROF.get();
  B = T.blog(K, { profile: prof, seed: SEED }); C = T.caption(K, { profile: prof, seed: SEED });
  const P = T.period(K);
  $('bMeta').textContent = `${K.sd} ${K.name} · ${P.long} · 글자 수 ${B.len.toLocaleString('ko-KR')}자(공백 포함, 출처·표시 정보 제외)`;
  $('post').innerHTML = `<b class="t">${esc(B.title)}</b>${esc(B.body)}\n\n${esc(B.src)}${B.ad && !B.ad.err ? '\n\n' + esc(B.ad.text) : ''}`;
  $('cap').textContent = C.text;
  try { await document.fonts.load("900 40px 'Noto Sans KR'"); await document.fonts.load("500 30px 'Noto Sans KR'"); } catch (e) {}
  const spec = T.cards(K, { profile: prof });
  $('cMeta').textContent = `1080×1080 · ${spec.length}장`;
  $('cards').innerHTML = spec.map((c, i) => `<figure><canvas id="cv${i}" width="1080" height="1080" aria-label="${esc(c.title)}"></canvas><figcaption><span>${i + 1}. ${esc(c.kicker)}</span><button type="button" data-dl="${i}">받기</button></figcaption></figure>`).join('');
  CARDS = spec.map((c, i) => { const cv = $('cv' + i); T.drawCard(cv, c, i, spec.length); return cv; });
  $('out').hidden = false;
  $('out').scrollIntoView({ behavior: 'smooth' });
}
const fname = ext => `${K.name}_${(K.wk || {}).from || K.built}_${ext}`;
function save(blob, name){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }
const pngBytes = cv => new Promise(ok => cv.toBlob(b => b.arrayBuffer().then(x => ok(new Uint8Array(x))), 'image/png'));
$('make').onclick = make;
$('again').onclick = () => { SEED = (SEED + 0x9E3779B1) >>> 0; draw(); };
$('cpBlog').onclick = async () => { $('bOk').textContent = (await PR.copy(B.text)) ? '복사했어요. 블로그 글쓰기 화면에 붙여 넣으세요.' : '복사하지 못했어요. txt로 받아 주세요.'; JDJ.track && JDJ.track('agent_content_copy', { k: 'blog' }); };
$('cpCap').onclick = async () => { $('pOk').textContent = (await PR.copy(C.text)) ? '복사했어요.' : '복사하지 못했어요.'; JDJ.track && JDJ.track('agent_content_copy', { k: 'cap' }); };
$('dlTxt').onclick = () => save(new Blob([B.text], { type: 'text/plain;charset=utf-8' }), fname('블로그.txt'));
$('dlMd').onclick = () => save(new Blob([B.md], { type: 'text/markdown;charset=utf-8' }), fname('블로그.md'));
$('cards').onclick = e => { const b = e.target.closest('[data-dl]'); if (!b) return; CARDS[+b.dataset.dl].toBlob(x => save(x, fname(`카드${+b.dataset.dl + 1}.png`)), 'image/png'); };
$('dlZip').onclick = async () => {
  const files = [];
  for (let i = 0; i < CARDS.length; i++) files.push({ name: `카드${i + 1}.png`, data: await pngBytes(CARDS[i]) });
  files.push({ name: '설명글.txt', data: new TextEncoder().encode(C.text) });
  save(new Blob([T.zip(files)], { type: 'application/zip' }), fname('카드.zip'));
  $('cOk').textContent = `카드 ${CARDS.length}장과 설명글을 묶어 받았어요.`;
  JDJ.track && JDJ.track('agent_content_zip', {});
};

(async function init(){
  PROF = T.mountProfile($('prof'), () => { if (K) draw(); });
  IDX = await fetch(KIT + 'index.json', {cache:'no-cache'}).then(r => r.ok ? r.json() : null).catch(() => null);
  const as = (IDX && IDX.areas) || [];
  if (!as.length){ $('ed').insertAdjacentHTML('beforebegin', '<div class="st0">이번 주 재료를 준비하고 있어요. 매일 새벽에 새로 만들어요 — 내일 아침에 다시 열어 주세요.</div>'); $('make').disabled = true; return; }
  $('area').innerHTML = as.map(a => `<option value="${esc(a.g)}">${esc(a.sd)} ${esc(a.name)} · 거래 ${a.n}건</option>`).join('');
  if (qg && as.some(a => a.g === qg)) $('area').value = qg;
  $("areaH").textContent = "목록에 없는 지역은 모닝 브리핑 관심 지역에 넣어 두면 다음 날 아침부터 준비돼요.";
  showQuota();
  if (qg && new URLSearchParams(location.search).has('go')) make();
})();
})();
</script>
</body>
</html>
